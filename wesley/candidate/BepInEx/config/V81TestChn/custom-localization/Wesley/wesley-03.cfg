exact:Year 154, day 12.\n\nToday is a scary day. \nProtocol wipeout was approved and the nuclear bomb will be installed tomorrow. \nKnowing where it came from I no longer feel quite as safe here. \nI can only imagine what could go wrong. \nWorse. \nHow it could ruin years of research and experimentation! \nIn case you don't know.. \nProtocol wipeout is only called during.. events of disaster. \nDestroying. \nEverything. \nAs much as I am facinated with the craft, I refuse to let it destroy all we've done. \nPerhaps I could modify some of its components. \nWe'll see. \nNow that project hawk is complete, we have received plans for new machines that will be used in the Grand War that just broke out. \nIt will be called, Project Nutcracker. \nI'm excited. \nMe out.=年份 154日、天 12.\n\n今天是一个可怕的一天。 \n协议销毁工作已获批准,明天将安装核弹。 \n知道它来自哪里 我不再觉得这里很安全了 \n我只能想象会出什么差错 \n更糟糕。 \n怎么会毁掉多年的研究和实验呢? \n万一你不知道... \n仅在灾难发生期间才会要求销毁议定书。 \n毁灭 \n所有的东西。 \n虽然我对这艘船很着迷 我拒绝让它毁掉我们所做的一切 \n也许我可以修改其中的一些内容。 \n等着瞧吧 \n现在项目老鹰已经完成了, 我们收到新机器的计划 将在刚爆发的大战争中使用。 \n它将被称为,胡桃项目。 \n我很兴奋 \n我出来。
exact:Year 154, day 136.\n\nBusiness as usual. \nProject nutcracker is well on the way. \nThese droids are getting more advanced by the day. \nEspecially since Geoffrey joined us a week ago. \nGreat stuff. \nMe out.=154年，第136天。\n\n一切如常。 \n胡桃夹子项目进展顺利。 \n这些机器人一天比一天先进。 \n尤其是自从杰弗里一周前加入我们之后。 \n真是太棒了。 \n我出去了。
exact:Year 154, day 139.\n\nUhh giants are still as prevalent as allways. \nUh. \nWe started to experiment with emotional manipulation alongside project nutcracker. \nWe just need the proper items to uh bind it to. \nMe out.=年份 154日、天 139.\n\n乌赫巨人仍然像所有行道一样普遍 \n呃... ... \n我们开始实验情感操控 与项目螺旋桨。 \n我们只需要合适的物品 把它绑起来 \n我出来。
exact:Year 154, day 146.\n\nWe used masks.. Big mistake. \nThey seem to get stuck to their wearers.. \nuh.. \nNo other side effects have been noted. \n\nI haven't seen it myself but I've heard project nutcracker was a succes! \nIt sounds like they're actually alive! \nuh.. \nWe also noticed that Geoffrey went missing recently. \nWe are looking into that. \nMe out.=154年，第146天。\n\n我们使用了面具……大错特错。 \n它们似乎会粘在佩戴者身上…… \n呃…… \n没有其他副作用被记录到。 \n\n我自己没亲眼看到，但我听说胡桃夹子项目很成功！ \n听起来它们真的有生命迹象！ \n呃…… \n我们还注意到杰弗里最近失踪了。 \n我们正在调查这件事。 \n我退出了。
exact:Year 154, day 15.. something.\n\nI am on the run. \nThose masks.. took them. \nThey're not them anymore. \nThey took my team! Converted half of them! \nThe nutcrackers are not droids like I thought. \nI.. I saw one of them. \nIt shot me.. right in the chest before I got here. \nI'm bleeding out. \nI think the nutcrackers.. \nThey're my coworkers.. \nOr what's left of them. \nI think those masked men.. \nI think they.. \n\n*Gunshot*=年份 154日、天 15..东西。\n\n我在逃命 \n那些面具... 拿走了 \n他们不再是他们了 \n他们抢走了我的球队!变换一半! \n螺旋桨不像我想的那样是机器人 \nI.. . .我看到其中一个 \n它射中了我... 就在我到这之前的胸部 \n我流血了 血流出来了 \n我觉得螺旋桨... \n他们是我的同事 \n或者他们剩下的什么 \n我觉得那些蒙面人... \n我想他们... \n\n*枪击*
