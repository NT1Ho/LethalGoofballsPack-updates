exact:Yesterday Jack claimed to have found an ancient dagger.\nHe was eager to tell the crew but he does not want to let go of it.\nThis is quite strange behaviour for Jack so I went to investigate this blade.\n\nHe left it next to his bed while he was asleep.\nI snuck in and tried to grab it but.. It was incredibly heavy.\nWhich is weird considering jack was able to carry it fine.\nHowever, in his sleep, I heard him mumble about some ancient note or.. ritual..\nCertainly strange.=昨天，杰克声称找到了一把古老的匕首。\n他非常想告诉船员们，但又不想放手。\n这对杰克来说真是奇怪的行为，所以我决定调查一下这把刀。\n\n他在睡觉的时候把匕首放在床边。\n我偷偷溜进去试图夺走它，但是……它实在太重了。\n这很奇怪，因为杰克明明能够轻松携带它。\n然而，在睡梦中，我听到他低声谈论着一些古老的笔记或……仪式。\n确实很奇怪。
exact:You abandoned us=你抛弃了我们
exact:You are now listening to\n-Across The Stars-\nI'm your favourite radio host and I'm here with your 11 AM news.\n On the dot for a change.\nIt looks like our Thursday will be sunny with little clouds in the sky.\nAlways nice after nothing but storms.\n\nJust like the past weeks the war is still raging on and we don’t see it ending anytime soon with how things are currently going.\nIn fact, the new factories on Oldred are doing nothing but throwing more gas on the fire.\nAs if the inferno isn’t large enough.\nCities are burning and for what.\nSurely not for sticks and marshmallows…\nI bring good news too though.\nThere have been talks of a safe place away from the war.\nA place to hide out until the nightmare is over.\nSomewhere to live.\nThe Domes of Demetrica.\n\nI’m out of time, I’ve got some more hits coming up to fill up the void of your day to day work schedule.\nStay tuned and thank you for listening to\n-Across The Stars-=您现在正在收听\n-跨越星辰-\n我是您最喜爱的广播主持人，这里是您上午11点的新闻节目。\n 时间到了，又是一天。\n看来今天的星期四会是个晴天，天空中有一些云朵。\n在经历了连续的暴风雨之后，这样的天气真是令人愉快。\n\n就像过去几周一样，战争仍在持续，从目前的情况来看，我们看不到战争很快结束的迹象。\n事实上，奥尔德雷德的新工厂只是在火上浇油。\n仿佛大火还不够猛烈似的。\n城市正在燃烧，而燃烧的原因是什么呢？\n肯定不是为了烤干树枝和棉花糖……\n不过，我也有好消息要告诉您。\n有人谈论着一个远离战争的安全之地。\n一个可以躲藏的地方，直到这场噩梦结束。\n一个可以居住的地方。\n德梅特里卡的穹顶。\n\n时间不多了，我还有更多内容要报道，以填补您日常工作的空白。\n请继续收听，感谢您收听\n-跨越星辰-
