exact:Year 154, day 12.\n\nToday is a scary day. \nProtocol wipeout was approved and the nuclear bomb will be installed tomorrow. \nKnowing where it came from I no longer feel quite as safe here. \nI can only imagine what could go wrong. \nWorse. \nHow it could ruin years of research and experimentation! \nIn case you don't know.. \nProtocol wipeout is only called during.. events of disaster. \nDestroying. \nEverything. \nAs much as I am facinated with the craft, I refuse to let it destroy all we've done. \nPerhaps I could modify some of its components. \nWe'll see. \nNow that project hawk is complete, we have received plans for new machines that will be used in the Grand War that just broke out. \nIt will be called, Project Nutcracker. \nI'm excited. \nMe out.=第 154 年，第 12 天。\n\n今天真让人害怕。\n清除协议获批，明天就要安装核弹。\n知道它是从哪儿来的以后，我待在这里就没那么安心了。\n我只能想象可能会出什么岔子。\n更糟的是，\n这么多年的研究和实验，说不定都要毁了！\n你要是不知道……\n清除协议只有在……发生灾难时才会启动。\n摧毁。\n一切。\n我再怎么着迷于这门技术，也不能让它毁掉我们做过的一切。\n也许我能改动其中几个部件。\n到时候再看。\n大战刚爆发，鹰计划也已完成。我们收到了新机器的设计图，打算投入这场战争。\n新项目要叫胡桃夹子计划。\n我很期待。\n就记到这儿。
exact:Year 154, day 136.\n\nBusiness as usual. \nProject nutcracker is well on the way. \nThese droids are getting more advanced by the day. \nEspecially since Geoffrey joined us a week ago. \nGreat stuff. \nMe out.=第 154 年，第 136 天。\n\n一切照旧。\n胡桃夹子计划进展顺利。\n这些机器人一天比一天先进，\n尤其是杰弗里上周加入以后。\n真不错。\n就记到这儿。
exact:Year 154, day 139.\n\nUhh giants are still as prevalent as allways. \nUh. \nWe started to experiment with emotional manipulation alongside project nutcracker. \nWe just need the proper items to uh bind it to. \nMe out.=第 154 年，第 139 天。\n\n呃，巨人还是跟往常一样，遍地都是。\n嗯。\n除了胡桃夹子计划，我们也开始实验怎么操控情绪。\n现在就差找到合适的物品，把它……呃，附在上面。\n就记到这儿。
exact:Year 154, day 146.\n\nWe used masks.. Big mistake. \nThey seem to get stuck to their wearers.. \nuh.. \nNo other side effects have been noted. \n\nI haven't seen it myself but I've heard project nutcracker was a succes! \nIt sounds like they're actually alive! \nuh.. \nWe also noticed that Geoffrey went missing recently. \nWe are looking into that. \nMe out.=第 154 年，第 146 天。\n\n我们用了面具……大错特错。\n面具好像会黏在佩戴者身上……\n呃……\n没发现其他副作用。\n\n我没亲眼看见，不过听说胡桃夹子计划成功了！\n听起来它们真的活了！\n呃……\n我们还发现杰弗里最近失踪了。\n正在调查。\n就记到这儿。
exact:Year 154, day 15.. something.\n\nI am on the run. \nThose masks.. took them. \nThey're not them anymore. \nThey took my team! Converted half of them! \nThe nutcrackers are not droids like I thought. \nI.. I saw one of them. \nIt shot me.. right in the chest before I got here. \nI'm bleeding out. \nI think the nutcrackers.. \nThey're my coworkers.. \nOr what's left of them. \nI think those masked men.. \nI think they.. \n\n*Gunshot*=第 154 年，第 15……十几天吧。\n\n我在逃命。\n那些面具……夺走了他们。\n他们已经不是原来的他们了。\n我的团队被夺走了！有一半被它们转化了！\n胡桃夹子不是我以为的那种机器人。\n我……我看见其中一个了。\n我来这里之前，它开了枪……正中胸口。\n我的血快流干了。\n我觉得那些胡桃夹子……\n它们是我的同事……\n或者说，是同事们剩下的部分。\n我觉得那些戴面具的人……\n我觉得他们……\n\n*枪声*
