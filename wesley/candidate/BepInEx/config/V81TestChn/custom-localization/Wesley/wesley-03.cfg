exact:Well, we found something.\n\nIt appears this strange growth is neither a fungi.. nor its own organism.\nIt's its own new thing.\nIt is able to remember certain growing patern from a genetic blueprint.\nMeaning it's alive!\nBut seamingly not in the traditional way we precieve living things.\nOur entire understanding of life was just flipped upside down.\nIt is even able to grow these weird.. bulbs resembling eyes.\nIt is unsure if these eyes serve a purpose.. Well.. They must.. Otherwise it wouldn't be growing them.\n\nWe will refer to this as.. Cosmic Growth from now on.\nThat's all I can say for now.\n\nProfessor Harrington, over and out.=嗯，我们发现了一些东西。\n\n看起来这种奇怪的生长物既不是真菌，也不是独立的生物体。\n它是一种全新的生命形式。\n它能够根据基因蓝图记住特定的生长模式。\n这意味着它是活着的！\n但显然不是我们以传统方式所理解的那种活着。\n我们对生命的整个认知都被颠覆了。\n它甚至能够长出这些类似眼睛的奇怪球体。\n目前还不确定这些眼睛有什么作用……不过，它们一定有什么作用，否则它就不会长出它们了。\n\n从现在开始，我们将这种生长物称为“宇宙生长体”。\n目前我就说这么多。\n\n哈林顿教授，结束通话。
