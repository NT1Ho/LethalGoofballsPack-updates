exact:Yesterday Jack claimed to have found an ancient dagger.\nHe was eager to tell the crew but he does not want to let go of it.\nThis is quite strange behaviour for Jack so I went to investigate this blade.\n\nHe left it next to his bed while he was asleep.\nI snuck in and tried to grab it but.. It was incredibly heavy.\nWhich is weird considering jack was able to carry it fine.\nHowever, in his sleep, I heard him mumble about some ancient note or.. ritual..\nCertainly strange.=昨天杰克说他找到了一把古代匕首。\n他急着告诉船员们，却一直不肯松手。\n杰克平常可不这样，我就去查了查那把刀。\n\n睡着时，他把刀放在床边。\n我悄悄溜进去想拿起来，可是……它沉得吓人。\n奇怪，杰克明明拿得轻轻松松。\n不过，我听见他在睡梦中嘟囔什么古老的便条，还是……仪式……\n确实古怪。
