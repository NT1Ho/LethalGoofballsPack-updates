exact:Well, we found something.\n\nIt appears this strange growth is neither a fungi.. nor its own organism.\nIt's its own new thing.\nIt is able to remember certain growing patern from a genetic blueprint.\nMeaning it's alive!\nBut seamingly not in the traditional way we precieve living things.\nOur entire understanding of life was just flipped upside down.\nIt is even able to grow these weird.. bulbs resembling eyes.\nIt is unsure if these eyes serve a purpose.. Well.. They must.. Otherwise it wouldn't be growing them.\n\nWe will refer to this as.. Cosmic Growth from now on.\nThat's all I can say for now.\n\nProfessor Harrington, over and out.=嗯，我们有所发现。\n\n这种古怪的增生物既不是真菌……也不是什么独立的生物。它是全新的东西。它能记住遗传蓝图里的特定生长模式。也就是说，它是活的！但似乎并不符合我们一直以来对生命的认识。这一下，我们对生命的理解全给颠覆了。\n它甚至能长出奇怪的……像眼睛一样的球茎。还不清楚这些眼睛有什么用……好吧，一定有用，否则何必长出来呢？\n\n今后我们就叫它“宇宙增生体”。目前能说的只有这些。\n\n哈林顿教授，通话结束。
