exact:uh, we really need to get better voice recorders for this.\nuhh anyways, yesterday we have finally concluded construction of the secondary research facillity here.\nThe equipment will arrive in a few days from now. Then we can offically start studdying on this side of the moon.\nWhich is splendid because have made a recent discovery...\nThis weird stuff..\nSome sort of fungi perhaps?\n\nI am not entirely sure what this is just yet but it has a.. regenerative ability.. at speeds unlike anything we have seen before.\n\nWe discovered this when we used a metal pipe to carefully stab a hole into it.\nAnwyays.\nI should wrap this up now, I'll record another log once we've got something.\n\nProfessor Harrington, over and out.=呃,我们真的需要 得到更好的语音记录器。\n不管怎样 昨天我们终于完成了 二级研究的建造工程\n设备将在几天后送达。之后，我们就可以正式开始在月球这一侧进行研究了。\n这真是太好了，因为最近我有了个发现……\n怪异的东西...\n或许是一种真菌吧？\n\n我目前还不太确定这到底是什么，但它具有一种……再生能力……其速度是我们前所未见的。\n\n我们发现这一点时，是用一根金属管小心地在其上钻了一个孔。\n安威亚斯\n我应该现在结束这个任务了，等我们有了结果之后，我会再记录一次日志。\n\n哈灵顿教授 完毕
