# Wesley / 简体中文。仅精确匹配显示文本。
exact:WHITE MOLD\n\n\nScientific name: Cretyrus-botaharum\n\n\nThis is a dangerous species of mold which thrives in bright areas. It is capable of growing in dark places but prefers not to, very rarely it be found in shadow or complete darkness.\n\n\nThe mold grows en masse and is able to spread across large surfaces with rapid succession. Additionally, on occasion it clusters up and grows spike-like formations which act as a way of detecting motion and a means to spread itself through direct infection of any poor creature which gets stung by it.\n\n\nThe spike-like formations are able to sense both heat and vibrations through the air. It knows what sort of creatures are easier to spread through and which are not. Those it deems not viable, it tries to scare off by shaking its spikes. However it will not hesitate to sting when the opportunity arises regardless of what steps on it.\n\n\nUnlike most infections, this one does not try to kill or harm the host, instead it tries to adapt to its host and strengthen the skeleton or exoskeleton, making them bulkier and more violent as a faster method of spreading to other creatures through the addition of spikes growing out of the bones it has strengthened. Comparisons have been made with Rabies lyssavirus, a disease which similarly alters behaviour to become more violent as a means to spread.\n\n\nThe I.T.D.A. has investigated several infestations of this mold and deemed it not to be a critical level invasive species and has successfully cleared large patches of the mold.\nThey highly advise everyone to report any instances of the white mold appearing and avoid direct contact.=白霉\n\n学名：Cretyrus-botaharum\n\n一种危险的霉菌，在明亮处生长旺盛。它也能在暗处生长，却很少出现在阴影中或完全黑暗的地方。\n\n白霉会成片生长，迅速蔓延到大片表面。有时菌体会聚成一簇，长出尖刺。这些尖刺既能探测动静，也能刺中倒霉的生物，通过直接感染来传播。\n\n尖刺能感知热量和空气中的振动。白霉能分辨哪些生物更适合帮它传播。碰上不合适的，它会抖动尖刺，试图把对方吓走。不过，无论是什么踩上去，只要有机会，它都会刺下去。\n\n与多数感染不同，白霉并不试图伤害或杀死宿主。它会适应宿主，加强其骨骼或外骨骼，使宿主变得粗壮、暴躁。强化后的骨骼上还会长出尖刺，加快向其他生物传播的速度。这种现象常被拿来与狂犬病病毒相比，后者同样通过使宿主更具攻击性来促进传播。\n\nI.T.D.A. 调查过多起白霉侵染事件，认定它尚不属于最高威胁级别的入侵物种，并已成功清除了大片菌落。该机构强烈建议大家一旦发现白霉就上报，并避免直接接触。
