exact:We should never have accepted that Crescent of Curses.\nSome of us have gone mad!\n\nThis morning we discovered three more skeletons at the bottom of the lakes.\nI fear out of sheer madness they went for an acidic swim.\n\nI too have experienced some strange things.\nSometimes when I look down a hallway, it starts expanding.\nLike there are more than a million other ways to go.\n\nIt shows things that nobody can see.=我们就不该收下那件诅咒新月。\n我们当中已经有人疯了！\n\n今早，我们又在湖底发现了三具骨架。\n我怕他们是彻底疯了，竟然去酸湖里游泳。\n\n我自己也遇到了些怪事。\n有时我朝走廊望去，它就开始往外延伸，\n仿佛分出了一百万条岔路。\n\n它让人看见旁人看不见的东西。
exact:We were able to reach out to one of those giant emergency service centers on Polarus.\nOne of those near the overly protected vaults.\nI wonder what kind of crazy stuff they hide in there.\nAnyway, rescue is on the way. We're scared but only a few more hours and we will be safe.=我们联系上了波拉鲁斯的一座大型应急服务中心，就在那些戒备森严得过头的金库附近。\n我倒想知道，他们到底把什么稀奇古怪的东西藏在里面。\n总之救援在路上了。大家都很害怕，但再过几个小时就安全了。
exact:We, quarry sector_4 on Cubatres have found an unidentified crystal.\n\nWe discovered this.. anomaly earlier today. It would light up nearby torches and lightbulbs.\nIt also seems to turn nearby objects into similarly look crystal.\nThis happened earlier to some of our equipment.\n\nI ask to have experts send over to identify what this could be and if it is of any use to our company.\n\nFor the time being it will be stored in Storage Area C.\n\n- Head of operation QS_4=我们是库巴特雷斯第 4 采石区，发现了一块身份不明的水晶。\n\n今天早些时候发现了这个……异常物。它能让附近的火把和灯泡自行亮起。\n附近的物体似乎还会变成与它形貌相似的晶体。\n我们有些设备刚刚就发生了这种变化。\n\n请派专家过来鉴定，并判断它对公司是否有用。\n\n暂时存放在 C 仓储区。\n\n——QS_4 行动负责人
