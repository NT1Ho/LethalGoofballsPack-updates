exact:We are now four weeks into the debate meaning next week will be the final and deciding council conference.\nWhile the Council of Rule is still highly against the study and use of biological warfare, there must be a way to convince them otherwise.\n..I understand that it is a very dangerous idea which..\nIn theory..\nCould ruin more lives than I can count as well as cause a financial catastrophe within this region..\n\nBut I trust the Emperor knows this and I am sure he has a plan which I will be made aware of soon.\nHe does not sit upon the throne without reason.\n\nAfter this log I might write a letter to my wife Madeline as I will be leaving 235-Calist the next morning for a meeting with the Emperor.\nI hope to find some clarity about his plans to better structure our case.\n\nAgent G- Signing off.=辩论已经进行了四周，下周就是理事会最后一次会议，届时将作出决定。执政议会仍坚决反对研究和使用生物战手段，但总有办法说服他们。\n……我明白，这个想法十分危险。理论上……它可能毁掉数不清的性命，还可能给这个地区带来一场金融灾难……\n\n但我相信皇帝也知道这一点。他一定有计划，想必很快就会让我知晓。他坐在皇位上，自有他的道理。\n\n写完这篇日志，我也许会给妻子玛德琳写封信。明早我要离开235-卡利斯特，去面见皇帝。我希望能弄清他的打算，以便把我们的主张讲得更有条理。\n\nG 干员，记录完毕。
exact:We found the.. anomalous object. It was quite far from the primary facility so we decided to construct a tunnel directly to it.\nThere's lots of plants and growth in the way, it will likely take quite a bit.\n\nBut when that's finished we will finally be able to further study this.. thing.\nIt's going to take some heavy machinery so we might just bring one of our special apparatuses.=我们找到了那个……异常物。它离主设施相当远，我们决定挖一条隧道直达那里。\n沿途尽是植物和增生物，恐怕要花上不少时间。\n\n等隧道修好，终于就能进一步研究那个……东西了。\n这得动用重型机械，我们或许会带上一台特制的设施电源。
exact:We heard noises in the walls.\nA buddy of mine went to investigate one of the vents and..\nThere were so many of them..\nThe bees they..\nI can still hear his screams as they were digging into his eyesockets and flying into his mouth.\nIf rescue won't come quick, I don't know what else might follow.=墙里有响动。\n我一个朋友去检查通风口，结果……\n里面全都是……\n那些蜜蜂，它们……\n它们钻进他的眼窝，飞进他的嘴里。我现在还听得见他的惨叫。\n如果救援不快点来，我不知道接下来还会发生什么。
