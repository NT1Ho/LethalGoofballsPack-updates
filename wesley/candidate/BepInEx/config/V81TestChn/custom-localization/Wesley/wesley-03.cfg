# Wesley / 简体中文。仅精确匹配显示文本。
exact:We were able to reach out to one of those giant emergency service centers on Polarus.\nOne of those near the overly protected vaults.\nI wonder what kind of crazy stuff they hide in there.\nAnyway, rescue is on the way. We're scared but only a few more hours and we will be safe.=我们成功联系到了波拉鲁斯上的一个大型紧急服务中心。\n就在那些受到严格保护的金库附近。\n不知道他们那里藏着什么疯狂的东西。\n无论如何，救援已经赶到了。虽然我们很害怕，但再过几个小时我们就会安全了。
exact:We, quarry sector_4 on Cubatres have found an unidentified crystal.\n\nWe discovered this.. anomaly earlier today. It would light up nearby torches and lightbulbs.\nIt also seems to turn nearby objects into similarly look crystal.\nThis happened earlier to some of our equipment.\n\nI ask to have experts send over to identify what this could be and if it is of any use to our company.\n\nFor the time being it will be stored in Storage Area C.\n\n- Head of operation QS_4=我们，库巴特雷斯采石场_4，在库巴特雷斯发现了一块不明晶体。\n\n我们今天早些时候发现了这个异常现象。它会点亮附近的火把和灯泡。\n它似乎还能将附近的物体转化为外观类似晶体的形态。\n之前我们的某些设备也出现了类似情况。\n\n我请求专家前来鉴定这到底是什么，以及它是否对我们的公司有任何用处。\n\n暂时将其存储在C存储区域中。\n\n- 行动负责人QS_4
