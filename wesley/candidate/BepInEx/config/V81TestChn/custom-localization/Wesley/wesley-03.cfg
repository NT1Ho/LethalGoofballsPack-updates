exact:What is happiness?\n\nIs it your dirty workplace?\nIs it your filthy house?\n\nIs it your crippling need for a therapist because you realised the universe is completely stacked against you and you will likely suffer the same fate as millions of others as the pressure of your worthless life becomes to much for the imagination of the mind leading to eventual damnination?\n\n\nNo!\n\n\nHappiness is the one who sends you money!\nHappiness is the one who created your job!\nHappiness is the one who protects you!\nHappiness is the Emperor!\nAnd if you work hard enough,\nYou will be personally invited to live in his golden city!\n\nHappiness is Empra!\n\nEmpra is happiness!=什么是幸福？\n\n是你那肮脏的工作场所？是你那污秽不堪的家？\n\n还是你突然发现整个宇宙都在跟你作对，自己多半要落得和千百万人一样的下场，这毫无价值的人生压得人想都不敢想，最终只能走向毁灭，所以你连一刻都离不开心理医生？\n\n不！\n\n给你发钱的那一位，就是幸福！给你创造工作的那一位，就是幸福！保护你的那一位，就是幸福！皇帝就是幸福！只要你足够努力，就会收到他本人的邀请，住进他的黄金之城！\n\n恩普拉就是幸福！\n幸福就是恩普拉！
