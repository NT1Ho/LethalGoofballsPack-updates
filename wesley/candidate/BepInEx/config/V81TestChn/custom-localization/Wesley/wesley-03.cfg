exact:What is happiness?\n\nIs it your dirty workplace?\nIs it your filthy house?\n\nIs it your crippling need for a therapist because you realised the universe is completely stacked against you and you will likely suffer the same fate as millions of others as the pressure of your worthless life becomes to much for the imagination of the mind leading to eventual damnination?\n\n\nNo!\n\n\nHappiness is the one who sends you money!\nHappiness is the one who created your job!\nHappiness is the one who protects you!\nHappiness is the Emperor!\nAnd if you work hard enough,\nYou will be personally invited to live in his golden city!\n\nHappiness is Empra!\n\nEmpra is happiness!=什么是幸福？\n\n是你的肮脏工作场所吗？\n是你的脏乱房子吗？\n\n是因为你极度需要心理治疗师，因为你意识到宇宙对你完全不利，你可能会遭受和数百万其他人一样的命运，因为你毫无价值的生活给心灵带来的压力太大，最终导致毁灭吗？\n\n\n不是！\n\n\n幸福是那个给你钱的人！\n幸福是创造你工作的人！\n幸福是保护你的人！\n幸福就是皇帝！\n如果你足够努力，\n你将被亲自邀请住在他那金色的城市里！\n\n幸福就是恩普拉！\n\n恩普拉就是幸福！
