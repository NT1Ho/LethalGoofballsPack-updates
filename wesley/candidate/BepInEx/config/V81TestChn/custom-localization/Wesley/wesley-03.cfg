exact:You are now listening to\n-Across The Stars-\nI'm your favourite radio host and I'm here with your 11 AM news.\n On the dot for a change.\nIt looks like our Thursday will be sunny with little clouds in the sky.\nAlways nice after nothing but storms.\n\nJust like the past weeks the war is still raging on and we don’t see it ending anytime soon with how things are currently going.\nIn fact, the new factories on Oldred are doing nothing but throwing more gas on the fire.\nAs if the inferno isn’t large enough.\nCities are burning and for what.\nSurely not for sticks and marshmallows…\nI bring good news too though.\nThere have been talks of a safe place away from the war.\nA place to hide out until the nightmare is over.\nSomewhere to live.\nThe Domes of Demetrica.\n\nI’m out of time, I’ve got some more hits coming up to fill up the void of your day to day work schedule.\nStay tuned and thank you for listening to\n-Across The Stars-=您正在收听《穿越星辰》。我是您最喜爱的主持人，现在为您播报上午11点新闻。难得准点了一回。\n看来这个星期四将是晴天，天空少云。连着挨了那么多场风暴，总算是件好事。\n\n和过去几周一样，战火仍在蔓延。照这局势，短期内看不到停战的希望。事实上，奥尔德雷德新建的工厂简直是在火上浇油。就好像这场大火还不够旺似的。城市在燃烧，又是为了什么？总不会是为了架树枝烤棉花糖吧……\n不过我也带来了好消息。听说远离战火的地方有一处避难所，能让人躲到噩梦结束，有个安身之处。那里就是德梅特里卡的穹顶。\n\n时间到了。接下来还有几首热门歌曲，为你日复一日的工作填填空。请别换台，感谢您收听《穿越星辰》。
