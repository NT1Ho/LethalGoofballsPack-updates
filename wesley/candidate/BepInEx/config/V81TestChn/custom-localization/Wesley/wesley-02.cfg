exact:Something has gone wrong. One of the anomalies in our storage areas have gone missing after a loud pulse like sound.\nOur security cameras show nobody entering or leaving this area, it disappeared on its own.\n\nAnd the employee who was watching over storage at the time has now been turned to crystal.\n\nI fear this might call for an emergency evacuation considering we don't know what we're dealing with yet.\n\nI now ask for immediate help.\n\n- Head of operation QS_4=出现了问题。我们存储区域中的一个异常装置在发出一声巨响后消失了。\n我们的监控摄像头显示，没有人进入或离开这个区域，它竟然自己消失了。\n\n当时负责监控存储区域的员工现在已经变成了水晶。\n\n考虑到我们还不清楚到底发生了什么，我担心可能需要紧急疏散。\n\n我现在请求立即提供帮助。\n\n- QS_4行动负责人
