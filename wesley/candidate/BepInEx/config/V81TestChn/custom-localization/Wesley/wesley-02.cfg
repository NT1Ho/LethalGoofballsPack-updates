exact:The plan worked. We lost good men but we took control over the facility.\nIn the control room I gained access to the ships which we are now loading up to make our escape.\nIt appears as though the guards called in an emergency.\nI expect more of them to come soon.\nI'll shoot a couple pipes on my way out in hopes that some of them suffocate in the leaking gas.\nBut more importantly. I went searching. And I found.\nJareck Hill was here 6 days ago. The log I read indicates that he now finds himself in another facility.\nThe flight route was set to 842 Core. I expect to find him there. With a proper disguise.\n\nPerhaps I can sneak in.. I must try.=计划成了。我们折了几个好兄弟，但拿下了设施。在控制室里，我取得了飞船的控制权。现在我们正往船上装东西，准备逃走。\n守卫似乎发出了紧急求援。他们的人应该很快就到。出去时我要朝管道开几枪，希望泄出的气体能闷死他们几个。\n更要紧的是，我去查了。还真查到了。\n贾雷克·希尔6天前来过这里。日志说他已经转去了另一座设施。航线设的是842 地核。我想我能在那里找到他。只要乔装得像样一点……\n\n也许我能混进去。我必须试试。
exact:The plan:\n\nI am going to kill Aaron.\nI must.\nI don't want there to be any evidence after so. \nI'll have to burn everyhing. Anyways.\nOnce he has arrived aI will lead him over to a small room where we used to hang out as children.\nAnd when he thinks he's safe I'll hrab my baseball bat and if not kill him, knock him unconsious.\nI'll hide his body in one of those giant standing Jack-in-the-box boxes that used to scare me to death.\nI'll have to improvise after.=计划：\n\n我要杀了亚伦。\n我必须这么做。\n事后不能留下任何证据。\n得把所有东西都烧了。总之，\n等他到了，我就领他去我们小时候常待的那个小房间。\n等他以为安全了，我就拿起棒球棍，打不死也要把他打晕。\n那儿立着几个巨大的吓人盒，小时候里面弹出来的小丑差点把我吓死。我会把他的身体藏进其中一个。\n再往后就只好随机应变了。
