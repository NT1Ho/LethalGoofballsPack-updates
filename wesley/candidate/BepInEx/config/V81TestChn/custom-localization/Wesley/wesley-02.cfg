exact:We should never have accepted that Crescent of Curses.\nSome of us have gone mad!\n\nThis morning we discovered three more skeletons at the bottom of the lakes.\nI fear out of sheer madness they went for an acidic swim.\n\nI too have experienced some strange things.\nSometimes when I look down a hallway, it starts expanding.\nLike there are more than a million other ways to go.\n\nIt shows things that nobody can see.=我们本就不该接受诅咒新月（Crescent of Curses）的存在。\n我们中的一些人已经疯了！\n\n今天早上，我们在湖底又发现了三具骨架。\n恐怕他们纯粹是出于疯狂，才去游了酸性的水。\n\n我也经历了一些奇怪的事情。\n有时候当我沿着走廊望去时，走廊开始膨胀起来。\n仿佛还有超过一百万条路可以走。\n\n那些路能展示出一些无人能看见的东西。
