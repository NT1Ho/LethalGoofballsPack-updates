exact:The stones of purification\n\nThese stones hold incredible power.\nThrough the crystal growing within, it can be used to alter matter.\n\nTo rid food of mold, crops of insects, water of plagues.\nIt can speed the growth of plants, heal the wounded, increase their strength.\n\nOnly when put together in precise ways can their power be used.=净化之石\n\n这些石头拥有不可思议的力量。\n通过内部生长的晶体，它们可以用来改变物质。\n\n可以去除食物中的霉菌、农作物中的害虫、水中存在的瘟疫。\n它们还能加速植物的生长、治愈伤者、增强他们的力量。\n\n只有以精确的方式组合这些石头，它们的力量才能被发挥出来。
