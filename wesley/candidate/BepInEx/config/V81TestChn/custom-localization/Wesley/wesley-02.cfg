exact:To start off my statement I would like everyone to remember why the use of biological warfare was made illegal in the first place.\nNot two hundred years ago, over in the Altra region when the study and use of biological weapons was allowed still.\nA conflict between two dominions turned to bloodshed. This war is now known as one of the most devastating wars in all of time across the known regions.\n\nAnd it was the weaponry they used which marked this war as the deadliest one in history thus far.\nThe most commonly used was the melting gas made with the spores of an acidic super-fungi.\nWhen it touched the skin or was inhaled, it would melt the victim from the inside out. And the majority of victims were not military but civilians.\n\nSurely I do not speak for myself when I say-\nThis musn't happen again.=在开始陈述前，请各位想想，当初为何要禁止生物战。还不到两百年前，在阿尔特拉地区，人们仍可研究和使用生物武器。两个领地之间的争端演变成了流血冲突。如今，整个已知区域都把它列为有史以来最具毁灭性的战争之一。\n\n所用的武器，更让它成了迄今死伤最惨重的一场。最常用的是以强酸性超级真菌的孢子制成的溶解气体。无论接触皮肤还是吸入体内，它都会让受害者从里到外溶解。而大多数受害者并非军人，是平民。\n\n我相信这句话绝不只代表我一个人——\n这样的事，绝不能重演。
