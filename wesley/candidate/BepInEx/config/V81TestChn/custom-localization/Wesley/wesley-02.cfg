exact:Transcript emergency recording\n—----------------------- 2:50\n\nS. Underhill: I know you’re there Cavil.\nS. Underhill: You realise we possess the ability to read the security transcripts from our headquarters.\nS. Underhill: Your pod sent out a distress signal, Cavil. I know where you are.\nC. Darter: Fuck you.\nS. Underhill: Do you believe you are doing the right thing?\nC. Darter: Stopping you from murdering innocents? Yes. Yes I believe I am.\nS. Underhill: By murdering innocents of your own?\nC. Darter: I didn’t mean to.\nS. Underhill: Yet you did. In an attempt to sabotage my plans you killed not just one, but two. You gave Sarah the illusion of escape. But Julian would’ve been left to die all alone. You are a hypocrite.\nC. Darter: I have your documents. I know what you did. Your experiments at the Crosswind Mental Hospital in Last Hope. Hailey Robertson, remember her? It’s all there. It will all be public soon enough.\nS. Underhill: And you think that changes things? We can tell the public anything and they’ll believe it.\nC. Darter: If this gets out you become a risk. Risks don’t tend to live long.\nS. Underhill: Then what. I’ve finished my machine. You think they’ll stop? It’s working. It’s working really well. You may have sabotaged your mission but we’ll find that ship, one way or another. Then project Mycete will be perfect. The soldiers we produce will be impenetrable, unstoppable. We will rescue so many cities from their lawlessness. We will unite what’s left after the silent age. You can stop the engineer, but not his machine.\nC. Darter: You’re lost, Sol. You’re lost in your own fantasy.\nS. Underhill: Don’t you see it? The cities we’ve saved? The people exist in peace. We brought them that peace. We’ve perfected it. You give people too much will, they destroy themselves. You give them too little, they destroy their government. You give them just enough, they’re happy. It doesn’t even have to be real. History is an archive of mistakes, an encyclopedia of lessons, we are the only ones who chose not to ignore them.\nC. Darter: You can’t call it peace when you’re the one bringing war. Maybe I can’t stop the project. But I can stop you.\n—----------------------- \nEmergency recording ended=紧急录音记录\n—----------------------- 2:50\n\nS. 安德希尔：我知道你在那儿，卡维尔。\nS. Underhill：您知道，我们拥有读取总部安全记录的能力。\nS. 安德希尔：你的太空舱发出了求救信号，卡维尔。我知道你在哪里。\nC. Darter：去你的。\nS. 安德希尔：你觉得自己做得对吗？\nC. Darter：阻止你杀害无辜者？是的。我认为我确实可以做到这一点。\nS. 安德希尔：通过杀害无辜的人来实现？\nC. Darter：我不是有意为之。\nS. 安德希尔：不过你确实这么做了。为了破坏我的计划，你不仅杀了一个人，而是两个。你让莎拉有了逃脱的假象。但朱利安却只能独自死去。你真是个伪君子。\nC. Darter：我已经拿到了你的文件。我知道你做了什么。你在Last Hope的Crosswind精神医院进行的实验。Hailey Robertson，还记得她吗？所有的事情都在里面了。很快这些都会被公开。\nS. Underhill：你认为这真的改变了事情吗？我们可以向公众说任何事情，他们都会相信。\nC. Darter：如果这件事泄露出去，你就会成为风险对象。风险通常不会持续很长时间。\nS. 安德希尔：那又怎样？我的机器已经完成了。你认为他们会停止吗？它运转得很顺利，效果非常好。也许你破坏了你的计划，但无论如何，我们都会找到那艘飞船。那样一来，Mycete项目就会完美实现。我们制造的士兵将不可战胜，无法被阻止。我们将从那些混乱的城市中拯救出许多城市。在无声时代结束后，我们将统一剩下的地区。你可以阻止工程师，但无法阻止他的机器。\nC. Darter：你迷失了，Sol。你沉浸在自己的幻想之中。\nS. 安德希尔：你没看到吗？我们拯救的那些城市，那些人们生活在和平之中。我们为他们带来了这种和平。我们已经将其完善到了极致。如果你给予人们太多的力量，他们就会自我毁灭；如果你给予他们太少的力量，他们就会破坏自己的政府。如果你给予他们恰到好处的力量，他们就会幸福。甚至不需要这种和平是真实的。历史就是错误的档案，是经验的百科全书，而我们才是唯一选择不去忽视这些错误的人。\nC. Darter：如果你才是带来战争的人，那就不叫和平。也许我无法阻止这个项目，但我可以阻止你。\n—----------------------- \n紧急录制结束
exact:Transcript security recording - Day 14 \n—----------------------- 15:12 - Cargo dock\n\nC. Darter: That’s everything in cargo?\nS. Dent: Just about, yeah.\nC. Darter: Good, I’ll signal Julian so he can start the engines.\nS. Dent: He knows how to fly this thing? I thought he was only here in case things like.. that.. Jump out on us.\nC. Darter: He doesn’t need to know how to fly, the autopilot takes care of that. He only needs to power the engines and make sure nothing goes up in flames in the process.\nS. Dent: oh, I assumed there was some manual labour involved in the taking off part but that makes sense. Well I’ll be in the office on Level 2 documenting our discoveries.\nC. Darter: Alright.\n\n—----------------------- 17:20 - Central hallway\n\nS. Dent: Hey, is everything in order?\nJ. Charter: I have nothing to report on, there hasn’t been a breach of containment.\nS. Dent: That’s good.\nJ. Charter: Sorry for asking but, what is that stuff we collected?\nS. Dent: It’s a type of Eumycota.. or fungi in layman's terms, a white mold that seems to form these spike-like pustules which it uses to inject itself into any unfortunate creature that happens to step on it.\nJ. Charter: I see. So that’s what was wrong with that spider.\nS. Dent: Yeah, so don’t touch the mold.\nJ. Charter: What are you planning on doing with it?\nS. Dent: That is classified.\nJ. Charter: Understood.\nS. Dent: I’ve got some work to do so I’ll be off.\nJ. Okay. Stay safe.\n\n—----------------------- 22:43 - Communications\n\nS. Underhill: What’s the status.\nC. Darter: We have contained some new samples for the project.\nS. Underhill: Is it promising?\nC. Darter: ..Potentially, I have not conducted extensive research just yet.\nS. Underhill: That will be your priority from now on.\nC. Darter: Of course. As you wish.\nS. Underhill: I sense that you are displeased. Is there anything I should know about?\nC. Darter: It doesn’t feel right. It’s immoral. We shouldn’t build a future on the torture of innocents.\nS. Underhill: If the loss of innocent lives worries you then I would recommend reminding yourself that our sins are as many as the others.\nC. Darter: It isn’t right.\nS. Underhill: Perhaps you don’t understand.\nC. Darter: Understand what? The fact that innocent people are being cut to pieces for an opportunity of finding someone who we then also torture with the notion of it will help build our future? You mean that?\nS. Underhill: We have our projects, our corporations, people, governments, ideologies, politics, empires.. together it forms a society.. The people strive to climb higher, rule, gain control, to sit at the top of whatever they feel gives them power, yet even when they get there, they still feel it.. that entity looming over their shoulder from a step on the ladder too high for anyone to reach. They hide behind the facade of smaller corporations. You know their influence. They allow us to exist as long as we provide, no matter the methods or the cost. If they won't care, why should we.\nC. Darter: The.. entity?\nS. Underhill: I expect a report tomorrow before the end of the day. Otherwise you will be considered for repurposing.\nC. Darter: ..Understood.=转录安全录音 - 第14天 \n—----------------------- 15:12 - 货舱\n\nC. 达特：这就是货舱里所有的东西吗？\nS. 登特：差不多吧。\nC. 达特：很好，我会通知朱利安，让他启动引擎。\nS. 登特：他知道如何驾驶这辆车吗？我原以为他只是以防万一……比如出了什么意外。\nC. 达特：他不需要知道如何驾驶，自动驾驶系统可以处理这个问题。他只需要启动引擎，确保过程中没有任何东西着火。\nS. 登特：哦，我以为起飞时需要一些手动操作，不过这说得通。好吧，我会留在2层的办公室里记录我们的发现。\nC. 达特：好的。\n\n—----------------------- 17:20 - 中央走廊\n\nS. 登特：嘿，一切都安排妥当了吗？\nJ. 查特：我没有什么要报告的，没有发生任何泄漏情况。\nS. 登特：那很好。\nJ. 查特：抱歉问了，但我们收集到的那些东西是什么？\nS. 登特：这是一种真菌类……用通俗的话来说就是白色霉菌，它会形成类似尖刺的脓疱，用来感染那些不小心踩到它的生物。\nJ. 查特：我明白了。所以那就是那只蜘蛛的病症。\nS. 登特：是的，所以不要触碰那种霉菌。\nJ. 查特：你打算怎么处理这些东西？\nS. 登特：这属于机密。\nJ. 查特：明白了。\nS. 登特：我还有一些工作要做，那我就走了。\nJ. 好的，注意安全。\n\n—----------------------- 22:43 - 通讯\n\nS. 安德希尔：情况如何？\nC. 达特：我们已经控制了一些新的样本，用于研究项目。\nS. 安德希尔：效果如何？\nC. 达特：……目前还没有进行充分的研究。\nS. 安德希尔：从现在开始，这应该是你的首要任务。\nC. 达特：当然。如您所愿。\nS. 安德希尔：我感觉你不太满意。有什么我需要知道的吗？\nC. 达特：感觉不对劲。这是不道德的。我们不应该用无辜者的痛苦来建设未来。\nS. 安德希尔：如果你担心无辜生命的损失，我建议你记住，我们的罪过和其他人一样多。\nC. 达特：这不对。\nS. 安德希尔：也许你不明白。\nC. 达特：明白什么？无辜者被撕成碎片，只是为了寻找一个可以折磨的人，然后以这种方式来建设我们的未来？你是这个意思吗？\nS. 安德希尔：我们有我们的项目、企业、人民、政府、意识形态、政治、帝国……它们共同构成了一个社会。人们努力往上爬，统治，获得控制权，坐在他们认为能给他们力量的顶端。然而，即使他们到达了那个位置，他们仍然感到那个阴影在他们头顶上挥之不去。他们躲在较小企业的表面之下。你知道他们的影响力。只要我们提供资源，无论用什么方法或代价，他们都会允许我们存在。如果他们不在乎，我们为什么要关心呢？\nC. 达特：那个……实体？\nS. 安德希尔：预计明天之前会有一份报告。否则，你将被考虑重新利用。\nC. 达特：……明白了。
exact:Transcript security recording - Day 15 \n—----------------------- 11:56 - Lab\n\nS. Dent: Out of all the specimens we have gathered, this one seems the most potent.\nC. Darter: On that I agree. We would only have to bioengineer the instinctual need to spread out of the samples before it can be merged and experimented with.\nS. Dent: Of course. I noted on the spider back on Utril that the exoskeleton seemed to have hardened with an increased density to help it protect itself from brute force impact.\nC. Darter: I wonder if it would do the same to a bone structure or if it would respond to the skin instead.\nS. Dent: Either way it would likely induce extreme pain, shock and possibly death were we to try that on an animal or even a person.\nC. Darter: I am aware. Though I doubt Solover cares as long as we can get a subject to survive.\nS. Dent: You’re probably right. But try finding medical research where animals didn’t suffer.\nC. Darter: Does it ever bother you? The screeches of pain whenever we have to test on a live subject.\nS. Dent: Yeah.. Of course it does. I don’t enjoy it. I try to remind myself that we’re doing this now so that people in the future will be able to live a better life. It doesn’t make it better but it’s how I deal with it.\nC. Darter: I suppose that makes sense.\n\n—----------------------- 12:46 - Central hallway\n\nC. Darter: Stand guard at the lab in case anything goes awry.\nJ. Charter: Yes sir.\n—----------------------- 13:08 - Lab\n\nJ. Charter: Everything okay here?\nS. Dent: Yeah, did something happen?\nJ. Charter: No no, I was sent by Cavil. He said I should keep watch in case anything happened.\nS. Dent: Fair enough. We’re only working with a highly infectious aggressive fungi haha.\nJ. Charter: Yeah hah.\nJ. Charter: The experiments that are conducted here, are they very dangerous?\nS. Dent: In the wrong hands, yes, very. Handle them wrong and we could have an outbreak. A scenario like that can only end nasty.\nJ. Charter: Good thing you’re so skilled then.\nS. Dent: Yeah, thanks.\nJ. Charter: I am curious though, do you feel.. safe.. Here? On the ship?\nS. Dent: Well. Not always. These are very dangerous things we’re working with. But in the end it’s part of the job, it’s what we signed up for. I feel you of all people would probably know that.\nJ. Charter: We have our duties, even if it’s dangerous. We’re building a future. That’s important.=转录安全录音 - 第15天 \n—----------------------- 11:56 - 实验室\n\nS. Dent：在我们收集的所有样本中，这个样本似乎是最有潜力的。\nC. Darter：我同意。我们只需要通过生物工程手段消除这些样本的扩散本能，然后就可以将其合并并进行实验了。\nS. Dent：当然了。我在尤特里尔上的蜘蛛身上注意到，它的外骨骼似乎已经硬化，密度也增加了，这有助于它抵御外力冲击。\nC. Darter：我想知道，这种效果是否同样适用于骨骼结构，还是只适用于皮肤？\nS. Dent：无论哪种情况，都可能引起剧烈的疼痛、休克，甚至可能导致死亡，如果我们对动物或人类进行这样的实验的话。\nC. Darter：我知道。不过我怀疑Solover并不在乎，只要能让人活下来就行。\nS. Dent：你可能是对的。但试着找一些不使用动物的医学研究吧。\nC. Darter：你偶尔也会感到困扰吗？每次在活体上进行实验时，那种痛苦的叫声……\nS. Dent：是的……当然会。我不喜欢这样。我会提醒自己，我们现在这样做是为了让未来的人们能够过上更好的生活。虽然这并不能改善现状，但这是我应对这种情况的方式。\nC. Darter：那也说得通。\n\n—----------------------- 12:46 - 中央走廊\n\nC. Darter：在实验室门口站岗，以防出现意外。\nJ. Charter：是的，长官。\n—----------------------- 13:08 - 实验室\n\nJ. Charter：这里一切都好吗？\nS. Dent：是的，发生了什么事吗？\nJ. Charter：没有，我是被Cavil派来的。他说我应该保持警惕，以防出现意外。\nS. Dent：好吧。我们处理的只是一种高度传染性的侵袭性真菌，哈哈。\nJ. Charter：是啊，哈哈。\nJ. Charter：在这里进行的实验，真的非常危险吗？\nS. Dent：如果落入坏人之手，确实非常危险。如果处理不当，可能会引发疫情。那样的情况只会带来麻烦。\nJ. Charter：幸好你技术这么高超。\nS. Dent：是的，谢谢。\nJ. Charter：不过，我很好奇，在这里……感觉安全吗？在船上？\nS. Dent：嗯，并不总是安全的。我们处理的都是非常危险的东西。但最终，这是工作的一部分，是我们所选择的职业。我觉得你最清楚这一点。\nJ. Charter：我们有责任，即使这很危险。我们在建设一个未来。这很重要。
exact:Transcript security recording - Day 16\n—----------------------- 10:36 - Lab\n\nS. Dent: I think that’s it. I think we’ve got it. This will be perfect when it’s merged with the main compound.\nC. Darter: Yeah.. that’s great.\nS. Dent: Is something wrong? I thought you’d be celebrating.\nC. Darter: I don’t think we’re doing the right thing.\nS. Dent: How so? We’re helping people. If not for the Triton Empire we’re saving people’s lives with this.\nS. Dent: Are we not? Cavil?\nC. Darter: They uh.. You aren’t allowed to know but it’s likely not for the purpose you’ve been led to believe.\nS. Dent: What do you mean? This is medicine, it will protect people.\nC. Darter: Yes but. Not the people you might think.\nS. Dent: Well.. Go on.\nC. Darter: This is part of Project Mycete. A project where they’re attempting to make enhanced soldiers by stuffing them with experimental drugs.\nS. Dent: What.\nC. Darter: And.. not only that but out there people are being slaughtered, tortured and murdered in pursuit of people fit for the procedure.\nS. Dent: WHAT.\nS. Dent: All this time. I have been working for a lie. Harming these poor creatures. Just so we have a small step up in this conquest??.\nC. Darter: .. Basically.\nS. Dent: Why didn’t you tell me?\nC. Darter: I mean, they will likely have me repurposed when they discover I have now leaked this information.. It’s more of an execution than a repurpose.\nS. Dent: Right. So. What now?. Do we leave? Do we burn it all? Tell me.\nC. Darter: I need time to think. I don’t want to hand Sol this research. We’ll talk about this tomorrow. Pretend like none of this happened.\nS. Dent: Yeah. Okay. Simple. I’ll just simply pretend like I haven’t spent the past two and half weeks risking my life for a lie.\nC. Darter: I mean it.\n—----------------------- 16:13 - Office\n\nJ. Charter: Sarah? Are you okay?\nS. Dent: I’m fine.\nJ. Charter: The tears running down your face say otherwise. Did something happen?\nS. Dent: I would prefer not to talk about it.\nJ. Charter: Something personal?\nS. Dent: Yea.\nJ. Charter: I see.. If something is up you can talk to me about it, it’s okay.\nS. Dent: Wouldn’t want it to be a detriment to the mission would you.\nJ. Charter: What?\nS. Dent: No I mean. I’m sorry. I don’t know where that came from. It’s just hard. I’m not sure if I can take much more of it.\nJ. Charter: It’s okay, I get it.\nS. Dent: Did Cavil send you?\nJ. Charter: No he didn’t.\nS. Dent: What made you come here?\nJ. Charter: Well you’ve seemed a bit down today. It’s important that everyone on this crew feels okay. And I also care.. about.. you. I mean..\nS. Dent: Thank you, I really appreciate it. There’s just.. Maybe I miss home and it’s wearing me down.\nJ. Charter: That makes sense. I can’t say I don’t miss it back there. Sooner or later we’ll be back. We just have to complete our mission. We’ll be okay.\nS. Dent: Yeah. Thank you, really.=转录安全录音 - 第16天\n—----------------------- 10:36 - 实验室\n\nS. Dent：我想就这样吧。我们认为已经搞定了。一旦与主要化合物合并，这将非常完美。\nC. Darter：是的..那太好了。\nS. Dent：有什么问题吗？我以为你会庆祝呢。\nC. Darter：我觉得我们没有做对。\nS. Dent：怎么了？我们在帮助人们。如果不是因为特里顿帝国，我们就是用这个来拯救人们的生命。\nS. Dent：我们不是吗？Cavil？\nC. Darter：他们...你不应该知道，但这很可能不是你被引导相信的目的。\nS. Dent：什么意思？这是药物，它能保护人们。\nC. Darter：是的，但是不是那些你认为的人。\nS. Dent：好吧...继续说。\nC. Darter：这是Project Mycete的一部分。他们试图通过给士兵注射实验性药物来制造增强型士兵。\nS. Dent：什么？\nC. Darter：而且...不仅如此，外面的人们正在被屠杀、折磨和杀害，只是为了寻找适合接受这种手术的人。\nS. Dent：什么？\nS. Dent：一直以来，我都在为一个谎言工作。伤害这些可怜的生物。只是为了让我们在这场征服中取得一点进展而已？\nC. Darter：基本上就是如此。\nS. Dent：你为什么没有告诉我？\nC. Darter：我的意思是，当他们发现我已经泄露了这些信息时，他们很可能会把我重新利用起来...这更像是处决而不是重新利用。\nS. Dent：明白了。那么现在该怎么办？我们离开吗？还是把一切都烧掉？告诉我。\nC. Darter：我需要时间思考。我不想把这个研究交给Sol。我们明天再讨论这件事。假装这一切都没有发生吧。\nS. Dent：嗯，好吧。很简单。我就假装过去两个半星期我不是为了一个谎言而冒着生命危险。\nC. Darter：我是认真的。\n—----------------------- 16:13 - 办公室\n\nJ. Charter：Sarah？你还好吗？\nS. Dent：我没事。\nJ. Charter：你脸上的泪水表明情况并不好。发生了什么事吗？\nS. Dent：我不想谈论这件事。\nJ. Charter：是个人问题吗？\nS. Dent：是的。\nJ. Charter：我明白...如果有什么问题，你可以和我谈谈，没关系。\nS. Dent：我不想因为这件事影响任务，你明白吧。\nJ. Charter：什么？\nS. Dent：不，我的意思是...对不起。我不知道这些泪水是从哪里来的。只是很难受。我不确定自己还能承受多久。\nJ. Charter：没关系，我理解。\nS. Dent：是Cavil派你来的吗？\nJ. Charter：不是，他没有。\nS. Dent：你为什么来这里？\nJ. Charter：今天你看起来有点沮丧。让整个团队都感觉良好很重要。而且我也关心你...我的意思是...\nS. Dent：谢谢，真的很感激。只是...也许我想家了，这让我很疲惫。\nJ. Charter：我明白。我也很想家。迟早我们会回到那里。我们只需要完成任务。我们会没事的。\nS. Dent：是的。真的谢谢。
exact:Transcript security recording - Day 17 \n—----------------------- 18:56 - Maintenance tunnel\n\nC. Darter: Hopefully nobody can hear us down here.\nS. Dent: Hope so too. Have you got an idea?\nC. Darter: I have a plan. It will be hairy.\nS. Dent: Alright. Can’t be worse than whatever they’re doing out there.\nC. Darter: It’s a two part plan. We have to destroy the autopilot. And manually route it somewhere else so they won’t be able to find it. I wrote the coordinates on this note. Send this ship here.\nS. Dent: Uhm. Okay. What will you do?\nC. Darter: I’ll make sure they won’t be able to track the ship anymore and prepare the escape pod.\nS. Dent: What about Julian? We tell him right?\nC. Darter: It’s better if we don’t. He’s loyal to the Triton Empire. I don’t trust him to betray that.\nS. Dent: Well we can’t just leave him. Maybe he’ll listen to me.\nC. Darter: It’d be best not to try. He might sound the alarm.\nS. Dent: I won’t leave him.\nC. Darter: If you can convince him to join us in the escape pod he can come with. But only after you’ve done your part.\nS. Dent: Right, If this is another lie I’ll kill you.\nC. Darter: I promise.\nS. Dent: When do we start?\nC. Darter: 22:00. I’ll have the escape pod ready by 23:30. Be there.\nS. Dent: Okay.\nC. Darter: I have some digging to do. Good luck.\nS. Dent: You too.\n\n—----------------------- 22:24 - Security office\n\nJ. Charter: The fuck.\n\n—----------------------- 22:38 - Cockpit\n\nJ. Charter: Who’s there? Sarah?\nS. Dent: Julian?\nJ. Charter: What are you doing? Did you mess with the autopilot?\nS. Dent: I can explain.\nJ. Charter: Is this an order? Why are you doing this?\nS. Dent: This is not right.\nJ. Charter: What do you mean?.\nS. Dent: This whole project is wrong. We’re not helping anyone with this. It won’t be for medicine. We’re developing weapons.\nJ. Charter: I know. This is a military operation, as was stated in my briefing.\nS. Dent: You knew? This whole time? They’re torturing people. Just so they can experiment on the survivors with this. You’re okay with that?\nJ. Charter: People suffer either way. Whether we complete this mission or not. You know that. We could be part of something great.\nS. Dent: If we are building a future like this.. I want none of it.\nJ. Charter: You’re a traitor.\nS. Dent: Please, think about it. We can escape this. Leave it behind. Knowing we won’t have innocent blood on our hands.\nJ. Charter: I trusted you, Cavil trusted you. Why would you sabotage the mission. We were going home. We were..\nS. Dent: Cavil is preparing the escape pod. Please just come with me.\nJ. Charter: You all Lied to me. You betrayed me.\nS. Dent: Please Julian, they are evil.\nJ. Charter: Why.\nS. Dent: Julian, please. Calm down, Lower your weapon and join me. We’ll be okay.\nS. Dent: Please calm down, Julian, please. Juli-.\nJ. Charter: I.. I’m sorry.\n\n—----------------------- 23:13 - Central hallway\n\nJ. Charter: I’m sorry Sarah. I love you.\n\n—----------------------- 23:16 - Cargo bay\n\nJ. Charter: I’m sorry.=安全记录记录记录记录-日 17 \n—----------------------- 18:56 - 维修隧道\n\nC. Darter：希望在这里没人能听到我们的谈话。\nS. Dent：希望也是这样的。你有想法吗？\nC. Darter：我有一个计划。这可能会很复杂。\nS. Dent：好吧。不会比他们现在所做的更糟糕了。\nC. Darter：这是一个分两部分的计划。我们必须摧毁自动驾驶系统，并手动将飞船引导到另一个地方，这样他们就找不到它了。我把坐标写在这张纸条上。把这艘飞船送到这里。\nS. Dent：嗯。好的。你会做什么？\nC. 达特：我会确保他们无法再追踪那艘飞船，并准备好逃生舱。\nS. Dent：那朱利安呢？我们得告诉他吧？\nC. 达特：我们最好不要这么做。他效忠于海神帝国。我不相信他会背叛那个帝国。\nS. Dent：嗯，我们不能就这么放他不管。也许他会听我的。\nC. Darter：最好不要尝试。他可能会发出警报。\nS. Dent：我不会离开他。\nC. 达特：如果你能说服他加入我们的逃生舱，那么他就可以一起离开。但前提是你必须先完成自己的任务。\nS. Dent：对，如果这又是谎言，我就杀了你。\nC. Darter：我保证。\nS. Dent：我们什么时候开始？\nC. 达特：22：00。我会在23：30之前准备好逃生舱。请务必到场。\nS. Dent：好的。\nC. Darter：我还有一些需要研究的内容。祝你好运。\nS. Dent：你也是。\n\n—----------------------- 22:24 - 警卫办公室\n\nJ. Charter：靠边站。\n\n—----------------------- 22:38 - 驾驶舱\n\nJ. Charter：谁在那里？莎拉？\nS. Dent：朱利安？\nJ. Charter：你在做什么？你是不是动了自动驾驶仪？\nS. Dent：我可以解释。\nJ. Charter：这是一项命令吗？你为什么要这么做？\nS. Dent：这不对。\nJ. Charter：你的意思是什么？\nS. Dent：这个整个项目都是错误的。我们并没有帮助任何人。这并非用于医学领域，而是用于研发武器。\nJ. Charter：我知道。正如我在简报中所说的，这是一次军事行动。\nS. Dent：你知道吗？一直到现在，他们都在折磨人们。只是为了能在幸存者身上进行实验。你对此没意见吗？\nJ. Charter：无论我们是否完成这项任务，人们都会遭受损失。你知道这一点。我们可能会成为某个伟大事业的一部分。\nS. Dent：如果我们正在打造这样的未来……我一点也不想要这样的未来。\nJ. Charter：你是个叛徒。\nS. Dent：请仔细考虑一下。我们可以摆脱这个困境。把它抛在身后吧。既然我们知道不会让无辜的人受到伤害，那就这么做吧。\nJ. Charter：我信任你，Cavil也信任你。你为什么要破坏这次任务呢？我们本来是要回家的……\nS. Dent：Cavil正在准备逃生舱。请跟我来吧。\nJ. Charter：你们都对我撒了谎。你们背叛了我。\nS. Dent：请 Julian，它们是邪恶的。\nJ. Charter：为什么。\nS. Dent：朱利安，请冷静一下。放下武器，跟我一起过来。我们会没事的。\nS. Dent：请冷静下来，朱利安，拜托了。朱利-\nJ. Charter: 我……对不起。\n\n—----------------------- 23:13 - 中央走廊\n\nJ. Charter：对不起，Sarah。我爱你。\n\n—----------------------- 标记23:16 - 货舱\n\nJ. Charter：对不起。
exact:Transcript security recording - Day 18\n—----------------------- 00:23 - Pod-1\n\nC. Darter: These might be the last words you’ll hear from me. Escape pods don’t have a great track record when it comes to landings.\nC. Darter: Sarah is dead. The damn bastard shot her in the neck. Following orders before he launched himself out the airlock. Watched him sobbing through the hallway.\nC. Darter: I didn’t want them to get hurt. It just happened.\nC. Darter: She was innocent.\nC. Darter: Sol, if you ever read the logs. I want you to know I’m not sorry for sabotaging your mission. You are a corrupt piece of shit who deserves to be put with the innocents you’re slaughtering.\nC. Darter: I’ve got your documents. I’ve read your history. You were always like this.\nC. Darter: Watch what happens when the common people figure out who you really are.=转录安全录像 - 第18天\n—----------------------- 00:23 - 花朵-1\n\nC. 达特：这些可能是你从我这里听到的最后一句话了。逃生舱在着陆方面并没有什么好记录。\nC. 达特：莎拉死了。那个混蛋在她的脖子上开枪。他在从气闸门冲出之前就听从了命令。我看着他沿着走廊哭泣。\nC. 达特：我不想让他们受伤。事情就是这么发生的。\nC. 达特：她是无辜的。\nC. 达特：索尔，如果你曾经看过日志的话，我希望你知道，我并不为破坏你的任务而感到抱歉。你是一个腐败的混蛋，应该和那些你杀害的无辜者一起被处决。\nC. 达特：我已经拿到了你的文件。我已经了解你的历史。你一直都是这样。\nC. 达特：当普通人发现你的真实面目时，你会知道会发生什么。
exact:Transcript: interview four\n\nYear: 3\n\nDay: 104\n\nEmployee: 24-3\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: I am very pleased with this job. I love it here. This place is fantas-\n...\nYou don't think I am actually keep reading this bullshit. This place is a fucking abomination.\nInterviewer: How are the working conditions?\n\nEmployee: Oh they are absolutely fucked. If it's not the poison you feed us every day it's unregulated broken machinery that'll kill us. I have seen at least six bodies in the past three fucking days. One of them you even interviewed. And the funny thing.. THEY ARE STILL THERE!. \n\nInterviewer: How would you recommend this job?\n\nEmployee: NO! I AM DONE WITH THIS BULLSHIT! THERE IS A FUCKING WAR GOING ON AND WE ARE STUCK HERE TRYING TO PROVIDE FOR YOUR FAMILIES WHILE YOU TREAT US LIKE SOME SORT OF EXPENDABLE OBJECTS! I AM DONE HELPING YOU FUEL THIS WAR! HELL THIS FUCKING PLACE WILL BE ATTACKED SOON ANYWAYS. I AM GOING TO FUCKING KILL Y-=转录：采访四\n\n年份: 3\n\n日期 : 104\n\n员工：24-3\n\n\n采访者：你对这份工作满意吗？\n\n员工：我对这份工作非常满意。我喜欢在这里工作。这个地方真是太棒了。\n...\n你不认为我一直在看这些废话吗?这地方真他妈的可憎\n面试官：工作条件如何？\n\n员工:哦,他们绝对是性交。如果不是你每天给我们喂的毒药 是不受管制的破解机器会害死我们的我在过去三天里见过至少六具尸体其中一个你甚至采访过有趣的是...他们仍然在那里! \n\n面试官：您如何推荐这份工作？\n\n员工：不！我受够了这种胡扯！现在正发生一场该死的战争，而我们却被困在这里，只能尽力照顾你们的家庭，而你们却把我们当成了某种可以随意利用的物件！我受够了为这场战争提供燃料！该死，这个地方迟早会被攻击的。我他妈要杀了你们！
exact:Transcript: interview one\n\nYear: 3\n\nDay: 74\n\nEmployee: 15-1\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: It's alright, it gets the family paid.\n\nInterviewer: How are the working conditions?\n\nEmployee: It's not the worst, a few accidents have happened but so far it's been OK.\n\nInterviewer: How would you recommend this job?\n\nEmployee: I can't say I'd recommend this job but if you are in desperate need of money like most of us, it's an alright job.=访谈一\n\n年份：3年\n\n日期：第74天\n\n员工：15-1\n\n\n面试官：你对这份工作满意吗？\n\n员工：还行吧，至少能让家人有饭吃。\n\n面试官：工作条件如何？\n\n员工：不算最差，偶尔会有一些事故，但到目前为止还算可以。\n\n面试官：你会推荐这份工作吗？\n\n员工：我不敢说推荐，但如果像我们大多数人一样急需赚钱，那这确实是一份不错的工作。
exact:Transcript: interview three\n\nYear: 3\n\nDay: 96\n\nEmployee: 17-5\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: To be quite frank, it's horrible. If I could take any other job right now, I would.\n\nInterviewer: How are the working conditions?\n\nEmployee: They're horrible. There's no safety equipment, an accident can happen at any time. I am pretty sure there's only one first aid area. And the only reason it's there is because it's required.\nYou all know this moon incredible pressure below its thin crust, one mistake and it might just burst.. It'll flood the entire surface with boiling hot oil, likely killing most.. if not all of us.\n\nInterviewer: How would you recommend this job?\n\nEmployee: I simply wouldn't.\n\nInterviewer: this is the third person we've interviewed now... I swear if the next one is just like the others. I am going to start threatening these assholes and force some words oh.. it's still recording.=转录：采访三\n\n年份: 3\n\n日期 : 96\n\n员工：17-5\n\n\n采访者：你对这份工作满意吗？\n\n员工：说实话，这太糟糕了。如果现在可以换一份工作，我一定会换的。\n\n面试官：工作条件如何？\n\n员工：他们太糟糕了。根本没有安全设备，任何时候都可能发生事故。我很确定只有一个急救区。而设置这个急救区只是因为法规要求。\n大家都知道，这颗卫星在其薄薄的地壳下承受着巨大的压力，只要出现一点失误，它就有可能破裂。整个表面将会被滚烫的石油淹没，很可能会杀死我们中的大多数人……甚至所有人。\n\n面试官：您如何推荐这份工作？\n\n员工：我实在不愿意这么做。\n\n采访者：这是我们目前采访的第三个人了……我发誓，如果下一个人也和其他人一样，那我就要开始威胁这些混蛋，并强迫他们说出一些话……哦，现在还在录像呢。
exact:Transcript: interview two\n\nYear: 3\n\nDay: 84\n\nEmployee: 35-2\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: ... this job is horrible. I hate it.\n\nInterviewer: How are the working conditions?\n\nEmployee: Unbearable, you either end up burning yourself to oil or you fall over from exhaustion. It's not like it matters to the higher ups, ware expendible anyways. There's a reason I am numbered 32-2.\n\nInterviewer: How would you recommend this job?\n\nEmployee: I wouldn't.=访谈二\n\n年份：3年\n\n日期：第84天\n\n员工编号：35-2\n\n\n面试官：你对这份工作满意吗？\n\n员工：……这份工作太糟糕了，我讨厌它。\n\n面试官：工作条件如何？\n\n员工：难以忍受，要么会烫伤自己，要么会因疲惫而摔倒。不过高层并不在乎这些，反正这些都是可以消耗的。这就是我编号为32-2的原因。\n\n面试官：你会推荐这份工作吗？\n\n员工：我不会。
