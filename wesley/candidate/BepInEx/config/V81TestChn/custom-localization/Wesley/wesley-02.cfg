exact:The purifying shrine\n\nThis device was designed to harvest and project the power of the purifying stones and spread their effect across areas far and wide.\n\nThe farmers most often used these to stabilize their farmland and increase the rate at which their crops grew.=净化神殿\n\n该装置旨在收集并释放净化石的力量，将其效果传播到广阔的区域。\n\n农民们最常使用这些装置来稳定农田，并提高作物的生长速度。
