# Wesley / 简体中文。仅精确匹配显示文本。
exact:I've been here for six weeks now.\nThey told me there will be a retrial for my case!\nTHANK GOD!\nMaybe this time they will actually have a close look at all the evidence I've provided.\nThis also means I can FINALLY leave this place.\nEven if temporarily.\n\nWe're also slowly being moved to another prison I've heard.\nI really hope it's a little nicer because I am SICK of waking up to a swarm of rats running around our cells.\n\nThe activities here are horrible too.\nWe can't even work out since most of the equipment is either broken or extremely dirty.\n\nThey cleared out a couple cell blocks already.\nI think we might be next.\n\nThis does mean I'll have to leave my notes here.\nI don't think I can sneak those with me.\n\ni will find justice for you Jane.\nI loved you.=我已经在这儿待六周了。他们说我的案子要重审！谢天谢地！也许这回他们真会好好看我交上去的证据。我终于能离开这里了，哪怕只是暂时的。\n\n听说大家也在分批转往另一所监狱。希望新地方能好一点，我受够了每天醒来都是老鼠在牢房里乱窜。这里的活动也糟透了。大半器材不是坏了就是脏得不行，连锻炼都没法锻炼。\n\n已经有几片监区清空了。我想接下来就该轮到我们。这也意味着我得把笔记留在这里，恐怕没法偷偷带走。\n\n简，我一定会为你讨回公道。\n我爱过你。
exact:I, Michael Dunton hereby resign from my position on the council.\n\nI feel there are things at play that are bigger than they seem.\nWhile I am certain that I would not be believed if I brought this up myself, I have left my notes and recordings in my office.\n\nI do not wish to be part of what's happening or what's to come.\nStrange things are going on in this council, and in this case.\n\nDuring the 4th and previous conference it seems to me that all sense of logistics are thrown out the window.\nI will take my leave on the day of the 5th and final conference.\n\nIt is best to carry my words with heavy thought.\n\n-Michael Dunton=我，迈克尔·邓顿，特此辞去议会职务。\n\n我觉得眼前所见只是冰山一角。我若亲自提出，想必不会有人相信，所以已把笔记和录音留在办公室。\n\n我不愿参与正在发生的事，也不愿参与即将发生的事。议会里、这桩案子里，都有蹊跷。\n\n在刚过去的第 4 次会议上，我觉得一切实际考量都被抛诸脑后。我会在第 5 次、也是最后一次会议当天离开。\n\n请诸位慎重思量我的话。\n\n——迈克尔·邓顿
exact:I.. I can't believe I actually did it. \nHis body flopped right onto the floor. \nI picked him up, now all covered in blood and I dumped him into one of those boxes.\nI wasn't quite sure what to do next so I closed it and pushed it into a giant pool of toxic waste.\nIn hindsight he might've still been alive.\nNot that it matters now..\nMy geiger counter reads dangerous levels now.\nI need to burn my stuff and leave before the radiation kills me..\nBye Bye Aaron.=我……我不敢相信自己真的动手了。\n他整个人一下子瘫倒在地。\n我抱起满身是血的他，把他塞进其中一个盒子。\n我不知道接下来怎么办，就合上盖子，把盒子推进了一大池有毒废液里。\n现在想来，他当时可能还有气。\n不过现在也无所谓了……\n盖革计数器的读数已经到了危险水平。\n我得烧掉自己的东西，在辐射要了我的命之前离开……\n拜拜，亚伦。
exact:ICE LEVIATHAN\r\n\r\nSigurd's danger level: ??? idk I have n veer seen tehm\r\n\r\nScientific name: Iciteren-gigantis\r\n\r\nThe Ice leviathan, being part of the family Piscicolidae is, similarly to the Earth leviathan among the largest invertebrates in the Thistle Nebula. While there have been equally little recorded captures of this creature, there have been a lot of discoveries made since the expedition in the glacial caves of 94-Polarus, which they have made their home.\r\n\r\nWhile it is often assumed that these leviathans primarily hunt land-dwelling prey due to their occasional appearances above the earth. It is quite the opposite.\r\nTheir jaws do not have any teeth but instead have baleen which they use to filter out nutrients from vast frozen oceans.\r\nIt is only in desperate times when they resort to hunting for prey on land. However they might also appear when their breeding grounds are threatened. Be wary of sudden vibrations as you might not immediately realise you are walking above one.\r\n\r\nIce leviathans primarily burrow themselves within deep sheets of ice, carving out large sections creating these ginormous unnatural caverns as resting and breeding places in between feeding sessions. Using their extremely hard and thick skin to break through the ice. \r\nThey have to move often due to the nutrient supply not replenishing quick enough to sustain the leviathan.\r\nAn ice leviathan will only ever make one breeding cavern in their lifetime, it is often much larger than resting caverns and it is always the place they return to when mortally wounded, or when they are approaching the final months of their life. They will stay there until death occurs. It is not known why. The common theory is that Ice Leviathans share a sentimental value with the area where they birthed their young.=冰原利维坦\n\n西格德的危险等级：？？？不知道，我从来没亲眼见过\n\n学名：Iciteren-gigantis\n\n冰原利维坦属于鱼蛭科，与大地利维坦同为蓟星云中最大的无脊椎动物之一。和后者一样，捕获记录寥寥无几。但自探险队深入 94-波拉鲁斯的冰洞以来，人们已经对这些以冰洞为家的生物有了许多新发现。\n\n由于它们偶尔钻出地面，人们常以为它们主要捕食陆生猎物。事实恰好相反。它们的颌部没有牙齿，而是靠须板从广阔冰海中过滤养分。\n只有在食物极度匮乏时，它们才会上岸捕猎；繁殖地受到威胁时也可能现身。留心突如其来的震动，你未必能及时意识到，自己正走在它的上方。\n\n冰原利维坦多钻入深厚的冰层，用格外坚韧厚实的皮肤破冰，挖出大片巨大的非天然洞室，供两次进食之间休息或繁殖。当地养分补充的速度赶不上它们的消耗，因此它们必须经常迁移。\n每条冰原利维坦一生只建一个繁殖洞，通常远大于休息用的洞室。身负致命伤，或生命只剩最后几个月时，它总会回到那里，直到死去。原因尚不清楚。常见的推测是，它们对诞育后代的地方怀有眷恋。
