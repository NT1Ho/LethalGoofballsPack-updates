exact:Many years ago in a time long passed.\nA young man stood between the flowers in a ray of moonlight.\nObserving the stars, taking in the beauty that is the universe.\nHe did this every night. And every time it was breathtaking.\nBut on one fateful night it was different.\nHe saw a bright light in the sky.\nA comet?, A creature? no, something more.\nHe described it as a soul or a presence..\n And it spoke.\nThere between the flowers he listened to this voice from deep space.\nIt sounded powerful, but vague. A message he couldn't understand.\nYet he was inspired. He had to hear this again.\nHe had to tell everyone he knew.\nThis was something special.=许多年前，在一个遥远的時代。\n一个年轻人站在月光下，花朵之间。\n他凝视着星星，欣赏着宇宙的美景。\n他每晚都这样做，每一次都是如此令人陶醉。\n但有一个决定性的夜晚，情况有所不同。\n他看到天空中有一道明亮的光。\n是彗星？还是某种生物？不，更像是别的什么。\n他将其描述为一个灵魂或一种存在..\n 然后它开口了。\n他在花朵之间聆听着来自深空的声音。\n那声音听起来很强大，但又很模糊。那是他无法理解的信息。\n然而，他受到了启发。他必须再次听到这个声音。\n他必须告诉所有他知道的人。\n这是一件特别的事情。
