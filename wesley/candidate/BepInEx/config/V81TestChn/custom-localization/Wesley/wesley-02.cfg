exact:There has been a fair passage of time between now and the previous time I have written.\nI had not expected this arrangement would prove so demanding. It feels as though every few days a new ship arrives at my door, not to be enamored by the mystiques of my gallery but rather to dispose of the debris they have gathered.\nI have attempted to inquire about their work yet they seem either hesitant to explain or convey that they know as much as I do.\nEither way, I have made the wise decision to automate the process of exporting these worthless pieces to Gordion. I cannot imagine taking care of such matters personally without leaving me exhausted.\n\nThere has however been one thing I became aware of regarding this mysterious company. They do not take kindly to their employees and demand them work an absurd amount where failure appears to be met with termination in the quite literal sense.\nI have always been aware of the cruelty within this region from the tales but I had never imagined it to be this terrible. Not until I met this gentleman of the name Marcus Brad.\n\nI wouldn't say it was the most pleasant of encounters.\nThis company ship had landed and were doing their own usual business. I on the other hand was altering some of the displays, not quite paying the attention to my surroundings as I likely should have.\nUpon turning, I discovered an armed stranger silently standing a few paces behind me, which in honesty I found considerably less pleasant than the display I had been arranging moments earlier. It was quite alarming even and my response was rather lacking. He demanded that I help him with his harrowing situation which, at the time, I wasn’t aware of how bad it was. His suit appeared worn, bloodied with a scorch mark covering the left side of his helmet. An intimidating figure.\nI exclaimed I wouldn’t know how and even if I did there would be a chance this mysterious company would return with evil intent.\nHe appeared serious, slightly frustrated even. Still pointing the weapon in my direction I attempted to politely ask for his name and how I could be of service.\n“My name is Marcus.”, he replied. “I have survived this company for at least five weeks now. You wouldn’t believe what they put us through. You need to help me escape them. Sooner or later they will try to kill me again.”. This ominous response left me curious and so I tried to inquire what exactly he meant with, they will try to kill him again. \nHe replied: “We have a quota we have to meet every few days. It keeps getting higher every time we succeed. I don’t believe it stops. It gets higher and higher until it’s impossible to reach. What happens if we don’t meet the quota? We die. The ship enters space and opens the doors sucking us into space to die an excruciating death. I survived this once, only because I could crawl into this airtight space within the ship’s internals before the doors opened and.. Took the others.”.\nI was stunned by this news. I confess I initially expected exaggeration.\nI could now sense that it wasn’t frustration in his voice but desperation. Perhaps a hint of sadness and dread.\nI offered a proposal, if he’s able to find and bring me uniquities or antiquities. I would search for a way of hiding him from and possibly tricking this company. Which he accepted.\n\nSince that eye opening encounter I have had a security system installed at the counter in case somebody deranged comes upon me with malicious intent.\nSo it appears for now I will be keeping myself busy with devising a plan alongside some other research I have been doing.\nI am certain I will write again.=距上次动笔，已过去好一阵子。当初没料到这笔安排会这么累人。仿佛每隔几天便有一艘新船登门，来人无意领略我馆藏的奥妙，只想处理他们捡来的破烂。我问过他们的工作，他们要么不太愿意解释，要么表示知道的并不比我多。总之，我明智地决定，将这些不值钱的东西自动运往戈尔迪翁。若要事事亲力亲为，我非累垮不可。\n\n关于那家神秘的公司，我倒弄清了一件事。他们苛待员工，要求高得荒唐，完不成便要被“终止”——恐怕得按字面意思理解。从前听人讲故事，我就知道这片区域残酷，却没想过竟能残酷到这种地步。直到我遇见一位名叫马库斯·布拉德的先生。\n\n我们的初次会面称不上愉快。公司的船降落后，船员照例做起生意。我正调整展品，没怎么留心周围。一转身才发觉，几步之外悄无声息地站着个持枪的陌生人。说实话，这可比我刚才摆弄的展品扫兴多了。我吓了一跳，一时没能作出像样的反应。他要我帮他脱离险境，那时我还不清楚他的处境有多糟。他的防护服破旧带血，头盔左侧一大片焦痕，模样颇为骇人。\n我脱口而出，说我哪知道该怎么帮他，即便知道，那家公司也可能回来寻仇。他神情严肃，甚至有些烦躁。枪口仍指着我，我只好尽量礼貌地问他尊姓大名、有什么可以效劳。\n“我叫马库斯，”他说，“我在这家公司活了至少五个星期了。他们让我们经受了什么，你不会相信的。你得帮我逃走。他们迟早还会再杀我一次。”这句不祥的话让我起了好奇心，我便问他，“再杀一次”究竟是什么意思。\n他说：“每隔几天我们就得完成配额。每完成一次，下一次就更高。我看它永远不会停，会一直涨到谁也完不成。完不成会怎么样？我们就得死。飞船开到太空，舱门打开，把人全吸出去，痛苦地死掉。我逃过一次。只是因为在舱门打开、把其他人……带走以前，我爬进了船体内部的一处气密空间。”\n我愣住了。坦白讲，我原以为他夸大其词。现在我才听出，那声音里的不是烦躁，而是绝望，或许还带着悲伤和恐惧。我向他提了个条件：只要他能为我找到并带回奇珍或古物，我就想办法把他藏起来，也许连那家公司都能骗过。他答应了。\n\n那次令我大开眼界的会面之后，我给柜台装了安保系统，以防哪天真有个心怀恶意的疯子找上门。看来近些日子，除了手头其他研究，我还得忙着想出一个计划。相信我还会再写。
exact:There has been a terrible turn of events.\n\nThe whole crew is celebrating, currently, after the Captain has confirmed my mad ramblings to be based in truth.\nThat Cosmocos possesses incredible alien knowledge, and is willing to share it with us.\nGranted - initially, I was not entirely coherent when I tried to convey my experience with the celestial brain, but...tch, I’ll hold my tongue.\n\nHe’s ordered to remove the brain and prepare for it to be taken back with us to 61-March.\nBut this will kill Cosmocos, I know this for certain.\nSlowly, over time, atrophied, until it is a husk.\nI don’t know why the Captain, having been offered the same kindness from Cosmocos, would even consider doing something like this.\nIt’s not right.\nPerhaps he doesn’t know?\nPerhaps we were not offered the same thing?\nPerhaps he knows...and he doesn’t care?\nHe’s not a man known for his kindness, after all.\n\nI asked that we put it to a vote.\nNot a single person sided with me.\n\nI don’t know what to do.\nI don’t know what I could possibly do to dissuade the Captain that wouldn’t have me thrown in a pod set on course for a jail cell back on 61.\n\nBut I have to do something.\nThis isn’t what Cosmocos wants.\nAnd I refuse to see it die like this.\n\nLieutenant Commander Cunningham, signing off.=事情急转直下。\n\n船长证实了我先前那通疯话确有其事。全船的人都在庆祝。科斯莫科斯当真掌握着不可思议的外星知识，也愿意与我们分享。好吧，起初我试着讲述与那颗星体大脑接触的经历时，确实有些语无伦次，可是……啧，我还是闭嘴吧。\n\n他下令取出大脑，准备带回61-March。这会杀死科斯莫科斯，我确信无疑。它会慢慢衰弱，直到只剩一具空壳。\n我不明白，船长也得到了科斯莫科斯同样的善意，怎么能动这种念头？这不对。也许他不知道？也许我们得到的并不一样？也许他知道……只是不在乎？毕竟他素来就不是个仁慈的人。\n\n我提议投票。没有一个人站在我这边。\n\n我不知道该怎么办。我能怎样劝船长回心转意，又不至于被扔进太空舱，直接送回61号的牢房？\n\n可我必须做点什么。这不是科斯莫科斯想要的。我绝不肯眼看着它这样死去。\n\n少校坎宁安，记录完毕。
exact:There were so many of them=它们实在太多了
exact:There's heads\nI swear\nThere are heads in the dark place\nWhy wont they believe me\n\n..\nMaybe they're right\nIgnore me\nI'm not okay=有人头\n我发誓\n黑暗里有人头\n他们为什么就是不信我\n\n……\n也许他们是对的\n别理我\n我不太对劲
exact:Thermometer=温度计
exact:These old voice recorders are the worst.. \nRight.. \nWe've got word from captain Donahue over at the primary facility. \nThey have found.. something.. \nIt appears to be something new, something unexplored. \nThey think it might be some sort of plant which sounds exciting. \n\nHere however we've made steady progress. \nAs mentioned before, this cosmic growth is able to grow.. eyes wherever it pleases. \nAt first we thought it might be some sort of defense mechanism. \nBut there's no active predators on Cosmocos from the data we've gathered. \nBut then we noticed something strange.. \n\nOne of the eyes growing in our incubators was able to move and look around, illuminating whatever it looked at. \nThis place is full of surprises. \nMore information soon. \n\nProfessor Harrington, over and out.=这些旧录音机真够呛……好了。\n我们收到了主设施多纳休船长的消息。他们发现了……什么东西。从没人研究过的新东西。他们猜是某种植物，听着挺让人兴奋。\n\n我们这边也在稳步推进。先前说过，这种宇宙增生体能在任何地方长出……眼睛。起初我们以为是防御机制，可我们收集到的数据显示，科斯莫科斯上没有活跃的捕食者。接着我们发现了一件怪事……\n\n培育箱里长出来的一只眼睛竟会转动，环顾四周，而且它看向哪里，哪里就会亮起来。这里处处是惊喜。有进展再说。\n\n哈林顿教授，通话结束。
exact:They brought this newfound knowledge to the village. They told everyone.\nWhile of course there were a lot of sceptics, there were few who had seen this light before when they were young. It had never spoken to them however.\nMaybe it wasn't a creature. Or something akin to that. Maybe it was the essence of their moon. Like a spirit, a presence as they described it.\nIt only made sense...\nAnd so they wished to see it again. To hopefully hear it speak, again.\nThey built shrines to please this presence.\nAnd even those of others.\nThey started giving them names, bodies, appearences, identities.\nThey would bring gifts to please them.\nThey would care for nature. The well being of their moon. Hoping to hear it again.\n\n... They never did, but they kept trying.=他们把新发现带回村子，讲给所有人听。怀疑的人自然不少，但也有几个人年轻时见过那道光。只是它从没对他们说过话。\n也许那并不是个生灵，也不是任何类似的东西。也许那是这颗星球的本质，如他们所说，是个灵，是冥冥中与他们同在的存在。这样就说得通了……\n他们渴望再见到它，再听它开口。为了取悦它，他们造起圣坛，又为别的存在供奉圣坛。他们赋予它们名字、形体、容貌和身份，带来礼物，爱护自然、照料脚下的星球，只盼再听见那声音。\n\n……他们再也没听见，却始终没有放弃。
exact:They have to be perfect, we cannot bathe in a stew of mediocrity if we wish to thrive in our future. With slight alterations, one perfect specimen might be worth a hundred regulars in action. The process might be slow but we require patience. An empire built in a day will end in one too. We must be patient, build our machines. Then watch as we bring order and end this quiet age.=它们必须完美。若想将来兴盛，我们就不能泡在平庸的泥汤里。只要稍加改造，一个完美个体在实战中或许就抵得上一百个普通个体。进度也许很慢，我们要有耐心。一日筑起的帝国，也会在一日之间覆灭。耐下心来，造好我们的机器。然后看我们如何建立秩序，终结这静默时代。
exact:They see fear\nThey fear\nFear\nI fear them=他们看见恐惧\n他们害怕\n恐惧\n我害怕他们
exact:They were no more=他们都不复存在了
exact:They will remember your tribute=他们会记住你的献礼
exact:They won't let us near it.\nThey won't let us touch the smoothness of the crytal.\nThey won't let us feel the embrace of its glowy shell.\nThey won't let us experience the relief.\nThey won't stop us from becoming one.\nThey won't stop us from being enlightened.\nThey won't stop us. They can't stop us.\nThey won't stop us. They can't stop us.\nThey won't stop us. They can't stop us.=他们不让我们靠近它。\n不让我们摸一摸那光滑的水晶。\n不让我们投入它发光的外壳的怀抱。\n不让我们感受那份解脱。\n他们阻止不了我们合为一体。\n他们阻止不了我们获得启明。\n他们阻止不了我们。他们办不到。\n他们阻止不了我们。他们办不到。\n他们阻止不了我们。他们办不到。
exact:They're everywhere!\nBees, spiders and whatever else lived out there.\nI think they killed most of the people here.\nI'm heading out the fire exit to wait outside.\nIt's that or getting eaten alive in here..\nTell my family I love them.=到处都是！\n蜜蜂、蜘蛛，还有原先住在外头的其他东西。\n这里的人恐怕大半都被它们杀了。\n我要从消防通道出去，在外面等。\n总比待在这里被活吃了强……\n告诉我的家人，我爱他们。
exact:They’re here. We’ve tried to leave the city but we’re boxed in. There’s borders beyond which you might get shot and I’d rather not take the risk.\nWe’re stuck in an apartment building waiting for an opportunity to leave. Not even sure if that opportunity will arrive at all but I must stay hopeful. If not for me, for my Julie and my daughter. They mean the world to me. I cannot afford to lose hope.\n\nThey are coming at the city with full force. I can hear the gunfire from here. I think we might be able to get to the metro station and escape through there. There’s a safety curfew in place, anyone out at night is at risk of getting shot, we must travel before then and be quick.\nThe clock is ticking so we’re preparing to go.\nJust like I always said, there is hope.=他们来了。我们试过出城，可路都被封了。越过警戒线就可能挨枪子，我不想拿命去赌。\n我们困在一栋公寓楼里，等机会离开。我甚至不知道等不等得到，可我得有盼头。就算不为自己，也得为朱莉和女儿。她们是我的一切。我不能灰心。\n\n他们正全力攻城。我在这里都能听到枪声。也许我们能赶到地铁站，从那里逃走。现在实行宵禁，晚上出门就有挨枪的危险。得赶在那之前，动作要快。\n时间不多了，我们准备动身。\n就像我一直说的，总还有希望。
exact:Things are getting weirder.\nIt has only been slightly over a week since the renowned Crescent of Curses arrived on our doorstep.\n\nI fear unlike the other artefacts we collected, this one appears to radiate some sort of aura which messes with the brain.\n\nAt least the filter has been replaced.\nUnfortunately it was only after one of us took a warm bath and melted overnight.\n\nWe need to get rid of that thing.=事情越来越怪了。\n那件大名鼎鼎的诅咒新月送到门口，才过去一个多星期。\n\n恐怕它和我们收集过的其他遗物不同。它似乎会散发某种气息，搅乱人的心智。\n\n好歹滤芯已经换了。\n可惜换之前，有个人洗了个热水澡，一夜之间整个人都融化了。\n\n我们得处理掉那东西。
exact:This apple is generic=这只苹果很普通
exact:This facility isn't big. It's composed of two sections. The work area and the guards office above.\nThe work area has 4 sleeping chambers, 6 beds in each if they're all like mine.\nAll connected to one long hallway leading down to the mine past the cafeteria.\nOn the other end are the stairs to the guard office.\nWhich I know has at leat an armory and a control room.\nI've noticed a pattern where they sent a different guard to check on us every day.\nReminding us that we'll be left for the vultures if we don't comply.\nSo far I've counted 7 faces. They're armed with automatic weapons each time. But we only need to get the jump on one.\nOne weapon, 24 men against 6.. I like these odds.=这座设施不大，分为作业区和上层守卫室。作业区有4间寝室，要是都跟我的一样，每间有6张床。它们连着同一条长廊，经过食堂就通向下面的矿井。另一头是去守卫室的楼梯。我知道那里至少有一间军械库和一间控制室。\n我发现他们每天换一个守卫来查房，提醒我们不听话就等着喂秃鹫。到现在我数过7张面孔。他们每次都带着自动武器。可我们只要打其中一个措手不及。\n一把枪，24个人对6个……这胜算我喜欢。
exact:This generic is apple=这只普通很苹果
exact:This is \n-Across The Stars-\nBack with the 11-ish am news, I’m a little late today.\nThere’s a lot to catch up on nowadays.\nIt’s been a cloudy week and it looks like it’ll be cloudy for a little while longer.\n\nThe reports have not been great.. quite the opposite in fact.\nIf you haven’t heard it already, Trite has suffered its most devastating attack yet.\n..The cities have fallen.\nI’ll repeat it once more, the cities of Trite have fallen.\nAccording to my sources most of the people were able to flee in time.\nI wish I could say I know what will happen next.\nBut..\nI can’t.\nWhat the Triton Military will do next is a mystery.\n\nAll I can say is go to the Domes of Demetrica, and survive.\n\nThere will be some comforting tunes, please, stay tuned.\nAnd for those still listening, thank you.=这里是《穿越星辰》。又到了上午11点左右的新闻时间，今天我来晚了点。近来要讲的事真多。\n这星期天一直阴着，看样子还要阴上一阵。\n\n传来的消息不太好……其实是糟透了。也许你还没听说，特赖特遭到了迄今最惨烈的袭击。……各座城市已经沦陷。我再说一遍，特赖特的各座城市已经沦陷。据我的消息来源，多数人都及时逃了出来。我真希望自己知道接下来会怎样。可我……不知道。特里同军方下一步会怎么走，无人知晓。\n\n我能说的只有：去德梅特里卡的穹顶，活下去。\n\n接下来放几首能让人宽心的歌。请别换台。感谢还在收听的各位。
exact:This is an automated message=这是一条自动发送的消息
exact:This is the end=一切都结束了
exact:This is writ with bloodied hands.\nParts of Jareck's brain still between my fingernails.\nI succeeded.\n\nMy chest is bleedin. A searing pain from one side to the other. I believe he shot me in my ambush.\nThough I only geel it now.\nMy adrenaline kept me going. I was on top of him.\nEvery fist that struck his face was fueled by unmatched anger.\nI asked what happened to my wife and child..\nHe didn't even know who I was.\nI now realise the road I drove would lead to nowhere.\nI killed the man I hated so much.\nYet nothing's changed. I feel no different.\nMy family is still missing. And soon my breath will be my last.\nI was damned from the day I was taken.=我用沾满血的手写下这些字。指甲缝里还有贾雷克的脑浆。我做到了。\n\n我的胸口在流血，从这一头到那一头，烧灼般地疼。他大概是在我扑过去时开的枪。我直到现在才感觉到。当时只靠一股冲劲撑着，我骑在他身上，一拳一拳砸向他的脸。每一拳里都是我这辈子没尝过的恨。\n我问他，我的妻儿怎么样了……他甚至不知道我是谁。\n我现在才明白，我一路追到这里，根本没有出路。我杀了自己最恨的人，却什么都没改变。我心里也没有半点不同。\n我的家人依旧下落不明，我很快就要咽下最后一口气。从被带走的那天起，我就已经完了。
exact:This poor guy didn't deserve this.\nI wonder if there are any other innocent prisoners here.\n\nIf I knew this I would've made sure he wasn't put with the others.\nBut.\nWe're all just following orders here.\n\nIt's vile what we do here.\nPoor guy thought he'd be moved.\nWe don't keep prisoners here.\nWe kill them and turn their bodies into soil.\nSoil which is used to grow crops at an extraordinary rate.\nThese crops are then sold back to the public.\n\nPeople would go crazy if they knew about this.\nI would too.\nBut that's just our job.\n\nI hate it but.. it's how money gets made.=这个可怜人不该遭这种罪。这里还有多少无辜的囚犯？\n\n早知道，我说什么也不会让他们把他和其他人关在一起。可我们在这儿，都只是奉命行事。\n\n我们干的事真恶心。可怜的家伙，还以为自己会被转走。我们这里不留囚犯。我们杀了他们，把尸体变成土，用这种土让作物长得快得出奇，再把收成卖给老百姓。\n\n要是大家知道，准会疯掉。换我也一样。可这就是我们的工作。\n\n我恨透了这事，可……钱就是这么挣来的。
exact:This ship requires immediate assistance=本船急需援助
exact:This tape contains highly classified material and must not see the eyes of the public\n\nA hidden bio-weapon testing facility has been discovered on the 13th Asteroid orbiting 56-vow\n\nYou have been tasked to find and extract what remains of  the weapons tested here\n\nThe facility has been destroyed but there are several rogue bio-weapons primed to kill anyone  and everyone in any way possible\n\nGood luck=本录像带载有绝密资料，严禁向公众披露。\n\n在环绕 56-Vow 的第 13 号小行星上，发现了一处隐蔽的生物武器试验设施。\n\n你的任务是找到在此测试的武器，并带回其残余部分。\n\n设施已遭摧毁，但仍有数件失控的生物武器随时可能发动攻击，用尽手段杀死它们遇见的每一个人。\n\n祝你好运。
exact:This will be my last day here, after today, I will be fleeing once more.\nBut to someplace safe this time.\nWe had come to the decision that the decades of research was simply too valuable to destroy.\nSo we have handed them the tools, the research and they will likely proceed with making their own soldier in labs.\nThe prospect of that is horrifying.\nOr.. well \nIt would have been had I not removed any mention of LYN-H, the one thing that prevents clones from dying shortly after being created.\nThe armies they grow will all drop dead within a month after being created.\nTime to find a brighter horizon.\nProfessor Harrington, over.. and out.=这是我在这儿的最后一天。今天过后，我又得逃了。这一次，要逃到安全的地方。\n我们商定了，几十年的研究实在太珍贵，不能一把火毁掉。于是我们把工具和研究都交给了他们。他们多半会在实验室里培育自己的士兵。这念头真叫人不寒而栗。\n或者说……本该如此。幸好，我删去了所有提到 LYN-H 的内容。克隆体造出来后，全靠它才不会很快死去。\n他们培育的军队，一个月之内就会全部倒下。\n该去找一片更明朗的天地了。\n哈林顿教授，通话……结束。
