exact:If anyone has followed me from across the stars, I made it to my apartment, Julie is here with my daughter, they’re safe. The armies aren’t here yet but the city is preparing for an invasion. I just don’t think they’re ready.\nI mean I’ve read the reports. This city doesn’t have nearly enough to withstand whatever army they’ll throw at us.\nI’m fearful.\n\nBags are packed and we are about ready to leave. But if I’m speaking in honesty, it doesn’t quite sit right with me. I know I have done all that I could to warn people but I am not sure if it was right for me to just.. Leave like that. \nI’ve thought about going back but then I’d be leaving my family. There are countless people listening to my station and I hope they don’t feel abandoned. I know what that’s like unfortunately.\nIt’s rough. Like the lifeboat sailed away and now you’re drowning alone, unsure of how to survive. I’ve been there.\nTimes are worse now.=如果还有人跟着我的广播一路听过来，我已经到家了。朱莉和我女儿都在公寓里，她们很安全。军队还没到，城里正在准备抵御入侵。可我觉得他们没准备好。\n我是看过报告的。不管对方派什么样的军队来，这座城能用来抵抗的力量都远远不够。\n我很害怕。\n\n行李收拾好了，我们差不多该走了。可说实话，我心里一直过不去。我知道我已经尽力警告了大家，可就这么……一走了之，真的对吗？\n我想过回去，可那样就得丢下家人。还有那么多人在听我的电台，希望他们别觉得我抛下了他们。不幸的是，那种滋味我知道。\n很难熬。就像眼看救生艇驶走，只剩你一个人往下沉，不知道怎么才能活命。我经历过。\n如今的情形更糟。
