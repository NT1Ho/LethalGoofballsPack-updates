exact:My existence, my being, my mortality are comming thougts which cycle through my head more often than not.\nMy future, my past, my heart's desires. And the choices made which brought me here. Could I have done something different I wonder. Could I have been happy.\n\nI offered to have my heart cut out. In the ceremony of this rotation.\nI hope to be placed among the others. I hope to be happy. I hope to be unalone.\nI hope for my soul to be at peace within it. And may I be found.\nI ask, please, take care of me.=我为何存在、我是谁、我终有一死，这些念头总在脑海里打转。\n我的将来，我的过去，我心中所求，还有那些把我带到这里的选择。我常想，当初能不能选一条别的路。我有没有可能过得幸福。\n\n在这一轮的仪式上，我自愿让他们剜出我的心。\n我希望能和其他人放在一起。我想要幸福。我不想再孤单。\n愿我的灵魂能在其中安息。愿有人找到我。\n我求你，请照顾好我。
