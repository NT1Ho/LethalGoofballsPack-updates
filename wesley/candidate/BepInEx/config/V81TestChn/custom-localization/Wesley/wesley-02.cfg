exact:WHITE MOLD\n\n\nScientific name: Cretyrus-botaharum\n\n\nThis is a dangerous species of mold which thrives in bright areas. It is capable of growing in dark places but prefers not to, very rarely it be found in shadow or complete darkness.\n\n\nThe mold grows en masse and is able to spread across large surfaces with rapid succession. Additionally, on occasion it clusters up and grows spike-like formations which act as a way of detecting motion and a means to spread itself through direct infection of any poor creature which gets stung by it.\n\n\nThe spike-like formations are able to sense both heat and vibrations through the air. It knows what sort of creatures are easier to spread through and which are not. Those it deems not viable, it tries to scare off by shaking its spikes. However it will not hesitate to sting when the opportunity arises regardless of what steps on it.\n\n\nUnlike most infections, this one does not try to kill or harm the host, instead it tries to adapt to its host and strengthen the skeleton or exoskeleton, making them bulkier and more violent as a faster method of spreading to other creatures through the addition of spikes growing out of the bones it has strengthened. Comparisons have been made with Rabies lyssavirus, a disease which similarly alters behaviour to become more violent as a means to spread.\n\n\nThe I.T.D.A. has investigated several infestations of this mold and deemed it not to be a critical level invasive species and has successfully cleared large patches of the mold.\nThey highly advise everyone to report any instances of the white mold appearing and avoid direct contact.=WHITE MOLD\n\n\n科学名称：Cretyrus-botaharum\n\n\n这是一种危险的霉菌，喜欢在明亮的地方生长。它能够在黑暗的地方生长，但更倾向于避免这种情况。非常罕见的情况下，它会出现在阴影或完全黑暗的地方。\n\n\n这种霉菌会大量生长，并能够迅速扩散到较大的表面上。此外，它偶尔会聚集起来，形成尖刺状的结构，这些结构可以感知运动，并通过直接感染被其叮咬的生物来传播自身。\n\n\n这些尖刺状结构能够感知空气中的热量和振动。它知道哪些生物更容易传播，哪些则不然。对于那些它认为无法传播的生物，它会通过摇动尖刺来吓退它们。然而，一旦有机会，它不会犹豫地发动攻击，无论面临何种威胁。\n\n\n与大多数感染不同，这种霉菌并不试图杀死或伤害宿主，而是试图适应宿主，并强化骨骼或外骨骼，使其体积更大、更具攻击性，从而通过从强化后的骨骼上长出尖刺来更快地传播给其他生物。有人将其与狂犬病病毒进行了比较，后者也是一种通过改变行为使其更具攻击性来传播的病毒。\n\n\nI.T.D.A.已经调查了多次这种霉菌的侵扰情况，并认为它不属于严重入侵物种，并且已经成功清除了大片霉菌区域。\n他们强烈建议所有人报告任何出现白色霉菌的情况，并避免直接接触。
