exact:The volcano was supposed to be dead!\nAt least that's what they told us.\nAny poor soul out there is currently being fried in the fiery rains of death.\nIf we don't call in rescue..\nWe might not see the light of day again.=这座火山本应已经熄灭了！\n至少他们是这么告诉我们的。\n现在，任何不幸的人都在死亡的烈焰雨中煎熬着。\n如果我们不呼叫救援……\n我们可能再也无法见到阳光了。
