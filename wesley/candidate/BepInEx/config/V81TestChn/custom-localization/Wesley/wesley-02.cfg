exact:The stones of purification\n\nThese stones hold incredible power.\nThrough the crystal growing within, it can be used to alter matter.\n\nTo rid food of mold, crops of insects, water of plagues.\nIt can speed the growth of plants, heal the wounded, increase their strength.\n\nOnly when put together in precise ways can their power be used.=净化石\n\n这些石头蕴藏着惊人的力量。\n借助内部生长的晶体，可以改变物质。\n\n让食物免受霉菌侵蚀，让庄稼免受虫害，让水源免受疫病污染。\n它们可以加速植物生长，治愈伤者，增强伤者的力量。\n\n只有按精确的方式组合，才能发挥这些力量。
