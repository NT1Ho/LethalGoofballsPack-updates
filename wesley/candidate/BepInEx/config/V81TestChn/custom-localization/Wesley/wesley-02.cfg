exact:The volcano was supposed to be dead!\nAt least that's what they told us.\nAny poor soul out there is currently being fried in the fiery rains of death.\nIf we don't call in rescue..\nWe might not see the light of day again.=那分明该是座死火山！\n至少他们是这么告诉我们的。\n外面那些可怜人，这会儿正被要命的火雨活活烤焦。\n要是不叫救援……\n我们可能再也见不到天日了。
