exact:The earthquakes are getting louder and I can hear parts of the cavern collapsing in the distance ahead of me.\nThe amount of bodies I have seen have left me horrified. While some of them were slumped over. Others looked like they were trying to run.\nIt's getting harder for me to breathe. And my legs are getting tired.\nI have found a few crystals of value. Not many but I should not succomb to my greed. This deposit is lost and I don't want to die trying to find it.\nI'm turning around and heading back. I want to see my cat Bean again.\nI just need to remember the way I came.=地震的响声越来越大。我听得见前方远处的洞穴一截截坍塌。\n一路看到的尸体多得让我发怵。有的瘫倒着，有的像是正要逃跑。\n我呼吸越来越费劲，腿也走不动了。\n我找到几块值钱的水晶。不多，可我不能太贪心。那处矿床已经找不着了，我不想为找它把命也搭上。\n我决定掉头回去。我还想再见见我的猫豆豆。\n只要我能想起来时的路。
