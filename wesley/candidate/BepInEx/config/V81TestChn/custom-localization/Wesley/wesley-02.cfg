exact:MANNEQUINS\r\n\r\nSigurd's danger level: 95%\r\n\r\nScientific name: Vir plascterus\r\nThe Vir plascterus is a silent threat which thrives among many non-hostile copies of itself. They are often referred to as mannequins due to their striking resemblance to clothing store mannequins and their outer body being made of plastic.\r\nProper research has not been conducted and therefore it is unclear what they actually are. \r\nIt is theorised that these are similar creations to the Vir colligerus, otherwise known as Coil-heads.\r\n\r\nAt the very least they have many behavioral traits in common, they only move when not observed by anything living. It has been noted that on occasion they abandon this rule and dash for the target. Unlike the Coil-head they do not make any noise while moving around. It is highly advised to stay vigilant of your surroundings as one might run up from behind.=模特\r\n\r\n西格德的危险等级：95%\r\n\r\n科学名称：Vir plascterus\r\nVir plascterus是一种隐秘的威胁，它会在许多不具敌意的同类中繁衍。由于它们与服装店的模特极为相似，且身体由塑料制成，因此常被称作模特。\r\n目前尚未进行充分的研究，因此不清楚它们究竟是什么。 \r\n据推测，这些生物与Vir colligerus类似，也被称为Coil-heads。\r\n\r\n至少它们有许多共同的行为特征，只有在未被任何生物观察到时才会移动。不过也有记录显示，它们有时会违反这一规则，直接冲向目标。与Coil-heads不同的是，它们移动时不会发出任何声音。因此，必须保持警惕，因为随时可能有人从背后袭击。
