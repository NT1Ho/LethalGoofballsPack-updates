exact:The earthquakes are getting louder and I can hear parts of the cavern collapsing in the distance ahead of me.\nThe amount of bodies I have seen have left me horrified. While some of them were slumped over. Others looked like they were trying to run.\nIt's getting harder for me to breathe. And my legs are getting tired.\nI have found a few crystals of value. Not many but I should not succomb to my greed. This deposit is lost and I don't want to die trying to find it.\nI'm turning around and heading back. I want to see my cat Bean again.\nI just need to remember the way I came.=地震的声音越来越响，我能听到前方洞穴的部分结构正在崩塌。\n我看到的尸体数量让我感到恐惧。有些尸体蜷缩着，而另一些则看起来像是试图逃跑。\n我的呼吸变得越来越困难，双腿也变得疲惫。\n我找到了一些有价值的晶体。虽然不多，但我不能屈服于贪婪。这个矿藏已经失去了，我不想在寻找它时死去。\n我打算转身回去。我想再见到我的猫Bean。\n我只需要记住来时的路。
