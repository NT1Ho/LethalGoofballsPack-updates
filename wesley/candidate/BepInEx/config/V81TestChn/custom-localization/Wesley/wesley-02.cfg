exact:They won't let us near it.\nThey won't let us touch the smoothness of the crytal.\nThey won't let us feel the embrace of its glowy shell.\nThey won't let us experience the relief.\nThey won't stop us from becoming one.\nThey won't stop us from being enlightened.\nThey won't stop us. They can't stop us.\nThey won't stop us. They can't stop us.\nThey won't stop us. They can't stop us.=他们不会让我们靠近它。\n他们不会让我们触摸到晶体的光滑表面。\n他们不会让我们感受到它那发光的外壳的拥抱。\n他们不会让我们体验到解脱的感觉。\n他们不会阻止我们成为一体。\n他们不会阻止我们获得启迪。\n他们不会阻止我们。他们无法阻止我们。\n他们不会阻止我们。他们无法阻止我们。\n他们不会阻止我们。他们无法阻止我们。
exact:They're everywhere!\nBees, spiders and whatever else lived out there.\nI think they killed most of the people here.\nI'm heading out the fire exit to wait outside.\nIt's that or getting eaten alive in here..\nTell my family I love them.=到处都是！\n蜜蜂、蜘蛛还有其他生物在那里生活。\n我觉得它们已经杀死了这里的大部分人。\n我要从消防出口出去，在外面等待。\n要么就在这里被吃掉……\n告诉我的家人我爱他们。
exact:They’re here. We’ve tried to leave the city but we’re boxed in. There’s borders beyond which you might get shot and I’d rather not take the risk.\nWe’re stuck in an apartment building waiting for an opportunity to leave. Not even sure if that opportunity will arrive at all but I must stay hopeful. If not for me, for my Julie and my daughter. They mean the world to me. I cannot afford to lose hope.\n\nThey are coming at the city with full force. I can hear the gunfire from here. I think we might be able to get to the metro station and escape through there. There’s a safety curfew in place, anyone out at night is at risk of getting shot, we must travel before then and be quick.\nThe clock is ticking so we’re preparing to go.\nJust like I always said, there is hope.=他们已经到了这里。我们试图离开这座城市，但被包围了。有边界线，一旦越过就会被枪击，我宁愿不要冒这个风险。\n我们被困在一栋公寓楼里，等待离开的机会。甚至不确定这个机会是否会到来，但我必须保持希望。如果不是为了我自己，也是为了我的朱莉和我的女儿。她们对我来说非常重要，我不能失去希望。\n\n他们正全力向这座城市进攻。我能听到枪声。我觉得我们或许可以到达地铁站，从那里逃出去。现在实行宵禁，晚上外出的人都有被枪击的风险，我们必须尽快行动。\n时间紧迫，我们准备出发了。\n就像我一直说的，还有希望。
exact:Things are getting weirder.\nIt has only been slightly over a week since the renowned Crescent of Curses arrived on our doorstep.\n\nI fear unlike the other artefacts we collected, this one appears to radiate some sort of aura which messes with the brain.\n\nAt least the filter has been replaced.\nUnfortunately it was only after one of us took a warm bath and melted overnight.\n\nWe need to get rid of that thing.=事情变得越来越奇怪了。\n自从著名的诅咒新月（Crescent of Curses）出现在我们家门口，仅仅过了一周多一点。\n\n我担心，与我们收集的其他文物不同，这个物品似乎散发着某种能量，会对大脑产生影响。\n\n至少那个过滤器已经被更换了。\n不幸的是，这只是在我们其中一个人洗了个热水澡后，过滤器在夜间融化了。\n\n我们必须处理掉那个东西。
exact:This apple is generic=这只苹果很普通
exact:This facility isn't big. It's composed of two sections. The work area and the guards office above.\nThe work area has 4 sleeping chambers, 6 beds in each if they're all like mine.\nAll connected to one long hallway leading down to the mine past the cafeteria.\nOn the other end are the stairs to the guard office.\nWhich I know has at leat an armory and a control room.\nI've noticed a pattern where they sent a different guard to check on us every day.\nReminding us that we'll be left for the vultures if we don't comply.\nSo far I've counted 7 faces. They're armed with automatic weapons each time. But we only need to get the jump on one.\nOne weapon, 24 men against 6.. I like these odds.=该设施并不大。它由两部分组成：工作区以及上方的警卫办公室。\n工作区有4个睡眠室，每个睡眠室里有6张床，这些床和我的床一样。\n所有建筑都连接着一条长长的走廊，这条走廊通向矿井，穿过食堂。\n在另一端是通往警卫办公室的楼梯。\n据我所知，那里至少有一个军械库和一个控制室。\n我注意到一个规律，他们每天都会派不同的警卫来查看我们的情况。\n提醒我们，如果我们不遵守规定，就会成为秃鹫的猎物。\n到目前为止，我已经数到了 7 个目标。每次他们都会配备自动武器。但我们只需要抓住其中一个目标。\n一种武器 24 男子反对或反对 6. .我喜欢这种机会
exact:This generic is apple=这只普通很苹果
exact:This is \n-Across The Stars-\nBack with the 11-ish am news, I’m a little late today.\nThere’s a lot to catch up on nowadays.\nIt’s been a cloudy week and it looks like it’ll be cloudy for a little while longer.\n\nThe reports have not been great.. quite the opposite in fact.\nIf you haven’t heard it already, Trite has suffered its most devastating attack yet.\n..The cities have fallen.\nI’ll repeat it once more, the cities of Trite have fallen.\nAccording to my sources most of the people were able to flee in time.\nI wish I could say I know what will happen next.\nBut..\nI can’t.\nWhat the Triton Military will do next is a mystery.\n\nAll I can say is go to the Domes of Demetrica, and survive.\n\nThere will be some comforting tunes, please, stay tuned.\nAnd for those still listening, thank you.=这是 \n-穿越星辰-\n带着11点左右的上午新闻回来，今天有点晚。\n现在有很多事情需要跟进。\n这一周天气阴沉，看起来还会持续一段时间。\n\n报道并不乐观……事实上，情况恰恰相反。\n如果你还没有听说，特赖特遭受了迄今为止最严重的打击。\n……特赖特的城市已经沦陷了。\n我再重复一遍，特赖特的城市已经沦陷了。\n根据我的消息来源，大多数人及时逃走了。\n我希望我能说我知道接下来会发生什么。\n但是……\n我无法预测。\n特赖特军队接下来会做什么仍然是个谜。\n\n我只能说，去德梅特里卡的穹顶，活下去。\n\n会有一些令人安慰的音乐，请继续关注。\n对于仍然在收听的人，谢谢。
exact:This is an automated message=这是一条自动生成的消息。
exact:This is the end=这是结束。
exact:This is writ with bloodied hands.\nParts of Jareck's brain still between my fingernails.\nI succeeded.\n\nMy chest is bleedin. A searing pain from one side to the other. I believe he shot me in my ambush.\nThough I only geel it now.\nMy adrenaline kept me going. I was on top of him.\nEvery fist that struck his face was fueled by unmatched anger.\nI asked what happened to my wife and child..\nHe didn't even know who I was.\nI now realise the road I drove would lead to nowhere.\nI killed the man I hated so much.\nYet nothing's changed. I feel no different.\nMy family is still missing. And soon my breath will be my last.\nI was damned from the day I was taken.=这是用沾满鲜血的手写成的。\n贾雷克的大脑部分组织仍留在我的指甲间。\n我成功了。\n\n我的胸口在流血，一阵灼热的疼痛从一侧蔓延到另一侧。我相信他在伏击时击中了我。\n尽管我现在只感到麻木。\n肾上腺素让我继续战斗。我终于压制住了他。\n每一记重拳都源于难以抑制的愤怒。\n我问我的妻子和孩子发生了什么……\n他甚至不知道我是谁。\n现在我意识到，我所走的这条路最终会通向无果。\n我杀死了自己如此憎恨的人。\n然而一切都没有改变。我感觉没什么不同。\n我的家人仍然失踪。很快，我的呼吸也将成为最后一口气。\n从被抓的那天起，我就被诅咒了。
exact:This poor guy didn't deserve this.\nI wonder if there are any other innocent prisoners here.\n\nIf I knew this I would've made sure he wasn't put with the others.\nBut.\nWe're all just following orders here.\n\nIt's vile what we do here.\nPoor guy thought he'd be moved.\nWe don't keep prisoners here.\nWe kill them and turn their bodies into soil.\nSoil which is used to grow crops at an extraordinary rate.\nThese crops are then sold back to the public.\n\nPeople would go crazy if they knew about this.\nI would too.\nBut that's just our job.\n\nI hate it but.. it's how money gets made.=这个可怜的家伙不值得遭受这样的对待。\n我想知道这里是否还有其他无辜的囚犯。\n\n如果我知道这一点，我就会确保他不会和其他人放在一起。\n不过...\n我们在这里只是按照指示行事而已。\n\n我们在这里的行为真是恶劣。\n可怜的家伙以为他会被感动\n我们这里不关押囚犯。\n我们杀死他们，将他们的尸体转化为土壤。\n以极高的速度用于种植农作物的土壤。\n这些农作物随后会被重新出售给公众。\n\n如果人们知道了这件事，他们会抓狂的。\n我也会这么做。\n但那只是我们的工作。\n\n我讨厌这样，但这就是赚钱的方式。
exact:This ship requires immediate assistance=这艘船需要立即救援。
exact:This tape contains highly classified material and must not see the eyes of the public\n\nA hidden bio-weapon testing facility has been discovered on the 13th Asteroid orbiting 56-vow\n\nYou have been tasked to find and extract what remains of  the weapons tested here\n\nThe facility has been destroyed but there are several rogue bio-weapons primed to kill anyone  and everyone in any way possible\n\nGood luck=这张磁带包含高度机密的信息，不得让公众看到。\n\n在绕56-vow小行星运行的第13颗小行星上，发现了一个隐藏的生物武器测试设施。\n\n你的任务就是找到并提取这里测试的武器的残余物。\n\n该设施已被摧毁，但仍有几件失控的生物武器处于待命状态，随时可能以任何方式杀死任何人。\n\n祝你好运。
exact:This will be my last day here, after today, I will be fleeing once more.\nBut to someplace safe this time.\nWe had come to the decision that the decades of research was simply too valuable to destroy.\nSo we have handed them the tools, the research and they will likely proceed with making their own soldier in labs.\nThe prospect of that is horrifying.\nOr.. well \nIt would have been had I not removed any mention of LYN-H, the one thing that prevents clones from dying shortly after being created.\nThe armies they grow will all drop dead within a month after being created.\nTime to find a brighter horizon.\nProfessor Harrington, over.. and out.=这是我在这里的最后一天,今天之后,我将再次逃离。\n这次要前往一个安全的地方。\n我们决定，数十年的研究成果实在太过宝贵，不应被毁掉。\n因此，我们已经为他们提供了所需的工具和研究资料，他们很可能会在实验室里自行制造出自己的士兵。\n这样做的前景是可怕的。\n或者... 好 \n要不是我删除了关于LYN-H的任何提及，那情况本可能有所不同。LYN-H是防止克隆体在创建后不久就死亡的关键因素。\n他们培育的军队在创建后一个月内都会全军覆灭。\n是时候寻找一个更光明的未来了。\n哈灵顿教授 完毕
