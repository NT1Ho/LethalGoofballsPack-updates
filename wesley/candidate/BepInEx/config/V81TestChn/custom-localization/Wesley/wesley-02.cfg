exact:SMILE\r\n\r\nIt smiles \r\nSmile\r\nI smile\r\nI laugh\r\nIt stares\r\nIt smiles\r\nSmile\r\nI smile\r\nI laugh\r\nIt stares\r\nIt smiles\r\nSmile\r\nI smile\r\nI laugh\r\nIt stares\r\nIt smiles\r\nSmile\r\nI smile\r\nI look\r\nIt stares\r\nIt smiles\r\nSmile\r\nI feel\r\nI see\r\nIt stares\r\nIt smiles\r\nSmile\r\nI feel watched\r\nIt keeps staring\r\nIt keeps smiling\r\nSmile\r\nThey’re here\r\nI feel safe\r\nIt’s gone\r\nBut I still feel it\r\nSmile=微笑\n\n它在微笑\n微笑\n我微笑\n我笑出声\n它盯着看\n它在微笑\n微笑\n我微笑\n我笑出声\n它盯着看\n它在微笑\n微笑\n我微笑\n我笑出声\n它盯着看\n它在微笑\n微笑\n我微笑\n我看\n它盯着看\n它在微笑\n微笑\n我感觉到\n我看见了\n它盯着看\n它在微笑\n微笑\n我觉得有人在看我\n它一直盯着看\n它一直在微笑\n微笑\n他们来了\n我觉得安全了\n它走了\n可我还是能感觉到它\n微笑
exact:SNARE FLEA\n\nSigurd's danger level: 30%\n\nScientific name: Dolus-scolopendra. \nA very large arthropod of the class chilopoda. Its body produces a silk which it primarily uses to propel itself to places where it is concealed. Its exoskeleton is somewhat fragile, and they can die from long falls. The snare flea does not produce venom, nor does it have a strong bite. It makes up for this weakness with its ability to tighten itself around large prey to suffocate.\n\nThe snare flea thrives in dark, warm areas. It cannot survive low temperatures and generally avoids open air and sunlight take the rats outside or just beat the hell otu of them! i think their insides could make a good milkshake,,=绊缚跳蚤\n\n西格德的危险等级：30%\n\n学名：Dolus-scolopendra。\n一种体型很大的唇足纲节肢动物。身体会分泌丝，主要靠它将自己弹送到隐蔽处。外骨骼较脆，从高处跌落可能摔死。它没有毒液，咬合力也不强，却能紧紧缠住比自己大的猎物，使其窒息。\n\n绊缚跳蚤喜暗喜暖，无法在低温下生存，通常也会避开露天和阳光。把这帮耗子带到外面去，或者直接揍扁！我觉得拿它们的内脏打奶昔应该不错，，
exact:SNATCHER\r\n\r\nSigurd's danger level: 65%\r\n\r\nScientific name: Mudcantis-suratin\r\n\r\nThe Mudcantis-suratin or more commonly known as the Snatcher is a part of the Uranuh family. It is a muddy creature which prefers warm, swampy areas where it is most commonly found. Female Snatchers tend to have a soft, muddy skin covered in tiny tendrils which are often mistaken for thick hairs. Male snatchers have a thick, hard calcium plate below their “face” under a thinner, rubbery layer of skin.\r\n\r\nSnatchers have a great amount of appendages, growing more as they get older, ending in hand-like shapes. While they look like hands they only resemble them and do not contain any Intrinsic muscles. However these are very strong and are their main form of travel both underwater and on land.\r\n\r\nSnatchers are not naturally aggressive creatures despite their intimidating look. They prefer to stick to the shadows or cloudy lakes and watch from a distance. The females are entirely herbivores while the males do snatch, drown and digest small creatures entirely for the calcium required to grow their face plate.\r\n\r\nHowever it is not always safe to assume a snatcher won’t harm you. It will act in self defense if it feels threatened with measures ranging from spitting thick sludge at you to violently swinging its appendages at you.\r\nThis act of defense is also amplified, specifically in females if anyone or anything approaches their nesting area. Chasing down and often viciously killing those who get too close to her young.\r\n\r\nThe mating process of snatchers is often fatal for the male as it requires them to briefly suffocate within the female. On the occasion of death, the female will mourn the male in their own unique way. The male’s skin gets repurposed to create a softer bed for the eggs once they are eventually laid. While the face plate will be hidden somewhere deep underwater as a form of burial. They often visit the burial site and seek to protect it from any intruders.\r\n\r\nWhile on the surface Snatchers are often described as monsters due to their name and look, they are very emotional and have a surprisingly good memory. There have been several counts of people befriending a Snatcher with them still remembering that person a decade later.\r\n\r\nIt is recommended to stay away from their nests and leave them be when encountered in the wild. While deaths by snatchers are not common, it is a possibility.=掳掠者\n\n西格德的危险等级：65%\n\n学名：Mudcantis-suratin\n\nMudcantis-suratin 俗称掳掠者，属 Uranuh 科。这种浑身泥泞的生物喜爱温暖的沼泽，那里也是最容易见到它的地方。雌体皮肤柔软，裹着泥浆，表面密布细小的卷须，常被误认为粗毛。雄体的“脸”下有一块厚而硬的钙质面板，外面覆盖着较薄的橡胶状皮肤。\n\n掳掠者有许多附肢，随着年龄增长还会长出更多，末端形似手掌。这些结构只是像手，内部并无手内在肌，却十分有力。无论在水下还是陆上，它们都主要靠这些附肢移动。\n\n虽然外表吓人，掳掠者天性并不好斗。它们更愿意躲在暗处或浑浊的湖中，远远观察。雌体完全以植物为食；雄体则会捉住小动物，将其溺死、消化，纯粹是为摄取生长面板所需的钙。\n\n不过，不能因此断定掳掠者一定不会伤人。感到威胁时，它会吐出浓稠的污泥，甚至用附肢猛烈抽打来犯者。任何人或动物靠近巢区，都会使它们的防卫反应加剧，雌体尤其如此。离幼体太近，母兽便会追上去，往往将入侵者凶狠地杀死。\n\n交配时雄体必须在雌体体内短暂窒息，因此常有雄体死亡。雌体会以独特的方式悼念伴侣：产卵后，用雄体的皮铺成柔软的卵床，再把它的面板藏到水下深处，作为安葬。雌体常常回到埋葬处，护住那里，不让入侵者靠近。\n\n名字和外表常使人将掳掠者视作怪物，其实它们情感丰富，记性也出奇地好。有好几个人曾与掳掠者结为朋友，十年后再见，它们仍认得对方。\n\n野外遇见时，建议远离巢区，让它们独处。掳掠者致人死亡的事虽不常见，确实可能发生。
