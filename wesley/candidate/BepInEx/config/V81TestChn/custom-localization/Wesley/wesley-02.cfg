exact:We are now four weeks into the debate meaning next week will be the final and deciding council conference.\nWhile the Council of Rule is still highly against the study and use of biological warfare, there must be a way to convince them otherwise.\n..I understand that it is a very dangerous idea which..\nIn theory..\nCould ruin more lives than I can count as well as cause a financial catastrophe within this region..\n\nBut I trust the Emperor knows this and I am sure he has a plan which I will be made aware of soon.\nHe does not sit upon the throne without reason.\n\nAfter this log I might write a letter to my wife Madeline as I will be leaving 235-Calist the next morning for a meeting with the Emperor.\nI hope to find some clarity about his plans to better structure our case.\n\nAgent G- Signing off.=我们现在已经进行了四周的辩论，因此下周将举行最终的、决定性的理事会会议。\n尽管规则委员会仍然强烈反对研究和使用生物武器，但必须找到一种方法来说服他们改变这一立场。\n我明白这是一个非常危险的想法……\n理论上……\n这可能会毁掉无数人的生活，同时还会给这个地区带来严重的经济灾难。\n\n不过，我相信皇帝已经知晓此事，我确信他有一个计划，很快我就会得到相关消息。\n他坐在王位上并非毫无理由。\n\n在这份日志之后，我可能会给我的妻子玛德琳写一封信，因为第二天早上我就要离开 235-卡利斯特，去参加与皇帝的会议。\n我希望能更清楚地了解他的计划，以便更好地构建我们的案件。\n\n特工G - 签名。
exact:We found the.. anomalous object. It was quite far from the primary facility so we decided to construct a tunnel directly to it.\nThere's lots of plants and growth in the way, it will likely take quite a bit.\n\nBut when that's finished we will finally be able to further study this.. thing.\nIt's going to take some heavy machinery so we might just bring one of our special apparatuses.=我们发现了那个异常物体。它距离主要设施相当远，所以我们决定直接修建一条隧道通往那里。\n途中会有很多植物和生长物，这可能需要花费相当长的时间。\n\n但一旦隧道建成，我们就能进一步研究这个物体了。\n这需要一些重型机械，所以我们可能会带上一种特殊的设备。
exact:We heard noises in the walls.\nA buddy of mine went to investigate one of the vents and..\nThere were so many of them..\nThe bees they..\nI can still hear his screams as they were digging into his eyesockets and flying into his mouth.\nIf rescue won't come quick, I don't know what else might follow.=我们听到墙里有声音。\n我的一个朋友去检查其中一个通风口，..\n通风口太多了..\n那些蜜蜂它们..\n我至今还能听到他的尖叫声，当时它们正钻进他的眼窝，飞进他的嘴里。\n如果救援不能迅速到来，我不知道还会发生什么。
