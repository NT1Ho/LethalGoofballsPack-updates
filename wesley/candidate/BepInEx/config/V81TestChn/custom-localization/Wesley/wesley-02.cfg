exact:To start off my statement I would like everyone to remember why the use of biological warfare was made illegal in the first place.\nNot two hundred years ago, over in the Altra region when the study and use of biological weapons was allowed still.\nA conflict between two dominions turned to bloodshed. This war is now known as one of the most devastating wars in all of time across the known regions.\n\nAnd it was the weaponry they used which marked this war as the deadliest one in history thus far.\nThe most commonly used was the melting gas made with the spores of an acidic super-fungi.\nWhen it touched the skin or was inhaled, it would melt the victim from the inside out. And the majority of victims were not military but civilians.\n\nSurely I do not speak for myself when I say-\nThis musn't happen again.=在开始我的陈述之前，我想让每个人都记住，为什么使用生物武器最初就被定为非法行为。\n就在两百年前，在阿尔特拉地区，对生物武器的研究和使用仍然是被允许的。\n一场两个势力之间的冲突演变成了流血战争。这场战争现在被认为是已知地区历史上最具破坏性的战争之一。\n\n而正是他们使用的武器，使这场战争成为迄今为止历史上最致命的战争。\n最常用的武器是一种由酸性超级真菌孢子制成的融化气体。\n当这种气体接触到皮肤或被吸入时，它会从内部将受害者融化。而大多数受害者并非军人，而是平民。\n\n我当然不能代表我自己说——\n这种情况不应该再次发生。
