exact:The past few weeks have been difficult.\nMy memory hasn't been the same since the crash.\nI do not recall much from before.\nAll that remains is some faint visions of self healing flesh, independently growing eyes and a bright flash before panic ensued.\n4 of us fled to one of ships and escaped the scene. \nI don't know what happened to the other two teams who were present at the time.\nI have now come to know that the entirety of Cosmocos vanished. And what we were standing on was merely a severed chunk of it.\n\nNobody has dared to return. We called it Desolation.\nI'll attach the coordinates to this log for anyone brave enough to have a look for themselves.\nAfter my recovery I might be able to help the people out over here.\nI've heard some interesting projects being discussed.\n\nProfessor Harrington, over and out.=过去几周非常艰难。\n自从那次崩溃之后，我的记忆已经不再如从前。\n我几乎不记得之前的事情了。\n剩下的只有一些模糊的幻象，比如自我修复的肉体、独立生长的眼睛，以及在一阵恐慌之前出现的明亮闪光。\n4 我们逃到一条船上 逃离现场 \n我不知道当时在场的其他两个团队发生了什么。\n我现在得知，整个科斯莫科斯都消失了。而我们曾经站立的地方，不过是一块被切下的碎片而已。\n\n没有人敢回来。我们将其称为荒芜。\n我会把坐标记录在这份日志中，供那些勇敢的人自行查看。\n等我恢复之后，或许能够帮助这里的人们。\n我听说有一些有趣的项目正在讨论中。\n\n哈林顿教授，再见。
