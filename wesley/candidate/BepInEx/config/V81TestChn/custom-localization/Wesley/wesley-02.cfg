exact:The plan worked. We lost good men but we took control over the facility.\nIn the control room I gained access to the ships which we are now loading up to make our escape.\nIt appears as though the guards called in an emergency.\nI expect more of them to come soon.\nI'll shoot a couple pipes on my way out in hopes that some of them suffocate in the leaking gas.\nBut more importantly. I went searching. And I found.\nJareck Hill was here 6 days ago. The log I read indicates that he now finds himself in another facility.\nThe flight route was set to 842 Core. I expect to find him there. With a proper disguise.\n\nPerhaps I can sneak in.. I must try.=计划成功了。我们失去了优秀的人员，但成功控制了该设施。\n在控制室里，我获得了进入飞船的权限，我们现在正在为逃跑做准备。\n看起来守卫们发出了紧急呼叫。\n预计很快会有更多的守卫赶来。\n在离开时，我会射杀几根管道，希望其中一些人在泄漏的气体中窒息而死。\n但更重要的是，我进行了搜索，并且找到了线索。\nJareck Hill在6天前来到这里。我查阅的记录显示，他现在身处另一个设施中。\n飞行路线被设定为842地核。我预计会在那里找到他，而且我会做好伪装。\n\n也许我可以偷偷进入……我必须试试。
exact:The plan:\n\nI am going to kill Aaron.\nI must.\nI don't want there to be any evidence after so. \nI'll have to burn everyhing. Anyways.\nOnce he has arrived aI will lead him over to a small room where we used to hang out as children.\nAnd when he thinks he's safe I'll hrab my baseball bat and if not kill him, knock him unconsious.\nI'll hide his body in one of those giant standing Jack-in-the-box boxes that used to scare me to death.\nI'll have to improvise after.=计划：\n\n我要杀死亚伦。\n必须这么做。\n我不想留下任何证据。 \n我得把一切烧掉。不管怎样。\n等他到了那里，我会带他去一个我们小时候常聚的小房间。\n当他以为自己安全时，我会拿起我的棒球棒，如果他还清醒，就杀了他，让他失去意识。\n我会把他的尸体藏在那些巨大的立式玩具箱里，那些玩具箱以前总是让我害怕得要死。\n之后我得随机应变了。
