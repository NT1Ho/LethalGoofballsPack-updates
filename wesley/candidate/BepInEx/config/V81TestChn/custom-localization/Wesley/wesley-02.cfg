exact:Tape 1, Infernis.\n\nThis is Captain Commander Cunningham.\nI have decided to start recording our sites of research and the environments we find ourselves in.\n\nOur current location is Infernis.\nThis fiery hellscape has done nothing but slow us down.\nThe seismic activity here is quite high so I'm not expecting to stay long.\nGood thing.\nThe mineshafts are riddled with bugs and are very much preventing us from doing anything.\n\nI rate this place a B+.\nCunningham, signing off.=录像带 1，因弗尼斯。\n\n我是指挥官坎宁安船长。\n我决定开始记录我们的研究地点，以及我们身处的环境。\n\n我们现在在因弗尼斯。\n这片烈焰地狱除了拖慢进度，什么用也没有。\n这里地震频繁，我估计我们不会久留。\n这样也好。\n矿井里到处都是虫子，我们根本干不了活。\n\n我给这里打 B+。\n坎宁安，通话完毕。
exact:Tape 2, Atlantica.\n\nThis is Captain Cunningham.\nGoing to Atlantica wasn't something we had initially planned. It was purely our curiosity that has led us here.\n\nAs of now we have not yet encountered anything unnatural as the reports have said.\nHowever, I do feel something is off about this place. It is pretty but something in me is telling me to leave.\n\nSo far I would rate this place a C.\nHowever I might've changed my mind by the time we go.\nCunningham, signing off.=录像带 2，亚特兰蒂卡。\n\n我是坎宁安船长。\n亚特兰蒂卡本来不在计划之内。我们完全是出于好奇才来的。\n\n到目前为止，我们还没碰上报告里说的那些反常现象。\n可我总觉得这里不对劲。景色虽美，心里却有个声音一直催我离开。\n\n目前我给这里打 C。\n等要走的时候，说不定我又改主意了。\n坎宁安，通话完毕。
exact:Tape 3, Etern.\n\nThis is Captain Cunningham.\nI have not been able to record much here and we will be leaving as soon as possible.\n\nOur trip to Etern has been an absolute disaster. I’ve seen more nutcrackers searching for us than there are grains of sand in this desert.\nWe’ve lost many and I’m not keen on losing any more of us.\n\nEtern gets an S+.\nI highly discourage anyone from going here.\nCunningham, signing off.=录像带 3，埃特恩。\n\n我是坎宁安船长。\n在这儿没能录下多少东西，我们会尽快撤离。\n\n这一趟简直是场灾难。搜捕我们的胡桃夹子比沙漠里的沙子还多。\n我们已经损失了很多人，我不想再失去任何一个。\n\n埃特恩，S+。\n我强烈建议所有人都别来这里。\n坎宁安，通话完毕。
exact:Tape 4, Acidir.\nThis is Captain Cunningham.\n\nWhen we arrived here the crew seemed fine.\nI use the term fine very loosely here.. They managed.\n\nHowever I feel the longer we stay, the worse things seem to be getting.\nI'm not sure if it's the air, the manor or the lakes of acid. But a few of us have already gone missing.\n\nI rate Acidir an S.\nCunningham, signing off.=录像带 4，阿西迪尔。\n我是坎宁安船长。\n\n刚到的时候，船员们看起来还好。\n说“还好”实在有点勉强……他们还撑得住。\n\n可我觉得，待得越久，情况就越糟。\n不知道是空气、那座庄园，还是那些酸湖的缘故。我们已经有几个人失踪了。\n\n我给阿西迪尔打 S。\n坎宁安，通话完毕。
exact:Tape 5, Gratar.\n\nThis is Captain Commander Cunningham.\nIt hasn’t been long since we got here.\nIt already appears to be a nice fresh breath of air compared what we have been through before.\n\nThe view is undeniably.. Stunning and the local wildlife has yet to try and kill us.\nWe will be going in soon to have a chat with this AI before we take off again.\n\nThus far I rate Gratar a low C.\nCunningham, signing off.=录像带 5，格拉塔尔。\n\n我是指挥官坎宁安船长。\n我们刚到不久。\n和之前经历的那些地方一比，来这里总算能喘口气。\n\n这里的景色确实……美得惊人。当地的野生动物至今也没试图杀我们。\n我们很快就要进去和这个 AI 谈谈，然后再起飞。\n\n目前我给格拉塔尔打个偏低的 C。\n坎宁安，通话完毕。
