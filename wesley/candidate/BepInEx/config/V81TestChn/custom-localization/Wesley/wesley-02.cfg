exact:Scientist: Year 135, uh day 48\nI've found cosmocos. Uh.. well.. the artificial intelligence I made uh found it.\nFrom what I understand.. it is encrypted. uhm, computer, tell me the location of Cosmocos.\n\nComputer: Alert! The location of Cosmocos is bit dot ly slash 3.. 3... \n\nScientist: Ugh! you stupid machine. I will sell you to the company of Gratar when I'm done with you!\nUh, last time he stopped after the second letter which was.. uh.. capital H!\nUhm nobody can find out about this.. \nMe out.=科学家：第 135 年，呃，第 48 天。\n我找到 Cosmocos 了。呃……好吧……其实是我造的人工智能找到的。\n据我了解……位置经过了加密。嗯，电脑，告诉我 Cosmocos 在哪里。\n\n电脑：警报！Cosmocos 的位置是 bit dot ly slash 3……3……\n\n科学家：唉！你这台蠢机器！等我用完，就把你卖给 Gratar 的公司！\n呃，上次它说到第二个字母就停了。那个字母是……呃……大写 H！\n嗯，这件事不能让任何人知道……\n通话结束。
