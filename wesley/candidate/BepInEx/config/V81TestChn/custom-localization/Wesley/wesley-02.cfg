exact:My existence, my being, my mortality are comming thougts which cycle through my head more often than not.\nMy future, my past, my heart's desires. And the choices made which brought me here. Could I have done something different I wonder. Could I have been happy.\n\nI offered to have my heart cut out. In the ceremony of this rotation.\nI hope to be placed among the others. I hope to be happy. I hope to be unalone.\nI hope for my soul to be at peace within it. And may I be found.\nI ask, please, take care of me.=我的存在、我的生命、我的 mortality 这些想法时常在我脑海中浮现。\n我的未来、我的过去、我心中的愿望。以及那些让我来到这里的选择。我是否可以做些不同的事情呢？我是否能够幸福呢？\n\n我提议在轮回的仪式中切除我的心。\n我希望能与其他人同在。我希望能幸福。我希望能不再孤独。\n我希望我的灵魂能得到安宁。愿我能被找到。\n我请求，请照顾好我。
