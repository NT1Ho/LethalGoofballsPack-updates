exact:Transcript emergency recording\n—----------------------- 2:50\n\nS. Underhill: I know you’re there Cavil.\nS. Underhill: You realise we possess the ability to read the security transcripts from our headquarters.\nS. Underhill: Your pod sent out a distress signal, Cavil. I know where you are.\nC. Darter: Fuck you.\nS. Underhill: Do you believe you are doing the right thing?\nC. Darter: Stopping you from murdering innocents? Yes. Yes I believe I am.\nS. Underhill: By murdering innocents of your own?\nC. Darter: I didn’t mean to.\nS. Underhill: Yet you did. In an attempt to sabotage my plans you killed not just one, but two. You gave Sarah the illusion of escape. But Julian would’ve been left to die all alone. You are a hypocrite.\nC. Darter: I have your documents. I know what you did. Your experiments at the Crosswind Mental Hospital in Last Hope. Hailey Robertson, remember her? It’s all there. It will all be public soon enough.\nS. Underhill: And you think that changes things? We can tell the public anything and they’ll believe it.\nC. Darter: If this gets out you become a risk. Risks don’t tend to live long.\nS. Underhill: Then what. I’ve finished my machine. You think they’ll stop? It’s working. It’s working really well. You may have sabotaged your mission but we’ll find that ship, one way or another. Then project Mycete will be perfect. The soldiers we produce will be impenetrable, unstoppable. We will rescue so many cities from their lawlessness. We will unite what’s left after the silent age. You can stop the engineer, but not his machine.\nC. Darter: You’re lost, Sol. You’re lost in your own fantasy.\nS. Underhill: Don’t you see it? The cities we’ve saved? The people exist in peace. We brought them that peace. We’ve perfected it. You give people too much will, they destroy themselves. You give them too little, they destroy their government. You give them just enough, they’re happy. It doesn’t even have to be real. History is an archive of mistakes, an encyclopedia of lessons, we are the only ones who chose not to ignore them.\nC. Darter: You can’t call it peace when you’re the one bringing war. Maybe I can’t stop the project. But I can stop you.\n—----------------------- \nEmergency recording ended=紧急录音文字记录\n—----------------------- 2:50\n\n索洛弗·安德希尔：卡维尔，我知道你在。\n索洛弗·安德希尔：你知道，总部能读到安保录音的文字记录。\n索洛弗·安德希尔：你的逃生舱发出了求救信号。卡维尔，我知道你在哪儿。\n卡维尔·达特：去你妈的。\n索洛弗·安德希尔：你觉得自己做得对？\n卡维尔·达特：阻止你屠杀无辜的人？对。我当然觉得对。\n索洛弗·安德希尔：办法就是你自己也杀几个无辜的人？\n卡维尔·达特：我没想让他们死。\n索洛弗·安德希尔：可他们还是死了。为了破坏我的计划，你害死的不止一个，是两个。你让莎拉以为自己可以逃走。可朱利安呢？你原本打算留下他，独自等死。你真虚伪。\n卡维尔·达特：你的文件在我手里。你干过什么我一清二楚。最后希望的横风精神病院，你在那里做的实验。海莉·罗伯逊，还记得她吗？全写在里面。很快所有人都会知道。\n索洛弗·安德希尔：你觉得这能改变什么？我们跟公众说什么，他们就信什么。\n卡维尔·达特：一旦泄露，你自己就成了风险。风险通常活不长。\n索洛弗·安德希尔：然后呢？我的机器已经造好了。你以为他们会停手？它能用，而且好用得很。你或许搞砸了这趟任务，可那艘船我们总会找到。到时候，真菌计划就完美了。我们制造的士兵将刀枪不入、势不可挡。我们会把多少城市从无法无天的境地中解救出来。静默时代留下的一切将重归一统。你阻止得了工程师，阻止不了他的机器。\n卡维尔·达特：索尔，你已经迷失了。你活在自己的幻想里。\n索洛弗·安德希尔：你看不见吗？那些被我们拯救的城市，人们安居乐业。和平是我们给的。我们已经掌握了分寸。给人太多自由意志，他们就自取灭亡。给得太少，他们就推翻政府。给得刚刚好，他们便心满意足。那自由甚至都不必是真的。历史是记载错误的档案，是写满教训的百科全书；只有我们选择了正视它。\n卡维尔·达特：挑起战争的人是你，凭什么管它叫和平？也许我阻止不了这个计划。但我阻止得了你。\n—-----------------------\n紧急录音结束
exact:Transcript security recording - Day 14 \n—----------------------- 15:12 - Cargo dock\n\nC. Darter: That’s everything in cargo?\nS. Dent: Just about, yeah.\nC. Darter: Good, I’ll signal Julian so he can start the engines.\nS. Dent: He knows how to fly this thing? I thought he was only here in case things like.. that.. Jump out on us.\nC. Darter: He doesn’t need to know how to fly, the autopilot takes care of that. He only needs to power the engines and make sure nothing goes up in flames in the process.\nS. Dent: oh, I assumed there was some manual labour involved in the taking off part but that makes sense. Well I’ll be in the office on Level 2 documenting our discoveries.\nC. Darter: Alright.\n\n—----------------------- 17:20 - Central hallway\n\nS. Dent: Hey, is everything in order?\nJ. Charter: I have nothing to report on, there hasn’t been a breach of containment.\nS. Dent: That’s good.\nJ. Charter: Sorry for asking but, what is that stuff we collected?\nS. Dent: It’s a type of Eumycota.. or fungi in layman's terms, a white mold that seems to form these spike-like pustules which it uses to inject itself into any unfortunate creature that happens to step on it.\nJ. Charter: I see. So that’s what was wrong with that spider.\nS. Dent: Yeah, so don’t touch the mold.\nJ. Charter: What are you planning on doing with it?\nS. Dent: That is classified.\nJ. Charter: Understood.\nS. Dent: I’ve got some work to do so I’ll be off.\nJ. Okay. Stay safe.\n\n—----------------------- 22:43 - Communications\n\nS. Underhill: What’s the status.\nC. Darter: We have contained some new samples for the project.\nS. Underhill: Is it promising?\nC. Darter: ..Potentially, I have not conducted extensive research just yet.\nS. Underhill: That will be your priority from now on.\nC. Darter: Of course. As you wish.\nS. Underhill: I sense that you are displeased. Is there anything I should know about?\nC. Darter: It doesn’t feel right. It’s immoral. We shouldn’t build a future on the torture of innocents.\nS. Underhill: If the loss of innocent lives worries you then I would recommend reminding yourself that our sins are as many as the others.\nC. Darter: It isn’t right.\nS. Underhill: Perhaps you don’t understand.\nC. Darter: Understand what? The fact that innocent people are being cut to pieces for an opportunity of finding someone who we then also torture with the notion of it will help build our future? You mean that?\nS. Underhill: We have our projects, our corporations, people, governments, ideologies, politics, empires.. together it forms a society.. The people strive to climb higher, rule, gain control, to sit at the top of whatever they feel gives them power, yet even when they get there, they still feel it.. that entity looming over their shoulder from a step on the ladder too high for anyone to reach. They hide behind the facade of smaller corporations. You know their influence. They allow us to exist as long as we provide, no matter the methods or the cost. If they won't care, why should we.\nC. Darter: The.. entity?\nS. Underhill: I expect a report tomorrow before the end of the day. Otherwise you will be considered for repurposing.\nC. Darter: ..Understood.=安保录音文字记录　　第14天\n15:12　货运码头\n\n卡维尔·达特：货物都在这儿了？\n莎拉·丹特：嗯，差不多了。\n卡维尔·达特：好，我给朱利安发信号，让他启动引擎。\n莎拉·丹特：他会开这玩意儿？我以为他只是来防着那种……东西……突然扑上来。\n卡维尔·达特：他不用会开。自动驾驶会管。他只要启动引擎，别让什么东西半路着火就行。\n莎拉·丹特：哦，我还以为起飞总得手动干点什么呢。也对。那我去2层办公室记录我们的发现了。\n卡维尔·达特：好。\n\n17:20　中央走廊\n\n莎拉·丹特：嘿，一切正常吗？\n朱利安·查特：没有情况需要报告。收容没有失效。\n莎拉·丹特：那就好。\n朱利安·查特：冒昧问一句，我们采集回来的是什么？\n莎拉·丹特：是一种真菌门生物……说白了就是真菌。一种白霉，会生出尖刺状的脓疱，哪个倒霉生物踩上去，它就借此把自己注进对方体内。\n朱利安·查特：明白了。那只蜘蛛就是这么回事。\n莎拉·丹特：对，所以别碰那些霉菌。\n朱利安·查特：你们打算拿它做什么？\n莎拉·丹特：这是机密。\n朱利安·查特：明白。\n莎拉·丹特：我还有工作，先走了。\n朱利安·查特：好。注意安全。\n\n22:43　通讯室\n\n索洛弗·安德希尔：情况如何？\n卡维尔·达特：我们为项目收容了一些新样本。\n索洛弗·安德希尔：有希望吗？\n卡维尔·达特：……有可能。还没来得及深入研究。\n索洛弗·安德希尔：从现在起，优先研究它。\n卡维尔·达特：当然，如您所愿。\n索洛弗·安德希尔：我听出你有些不快。有什么事我该知道吗？\n卡维尔·达特：我觉得这样不对。这不道德。我们的未来不该建立在折磨无辜者的基础上。\n索洛弗·安德希尔：如果你为无辜者丧命而不安，不妨提醒自己：我们的罪行也不过和别人一样多。\n卡维尔·达特：这不对。\n索洛弗·安德希尔：也许你还不明白。\n卡维尔·达特：明白什么？我们把无辜的人切成碎块，只为有机会找到合适的人，然后以建设未来为由，连那个人也一起折磨？你是指这个吗？\n索洛弗·安德希尔：有项目，有企业，有人民、政府、思想、政治和帝国……合在一起就成了社会。人总想往上爬，想统治，想掌权，想站在一切能给自己权力的东西顶上。可就算爬到顶，他们还是能感觉到……那个实体就在背后，从谁也够不着的那一级阶梯上俯视着他们。他们藏在一家家小公司的门面背后。你知道他们的影响力。我们只要能交出东西，他们就允许我们存在，不问手段，不计代价。他们都不在乎，我们何必在乎？\n卡维尔·达特：那个……实体？\n索洛弗·安德希尔：明天结束前，我要看到报告。否则，我们会考虑给你另作安排。\n卡维尔·达特：……明白。
exact:Transcript security recording - Day 15 \n—----------------------- 11:56 - Lab\n\nS. Dent: Out of all the specimens we have gathered, this one seems the most potent.\nC. Darter: On that I agree. We would only have to bioengineer the instinctual need to spread out of the samples before it can be merged and experimented with.\nS. Dent: Of course. I noted on the spider back on Utril that the exoskeleton seemed to have hardened with an increased density to help it protect itself from brute force impact.\nC. Darter: I wonder if it would do the same to a bone structure or if it would respond to the skin instead.\nS. Dent: Either way it would likely induce extreme pain, shock and possibly death were we to try that on an animal or even a person.\nC. Darter: I am aware. Though I doubt Solover cares as long as we can get a subject to survive.\nS. Dent: You’re probably right. But try finding medical research where animals didn’t suffer.\nC. Darter: Does it ever bother you? The screeches of pain whenever we have to test on a live subject.\nS. Dent: Yeah.. Of course it does. I don’t enjoy it. I try to remind myself that we’re doing this now so that people in the future will be able to live a better life. It doesn’t make it better but it’s how I deal with it.\nC. Darter: I suppose that makes sense.\n\n—----------------------- 12:46 - Central hallway\n\nC. Darter: Stand guard at the lab in case anything goes awry.\nJ. Charter: Yes sir.\n—----------------------- 13:08 - Lab\n\nJ. Charter: Everything okay here?\nS. Dent: Yeah, did something happen?\nJ. Charter: No no, I was sent by Cavil. He said I should keep watch in case anything happened.\nS. Dent: Fair enough. We’re only working with a highly infectious aggressive fungi haha.\nJ. Charter: Yeah hah.\nJ. Charter: The experiments that are conducted here, are they very dangerous?\nS. Dent: In the wrong hands, yes, very. Handle them wrong and we could have an outbreak. A scenario like that can only end nasty.\nJ. Charter: Good thing you’re so skilled then.\nS. Dent: Yeah, thanks.\nJ. Charter: I am curious though, do you feel.. safe.. Here? On the ship?\nS. Dent: Well. Not always. These are very dangerous things we’re working with. But in the end it’s part of the job, it’s what we signed up for. I feel you of all people would probably know that.\nJ. Charter: We have our duties, even if it’s dangerous. We’re building a future. That’s important.=安保录音文字记录　　第15天\n11:56　实验室\n\n莎拉·丹特：我们收集到的所有标本里，这一个看来效力最强。\n卡维尔·达特：我同意。只要先用生物工程去掉样本自行扩散的本能，就可以进行融合，再做实验。\n莎拉·丹特：当然。我在尤特里尔观察过那只蜘蛛，它的外骨骼似乎硬化了，密度也提高了，能更好地承受猛烈撞击。\n卡维尔·达特：我好奇它对骨骼会不会产生同样的作用，又或者起反应的其实是皮肤。\n莎拉·丹特：无论哪种，把它用在动物甚至人身上，都可能造成剧痛、休克，甚至死亡。\n卡维尔·达特：我知道。不过只要能让一个受试者活下来，我怀疑索洛弗根本不在乎。\n莎拉·丹特：大概吧。可你倒是找一项没让动物受过苦的医学研究来。\n卡维尔·达特：你从来不难受吗？每次拿活体做实验，那些痛得刺耳的惨叫声。\n莎拉·丹特：难受……当然难受。我并不喜欢。我只能提醒自己，我们今天做这些，是为了以后的人能过得更好。这没让事情变好，但我是这么撑下来的。\n卡维尔·达特：我想我能理解。\n\n12:46　中央走廊\n\n卡维尔·达特：守在实验室外面，以防不测。\n朱利安·查特：是，长官。\n13:08　实验室\n\n朱利安·查特：这里一切正常吗？\n莎拉·丹特：正常，出什么事了？\n朱利安·查特：没有，没有。卡维尔让我来的。他说让我盯着点，以防出事。\n莎拉·丹特：有道理。毕竟我们弄的“只不过”是一种传染性极强、攻击性十足的真菌，哈哈。\n朱利安·查特：是啊，哈。\n朱利安·查特：你们在这儿做的实验，很危险吗？\n莎拉·丹特：落在不懂的人手里，当然，非常危险。处理不当就可能暴发感染。那种事绝不会有好下场。\n朱利安·查特：幸好你这么在行。\n莎拉·丹特：嗯，谢谢。\n朱利安·查特：不过我有点好奇。在这里……在这艘船上，你觉得安全吗？\n莎拉·丹特：唔，不总是。我们打交道的东西很危险。但说到底这是工作的一部分，我们来之前就知道。你应该比谁都明白。\n朱利安·查特：再危险也有自己的职责。我们在建设未来，这很重要。
exact:Transcript security recording - Day 16\n—----------------------- 10:36 - Lab\n\nS. Dent: I think that’s it. I think we’ve got it. This will be perfect when it’s merged with the main compound.\nC. Darter: Yeah.. that’s great.\nS. Dent: Is something wrong? I thought you’d be celebrating.\nC. Darter: I don’t think we’re doing the right thing.\nS. Dent: How so? We’re helping people. If not for the Triton Empire we’re saving people’s lives with this.\nS. Dent: Are we not? Cavil?\nC. Darter: They uh.. You aren’t allowed to know but it’s likely not for the purpose you’ve been led to believe.\nS. Dent: What do you mean? This is medicine, it will protect people.\nC. Darter: Yes but. Not the people you might think.\nS. Dent: Well.. Go on.\nC. Darter: This is part of Project Mycete. A project where they’re attempting to make enhanced soldiers by stuffing them with experimental drugs.\nS. Dent: What.\nC. Darter: And.. not only that but out there people are being slaughtered, tortured and murdered in pursuit of people fit for the procedure.\nS. Dent: WHAT.\nS. Dent: All this time. I have been working for a lie. Harming these poor creatures. Just so we have a small step up in this conquest??.\nC. Darter: .. Basically.\nS. Dent: Why didn’t you tell me?\nC. Darter: I mean, they will likely have me repurposed when they discover I have now leaked this information.. It’s more of an execution than a repurpose.\nS. Dent: Right. So. What now?. Do we leave? Do we burn it all? Tell me.\nC. Darter: I need time to think. I don’t want to hand Sol this research. We’ll talk about this tomorrow. Pretend like none of this happened.\nS. Dent: Yeah. Okay. Simple. I’ll just simply pretend like I haven’t spent the past two and half weeks risking my life for a lie.\nC. Darter: I mean it.\n—----------------------- 16:13 - Office\n\nJ. Charter: Sarah? Are you okay?\nS. Dent: I’m fine.\nJ. Charter: The tears running down your face say otherwise. Did something happen?\nS. Dent: I would prefer not to talk about it.\nJ. Charter: Something personal?\nS. Dent: Yea.\nJ. Charter: I see.. If something is up you can talk to me about it, it’s okay.\nS. Dent: Wouldn’t want it to be a detriment to the mission would you.\nJ. Charter: What?\nS. Dent: No I mean. I’m sorry. I don’t know where that came from. It’s just hard. I’m not sure if I can take much more of it.\nJ. Charter: It’s okay, I get it.\nS. Dent: Did Cavil send you?\nJ. Charter: No he didn’t.\nS. Dent: What made you come here?\nJ. Charter: Well you’ve seemed a bit down today. It’s important that everyone on this crew feels okay. And I also care.. about.. you. I mean..\nS. Dent: Thank you, I really appreciate it. There’s just.. Maybe I miss home and it’s wearing me down.\nJ. Charter: That makes sense. I can’t say I don’t miss it back there. Sooner or later we’ll be back. We just have to complete our mission. We’ll be okay.\nS. Dent: Yeah. Thank you, really.=安保录音文字记录　　第16天\n10:36　实验室\n\n莎拉·丹特：我想就是这样。我们成功了。等和主化合物融合，就完美了。\n卡维尔·达特：嗯……太好了。\n莎拉·丹特：出什么事了？我还以为你会庆祝呢。\n卡维尔·达特：我觉得我们做得不对。\n莎拉·丹特：为什么？我们在帮人。就算不为特里同帝国，我们做的也是救命的事。\n莎拉·丹特：难道不是吗？卡维尔？\n卡维尔·达特：他们，呃……这事本来不能让你知道。它的用途恐怕跟他们让你相信的不一样。\n莎拉·丹特：你是什么意思？这是药，它能保护人。\n卡维尔·达特：是，可被保护的未必是你以为的那些人。\n莎拉·丹特：好吧……说下去。\n卡维尔·达特：这是真菌计划的一部分。他们试图把实验药物塞进士兵体内，造出强化士兵。\n莎拉·丹特：什么？\n卡维尔·达特：而且……还不止如此。为了找到受得住这道程序的人，他们正在外面屠杀、折磨、杀害无辜的人。\n莎拉·丹特：什么？！\n莎拉·丹特：这么长时间，我一直在为一个谎言卖命。让那些可怜的生物受苦，就为了在这场征服里多占那么一点优势？！\n卡维尔·达特：……差不多。\n莎拉·丹特：你为什么不告诉我？\n卡维尔·达特：他们一旦发现我泄了密，多半会让我“另作他用”……与其说是另作他用，不如说是处决。\n莎拉·丹特：好。那现在呢？我们走吗？一把火把它全烧了？告诉我。\n卡维尔·达特：给我点时间想想。我不想把这些研究交给索尔。明天再谈。先当什么都没发生。\n莎拉·丹特：行，好啊，简单。我就假装过去两个半星期没有为了一个谎言拿命冒险好了。\n卡维尔·达特：我是认真的。\n16:13　办公室\n\n朱利安·查特：莎拉？你还好吗？\n莎拉·丹特：我没事。\n朱利安·查特：可你脸上都是眼泪。发生什么了？\n莎拉·丹特：我不想谈。\n朱利安·查特：私事？\n莎拉·丹特：嗯。\n朱利安·查特：我明白……有什么事可以跟我说，没关系。\n莎拉·丹特：你可不想让它拖累任务，是吧？\n朱利安·查特：什么？\n莎拉·丹特：不是，我是说……对不起。我也不知道怎么突然说出这种话。只是太难熬了。我不知道自己还能撑多久。\n朱利安·查特：没关系，我明白。\n莎拉·丹特：卡维尔让你来的？\n朱利安·查特：不，他没有。\n莎拉·丹特：那你怎么来了？\n朱利安·查特：你今天看着有点低落。船上每个人都得好好的，这很重要。而且我也关心……你。我是说……\n莎拉·丹特：谢谢。我真的很感激。只是……也许是想家，这事一直压着我。\n朱利安·查特：我明白。我也不是不想家。迟早会回去的。我们只要完成任务就行。我们会没事的。\n莎拉·丹特：嗯。真的，谢谢你。
exact:Transcript security recording - Day 17 \n—----------------------- 18:56 - Maintenance tunnel\n\nC. Darter: Hopefully nobody can hear us down here.\nS. Dent: Hope so too. Have you got an idea?\nC. Darter: I have a plan. It will be hairy.\nS. Dent: Alright. Can’t be worse than whatever they’re doing out there.\nC. Darter: It’s a two part plan. We have to destroy the autopilot. And manually route it somewhere else so they won’t be able to find it. I wrote the coordinates on this note. Send this ship here.\nS. Dent: Uhm. Okay. What will you do?\nC. Darter: I’ll make sure they won’t be able to track the ship anymore and prepare the escape pod.\nS. Dent: What about Julian? We tell him right?\nC. Darter: It’s better if we don’t. He’s loyal to the Triton Empire. I don’t trust him to betray that.\nS. Dent: Well we can’t just leave him. Maybe he’ll listen to me.\nC. Darter: It’d be best not to try. He might sound the alarm.\nS. Dent: I won’t leave him.\nC. Darter: If you can convince him to join us in the escape pod he can come with. But only after you’ve done your part.\nS. Dent: Right, If this is another lie I’ll kill you.\nC. Darter: I promise.\nS. Dent: When do we start?\nC. Darter: 22:00. I’ll have the escape pod ready by 23:30. Be there.\nS. Dent: Okay.\nC. Darter: I have some digging to do. Good luck.\nS. Dent: You too.\n\n—----------------------- 22:24 - Security office\n\nJ. Charter: The fuck.\n\n—----------------------- 22:38 - Cockpit\n\nJ. Charter: Who’s there? Sarah?\nS. Dent: Julian?\nJ. Charter: What are you doing? Did you mess with the autopilot?\nS. Dent: I can explain.\nJ. Charter: Is this an order? Why are you doing this?\nS. Dent: This is not right.\nJ. Charter: What do you mean?.\nS. Dent: This whole project is wrong. We’re not helping anyone with this. It won’t be for medicine. We’re developing weapons.\nJ. Charter: I know. This is a military operation, as was stated in my briefing.\nS. Dent: You knew? This whole time? They’re torturing people. Just so they can experiment on the survivors with this. You’re okay with that?\nJ. Charter: People suffer either way. Whether we complete this mission or not. You know that. We could be part of something great.\nS. Dent: If we are building a future like this.. I want none of it.\nJ. Charter: You’re a traitor.\nS. Dent: Please, think about it. We can escape this. Leave it behind. Knowing we won’t have innocent blood on our hands.\nJ. Charter: I trusted you, Cavil trusted you. Why would you sabotage the mission. We were going home. We were..\nS. Dent: Cavil is preparing the escape pod. Please just come with me.\nJ. Charter: You all Lied to me. You betrayed me.\nS. Dent: Please Julian, they are evil.\nJ. Charter: Why.\nS. Dent: Julian, please. Calm down, Lower your weapon and join me. We’ll be okay.\nS. Dent: Please calm down, Julian, please. Juli-.\nJ. Charter: I.. I’m sorry.\n\n—----------------------- 23:13 - Central hallway\n\nJ. Charter: I’m sorry Sarah. I love you.\n\n—----------------------- 23:16 - Cargo bay\n\nJ. Charter: I’m sorry.=安保录音文字记录　　第17天\n18:56　维修通道\n\n卡维尔·达特：希望在这儿没人能听见我们说话。\n莎拉·丹特：但愿。想到办法了吗？\n卡维尔·达特：有个计划。会很险。\n莎拉·丹特：说吧。总不会比他们在外头干的事更糟。\n卡维尔·达特：分两步。我们得破坏自动驾驶，把航线手动改去别处，让他们找不到船。我把坐标写在这张纸条上了。让船开到这里。\n莎拉·丹特：呃，好。那你呢？\n卡维尔·达特：我会确保他们再也追踪不到这艘船，再把逃生舱备好。\n莎拉·丹特：朱利安怎么办？我们会告诉他，对吧？\n卡维尔·达特：最好别告诉他。他效忠特里同帝国。我不信他肯背叛帝国。\n莎拉·丹特：我们不能就这么丢下他。也许他肯听我的。\n卡维尔·达特：最好别试。他可能会拉警报。\n莎拉·丹特：我不会丢下他。\n卡维尔·达特：要是你能说服他跟我们一起进逃生舱，就让他来。但你得先办完自己的事。\n莎拉·丹特：好。你要是又骗我，我就杀了你。\n卡维尔·达特：我保证。\n莎拉·丹特：什么时候动手？\n卡维尔·达特：22:00。我会在23:30前备好逃生舱。到时候一定要来。\n莎拉·丹特：好。\n卡维尔·达特：我还得去查点东西。祝你好运。\n莎拉·丹特：你也是。\n\n22:24　安保室\n\n朱利安·查特：操。\n\n22:38　驾驶舱\n\n朱利安·查特：谁在那儿？莎拉？\n莎拉·丹特：朱利安？\n朱利安·查特：你在干什么？自动驾驶是你动的？\n莎拉·丹特：我可以解释。\n朱利安·查特：这是命令吗？你为什么这么做？\n莎拉·丹特：这样不对。\n朱利安·查特：什么意思？\n莎拉·丹特：整个项目都错了。我们谁也帮不了。这东西不会用作药物。我们在研制武器。\n朱利安·查特：我知道。这是军事行动。任务简报写得很清楚。\n莎拉·丹特：你知道？从一开始就知道？他们在折磨人，只为用这个东西在幸存者身上做实验。你觉得这没问题？\n朱利安·查特：不管我们完不完成任务，都有人受苦。你知道的。我们有机会参与一件了不起的事。\n莎拉·丹特：如果我们要建设的是这种未来……我宁可不要。\n朱利安·查特：你是叛徒。\n莎拉·丹特：求你想想。我们可以逃，离开这一切，至少知道自己手上没沾无辜者的血。\n朱利安·查特：我信任你，卡维尔也信任你。你为什么要破坏任务？我们本来要回家了。我们本来……\n莎拉·丹特：卡维尔在准备逃生舱。求你跟我走吧。\n朱利安·查特：你们全在骗我。你们背叛了我。\n莎拉·丹特：求你了，朱利安，他们是恶人。\n朱利安·查特：为什么？\n莎拉·丹特：朱利安，求你冷静。放下枪，跟我走。我们会没事的。\n莎拉·丹特：别激动，朱利安，求你了。朱利——\n朱利安·查特：我……对不起。\n\n23:13　中央走廊\n\n朱利安·查特：对不起，莎拉。我爱你。\n\n23:16　货舱\n\n朱利安·查特：对不起。
exact:Transcript security recording - Day 18\n—----------------------- 00:23 - Pod-1\n\nC. Darter: These might be the last words you’ll hear from me. Escape pods don’t have a great track record when it comes to landings.\nC. Darter: Sarah is dead. The damn bastard shot her in the neck. Following orders before he launched himself out the airlock. Watched him sobbing through the hallway.\nC. Darter: I didn’t want them to get hurt. It just happened.\nC. Darter: She was innocent.\nC. Darter: Sol, if you ever read the logs. I want you to know I’m not sorry for sabotaging your mission. You are a corrupt piece of shit who deserves to be put with the innocents you’re slaughtering.\nC. Darter: I’ve got your documents. I’ve read your history. You were always like this.\nC. Darter: Watch what happens when the common people figure out who you really are.=安保录音文字记录｜第 18 天\n—----------------------- 00:23　1 号逃生舱\n\n卡维尔·达特：这也许是你最后一次听见我的声音。逃生舱在着陆这件事上，向来没什么好记录。\n卡维尔·达特：莎拉死了。那个混蛋一枪打中了她的脖子。奉命行事，然后自己从气闸出去了。我看着他一路哭着走过走廊。\n卡维尔·达特：我没想让他们受伤。事情就这么发生了。\n卡维尔·达特：她是无辜的。\n卡维尔·达特：索尔，如果有一天你读到这些日志，给我记住：我破坏了你的任务，一点也不后悔。你这个烂透了的人渣，就该被扔进你正在屠杀的那些无辜人中间。\n卡维尔·达特：文件在我手里。你的过去我全读过了。你一直都是这种人。\n卡维尔·达特：等普通人看清了你的真面目，你就等着瞧吧。
exact:Transcript: interview four\n\nYear: 3\n\nDay: 104\n\nEmployee: 24-3\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: I am very pleased with this job. I love it here. This place is fantas-\n...\nYou don't think I am actually keep reading this bullshit. This place is a fucking abomination.\nInterviewer: How are the working conditions?\n\nEmployee: Oh they are absolutely fucked. If it's not the poison you feed us every day it's unregulated broken machinery that'll kill us. I have seen at least six bodies in the past three fucking days. One of them you even interviewed. And the funny thing.. THEY ARE STILL THERE!. \n\nInterviewer: How would you recommend this job?\n\nEmployee: NO! I AM DONE WITH THIS BULLSHIT! THERE IS A FUCKING WAR GOING ON AND WE ARE STUCK HERE TRYING TO PROVIDE FOR YOUR FAMILIES WHILE YOU TREAT US LIKE SOME SORT OF EXPENDABLE OBJECTS! I AM DONE HELPING YOU FUEL THIS WAR! HELL THIS FUCKING PLACE WILL BE ATTACKED SOON ANYWAYS. I AM GOING TO FUCKING KILL Y-=访谈记录：第四次访谈\n第3年，第104天　员工：24-3\n\n采访者：你对这份工作有多满意？\n员工：我对这份工作非常满意。我爱这里。这个地方简直太棒——\n……你不会真以为我还会照着这堆狗屁往下念吧？这鬼地方他妈的就是个地狱。\n采访者：工作条件如何？\n员工：烂透了。每天不是吃你们喂的毒药，就是给没人管的破机器弄死。这他妈三天里，我至少见了六具尸体，有一个你还采访过。好笑的是……他们现在还躺在那儿！\n采访者：你会怎样推荐这份工作？\n员工：不！老子受够了！外头他妈的在打仗，我们困在这儿给你们养家，你们却拿我们当用完就扔的东西！老子不帮你们打这场仗了！这鬼地方反正很快就要挨炸。我他妈要杀了你——
exact:Transcript: interview one\n\nYear: 3\n\nDay: 74\n\nEmployee: 15-1\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: It's alright, it gets the family paid.\n\nInterviewer: How are the working conditions?\n\nEmployee: It's not the worst, a few accidents have happened but so far it's been OK.\n\nInterviewer: How would you recommend this job?\n\nEmployee: I can't say I'd recommend this job but if you are in desperate need of money like most of us, it's an alright job.=访谈记录 1\n\n年份：3\n\n日期：第 74 天\n\n员工：15-1\n\n\n采访者：你对这份工作满意吗？\n\n员工：还行，够养家。\n\n采访者：工作条件怎么样？\n\n员工：不算最差。出过几起事故，到现在还过得去。\n\n采访者：你会怎么向别人推荐这份工作？\n\n员工：说不上推荐吧。但你要是跟我们大多数人一样急等钱用，这活儿还凑合。
exact:Transcript: interview three\n\nYear: 3\n\nDay: 96\n\nEmployee: 17-5\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: To be quite frank, it's horrible. If I could take any other job right now, I would.\n\nInterviewer: How are the working conditions?\n\nEmployee: They're horrible. There's no safety equipment, an accident can happen at any time. I am pretty sure there's only one first aid area. And the only reason it's there is because it's required.\nYou all know this moon incredible pressure below its thin crust, one mistake and it might just burst.. It'll flood the entire surface with boiling hot oil, likely killing most.. if not all of us.\n\nInterviewer: How would you recommend this job?\n\nEmployee: I simply wouldn't.\n\nInterviewer: this is the third person we've interviewed now... I swear if the next one is just like the others. I am going to start threatening these assholes and force some words oh.. it's still recording.=访谈记录：第三次访谈\n第3年，第96天　员工：17-5\n\n采访者：你对这份工作有多满意？\n员工：说实话，糟透了。现在只要还有别的工作可选，我就走了。\n采访者：工作条件如何？\n员工：糟透了。这里没有安全设备，随时可能出事故。我敢说就一个急救点，还是因为规定非设不可。你们都知道，这颗星球的薄壳下面压力有多大。只要出一次错，它就可能爆开……滚烫的油会淹没整个地表。我们就算不死光，也得死一大半。\n采访者：你会怎样推荐这份工作？\n员工：我不会推荐。\n采访者：这都采访第三个人了……我发誓，要是下一个还这样，我就开始威胁这帮混蛋，逼他们说点——哦……还录着呢。
exact:Transcript: interview two\n\nYear: 3\n\nDay: 84\n\nEmployee: 35-2\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: ... this job is horrible. I hate it.\n\nInterviewer: How are the working conditions?\n\nEmployee: Unbearable, you either end up burning yourself to oil or you fall over from exhaustion. It's not like it matters to the higher ups, ware expendible anyways. There's a reason I am numbered 32-2.\n\nInterviewer: How would you recommend this job?\n\nEmployee: I wouldn't.=访谈记录 2\n\n年份：3\n\n日期：第 84 天\n\n员工：35-2\n\n\n采访者：你对这份工作满意吗？\n\n员工：……这活儿糟透了。我恨这份工作。\n\n采访者：工作条件怎么样？\n\n员工：根本受不了。不是把自己烧成一摊油，就是累得栽倒。上头才不在乎，反正我们随时能换。你以为我为什么叫 32-2？\n\n采访者：你会怎么向别人推荐这份工作？\n\n员工：我不会推荐。
