exact:Long time no see, old friend.\n\nYou gave me a real run-around, didn’t you?\nGoing off the radar like that.\nYou teleported yourself... nearly eight-hundred-million miles away.\nI didn’t even know you could do that.\nYou are full of wonders.\n\nYou didn’t want to hurt them, did you, friend?\n\nYou did everything you could not to kill them.\nYou wanted so dearly to see them learn, and grow, and help each other...\n\nI feel it. I know, I know...\n\nThey’re still out there, though, aren’t they?\nThat’s them?\nLurking in the shadows.\nThey’re protecting you now.\n\nI want to protect you too, if you’ll let me.\nNo one will ever hurt you again.\n\nNot while I’m around.=好久不见，老朋友。\n\n你可真让我好找啊。一声不响就从雷达上消失，把自己传送到了……将近八亿英里之外。我都不知道你有这本事。你身上的奇迹可真多。\n\n朋友，你并不想伤害他们，对吗？\n\n为了不杀他们，你已经竭尽所能。你多么希望能看着他们学习、成长，彼此扶持……\n\n我感觉到了。我知道，我知道……\n\n不过，他们还在外面，是不是？\n暗处潜伏的，就是他们吗？\n现在是他们在保护你了。\n\n我也想保护你，只要你愿意。再也不会有人伤害你。\n\n只要我还在。
