exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\n> The Beginning\nThe Employee\nThe Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Beginning - 0 days since impact.\n—--------------------------------------\nIn the town of Rosemaw, a small hike into the forest a meteor fragment had impacted.\nIt is not unusual for small fragments to reach the surface and make contact so it wasn’t immediately reported by the public.\n\nA few days later a few hikers had noticed an unusual looking fungus but chose to leave it be. These hikers only began to take notice once it started spreading and growing over a small patch in the forest. They didn’t think much of it and avoided the area for the time being.=希克塞利亚的腐败\n—--------------------------------------\n自最初陨石撞击以来，记录下来的事件时间线。\n> 开端\n员工\n官员\nI.T.D.A.\n掩盖行动\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\n开端 - 撞击后0天。\n—--------------------------------------\n在罗丝马乌镇，一小部分人徒步进入森林时，发现了一块陨石碎片撞击地面。\n小型陨石碎片到达地表并造成接触并不罕见，因此公众并未立即报告此事。\n\n几天后，一些徒步者注意到一种看起来不寻常的真菌，但选择不去理会它。这些徒步者直到这种真菌开始在森林中的一小片区域蔓延和生长时才开始注意它。他们并没有太在意，暂时避开了该区域。
exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\n> The Employee\nThe Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Employee - 4 days since impact.\n—--------------------------------------\nRichard Pollar, more commonly known as Rich, arrived at the local bakery for work an hour before opening time. He started preparing the kitchen for the day, organising and cleaning the kitchen when he noticed red blobs of an unusual liquid sticking to the equipment and the furniture.\nThe liquid was thick and lukewarm to the touch, a gooey substance. Rich was both intrigued and disgusted by the discovery and went looking for the source. He couldn’t find anything else out of the ordinary until he got to the stove. He was frightened by what he saw. It was a rat covered in tendrils with strange goop oozing from one of its empty eyesockets, bubbling and twitching as it did. Before Rich could fully understand what he was looking at, it scurried away, fleeing to someplace outside.\nHe was shaking and frantically called his employer before loosely explaining what happened.\nRich was quickly dismissed with the assumption of it being another one of his psychotic breaks.\nMeaning to prove that what he witnessed was real, he went to chase it down, leaving a note for the other employees explaining where he went.\nRich followed the trail of goop through the town, into the forest all the way to the area where the fungus was spotted by hikers before. There he found it, laying still on this yellow-orangish rock. Rich was bemused and stared at it for a while. He assumed it was dead considering its state and the fact it wasn’t moving anymore. The only movement he saw were these small tendrils sticking out of its body.\nUnsure of what to make of it he decided to investigate, he was scared but his curiosity carried him forward. The fungus he had heard about has seemingly spread through a significant chunk of the forest.\nAs Rich wandered through the infested area, he laid eyes upon more of these critters in a similar condition. Witnessing this he got scared and ran back towards the bakery and told his coworkers, who had arrived by this time, what he had seen. To ensure they would believe him he had taken some pictures to show.\nThe coworkers seemed very concerned upon being shown the pictures. Similarly confused and disgusted they decided to investigate on their own, leaving Rich at the bakery, who at this time was still shaking.\nAn hour passed and Rich grew concerned, maybe they got lost, maybe they were still investigating, who knows. But he grew more and more concerned by the minute. Another hour later he finally made the decision to call the authorities. Fearing they’d dismiss him if he spoke the truth, he only said there was an emergency at the bakery. And there he stayed until an officer arrived.=希克塞利亚的腐败\n—--------------------------------------\n自最初陨石撞击以来，记录下来的事件时间线。\n开端\n> 员工\n官员\nI.T.D.A.\n掩盖事件\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\n员工 - 撞击后4天。\n—--------------------------------------\n理查德·波拉尔，更常被称为里奇，在开店前一个小时到达当地的面包店上班。他开始为当天做准备，整理和清洁厨房时，注意到设备上和家具上沾有红色液体斑点。\n这种液体摸起来浓稠而温热，是一种黏糊糊的物质。里奇对这一发现既感到好奇又感到厌恶，于是去寻找源头。直到他走到炉灶前，他才发现了其他异常情况。他所看到的景象让他感到恐惧。那是一只被奇怪触须覆盖的老鼠，其中一个空眼窝里渗出了黏稠的液体，它还在抽搐和冒泡。在里奇完全明白发生了什么之前，那只老鼠已经逃走了，消失在某个地方。\n他浑身发抖，疯狂地叫来了他的雇主，然后简要地解释了发生的事情。\n里奇很快就被认为这是他又一次精神崩溃，被轻易地驳回了。\n为了证明他所看到的都是真实的，他决定追上去，并给其他员工留了一张纸条，说明自己去了哪里。\n里奇沿着那条黏糊糊的痕迹在镇上走，一直走到森林里，最终找到了之前徒步旅行者发现真菌的地方。在那里，他发现那只真菌静静地躺在黄色或橙色的岩石上。里奇看着它，感到困惑，认为它已经死了，因为它不再动弹了。他看到的唯一动静就是那些从小小的触须中伸出的部分。\n不确定该如何处理这件事，他决定继续调查。虽然害怕，但他的好奇心驱使他继续前进。他听说过的真菌似乎已经扩散到了森林的很大一片区域。\n当里奇在受感染的区域漫步时，他发现了更多处于类似状态的生物。看到这一幕后，他感到害怕，跑回面包店，告诉此时已经到达的同事他所看到的情况。为了确保他们相信他，他还拍了一些照片作为证据。\n同事们看到照片后显得非常担忧。他们同样感到困惑和厌恶，决定自行调查，而里奇则留在了面包店，此时他仍然在颤抖。\n一个小时过去了，里奇开始担心，也许他们迷路了，或者还在调查中，谁知道呢。但随着时间的推移，他的担忧越来越严重。又过了一个小时，他最终决定联系当局。由于担心如果说实话他们会驳回他的报告，他只说面包店发生了紧急情况。他就这样待着，直到一名官员到达。
exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\n> The Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Officer - 4 days since impact.\n—--------------------------------------\nAn officer by the name of Michael Benson, Mike for short. Arrived at the scene finding a distressed Richard sitting in the bakery. Mike asked about the emergency to which Rich tried to explain that his coworkers left to investigate something in the forest but hadn’t returned for hours. Mike grew suspicious and calmly asked why he’s as distressed as he is. Rich told Mike there’s horrifying things happening in the forest around the infested area.\nMike called this in and went to have a look for himself, unsure if he was telling the truth. But only after a few more officers arrived at the scene.\nMike arrived at the forest and cautiously took a few steps in when he already began to see signs of something being off.\nThe ground was covered in yellowish rock with this red substance oozing out of the ground. Slightly deeper into the forest, plants seemed to turn gray, die or get covered in this same yellow rock.\nMike returned to the edge of the forest and called for a search party. This has to be reported, it has become a real anomaly he thought. Half an hour later four more officers arrived and the search started.\nAs Mike ventured deeper into the forest he began to see the same things Rich had described, Critters, seemingly deceased with tendrils erupting from their bodies. Starting to get a notion of dread he continued. As he stumbled further into the woods it became less and less lively.\nThen he noticed something red, moving away from him, sliding across the rocky ground, leaving a trail of that same red substance. As Mike got closer the picture got clearer, it was similar to the critters he had seen earlier. When he walked in a big circle to the front of it he saw what it really was.\nIt was the front half of a moose, a large tentacle slid out of its mouth alongside a significant amount of red ooze. Where its back half was meant to be was nothing but tendrils and intestine slowly moving it forward.\nFrightened, Mike quickly stepped back. He wasn’t sure what to do. It looked like it was trying to scream or yell but no sound erupted from its mouth. Another tentacle protruded through one of its eyes, pushing it out of its socket followed by blood and ooze.\nNow horrified, Mike grabbed the weapon out of his holster and fired a bullet into its head, meaning to end its suffering.\nIt ceased to move for a moment but quickly got back to it, now oozing from the wound.\nMike was filled with dread and ran away from there. On his way back he found something else.\nThe missing employees laid there, lifeless on the hard rock surface. He called it in and told the other officers to head back. The employees were in a terrible condition, it looked like their limbs had torn themselves from their bodies, oozing out of their eyes and mouths. Witnessing this he ran back immediately and met up with the other officers in the bakery. This has quickly turned into a seemingly deadly fungal invasion.=希克塞利亚的腐败\n—--------------------------------------\n自最初的流星撞击以来，所有事件的记录时间线。\n开端\n员工\n> 官员\nI.T.D.A.\n掩盖事件\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\n官员 - 撞击后4天。\n—--------------------------------------\n一名名叫迈克尔·本森的官员，简称迈克。他赶到现场时，发现理查德坐在面包店里，看起来非常痛苦。迈克询问了紧急情况，理查德试图解释他的同事离开去调查森林里的状况，但已经数小时没有回来。迈克开始怀疑，并平静地询问他为何如此痛苦。理查德告诉迈克，被感染的区域周围的森林里正在发生可怕的事情。\n迈克立即报告此事，并亲自去查看情况，不确定理查德是否说了真话。但直到其他几名官员赶到现场后，他才离开。\n迈克进入森林，小心翼翼地走了几步，就发现了一些异常现象。\n地面上覆盖着黄色的岩石，红色物质从地面渗出。在森林深处，植物似乎变成了灰色，或者死亡了，或者被同样的黄色岩石覆盖。\n迈克回到森林边缘，召集了一支搜索队。他认为这必须被报告，因为这已经变成了一个真正的异常现象。半小时后，又有四名官员赶到，搜索开始了。\n随着迈克深入森林，他开始看到理查德描述的那些现象：一些生物，看起来已经死亡，身体上长出了触须。他开始感到恐惧，继续前进。当他越走越深时，森林变得越来寂静。\n然后他注意到有红色的东西从他身边移动过来，沿着岩石地面滑行，留下一串同样的红色物质。当迈克靠近时，情况变得更加清晰，它和他之前看到的生物很相似。当他绕到它的前面时，他看到了它的真实面目。\n那是一只驼鹿的前半部分，一个巨大的触须从它的嘴里伸出，伴随着大量的红色液体。它的后半部分变成了触须和肠子，缓慢地向前移动。\n迈克非常害怕，迅速后退。他不知道该怎么办。它似乎想要尖叫或喊叫，但没有任何声音从它的嘴里发出。另一个触须从它的眼睛中伸出，将其从眼眶中推出，随后是血液和液体。\n现在，迈克感到极度恐惧，拿起武器，向它的头部射出一颗子弹，试图结束它的痛苦。\n它暂时停止了移动，但很快又恢复了活动，伤口处仍然有液体渗出。\n迈克充满了恐惧，逃离了那里。在返回的路上，他又发现了其他东西。\n那些失踪的员工躺在坚硬的岩石表面上，已经没有生命迹象。他立即报告此事，并告诉其他官员返回。这些员工的状况非常糟糕，看起来他们的四肢已经从身体上撕裂出来，眼睛和嘴巴里也有液体渗出。目睹了这一场景后，他立即跑回面包店，与其他官员会合。这很快变成了一场看似致命的真菌侵袭。
exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\nThe Officer\n> The I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe I.T.D.A. - 7 days since impact.\n—--------------------------------------\nThe town has been evacuated and all survivors involved have been brought in for questioning and isolation. The I.T.D.A. Has labeled this situation as critical and has begun quarantining the area. Nobody was allowed to enter or leave the quarantine zone. The military had been called in for additional security.\nSeveral teams of experienced biologists and scientists had made it to the site to analyze and halt the anomalous threat. It was immediately proven not to be any sort of fungi but something else that had yet to be documented. This spread seemed to overtake whatever they put in front of it, consuming it entirely. Attempts of halting the spread were made such as burning it which only temporarily made the tendrils disappear. They had attempted several other chemical solutions to no avail. The closest they had gotten was by using a liquid which super freezes anything it comes into contact with. It only significantly slowed it down.\nFrom this point several nearby towns were also evacuated as the spread and the quarantine area grew. Slowly but surely the area was becoming a wasteland.\nIt was discovered that direct contact with the substance could result in an infection which ends in a grueling eruption of tendrils, torn limbs and death.\nThe I.T.D.A. had officially labeled the spread as a world-ending level hazard. And as there have been no viable methods to halt the spreading or cure anyone infected. The I.T.D.A after a discussion with the Council of Rule on Calist, had marked Hyxellia as a moon in quarantine. Nobody could enter. Nobody could leave. Those who tried were either stopped or killed.\nThe population remaining on Hyxellia were scared, unable to send out or receive communication from a source outside of the moon, the only source they had were the I.T.D.A. which assured the public that the threat will be dealt with.\nBiologists had well documented the workings of this spread which has gained the name “The Red Death”. In a detailed report it was documented how the red death consumed and spread:\nThe yellow rock-like material isn’t technically stone as many assumed but more similar to a very thick, dense, solidified skin. Instead of being stretchy, the density makes it much harder and rock-like. Below the yellow crust is a much softer meat-like material, this material is able to retract or expand, even move as if it’s one large living being organising its fleshy layer. This soft layer has seen to form these tentacles or tendrils for either defensive or even offensive measures. The spread itself is quite unique, these cells will attempt to eat whatever is around them and immediately replace the consumed material with a new cell. The process of consumption also generates this red substance. Drilling procedures have noted that deep inside the soft layer there’s large tunnels where the substance flows similar to our veins. The substance which gets generated doesn’t always end up within these veins, it often surfaces and forms large bubbles of goop below the crust, sometimes bursting through, leaving holes within the crust and forming large puddles of goop.\nAt the two week mark, the Red Death had consumed nearly half the moon. The cause seemed lost. This was the end times. Anyone still on Hyxellia was awaiting a horrible fate with no way of saving them.\nMany military personnel as well as teams sent in by the I.T.D.A. have chosen to end their own lives to avoid a worse end.=希克塞利亚的腐败\n—--------------------------------------\n自最初的流星撞击以来，记录下来的事件时间线。\n开端\n员工\n官员\n> I.T.D.A.\n掩盖\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\nI.T.D.A. - 撞击后7天。\n—--------------------------------------\n该镇已被疏散，所有幸存者都被带去接受询问和隔离。I.T.D.A.将这种情况标记为紧急事件，并开始对区域实施隔离。任何人都不允许进入或离开隔离区。军队也被调来加强安保。\n几支由经验丰富的生物学家和科学家组成的团队已经到达现场，分析并阻止这种异常威胁。很快证明这并不是某种真菌，而是另一种尚未被记录的物质。这种扩散似乎会吞噬任何挡在它面前的事物，将其完全摧毁。他们尝试了多种方法来阻止扩散，比如燃烧，但这只是暂时让触须消失。他们还尝试了其他化学方法，但都没有成功。最接近的方法是使用一种液体，它可以使接触到的任何东西迅速冻结。但这只能显著减缓扩散速度。\n从这一点开始，附近的几个镇子也被疏散，因为扩散和隔离区域不断扩大。这个地区逐渐变成了一片荒地。\n人们发现，直接接触这种物质会导致感染，最终引发剧烈的触须、断裂的肢体和死亡。\nI.T.D.A.正式将这种扩散标记为世界末日级别的危险。由于目前没有有效的办法来阻止扩散或治愈感染者，在与Calist理事会讨论后，I.T.D.A.将希克塞利亚标记为隔离卫星。没有人可以进入或离开。试图进入或离开的人要么被阻止，要么被杀死。\n留在希克塞利亚的人口非常害怕，无法从月球以外的来源发送或接收信息，他们唯一的消息来源就是I.T.D.A.，后者向公众保证会处理这一威胁。\n生物学家已经详细记录了这种扩散的机制，它被称为“红死病”。在一份详细的报告中，记录了红死病如何吞噬和扩散：\n这种黄色岩石状物质实际上并不是石头，而是类似于非常厚、致密、固化的皮肤。它不是可伸缩的，而是密度极高，更像岩石。在黄色外壳下面是更柔软的肉状物质，这种物质能够收缩或扩张，就像一个巨大的生物组织其肉质层一样。这个柔软层形成了这些触须或触须，用于防御甚至进攻。这种扩散本身非常独特，这些细胞会试图吞噬周围的一切，并立即用新的细胞替换被吞噬的物质。吞噬过程还会产生这种红色物质。钻探程序发现，在柔软层的深处有大型隧道，物质在其中流动，类似于我们的血管。产生的物质并不总是进入这些血管，它经常浮出表面，在外壳下形成大块的粘稠物，有时会破裂，在外壳上留下孔洞，形成大块粘稠物。\n两周后，红死病几乎吞噬了半个月球。原因不明。这就是末日。仍然留在希克塞利亚的人都在等待可怕的命运，没有任何办法可以拯救他们。\n许多军事人员以及I.T.D.A.派来的团队选择自杀，以避免更糟糕的结局。
exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\nThe Officer\nThe I.T.D.A.\n> The Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Coverup - 16 days since impact.\n—--------------------------------------\nHyxellia had been nearly entirely consumed and the I.T.D.A. had ceased any further attempts at rescuing the moon.\nFollowing this the I.T.D.A. had sent out a message to Calist, where the council would decide over the fate of the moon.\nThe response was immediate and due to the level of contagiousness of the Red Death, the council had decided to not only keep the moon in quarantine but also silence anyone aware of the situation.\nHyxellia was to be removed from the star maps and public knowledge entirely as if it had never existed in the first place. They had gone through great lengths to achieve this.\nNearing full corruption, few reports were sent out by biologists in hopes they would be rescued.\nThey spoke of having heard sounds from deep space, calling them cosmic, possibly a language they couldn’t understand. They said it felt like something was watching them. Something beyond what they could understand. Something they couldn’t feel but only feel its presence of.\nIn the final moments of life on Hyxellia, a warning was sent out:\n“Stay away. It is watching us. It sees us. It will come for us all.”\nHyx is a threat, well documented and hidden.\n\n[These documents have been classified by the Council of Rule]\nUnder no circumstance can they be released to the public.\nThey will be kept on Hyxellia to ensure no living being is able to access them.=希克塞利亚的腐败\n—--------------------------------------\n自最初流星撞击以来，记录下来的事件时间线。\n开端\n员工\n官员\nI.T.D.A.\n> 掩盖行动\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\n掩盖行动 - 自撞击以来已过去16天。\n—--------------------------------------\n希克塞利亚几乎完全被摧毁，I.T.D.A.也停止了任何进一步的救援尝试。\n此后，I.T.D.A.向卡利斯特发送了一封信，要求议会决定月球的命运。\n回应迅速，由于“红死病”的传染性极强，议会决定不仅将月球置于隔离状态，还要让所有知情者保持沉默。\n希克塞利亚将从星图上彻底抹去，仿佛它从未存在过一样。他们付出了巨大努力来实现这一目标。\n在腐败达到顶峰之际，生物学家们几乎没有发出任何救援请求的报告。\n他们提到听到了来自深空的声音，称其为宇宙之声，可能是他们无法理解的语言。他们说感觉好像有什么东西在注视着他们。有些东西超出了他们的理解范围。他们无法感知，只能感受到它的存在。\n在希克塞利亚生命最后的时刻，发出了一个警告：\n“远离。它在注视着我们。它看到了我们。它会来找我们所有人。”\n希克斯是一个威胁，其存在已被详细记录并隐藏起来。\n\n[这些文件已由统治议会列为机密。]\n在任何情况下，都不能向公众公开。\n它们将被保存在希克塞利亚，以确保没有任何生物能够获取它们。
