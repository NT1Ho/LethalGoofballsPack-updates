exact:MANNEQUINS\r\n\r\nSigurd's danger level: 95%\r\n\r\nScientific name: Vir plascterus\r\nThe Vir plascterus is a silent threat which thrives among many non-hostile copies of itself. They are often referred to as mannequins due to their striking resemblance to clothing store mannequins and their outer body being made of plastic.\r\nProper research has not been conducted and therefore it is unclear what they actually are. \r\nIt is theorised that these are similar creations to the Vir colligerus, otherwise known as Coil-heads.\r\n\r\nAt the very least they have many behavioral traits in common, they only move when not observed by anything living. It has been noted that on occasion they abandon this rule and dash for the target. Unlike the Coil-head they do not make any noise while moving around. It is highly advised to stay vigilant of your surroundings as one might run up from behind.=人体模型\n\n西格德的危险等级：95%\n\n学名：Vir plascterus\n这种生物悄无声息，混在众多长相相同、却没有敌意的模型中间。它们外壳由塑料构成，与服装店的模特极为相似，因此常被称为人体模型。\n目前尚无充分研究，无法确定它们究竟是什么。\n一种推测认为，它们与弹簧头（Vir colligerus）是同类造物。\n\n至少两者有许多相似的习性：通常只有在没有任何活物注视时才移动。不过，偶尔也有人见到人体模型打破这条规律，径直冲向目标。与弹簧头不同，它们移动时没有一点声音。务必留意四周，它可能正从背后跑来。
