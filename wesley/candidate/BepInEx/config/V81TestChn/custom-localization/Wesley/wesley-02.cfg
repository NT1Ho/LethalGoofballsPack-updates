exact:There has been a fair passage of time between now and the previous time I have written.\nI had not expected this arrangement would prove so demanding. It feels as though every few days a new ship arrives at my door, not to be enamored by the mystiques of my gallery but rather to dispose of the debris they have gathered.\nI have attempted to inquire about their work yet they seem either hesitant to explain or convey that they know as much as I do.\nEither way, I have made the wise decision to automate the process of exporting these worthless pieces to Gordion. I cannot imagine taking care of such matters personally without leaving me exhausted.\n\nThere has however been one thing I became aware of regarding this mysterious company. They do not take kindly to their employees and demand them work an absurd amount where failure appears to be met with termination in the quite literal sense.\nI have always been aware of the cruelty within this region from the tales but I had never imagined it to be this terrible. Not until I met this gentleman of the name Marcus Brad.\n\nI wouldn't say it was the most pleasant of encounters.\nThis company ship had landed and were doing their own usual business. I on the other hand was altering some of the displays, not quite paying the attention to my surroundings as I likely should have.\nUpon turning, I discovered an armed stranger silently standing a few paces behind me, which in honesty I found considerably less pleasant than the display I had been arranging moments earlier. It was quite alarming even and my response was rather lacking. He demanded that I help him with his harrowing situation which, at the time, I wasn’t aware of how bad it was. His suit appeared worn, bloodied with a scorch mark covering the left side of his helmet. An intimidating figure.\nI exclaimed I wouldn’t know how and even if I did there would be a chance this mysterious company would return with evil intent.\nHe appeared serious, slightly frustrated even. Still pointing the weapon in my direction I attempted to politely ask for his name and how I could be of service.\n“My name is Marcus.”, he replied. “I have survived this company for at least five weeks now. You wouldn’t believe what they put us through. You need to help me escape them. Sooner or later they will try to kill me again.”. This ominous response left me curious and so I tried to inquire what exactly he meant with, they will try to kill him again. \nHe replied: “We have a quota we have to meet every few days. It keeps getting higher every time we succeed. I don’t believe it stops. It gets higher and higher until it’s impossible to reach. What happens if we don’t meet the quota? We die. The ship enters space and opens the doors sucking us into space to die an excruciating death. I survived this once, only because I could crawl into this airtight space within the ship’s internals before the doors opened and.. Took the others.”.\nI was stunned by this news. I confess I initially expected exaggeration.\nI could now sense that it wasn’t frustration in his voice but desperation. Perhaps a hint of sadness and dread.\nI offered a proposal, if he’s able to find and bring me uniquities or antiquities. I would search for a way of hiding him from and possibly tricking this company. Which he accepted.\n\nSince that eye opening encounter I have had a security system installed at the counter in case somebody deranged comes upon me with malicious intent.\nSo it appears for now I will be keeping myself busy with devising a plan alongside some other research I have been doing.\nI am certain I will write again.=从我上次写作到现在，已经过去了相当长的时间。\n我没想到这种安排会如此麻烦。感觉每隔几天就会有一艘新船来到我的门口，它们并非被我画廊的神秘氛围所吸引，而是想要处理掉它们收集到的垃圾。\n我试图询问他们的工作情况，但他们似乎要么不愿意解释，要么表示他们和我一样清楚情况。\n无论哪种方式,我已经做出了明智的决定 将这些没用的物品出口到戈尔迪翁的过程自动化我无法想象自己会亲自处理这些事情 而不让我精疲力尽\n\n不过，关于这家神秘公司，我有件事注意到。他们对员工非常苛刻，要求员工完成极其艰巨的工作，而一旦失败，他们就会以字面意义上的解雇来惩罚员工。\n我一直通过故事了解到这个地区存在的残酷现象，但我从未想象过它会如此可怕。直到我遇到了名叫马库斯·布拉德的这位先生。\n\n我不会说这是最愉快的相遇。\n这艘公司的船只已经靠岸，他们正在从事自己惯常的业务。而我则正在调整一些展示设备，没有完全注意周围的环境，虽然我本应该如此。\n转身时，我发现一个武装的陌生人静静地站在我身后几步远的地方。说实话，这让我感到相当不愉快，比我刚才所准备的场面还要糟糕。他要求我帮助他解决他的困境，当时我并不清楚情况有多严重。他的制服看起来很破旧，身上有血迹，头盔的左侧还有一个烧焦的痕迹。真是个令人畏惧的人物。\n我大声喊道，我不知道该如何做，即使我知道了，这个神秘的公司也有可能带着恶意回来。\n他看起来很严肃，甚至有些沮丧。他仍然用武器指向我的方向，我试图礼貌地询问他的名字以及我能为他做些什么。\n他回答说,“我的名字是Marcus......”。 “我从该公司活了至少五个星期。你不会相信他们给我们带来了什么。你需要帮助我摆脱他们他们迟早会试图再次杀我。”这个不祥的反应让我好奇, 所以我想问他到底是什么意思, 他们会试图再次杀死他。 \n他回答说：“我们有一项必须每隔几天就完成的任务指标。每次成功完成后，这个指标就会越来越高。我认为它永远不会停止上升，直到达到无法再达到的限度。如果我们没有完成这个指标，会发生什么？我们会死掉。飞船进入太空后，门会打开，把我们吸入太空，让我们遭受极度的痛苦而死。我曾经活下来，只是因为在门打开之前，我能爬进飞船内部的密封空间……其他人则没能成功。”\n这个消息让我震惊了。我承认，最初我以为这不过是一种夸张的说法。\n我能够感觉到，他声音中的并非沮丧，而是绝望。或许还带着一丝悲伤和恐惧。\n我提出了一个提议：如果他能够找到并带给我一些独特的或古老的物品，我会想办法把他隐藏起来，甚至有可能欺骗这家公司。他同意了我的提议。\n\n自从那次令人警醒的遭遇之后，我在柜台处安装了一个安全系统，以防那些心怀恶意的人以恶意为之而找到我。\n目前看来，我将继续忙于制定计划，同时开展一些其他研究。\n我确信自己会再次写作。
exact:There has been a terrible turn of events.\n\nThe whole crew is celebrating, currently, after the Captain has confirmed my mad ramblings to be based in truth.\nThat Cosmocos possesses incredible alien knowledge, and is willing to share it with us.\nGranted - initially, I was not entirely coherent when I tried to convey my experience with the celestial brain, but...tch, I’ll hold my tongue.\n\nHe’s ordered to remove the brain and prepare for it to be taken back with us to 61-March.\nBut this will kill Cosmocos, I know this for certain.\nSlowly, over time, atrophied, until it is a husk.\nI don’t know why the Captain, having been offered the same kindness from Cosmocos, would even consider doing something like this.\nIt’s not right.\nPerhaps he doesn’t know?\nPerhaps we were not offered the same thing?\nPerhaps he knows...and he doesn’t care?\nHe’s not a man known for his kindness, after all.\n\nI asked that we put it to a vote.\nNot a single person sided with me.\n\nI don’t know what to do.\nI don’t know what I could possibly do to dissuade the Captain that wouldn’t have me thrown in a pod set on course for a jail cell back on 61.\n\nBut I have to do something.\nThis isn’t what Cosmocos wants.\nAnd I refuse to see it die like this.\n\nLieutenant Commander Cunningham, signing off.=发生了极其糟糕的事情。\n\n目前，全体船员都在庆祝，因为船长确认了我的疯狂想法是建立在真相之上的。\n科斯莫科斯拥有令人难以置信的外星知识，并且愿意与我们分享。\n当然，最初当我试图描述与那颗天体大脑的经历时，我并不连贯……但是，我会保持沉默。\n\n他被命令移除那颗大脑，并准备将其带回61-March。\n但我知道，这样做会杀死科斯莫科斯。\n它会慢慢萎缩，最终变成一副空壳。\n我不明白，既然科斯莫科斯也给予过同样的善意，船长为什么还要这么做。\n这不对。\n也许他不知道？\n也许我们没有得到同样的对待？\n也许他知道……但他不在乎？\n毕竟，他并不是一个以善良著称的人。\n\n我提议进行投票。\n但没有一个人支持我。\n\n我不知道该怎么办。\n我不知道能做些什么来阻止船长，否则我就会被送回61-March，进入监狱。\n\n但我必须做点什么。\n这不是科斯莫科斯想要的。\n我拒绝看到它就这样死去。\n\n坎宁安中校，结束通话。
