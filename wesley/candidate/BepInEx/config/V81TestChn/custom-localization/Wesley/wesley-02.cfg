exact:The past few weeks have been difficult.\nMy memory hasn't been the same since the crash.\nI do not recall much from before.\nAll that remains is some faint visions of self healing flesh, independently growing eyes and a bright flash before panic ensued.\n4 of us fled to one of ships and escaped the scene. \nI don't know what happened to the other two teams who were present at the time.\nI have now come to know that the entirety of Cosmocos vanished. And what we were standing on was merely a severed chunk of it.\n\nNobody has dared to return. We called it Desolation.\nI'll attach the coordinates to this log for anyone brave enough to have a look for themselves.\nAfter my recovery I might be able to help the people out over here.\nI've heard some interesting projects being discussed.\n\nProfessor Harrington, over and out.=这几个星期真难熬。坠毁后，我的记性就大不如前，先前的事几乎都想不起来了。\n只剩几个模糊的画面：自己愈合的血肉、独自生长的眼睛，还有一片强光。然后所有人都慌了。\n我们4个人逃上一艘船，离开了现场。另外两队怎么样了，我不知道。\n如今我才得知，整个科斯莫科斯都消失了。我们脚下的不过是从它身上断下来的一块碎片。\n\n没人敢回去。我们管那里叫“荒芜”。我会把坐标附在日志里，谁有胆量，可以亲自去看。\n等身体恢复了，也许我能帮上这里的人。我听他们谈起过几个挺有意思的项目。\n\n哈林顿教授，通话结束。
