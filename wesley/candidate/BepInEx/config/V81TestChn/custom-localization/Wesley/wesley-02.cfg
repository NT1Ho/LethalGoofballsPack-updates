exact:SMILE\r\n\r\nIt smiles \r\nSmile\r\nI smile\r\nI laugh\r\nIt stares\r\nIt smiles\r\nSmile\r\nI smile\r\nI laugh\r\nIt stares\r\nIt smiles\r\nSmile\r\nI smile\r\nI laugh\r\nIt stares\r\nIt smiles\r\nSmile\r\nI smile\r\nI look\r\nIt stares\r\nIt smiles\r\nSmile\r\nI feel\r\nI see\r\nIt stares\r\nIt smiles\r\nSmile\r\nI feel watched\r\nIt keeps staring\r\nIt keeps smiling\r\nSmile\r\nThey’re here\r\nI feel safe\r\nIt’s gone\r\nBut I still feel it\r\nSmile=空间\r\n\r\n它微笑着 \r\n微笑\r\n我微笑着\r\n我笑了\r\n它凝视着\r\n它微笑着\r\n微笑\r\n我微笑着\r\n我笑了\r\n它凝视着\r\n它微笑着\r\n微笑\r\n我微笑着\r\n我笑了\r\n它凝视着\r\n它微笑着\r\n微笑\r\n我微笑着\r\n我看着\r\n它凝视着\r\n它微笑着\r\n微笑\r\n我感觉\r\n我明白了。\r\n它凝视着\r\n它微笑着\r\n微笑\r\n我感觉有人在监视我\r\n它一直盯着看\r\n它一直微笑着\r\n微笑\r\n他们在这里。\r\n我感到很安全\r\n已经不见了\r\n但我仍然感觉如此。\r\n微笑
exact:SNARE FLEA\n\nSigurd's danger level: 30%\n\nScientific name: Dolus-scolopendra. \nA very large arthropod of the class chilopoda. Its body produces a silk which it primarily uses to propel itself to places where it is concealed. Its exoskeleton is somewhat fragile, and they can die from long falls. The snare flea does not produce venom, nor does it have a strong bite. It makes up for this weakness with its ability to tighten itself around large prey to suffocate.\n\nThe snare flea thrives in dark, warm areas. It cannot survive low temperatures and generally avoids open air and sunlight take the rats outside or just beat the hell otu of them! i think their insides could make a good milkshake,,=RE 森林森林\n\n西格德的危险等级：30%\n\n科学名称:Dolus-scolopendra。 \n一种非常庞大的蜈蚣类节肢动物。它的身体会分泌一种丝状物，主要用于将自己推进隐蔽的地方。它的外骨骼有些脆弱，因此长时间坠落可能会导致死亡。这种跳蚤并不分泌毒液，咬合力也不强。不过，它可以通过将自己缠绕在大型猎物身上来使其窒息，以此来弥补自身的弱点。\n\n陷阱蚤在黑暗、温暖的环境中生存得很好。它们无法在低温环境下存活，通常会避开开阔的空气和阳光，把老鼠赶到外面去吧！我觉得它们的内脏可以做成美味的奶昔呢。
exact:SNATCHER\r\n\r\nSigurd's danger level: 65%\r\n\r\nScientific name: Mudcantis-suratin\r\n\r\nThe Mudcantis-suratin or more commonly known as the Snatcher is a part of the Uranuh family. It is a muddy creature which prefers warm, swampy areas where it is most commonly found. Female Snatchers tend to have a soft, muddy skin covered in tiny tendrils which are often mistaken for thick hairs. Male snatchers have a thick, hard calcium plate below their “face” under a thinner, rubbery layer of skin.\r\n\r\nSnatchers have a great amount of appendages, growing more as they get older, ending in hand-like shapes. While they look like hands they only resemble them and do not contain any Intrinsic muscles. However these are very strong and are their main form of travel both underwater and on land.\r\n\r\nSnatchers are not naturally aggressive creatures despite their intimidating look. They prefer to stick to the shadows or cloudy lakes and watch from a distance. The females are entirely herbivores while the males do snatch, drown and digest small creatures entirely for the calcium required to grow their face plate.\r\n\r\nHowever it is not always safe to assume a snatcher won’t harm you. It will act in self defense if it feels threatened with measures ranging from spitting thick sludge at you to violently swinging its appendages at you.\r\nThis act of defense is also amplified, specifically in females if anyone or anything approaches their nesting area. Chasing down and often viciously killing those who get too close to her young.\r\n\r\nThe mating process of snatchers is often fatal for the male as it requires them to briefly suffocate within the female. On the occasion of death, the female will mourn the male in their own unique way. The male’s skin gets repurposed to create a softer bed for the eggs once they are eventually laid. While the face plate will be hidden somewhere deep underwater as a form of burial. They often visit the burial site and seek to protect it from any intruders.\r\n\r\nWhile on the surface Snatchers are often described as monsters due to their name and look, they are very emotional and have a surprisingly good memory. There have been several counts of people befriending a Snatcher with them still remembering that person a decade later.\r\n\r\nIt is recommended to stay away from their nests and leave them be when encountered in the wild. While deaths by snatchers are not common, it is a possibility.=抄袭者\r\n\r\n西格德的危险等级：65%\r\n\r\n科学名称：Mudcantis-suratin\r\n\r\n泥捕手，更常被称为掠夺者，是乌拉努家族的一员。它是一种泥质生物，喜欢温暖、沼泽地带，在这些地方最为常见。雌性掠夺者的皮肤呈泥质状，表面覆盖着细小的触须，这些触须常被误认为是浓密的毛发。雄性掠夺者的“面部”下方有一层厚厚的、坚硬的钙质板，其表面覆盖着一层较薄的、类似橡胶的皮膜。\r\n\r\n捕手拥有大量的附肢，随着年龄的增长，这些附肢会不断增多，最终形成类似手的形状。虽然它们看起来像手，但实际上并不具备真正的肌肉。不过，这些附肢非常强壮，是它们在水中和陆地上移动的主要工具。\r\n\r\n尽管捕兽者外表看起来很凶猛，但它们本质上并不具有攻击性。它们更喜欢躲在阴影处或阴云笼罩的湖泊中，从远处观察猎物。雌性捕兽者完全是食草动物，而雄性捕兽者则会捕捉、溺死并消化小型生物，以获取生长面部皮肤所需的钙质。\r\n\r\n尽管假设绑匪不会伤害你并不总是安全的，但如果它感到受到威胁，它仍会采取自卫行动，比如向你吐脏泥巴，或者猛烈地挥动它的肢体攻击你。\r\n这种防御行为也会在雌性身上得到加强，特别是当有人或事物靠近它们的巢穴时。它们会追逐并常常残忍地杀害那些过于接近它们幼崽的生物。\r\n\r\n捕食者的交配过程对雄性来说往往是致命的，因为这需要雄性短暂地窒息在雌性体内。在雄性死亡的情况下，雌性会以自己独特的方式哀悼雄性。雄性的皮肤会被重新利用，为卵提供一个更柔软的栖息地，这些卵最终会被产下。而雄性的面部则会被隐藏在水下某个地方，作为一种埋葬方式。雌性经常会访问这个埋葬地点，并努力保护它免受任何入侵者的侵害。\r\n\r\n虽然从表面上看，捕抓者因其名字和外形常被描述为怪物，但实际上它们非常情绪化，而且记忆力惊人。已经有好几次有人与捕抓者成为了朋友，而十年后它们仍然记得那个人。\r\n\r\n建议远离它们的巢穴，在野外遇到它们时不要打扰。虽然被绑架致死的情况并不常见，但这种情况是有可能发生的。
