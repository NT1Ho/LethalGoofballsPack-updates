exact:Long time no see, old friend.\n\nYou gave me a real run-around, didn’t you?\nGoing off the radar like that.\nYou teleported yourself... nearly eight-hundred-million miles away.\nI didn’t even know you could do that.\nYou are full of wonders.\n\nYou didn’t want to hurt them, did you, friend?\n\nYou did everything you could not to kill them.\nYou wanted so dearly to see them learn, and grow, and help each other...\n\nI feel it. I know, I know...\n\nThey’re still out there, though, aren’t they?\nThat’s them?\nLurking in the shadows.\nThey’re protecting you now.\n\nI want to protect you too, if you’ll let me.\nNo one will ever hurt you again.\n\nNot while I’m around.=久违了，老朋友。\n\n你真是个混蛋，对吧？\n完全脱离了人们的视线。\n你传送了自己……几乎到达了八亿英里之外。\n我甚至不知道可以这样做。\n你充满了奇迹\n\n你并不想伤害他们，对吧，朋友？\n\n你尽了一切努力，就是不让他们被杀。\n你如此渴望看到他们学习、成长，并互相帮助……\n\n我明白。我知道，我知道……\n\n不过，它们仍然存在于那里，对吧？\n那是他们吗？\n隐藏在暗处。\n他们现在正在保护你。\n\n如果你允许的话，我也想保护你。\n没有人会再伤害你\n\n只要我在场，就不会这样做。
