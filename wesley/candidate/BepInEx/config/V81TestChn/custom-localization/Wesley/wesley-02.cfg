exact:Many years ago in a time long passed.\nA young man stood between the flowers in a ray of moonlight.\nObserving the stars, taking in the beauty that is the universe.\nHe did this every night. And every time it was breathtaking.\nBut on one fateful night it was different.\nHe saw a bright light in the sky.\nA comet?, A creature? no, something more.\nHe described it as a soul or a presence..\n And it spoke.\nThere between the flowers he listened to this voice from deep space.\nIt sounded powerful, but vague. A message he couldn't understand.\nYet he was inspired. He had to hear this again.\nHe had to tell everyone he knew.\nThis was something special.=很久很久以前，一个年轻人站在花丛间，月光落在他身上。他仰望群星，欣赏宇宙之美。每夜如此，每一次仍叫人屏息。\n可在命中注定的那一晚，一切都不同了。他看见天空中有一道亮光。一颗彗星？一个生灵？不，还不止于此。按他的说法，那像是灵魂，又像某种存在……而且，它开口了。\n他就站在花间，聆听来自深空的声音。那声音强大，却含糊，传递着他无法理解的消息。可他深受触动。他一定要再听一次，一定要告诉所有认识的人。\n那绝非寻常之物。
