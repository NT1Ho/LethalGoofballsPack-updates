exact:These old voice recorders are the worst.. \nRight.. \nWe've got word from captain Donahue over at the primary facility. \nThey have found.. something.. \nIt appears to be something new, something unexplored. \nThey think it might be some sort of plant which sounds exciting. \n\nHere however we've made steady progress. \nAs mentioned before, this cosmic growth is able to grow.. eyes wherever it pleases. \nAt first we thought it might be some sort of defense mechanism. \nBut there's no active predators on Cosmocos from the data we've gathered. \nBut then we noticed something strange.. \n\nOne of the eyes growing in our incubators was able to move and look around, illuminating whatever it looked at. \nThis place is full of surprises. \nMore information soon. \n\nProfessor Harrington, over and out.=这些老录音机最糟糕... \n对... \n我们收到唐纳休船长在主设施的消息 \n他们发现了... 什么东西... \n似乎有些新事物, 一些未探索的东西 \n他们认为这也许是某种植物 听起来很刺激 \n\n然而,我们在这方面取得了稳步进展。 \n如前所述,这种宇宙增长能够生长... 眼睛可以随心所欲地成长 \n起初我们以为它可能是某种防御机制 \n但是从我们收集到的数据来看 宇宙号上没有活跃的掠食者 \n但后来我们发现一些奇怪的事情... \n\n我们孵化器中成长的一只眼睛 能够移动和环顾四周, 启发着它所看到的任何东西。 \n这地方充满惊喜 \n很快会收到更多资料。 \n\n哈灵顿教授 完毕
exact:They brought this newfound knowledge to the village. They told everyone.\nWhile of course there were a lot of sceptics, there were few who had seen this light before when they were young. It had never spoken to them however.\nMaybe it wasn't a creature. Or something akin to that. Maybe it was the essence of their moon. Like a spirit, a presence as they described it.\nIt only made sense...\nAnd so they wished to see it again. To hopefully hear it speak, again.\nThey built shrines to please this presence.\nAnd even those of others.\nThey started giving them names, bodies, appearences, identities.\nThey would bring gifts to please them.\nThey would care for nature. The well being of their moon. Hoping to hear it again.\n\n... They never did, but they kept trying.=他们将这一新发现的知识带到了村庄里，告诉了每一个人。\n虽然当然有很多怀疑者，但很少有人在年轻时见过这种光芒。然而，这种光芒从未与他们有过联系。\n也许那不是某种生物，或者类似的东西。也许它就是他们月亮的精髓。就像一种精神，一种他们所描述的存在。\n这似乎很有道理……\n因此，他们希望再次见到它，希望能再次听到它的声音。\n他们建造了神殿来安抚这种存在。\n甚至也为了其他人的利益而这样做。\n他们给这种存在起名，赋予它形态、外观和身份。\n他们献上礼物来讨好它。\n他们关心自然，关心他们月亮的福祉。希望再次听到它的声音。\n\n……他们从未实现过，但他们一直努力着。
exact:They have to be perfect, we cannot bathe in a stew of mediocrity if we wish to thrive in our future. With slight alterations, one perfect specimen might be worth a hundred regulars in action. The process might be slow but we require patience. An empire built in a day will end in one too. We must be patient, build our machines. Then watch as we bring order and end this quiet age.=这些必须做到完美，如果我们希望在未来取得成功，就不能容忍平庸的混杂物。通过微小的调整，一个完美的样本可能就能替代一百个普通的样本。这个过程可能会很缓慢，但我们需要耐心。一个在一天内建立起来的帝国也会以同样的方式终结。我们必须有耐心，打造我们的机器。然后，让我们带来秩序，结束这个宁静的时代。
