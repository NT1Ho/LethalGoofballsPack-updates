exact:The purifying shrine\n\nThis device was designed to harvest and project the power of the purifying stones and spread their effect across areas far and wide.\n\nThe farmers most often used these to stabilize their farmland and increase the rate at which their crops grew.=净化圣坛\n\n这座装置可以汲取净化石的力量，将其投射出去，让大片区域都受到影响。\n\n农民最常用它稳定耕地，并加快作物生长。
