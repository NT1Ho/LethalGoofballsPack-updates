exact:Not weeks ago we had a big breakthrough with one of my theories.\nNow yesterday our front door was broken though.\nAfter having celebrated our victory in the cloning of spore lizards we weren't expecting to see the military show up to investigate our lab.\nBut after learning about our success in the cloning department, we had a.. less than peaceful discussion as they had brought it to their higher ranks who now demand to use it to clone.. people.. for the war of course.\nThis leaves us with a choice, we either give them an unlimited army.. or we destroy all our progress.\n\nI have to take my leave.\nProfessor Harrington, over and out.=不到几个星期前，我的一个理论才取得重大突破。可就在昨天，有人破门而入。\n我们刚庆祝完成功克隆孢子蜥蜴，没想到军方会来搜查实验室。他们得知克隆项目的进展后向上级作了汇报，谈话就……不大愉快了。现在上面要求用这项技术克隆……人。当然，是为了战争。\n摆在眼前的只有两条路：要么把一支无穷无尽的军队交给他们，要么毁掉我们取得的一切成果。\n\n我得走了。\n哈林顿教授，通话结束。
