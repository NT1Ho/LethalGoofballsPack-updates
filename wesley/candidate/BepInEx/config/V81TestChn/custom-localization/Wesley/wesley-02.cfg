exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\n> The Beginning\nThe Employee\nThe Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Beginning - 0 days since impact.\n—--------------------------------------\nIn the town of Rosemaw, a small hike into the forest a meteor fragment had impacted.\nIt is not unusual for small fragments to reach the surface and make contact so it wasn’t immediately reported by the public.\n\nA few days later a few hikers had noticed an unusual looking fungus but chose to leave it be. These hikers only began to take notice once it started spreading and growing over a small patch in the forest. They didn’t think much of it and avoided the area for the time being.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n> 开端\n店员\n警员\nI.T.D.A.\n掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\n开端　撞击后第0天\n\n陨石碎片落在罗斯莫镇附近，往林子里走一小段路就到。小块陨石落到地表并不罕见，所以起初没有居民报告。\n几天后，几名徒步者注意到一种样子古怪的真菌，当时谁也没碰它。直到它蔓延开来，占据了一小片林地，他们才多看了几眼。他们并没放在心上，只是暂时绕开了那里。
exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\n> The Employee\nThe Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Employee - 4 days since impact.\n—--------------------------------------\nRichard Pollar, more commonly known as Rich, arrived at the local bakery for work an hour before opening time. He started preparing the kitchen for the day, organising and cleaning the kitchen when he noticed red blobs of an unusual liquid sticking to the equipment and the furniture.\nThe liquid was thick and lukewarm to the touch, a gooey substance. Rich was both intrigued and disgusted by the discovery and went looking for the source. He couldn’t find anything else out of the ordinary until he got to the stove. He was frightened by what he saw. It was a rat covered in tendrils with strange goop oozing from one of its empty eyesockets, bubbling and twitching as it did. Before Rich could fully understand what he was looking at, it scurried away, fleeing to someplace outside.\nHe was shaking and frantically called his employer before loosely explaining what happened.\nRich was quickly dismissed with the assumption of it being another one of his psychotic breaks.\nMeaning to prove that what he witnessed was real, he went to chase it down, leaving a note for the other employees explaining where he went.\nRich followed the trail of goop through the town, into the forest all the way to the area where the fungus was spotted by hikers before. There he found it, laying still on this yellow-orangish rock. Rich was bemused and stared at it for a while. He assumed it was dead considering its state and the fact it wasn’t moving anymore. The only movement he saw were these small tendrils sticking out of its body.\nUnsure of what to make of it he decided to investigate, he was scared but his curiosity carried him forward. The fungus he had heard about has seemingly spread through a significant chunk of the forest.\nAs Rich wandered through the infested area, he laid eyes upon more of these critters in a similar condition. Witnessing this he got scared and ran back towards the bakery and told his coworkers, who had arrived by this time, what he had seen. To ensure they would believe him he had taken some pictures to show.\nThe coworkers seemed very concerned upon being shown the pictures. Similarly confused and disgusted they decided to investigate on their own, leaving Rich at the bakery, who at this time was still shaking.\nAn hour passed and Rich grew concerned, maybe they got lost, maybe they were still investigating, who knows. But he grew more and more concerned by the minute. Another hour later he finally made the decision to call the authorities. Fearing they’d dismiss him if he spoke the truth, he only said there was an emergency at the bakery. And there he stayed until an officer arrived.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n开端\n> 店员\n警员\nI.T.D.A.\n掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\n店员　撞击后第4天\n\n当地面包房的员工理查德·波拉尔，人们通常叫他里奇。开门前一小时，他就到了店里。他正收拾、擦洗厨房，准备一天的生意，忽然看到设备和家具上粘着一团团古怪的红色液体。\n这东西又稠又黏，摸上去温温的。里奇既好奇又恶心，便去找源头。其他地方都没什么异常，直到他查到炉子旁边。眼前的一幕吓坏了他。一只老鼠浑身长满卷须，空眼窝里渗出怪异的黏液，直冒泡，身子一抽一抽的。他还没回过神，它就蹿到外头不见了。\n他浑身发抖，慌忙打电话给老板，语无伦次地说了个大概。老板只当他又发病了，根本不信。为了证明自己没看错，他给同事留了张便条，交代去向，然后追了出去。\n里奇循着黏液穿过小镇，一路进了树林，来到徒步者最先发现真菌的地方。他找到了那只老鼠。它静静躺在一块橙黄色岩石上。他愣愣地看了好一会儿，看它那副模样，又一动不动，就以为它已经死了。只有身上伸出的小卷须还在动。\n他不知道该怎么解释。害怕归害怕，好奇心还是推着他往前走。传闻中的真菌看来已经蔓延到好大一片树林。他又看见几只小动物，也是同样的惨状，终于怕得掉头跑回面包房。他把情况讲给已经到店的同事，还拍了照片给他们看，免得他们不信。\n同事们看过照片，都十分不安，跟他一样既困惑又恶心。他们决定亲自去查，把还在发抖的里奇留在店里。\n一个小时过去了，他开始担心。也许他们迷路了，也许还在调查，谁说得准。时间一分一秒地过去，他越想越不安。又过了一小时，他终于报了警。他怕说实话又没人信，只说面包房出了急事。随后便留在那里，直到一名警员赶到。
exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\n> The Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Officer - 4 days since impact.\n—--------------------------------------\nAn officer by the name of Michael Benson, Mike for short. Arrived at the scene finding a distressed Richard sitting in the bakery. Mike asked about the emergency to which Rich tried to explain that his coworkers left to investigate something in the forest but hadn’t returned for hours. Mike grew suspicious and calmly asked why he’s as distressed as he is. Rich told Mike there’s horrifying things happening in the forest around the infested area.\nMike called this in and went to have a look for himself, unsure if he was telling the truth. But only after a few more officers arrived at the scene.\nMike arrived at the forest and cautiously took a few steps in when he already began to see signs of something being off.\nThe ground was covered in yellowish rock with this red substance oozing out of the ground. Slightly deeper into the forest, plants seemed to turn gray, die or get covered in this same yellow rock.\nMike returned to the edge of the forest and called for a search party. This has to be reported, it has become a real anomaly he thought. Half an hour later four more officers arrived and the search started.\nAs Mike ventured deeper into the forest he began to see the same things Rich had described, Critters, seemingly deceased with tendrils erupting from their bodies. Starting to get a notion of dread he continued. As he stumbled further into the woods it became less and less lively.\nThen he noticed something red, moving away from him, sliding across the rocky ground, leaving a trail of that same red substance. As Mike got closer the picture got clearer, it was similar to the critters he had seen earlier. When he walked in a big circle to the front of it he saw what it really was.\nIt was the front half of a moose, a large tentacle slid out of its mouth alongside a significant amount of red ooze. Where its back half was meant to be was nothing but tendrils and intestine slowly moving it forward.\nFrightened, Mike quickly stepped back. He wasn’t sure what to do. It looked like it was trying to scream or yell but no sound erupted from its mouth. Another tentacle protruded through one of its eyes, pushing it out of its socket followed by blood and ooze.\nNow horrified, Mike grabbed the weapon out of his holster and fired a bullet into its head, meaning to end its suffering.\nIt ceased to move for a moment but quickly got back to it, now oozing from the wound.\nMike was filled with dread and ran away from there. On his way back he found something else.\nThe missing employees laid there, lifeless on the hard rock surface. He called it in and told the other officers to head back. The employees were in a terrible condition, it looked like their limbs had torn themselves from their bodies, oozing out of their eyes and mouths. Witnessing this he ran back immediately and met up with the other officers in the bakery. This has quickly turned into a seemingly deadly fungal invasion.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n开端\n店员\n> 警员\nI.T.D.A.\n掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\n警员　撞击后第4天\n\n警员迈克尔·本森，人称迈克。赶到面包房时，他看到理查德坐在那里，惊魂不定。迈克问出了什么事。里奇说，同事去林子里查一件事，已经好几个小时没回来。迈克起了疑心，平静地问他为什么怕成这样。里奇说，林中那片受侵染的地方正在发生可怕的事。\n迈克把情况报了上去。他不知道里奇说的是不是真的，决定亲眼看看，但等另外几名警员到了才出发。他小心地往树林里走了几步，就看出不对了。\n地上覆着发黄的岩层，里面渗出红色物质。再往里走，草木有的发灰，有的已枯死，还有的裹上了同样的黄色岩层。迈克退到林边，呼叫搜查队。他想，这已经是货真价实的异常事件，必须上报。半小时后又到了四名警员，搜查开始。\n越往深处走，他就越多地看到里奇描述的景象。小动物像是早已死去，身体里却钻出卷须。他心里发毛，还是继续往前走。林子里越来越没有生气。\n前方有个红色的东西，在岩面上滑动，拖着一道同样的红痕。迈克走近一看，它和先前那些动物有点像。他绕了个大圈来到正面，才看清那到底是什么。\n那是一头驼鹿的前半身。一根粗大的触手连同大量红色黏液从嘴里滑出。本该是后半身的地方只剩卷须和肠子，正慢慢拖着它前进。\n迈克惊得往后退，不知该怎么办。它好像想叫，嘴里却发不出一点声音。又一条触手穿过眼睛，把眼球挤出眼窝，血和黏液跟着流了下来。迈克吓坏了，拔枪朝它脑袋开了一枪，想让它少受点苦。它停了一下，很快又动了起来，这次连弹孔也在往外渗黏液。\n迈克拔腿就跑。回去的路上，他发现了失踪的店员。他们躺在坚硬的岩面上，已没了气息。他用无线电上报，叫其他警员撤回。死者惨不忍睹，四肢像是自行从躯干上扯了下来，眼睛和嘴里渗着黏液。迈克立刻跑回面包房与其他人会合。事态急转直下，看来这场真菌入侵足以致命。
exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\nThe Officer\n> The I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe I.T.D.A. - 7 days since impact.\n—--------------------------------------\nThe town has been evacuated and all survivors involved have been brought in for questioning and isolation. The I.T.D.A. Has labeled this situation as critical and has begun quarantining the area. Nobody was allowed to enter or leave the quarantine zone. The military had been called in for additional security.\nSeveral teams of experienced biologists and scientists had made it to the site to analyze and halt the anomalous threat. It was immediately proven not to be any sort of fungi but something else that had yet to be documented. This spread seemed to overtake whatever they put in front of it, consuming it entirely. Attempts of halting the spread were made such as burning it which only temporarily made the tendrils disappear. They had attempted several other chemical solutions to no avail. The closest they had gotten was by using a liquid which super freezes anything it comes into contact with. It only significantly slowed it down.\nFrom this point several nearby towns were also evacuated as the spread and the quarantine area grew. Slowly but surely the area was becoming a wasteland.\nIt was discovered that direct contact with the substance could result in an infection which ends in a grueling eruption of tendrils, torn limbs and death.\nThe I.T.D.A. had officially labeled the spread as a world-ending level hazard. And as there have been no viable methods to halt the spreading or cure anyone infected. The I.T.D.A after a discussion with the Council of Rule on Calist, had marked Hyxellia as a moon in quarantine. Nobody could enter. Nobody could leave. Those who tried were either stopped or killed.\nThe population remaining on Hyxellia were scared, unable to send out or receive communication from a source outside of the moon, the only source they had were the I.T.D.A. which assured the public that the threat will be dealt with.\nBiologists had well documented the workings of this spread which has gained the name “The Red Death”. In a detailed report it was documented how the red death consumed and spread:\nThe yellow rock-like material isn’t technically stone as many assumed but more similar to a very thick, dense, solidified skin. Instead of being stretchy, the density makes it much harder and rock-like. Below the yellow crust is a much softer meat-like material, this material is able to retract or expand, even move as if it’s one large living being organising its fleshy layer. This soft layer has seen to form these tentacles or tendrils for either defensive or even offensive measures. The spread itself is quite unique, these cells will attempt to eat whatever is around them and immediately replace the consumed material with a new cell. The process of consumption also generates this red substance. Drilling procedures have noted that deep inside the soft layer there’s large tunnels where the substance flows similar to our veins. The substance which gets generated doesn’t always end up within these veins, it often surfaces and forms large bubbles of goop below the crust, sometimes bursting through, leaving holes within the crust and forming large puddles of goop.\nAt the two week mark, the Red Death had consumed nearly half the moon. The cause seemed lost. This was the end times. Anyone still on Hyxellia was awaiting a horrible fate with no way of saving them.\nMany military personnel as well as teams sent in by the I.T.D.A. have chosen to end their own lives to avoid a worse end.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n开端\n店员\n警员\n> I.T.D.A.\n掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\nI.T.D.A.　撞击后第7天\n\n小镇已疏散，所有涉事的幸存者都被带走问话、隔离。I.T.D.A. 将事态列为危急，开始封锁该地。隔离区禁止出入，并调派军队加强警戒。\n数支由资深生物学家和其他科学家组成的小组赶到现场，试图分析并阻止这种异常威胁。他们很快证明它根本不是真菌，而是一种从未记录的东西。摆在它面前的一切似乎都会被它吞没，彻底消失。多种化学手段都无效。最接近成功的一次，是使用一种能让接触物瞬间深度冻结的液体，但也只能大幅减慢扩散。\n随着侵染和隔离区一同扩大，附近数个城镇也被疏散。这里逐渐沦为荒地。研究发现，直接接触这种物质可能遭感染，最终无数卷须会痛苦地破体而出，四肢撕裂，人也随之死去。\nI.T.D.A. 正式将其列为足以毁灭世界的灾害。既没有办法阻止扩散，也无法医治感染者。与卡利斯特的执政议会商议后，I.T.D.A. 将希克塞利亚全星列为隔离区。不得进入。不得离开。胆敢尝试者，不是被拦下，就是被击毙。\n留在希克塞利亚的居民惶恐不安，既无法向外界发信，也收不到外界的消息。唯一的消息来源是 I.T.D.A.，它向公众保证威胁会得到控制。\n生物学家详细记录了如今被称为“红死病”的扩散过程。报告中写道：\n黄色岩状物并非人们以为的石头，而像一层极厚、极密、凝固的皮肤。它毫无弹性，高密度使它像岩石一样坚硬。黄壳下面柔软得多，像肉，会收缩、膨胀，甚至移动，仿佛一个巨大的生物在调整自身的肉层。这一层会生成触手或卷须，用以防御，甚至主动攻击。它的扩散方式很特别：细胞试图吃掉周围的一切，随即用新细胞取而代之。吞噬过程还产生红色物质。钻探显示，软层深处有巨大的管道，红色物质在其中流动，就像血液在血管里流动。生成的物质并不全流进管道，它常常上涌，在壳下形成巨大的黏液泡。气泡有时会冲破外壳，留下孔洞，积成大片黏液池。\n两周过去，红死病已经吞掉了近半颗星球。挽救它已看不到希望。末日到了。仍留在希克塞利亚的人等待着可怖的命运，已无人能救。许多军人和 I.T.D.A. 派来的小组成员选择了自尽，以免遭受更惨的下场。
exact:The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\nThe Officer\nThe I.T.D.A.\n> The Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Coverup - 16 days since impact.\n—--------------------------------------\nHyxellia had been nearly entirely consumed and the I.T.D.A. had ceased any further attempts at rescuing the moon.\nFollowing this the I.T.D.A. had sent out a message to Calist, where the council would decide over the fate of the moon.\nThe response was immediate and due to the level of contagiousness of the Red Death, the council had decided to not only keep the moon in quarantine but also silence anyone aware of the situation.\nHyxellia was to be removed from the star maps and public knowledge entirely as if it had never existed in the first place. They had gone through great lengths to achieve this.\nNearing full corruption, few reports were sent out by biologists in hopes they would be rescued.\nThey spoke of having heard sounds from deep space, calling them cosmic, possibly a language they couldn’t understand. They said it felt like something was watching them. Something beyond what they could understand. Something they couldn’t feel but only feel its presence of.\nIn the final moments of life on Hyxellia, a warning was sent out:\n“Stay away. It is watching us. It sees us. It will come for us all.”\nHyx is a threat, well documented and hidden.\n\n[These documents have been classified by the Council of Rule]\nUnder no circumstance can they be released to the public.\nThey will be kept on Hyxellia to ensure no living being is able to access them.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n开端\n店员\n警员\nI.T.D.A.\n> 掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\n掩盖真相　撞击后第16天\n\n希克塞利亚几乎全被吞没。I.T.D.A. 停止了挽救这颗星球的一切尝试，随后向卡利斯特发出消息，由理事会决定它的命运。\n答复立即送达。鉴于红死病极易传播，理事会决定继续隔离，并封住所有知情者的口。希克塞利亚要从星图和公众记忆中彻底抹去，仿佛它从未存在过。为此，他们不惜大费周章。\n在侵染即将覆盖全星时，生物学家发出了最后几份报告，希望有人来救他们。他们说，自己听见来自深空的声音，像是宇宙本身传来的，也可能是一种他们听不懂的语言。他们觉得有东西正注视着他们。那东西超出了他们所能理解的范围，触摸不到，只能感觉到它的存在。\n在希克塞利亚上生命的最后时刻，有人发出了警告：\n“别靠近。它在看我们。它看得见我们。它会来找我们所有人。”\n希克斯的威胁有详实的记录，也遭到了严密的隐瞒。\n\n［这些文件已由执政议会列为机密］\n在任何情况下均不得向公众公布。文件将留在希克塞利亚，确保没有任何活物能够取得。
