exact:ARACHNOHEAD\r\n\r\nSigurd's danger level: 35%\r\n\r\nScientific name: Areck-hetoma\r\nAreck-hetoma or the “Arachnohead” are vicious devices designed to ensnare their targets with the intent to kill. \r\nIt is theorised their original intended purpose was to act as a security device and scare off intruders when spotted. However it is certain their current purpose is to only act as a trap, an artefact of the war predating the quiet age.\r\n\r\nTheir appearance is that of a teddy bear with a head resembling that of a baby doll. The teddy bear exterior is only there to conceal the machinery of the Arachnohead itself in its dormant state. Upon activation it starts a search for any nearby entities internally listed as enemy targets. When a target is spotted it leaves its teddy enclosure and uses a set of four hydraulic legs to chase its target.\r\nThe internals of the head are often very haphazardly wired and it is not uncommon for the wrong wires to cross during an impact of blunt force causing a short circuit leading to a possibly explosive reaction. While it is a flaw in the original design, it was never resolved due to it being a very favourable feature when used in times of conflict.=蛛首怪\n\n西格德的危险等级：35%\n\n学名：Areck-hetoma\n蛛首怪是一种专为诱捕并杀死目标而设计的凶险装置。有人推测，它最初是发现并吓退入侵者的安保设备。可以确定的是，如今它只起陷阱的作用，是静默时代之前那场战争的遗物。\n\n外观像一只长着玩偶脑袋的泰迪熊。熊皮只是用来遮掩休眠的机械本体。装置启动后，会在附近搜寻内部名单上列为敌人的目标。一旦发现目标，头部便脱离熊身，靠四条液压腿追击。\n头内的布线往往相当草率，受到钝击时，原本不该相碰的电线很容易搭在一起，引起短路，甚至爆炸。这本是设计缺陷，却因在战时颇为实用，一直没有修正。
