exact:CORPSE CRAWLER\r\n\r\nScientific name: Cerec-retoma\r\nThe Cerec-retoma is a device made up of a hollowed rotting corpse stuffed with machinery using parts of the nervous system as internal wiring to reduce the cost of creation. The body itself seems to serve no other purpose other than to keep the components together. Hence how it has earned the name “Corpse crawler”.\r\n\r\nIt walks around through the means of four hydraulic legs which use various liquids drained from the body among which are spinal fluid and blood rather than water. The extraction happens shortly after the insertion which as a side effect severs the spine and the head from the body in a very short, yet painful method.\r\n\r\nThe body is riddled with spikes protruding through the flesh and skin and can be used as a defensive method against anything that seeks to attack or destroy it.\r\n\r\nThese devices were likely designed and produced by the Trite Control Corporation as the first appearances were sighted on celestial bodies surrounding the fractured remains of the Triton Empire shortly after the creation of the corporation in 2249. There they acted as remotely controlled scouts being able to search and explore through the cameras hidden within the head of the device. The usage of a human body with their organs as components meant that these scouts are purposefully temporary. The rot of the corpse making it near impossible to understand what its original internals may have looked like before deactivation.\r\nLater models discovered around 2296 no longer possessed the ability of being remotely controlled but were instead fully autonomous.\r\n\r\nThe corpse crawler bears a striking resemblance to the Areck-hetoma, otherwise known as the Arachnohead which was likely an inspiration for the design.=爬行尸怪\n\n学名：Cerec-retoma\n这种装置由一具掏空的腐尸和塞入其中的机械组成。制造者为降低成本，利用部分神经系统充当内部线路。尸身本身似乎只起到固定零件的作用，“爬行尸怪”一名由此而来。\n\n它靠四条液压腿行走，驱动腿部的不是水，而是从身体抽取的血液、脑脊液等体液。机械装入不久便开始抽液；这一过程会使脊柱和头部与身体分离，短暂，却极为痛苦。\n\n尖刺遍布全身，穿透皮肉向外伸出，可用来抵挡试图攻击或摧毁它的东西。\n\n这些装置很可能由特赖特控制公司设计制造。公司于 2249 年成立，不久后，人们首次在环绕特里同帝国残部的天体上发现它们。当时它们充当遥控侦察兵，操作者通过藏在头内的摄像头进行搜索和勘察。用人体和器官做零件，意味着这种侦察兵从设计之初就不打算长期使用。尸体会腐烂，设备停用后几乎没人能还原内部原先的模样。\n约在 2296 年发现的后期型号已不再接受遥控，改为完全自主行动。\n\n爬行尸怪与蛛首怪（Areck-hetoma）极为相似，其设计很可能受过后者启发。
