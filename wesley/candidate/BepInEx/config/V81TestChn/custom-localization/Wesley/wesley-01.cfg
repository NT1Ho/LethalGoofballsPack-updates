exact:HONEY STINGER\n\n\nSigurd's danger level: 40%\n\n\nScientific name: Vapir-Mellitera\n\n\nThe Honey stinger is a large insect part of the Anthophila, being close to the Melittidae. They tend to inhabit luscious or mountainous areas with the largest colony discovered in the asteroid belt of 56-Vow.\nThe honey stinger has a hard and thick shell on its back to protect itself from any aggressors while the bottom is more soft and vulnerable. It is because of this vulnerability that they prefer to crawl around despite them being excellent at flying.\n\n\nMuch like many species of bees they are born from and serve one queen. While the antics of the honey stinger are not extensively studied, it is known that they possess a more playful behaviour than most other families of bees.\n\n\nThey take a liking to grabbing and claiming objects they find interesting. Most often these are beehives of smaller species of bees. It is unsure if they understand the concept of a smaller version of themselves existing but it is known that after obtaining several of these hives they become increasingly defensive.\n\n\nWhile they do not have any aggressive tendencies towards most species they are quick to attack any human who wanders near them, likely due to the frequent exploitation of their hives.\n\n\nIt is recommended to stay away from the honey stinger when encountered in the wild. They do not like you but they mean no harm. They are only protective of themselves and their hives.=蜜刺虫\n\n西格德的危险等级：40%\n\n学名：Vapir-Mellitera\n\n蜜刺虫是蜂类（Anthophila）中的大型昆虫，与准蜂科亲缘较近。它们多栖息在草木繁盛的地区或山区，已发现的最大群落位于 56-Vow 的小行星带。厚实坚硬的背甲能抵御来犯者，腹面却较柔软、易受伤。正因这个弱点，它们虽然善飞，却更喜欢贴地爬行。\n\n和许多蜂类一样，群落中的个体由同一只蜂后繁育，并为她效力。人们对蜜刺虫的习性研究不多，只知道它们比多数蜂类更爱玩。\n\n它们喜欢把感兴趣的东西抓来据为己有，其中最常见的是小型蜂类的蜂巢。我们不清楚它们能否理解世上也有“小一号的自己”，只知道收集到几个这样的巢后，它们的防御性会越来越强。\n\n它们对多数物种并无攻击倾向，却会迅速攻击靠近的人类，很可能是因为人类常常掠取它们的蜂巢。\n\n野外遇见蜜刺虫时，建议保持距离。它们不喜欢你，但也无意加害；它们只是在保护自己和蜂巢。
