exact:Day 289 - Golden Dagger - Origin: Junic\n\nExperiment-1: Possession\nThe subject was given the dagger and left alone in a room. The subject would not let go of the dagger.\nAfter 15.1 hours the subject started chanting strange words. The subject attempted to murder another employee, during with the subject was executed. The employee fell victim to crossfire.\n\nExperiment-2: Grouping\nThe subject was given the dagger and placed in a room with 3 more subjects. The other subjects attempted to carry the dagger but were unable to.\nAfter 27.4 hours the subject started to chant strange words again. The subject covered their face with their hand and decapitated another subject using the dagger before violently ripping out their organs and drawing a strange symbol on the floor. All surviving subjects except for the wielder were removed from the room. After 34.44 minutes of the subject searching for other subjects, the subject stabbed itself through the mouth upwards into the brain using the dagger.\n\nConclusion: Not Weaponisable=第289天 - 金匕首 - 起源：朱尼克（Junic）\n\n实验-1:拥有\n受试者被给予匕首，并被单独留在房间里。受试者无法放开匕首。\n15.1小时后，受试者开始念叨奇怪的词语。受试者试图杀害另一名员工，最终被处决。那名员工在交火中丧生。\n\n实验-2:分组\n受试者被给予匕首，并与其他3名受试者一起被安置在一个房间里。其他受试者试图携带匕首，但未能成功。\n27.4小时后，受试者再次开始念叨奇怪的词语。受试者用手遮住脸，用匕首砍下另一名受试者的头颅，随后暴力地割下其器官，并在地板上画出一个奇怪的符号。除持刀者外，所有幸存者都被带出房间。在34.44分钟内，受试者寻找其他受试者，最终用匕首刺穿自己的大脑。\n\n结论：不可武器化
exact:Day 374 - Hyper Acid - Origin: Acidir\n\nExperiment-1: Touch\nThe subject's finger was unharmed.\n\nExperiment-2: Spray\nThe subject experienced discomfort but remained healthy.\n\nExperiment-3: Ingest\nThe subject felt slight burning of the throat but remained healthy.\n\nExperiment-4: Dousing\nThe subject lived for a total of 4.68 seconds after being fully drenched. The flesh was fully melted in 8.49 seconds once the subject was fully covered.\nOnly few bones remained.\n\nConclusion: Weaponisable=天天 374 - 超酸-来源:酸性\n\n实验-1：触摸\n受试者的手指没有受到伤害。\n\n实验-2：喷洒\n受试者感到不适，但身体状况良好。\n\n实验-3：摄入\n受试者感到喉咙有轻微的灼烧感，但身体状况良好。\n\n实验-4:使用\n该受试者在被完全浸湿后，总共存活了4.68秒。当受试者全身被水完全覆盖后，其肉体在8.49秒内完全融化。\n仅剩少量骨头。\n\n结论：可武器化
exact:Day 387 - Comedy Mask - Origin: Etern\n\nExperiment-1: Presence\nThe subject was put in a room with a mask for 7.8 hours. The subject claimed to have heard laughs. No further effects noted.\n\nExperiment-2: Wearing\nThe subject entered a zombie like state within 28.78 seconds. The subject was executed.\n\nExperiment-3: Conversion\nTwo subjects were put in a room, one of which converted. The living subject was immedietely attacked and converted. Both were executed.\n\nNOTE\nA secret log was recovered from a body on Etern. It was put into storage area D.\n\nConclusion: Weaponisable=第387天 - 喜剧面具 - 来源：埃特恩（Etern）\n\n实验-1:存在\n实验对象被戴上面具，处于该状态共7.8小时。实验对象声称听到了笑声。无其他明显效果。\n\n实验-2:穿戴\n实验对象在28.78秒内进入僵尸状态。实验对象被处决。\n\n实验-3: 换算\n两名实验对象被放入一个房间，其中一名发生了转化。活着的实验对象立即遭到攻击并转化。两名实验对象均被处决。\n\n备注：\n从埃特恩的一具尸体上发现了一份秘密记录。该记录被存放在D存储区。\n\n结论：具有武器化潜力
exact:Day 394 - Cursed Coin - Origin: Polarus\n\nExperiment-1: Proximity\nThe subject was given the coin. It took 6 hours for the subject to enter insanity. The subject claimed to see a ghostly figure.\nPossible schizophrenia.\n\nNOTE\nSeveral employees died with similar symtoms. Every employee who claimed to see a ghost has died.\n\nAny further experiments with this item are prohibited!\n\nConclusion: Not Weaponisable=第394天 - 被诅咒的硬币 - 来源：波拉鲁斯（Polarus）\n\n实验-1:相近\n实验对象被给予该硬币。实验对象需要6小时才会陷入疯狂状态。实验对象声称看到了一个幽灵般的身影。\n可能患有精神分裂症。\n\n注意：\n几名员工也出现了类似的症状而去世。所有声称看到幽灵的人都有死亡。\n\n禁止对该物品进行任何进一步实验！\n\n结论：无法作为武器使用
exact:Day 402 - BIO HXNV7 - Origin: Cosmocos\n\nExperiment-1: Touch\nUpon touch the subject became very agressive and seemed to slightly deform. The subject was executed before further experiments could be done.\n\nExperiment-2: Isolation\nThe subject was infected with BIO HXNV7 and put into a room. It took 12.24 seconds for the subject to become agressive. It took 15.48 seconds for the subject to deform. The subject's flesh seemed to merge with the walls it touched. Turning into a concrete statue while completely consious. It took 4.23 minutes for the subject to lose thought. At 4.44 minutes the subject was a concrete statue.\n\nNOTE\nBIO HXNV7 OUTBREAK! SEVERAL INFECTED.\nSTARTING SECTOR WIDE DECONTAMINATION.\nDECONTAMINATION LEVEL 5: INCINERATION.\n\nSEVERAL STILL INFECTED, FEW FULLY TRANSFORMED.\nDON'T LOOK AWAY!\nFACILITY WIDE DECONTAMINATION IMMINENT.\nGOODBYE.\n\nConclusion: Highly Weaponisable=第402天 - BIO HXNV7 - 起源：科斯莫科斯（Cosmocos）\n\n实验-1：触摸\n触碰后，实验对象变得非常具有攻击性，并似乎发生了轻微的变形。在进一步实验之前，实验对象被处决了。\n\n实验-2:孤立\n实验对象感染了BIO HXNV7，并被安置在一个房间里。实验对象变得具有攻击性需要12.24秒，发生变形需要15.48秒。实验对象的肉体似乎与它所触碰的墙壁融合在一起，变成了一座混凝土雕像。实验对象失去意识需要4.23分钟。在4.44分钟时，实验对象已经变成了一座混凝土雕像。\n\n注意：\nBIO HXNV7疫情爆发！已有数名感染者。\n正在整个领域范围内进行净化处理。\n净化等级5：焚化处理。\n\n仍有几名感染者，但已完全变形的只有少数。\n切勿视而不见！\n设施范围内的净化处理即将开始。\n再见。\n\n结论：极具武器化潜力
exact:Day 79\nOur team has gone mad. Ever since the flash, our technology seems to be malfunctioning.\nIt is unlikely that we’ll be able to leave anytime soon.\nDay 80\nA few on the team say they are experiencing disorientation and dizziness. Unsure as to why but it appears to be a common factor. I wonder if we’ve been hit with a large surge of radiation. We best figure out what’s wrong with the equipment so we can do a proper evaluation.\nDay 81\nThree of us stumbled into the forest, they said, “the forest is calling to us”. If it weren’t for the fact that we need all hands on deck I would let them get lost. I’ve sent two more of us out to go and look for them.\nDay 82\nNobody turned up, not the three who went missing nor the ones I sent out to find them. Fantastic. Now I am starting to sense it too. Slightly disoriented and there’s this strange feel to my skin.\nI’ve told the rest of the team to keep working on getting the equipment fixed up. I’m heading out to the third facility. It’s not too distant. About 12000 meters north-east from here.\nPerhaps they have answers there.\nDay 83\nMy skin feels strange. My back hurts. It feels like something’s crawling under my shoulderblades. The path seems different from what we mapped out. I dare say I am lost.\nRunning out of ink too.\nDay 84\nEverything hurts. My legs below my knees are shrinking. It’s getting hard to walk. My skin has turned purple and thick. There’s something sticking out my back. Something cursed me, something cursed all of us. I don’t believe I’ll be here for much longer. There’s something very wrong here.\nI think I’ll just sit by this tree. I’ll write more tomorrow.=第 79 天\n我们的人都疯了。那道闪光之后，设备也开始失灵了。\n恐怕短时间内走不了。\n第 80 天\n几名队员说他们头晕，分不清方向。原因不明，但症状很相似。我怀疑我们遭遇了强烈的辐射。得先找出设备的故障，才能好好检查一番。\n第 81 天\n有三个人踉踉跄跄走进树林，说“森林在召唤我们”。要不是急需人手，我真想任由他们迷路。我又派了两个人去找。\n第 82 天\n三名失踪者、两名搜寻者，一个都没回来。好极了。现在连我也感觉到了：有点晕，皮肤的感觉也很奇怪。\n我让剩下的队员继续修设备，自己动身去第三座设施。那里不算太远，就在东北方，大约 12000 米。\n也许那里能找到答案。\n第 83 天\n皮肤感觉不对劲，背也疼，像是有什么在肩胛骨底下爬。这条路和地图上不一样。我想，我迷路了。\n墨水也快用完了。\n第 84 天\n我浑身都疼。膝盖以下的腿正在萎缩，走路越来越难。皮肤变紫，也变厚了。背上有什么东西凸了出来。有什么诅咒了我，诅咒了我们所有人。我大概撑不了多久。这里一定出了大问题。\n我想就在这棵树旁坐一会儿。明天再写。
