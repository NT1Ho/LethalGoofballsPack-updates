exact:DROOP\r\n\r\nSigurd's danger level: uhhhh I dnot know but thsi sou nds horrifyign\r\n\r\nScientific name: Vorictus-detoma\r\n\r\nThe Vorictus-detoma, garnered the name “Droop” due to its drooping appearance. Its arms, legs and neck are exceptionally long, likely due to the body deformation which happens in the process of a Droop’s creation.\r\n\r\nThe Droop is not officially classified as a non-human creature, while it no longer possesses the humanity it once did, it technically is still human. Only with the effects of prolonged exposure to V-Radiation.\r\n\r\nV-Radiation is an incredibly rare phenomenon and has previously had very adverse and unexplainable effects on creatures and places, often leading to deformation and destruction. Sightings of V-Radiation were extremely rare up until the Grand war where it was occasionally used to cause mass destruction. However, even by supporters of the use of biological warfare, it was greatly frowned upon due to its cruel and otherworldly effects often rendering places uninhabitable.\r\n\r\nWhile there have not been many encounters, the majority of the Droop were likely everyday civilians affected during the war. \r\nDirect exposure to gamma or beta rays of V-Radiation vaporises the average unprotected human, leaving behind what can only be described as a shadow or a memory where they once were. It is not certain what exactly it is that they leave behind but it is thought to no longer be alive. However there have been rumors of these shadows stalking or moving in the dark.\r\nWhen exposed to alpha rays of V-Radiation you won’t immediately notice any harmful effects aside from a slight headache or brief dizziness. But from the moment of exposure you have been infected with a unique type of radiation sickness. While it doesn’t break your DNA, it does change it which only becomes noticeable after a few days. Skin might start feeling heavy and organs might move around during a very painful process. If the infected is still alive 13 days past the first exposure, changes start happening to the brain, often noting highly irregular brainwaves. From this point onwards it is only a husk of its former self. While it is on a technical level not death, this is what we consider the moment of death. The person is unrecoverable and the body is deformed to an unrecognisable level where the skin and muscles resemble a droopy obsidian. \r\n\r\nThere has not been any research from this point onwards.=DROOP\r\n\r\n西格德的危险等级：呃，我不知道，但这个生物非常可怕。\r\n\r\n科学名称：Vorictus-detoma\r\n\r\nVorictus-detoma因其下垂的外形而得名“Droop”。它的手臂、腿部和颈部异常长，这可能是由于在Droop形成过程中发生的身体变形所致。\r\n\r\nDroop并不被正式归类为非人类生物，虽然它已经不再具有曾经的人性，但从技术上讲它仍然是人类。只有在长时间暴露于V-辐射下时才会发生这种情况。\r\n\r\nV-辐射是一种极其罕见的现象，过去对生物和地点产生了非常恶劣且无法解释的影响，常常导致变形和破坏。直到大战争时期，V-辐射才偶尔被用来造成大规模破坏。然而，即使是生物战的支持者也对其残忍和超自然的影响感到厌恶，因为它常常使地方变得无法居住。\r\n\r\n虽然遭遇Droop的情况不多，但大多数Droop都是战争期间受到影响的普通平民。 \r\n直接暴露于V-辐射的伽马或贝塔射线会摧毁普通未受保护的人类，只留下一个影子或记忆，无法知道他们究竟变成了什么。不过，有传言称这些影子会在黑暗中徘徊或移动。\r\n当暴露于V-辐射的阿尔法射线时，除了轻微的头痛和短暂的头晕外，你不会立即察觉到任何有害影响。但从暴露的那一刻起，你就会感染一种独特的辐射病。虽然它不会破坏你的DNA，但它会改变DNA，这种影响在几天后才会显现出来。皮肤可能会变得沉重，器官也会在非常痛苦的过程中移动。如果感染者在初次暴露后的13天内仍然活着，大脑就会开始发生变化，通常会出现异常的大脑波。从这一点开始，它就只剩下了一具躯壳。虽然从技术上讲还没有死亡，但我们认为这就是死亡的时刻。这个人已经无法恢复，身体也变形到了无法辨认的程度，皮肤和肌肉看起来就像下垂的黑曜石一样。 \r\n\r\n从那时起，就没有任何关于Droop的研究了。
