exact:He threatened me! That- that- heartless-\n\nI don’t know why I ever felt compelled to try and convince that man of anything, knowing he is capable of such evil.\nHe is not a man reasoned with.\n\nCosmocos has the most beautiful terrain I’ve ever laid eyes upon.\nSuch gorgeous, diverse plant life.\nA heart.\nI really feel as though it has what the more spritual of us would call a soul.\nAnd the Captain has a gall to suggest that Cosmocos has tricked me, somehow.\n\nPerhaps these feelings are not my own.\nPerhaps these are feelings Cosmocos has imposed upon me.\n\nRegardless of whether these emotions are pre-disposed or not - with everyone ounce of my being, I feel certain that Cosmocos is a thinking, feeling moon.\nIsn’t that incredible?\nShouldn’t that be protected?\n\nI’m going to be the one to protect it, if no one else will.\n\nWhatever the cost.\nIf I fail, at worst, they’ll send me back to March for proper proceedings.\nMy knowledge is too valuable.\n\nAnd then I’ll make it my mission to come back.\nIf they succeed in doing this to Cosmocos...\nI’ll see it done that it is made whole again.\n\nCunningham, signing off.=他威胁我！那个、那个没心没肺的——\n\n明知道他能做出那种恶事，我为什么还非要试着说服他？那个人根本不讲道理。\n\n科斯莫科斯的地貌是我见过最美的，植物繁盛，千姿百态。它有一颗心。我真的觉得，它有我们当中那些有信仰的人所说的“灵魂”。船长居然有脸说，科斯莫科斯不知怎么骗了我。\n\n也许这些感受并不属于我。也许它们是科斯莫科斯强加给我的。\n\n可无论这份情感从何而来，我全心全意相信，科斯莫科斯是一颗会思考、有感情的卫星。这还不够不可思议吗？它难道不值得保护吗？\n\n如果没人肯，我就自己保护它。\n\n不惜一切。就算失败，最坏也只是被押回 March 接受正式审理。我掌握的知识太宝贵，他们舍不得。\n\n到时候，我就把重返这里当作自己的使命。如果他们真要对科斯莫科斯下手……我一定会让它恢复完整。\n\n坎宁安，通话完毕。
