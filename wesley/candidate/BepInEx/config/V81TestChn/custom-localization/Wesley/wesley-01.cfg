exact:I really am cursed to live out my days recording with subpar recording devices.\n\nThis is professor Harrington and I have found myself to be on Utril.\nThe days may be darker than the nights yet it has a strange sense of beauty.\nIt is not a place I ever expected to visit.\nThe wildlife is unlike the usual, not very diverse.\nGenerally consistent of spore lizards and arachnids.\nIt was surprising to learn that it wasn't the spiders that were the aggressive ones here.\nThey were much more keen on posing for a picture.\nEither way,\nI'm needed back in the labs.\nProfessor Harrington, over and out.=我真的被诅咒了，必须用质量不佳的录音设备来记录我的岁月。\n\n这里是哈林顿教授，我发现自己在尤特里尔上。\n白天可能比夜晚更黑暗，但却有一种奇特的美丽感。\n这不是我原本期望去的地方。\n这里的野生动物与平常的完全不同，种类并不丰富。\n通常都是孢子蜥蜴和蛛形纲动物。\n令人惊讶的是，这里并非蜘蛛才是具有攻击性的生物。\n它们更喜欢摆出姿势拍照。\n无论如何，\n我需要回到实验室去。\n哈林顿教授，通话结束。
exact:I remember that moment... clear as day.\nI was at work when I received a message from my wife Jane.'There's people in the house'.\nI told her to grab the gun from my desk and hide with the kids in the bedroom closet.\n'I am on my way' I said.\n\nWhile driving home I got a call from my nextdoor neighbor.\nShe said she heard screams and gunshots from our apartment.\nAnd that her husband called the police.\nI should have never gone home after I heard that...\n\nWhen I finally got home, I burst through the door and...\nI found her..\nOn the floor in the kitchen..\nShe had been shot multiple times and her body was partially flayed.\n\nAnd before I could even see what he did to my children, the cops ran in and I was arrested on the spot.\n\nBut as we drove away. I saw him I SAW HIM.\nHis crooked smile and those fiery eyes staring at me through the bushes, still covered in Jane's blood.\n\nI will never forget that face.=我记得那一刻...清晰如白昼。\n我在工作时收到了妻子简的消息。'家里有人'。\n我让她从我的桌子上拿起枪，和孩子们一起躲到卧室的衣柜里。\n'我马上就到'我说。\n\n在开车回家的路上，我接到了邻居的电话。\n她说她听到我们公寓里有尖叫声和枪声。\n而且她的丈夫已经报警了。\n听到这些后，我根本不应该回家...\n\n当我终于回到家时，我冲进门去...\n发现了她...\n她在厨房的地板上...\n她被多次枪击，身体部分被剥皮。\n\n在我还没来得及看到他对孩子们做了什么之前，警察就冲了进来，我当场被捕。\n\n但当我们开车离开时，我看到了他...我真的看到了他。\n他那扭曲的笑容和那双炽热的眼睛透过灌木丛盯着我，身上还沾着简的血。\n\n我永远忘不了那张脸。
exact:I sought to become all=我渴望成为全人
exact:I thought I would write about our findings.\nDuring the excavation we laid eyes upon an ancient golden mask.\nI bet this is worth millions considering where it came from!\n\nIt was perhaps used by the ancient people of this moon.\nNot quite sure what for however. I do feel it has a creepy look to it.\nMaybe my fellow archeologist Jack might have an idea.\nHere's a sketch:=我想我会写下我们的发现。\n在挖掘过程中，我们发现了面部的古代金面具。\n我相信，考虑到它的来源，这个东西的价值可能高达数百万！\n\n或许，这个星球上的古代居民曾经使用过这样的术语。\n但是,还不清楚为了什么。我确实觉得它看起来有点诡异\n也许我的考古学家杰克同学 可能有个主意\n这是一张草图:
exact:I understand that I am writing on an official document but I have overheard something I feel like I shouldn't have. However it seems important enough to have it written down for later.\nWhile I walked through the halls near the office secions. I heard a faint discussion through one of the closed doors.\nIt was the Emperor talking to his closest agent.\n\nWhile I do not exactly recall what was said, I do remember them discussing the case as it stands. Their strategy is unusual.\nThe agent seemed sceptical while the Emperor remained adamant. Understandibly so.\n\nApparently their next argument will be that biological weapons might come in use if, say, a swarm of unidentified lifeforms from beyond the known regions invade that of ours.\nNot impossible but certainly not plausible.\n\nI am going to try figuring out more about the Emperor's plans.=我明白自己正在撰写一份正式文件，但我听到了一些我不应该听到的消息。不过，这些消息似乎非常重要，有必要记录下来以备将来参考。\n当我在办公室附近的走廊里走动时，我听到一扇关闭的门后传来微弱的谈话声。\n那是皇帝正在与他的亲信特工交谈。\n\n虽然我不太记得他们具体说了什么，但我记得他们讨论了当前的情况。他们的策略很不寻常。\n特工似乎持怀疑态度，而皇帝则坚持自己的观点。这是可以理解的。\n\n显然，他们的下一个争论点将是：如果来自已知区域之外的未知生命体入侵我们的领地，生物武器可能会被使用。\n这并非不可能，但肯定不太可能实现。\n\n我打算尝试了解更多关于皇帝的计划。
exact:I wanted to give an update to my time here.\nThe cloning process is very complex but the technology is easy to produce.\nWhen they explained to me the current state of the project I was told that they had figured out how to grow a spore lizard from practically nothing to a fully functioning adult in the matter of days.\nHowever there was one fatal flaw.\nDue to GYN-H chemicals used in the process of speeding up the development of the creature, a unique form of cancer would grow in the brain which, after about a month would kill it.\nBut I think I came up with a solution, LYN-H is a very similar chemical to GYN-H, It's only down one component.\nI've theorised this could be the required change.\nProfessor Harrington, over and out.=我想向您汇报一下我在这里的情况。\n克隆过程非常复杂，但相关技术其实很容易实现。\n当他们向我解释项目的现状时，他们告诉我已经找到了一种方法，可以在短短几天内，从几乎没有任何东西开始，培育出一只功能完备的孢子蜥蜴。\n不过，存在一个致命的缺陷。\n因为在加速生物发育的过程中使用了GYN-H化学物质，会导致大脑中出现一种特殊的癌症，大约一个月后，这种癌症就会导致生物死亡。\n但我想我已经找到了解决方案。LYN-H是一种与GYN-H非常相似的化学物质，只是少了一个成分而已。\n我认为这就是我们需要进行的关键改变。\n哈林顿教授，以上便是我的汇报。
exact:I was there=我在那里
exact:I was uneased before, now I'm scared.\nI have seen some of the equipment scattered around the caverns. Abandoned by whomwever used to work here. Possibly left in an emergency I thought. But then I started seeing bones and bodies.\nThere were empty birdcages sitting on the floor about an hour back. My theory is that there might be something toxic in the air. Possibly some sort of gas leak. Suffocating everyone who was down here at the time. It could be in the air still.\nEither way, I need to make it quick. The rumbling is getting closer. And I do not entertain what that could mean.=我之前就感到不安，现在更是害怕了。\n我在洞穴里看到一些设备散落一地。不知道是谁留下的，可能是曾经在这里工作的人遗弃的。或许是在紧急情况下留下的。但后来我发现还有骨头和尸体。\n大约一小时前，地板上还放着一些空鸟笼。我觉得空气中可能有某种有毒物质，可能是某种气体泄漏，导致当时在这里的人窒息。现在空气中可能还残留着这种物质。\n不管怎样，我得赶紧行动。那种轰鸣声越来越近了。我不清楚那意味着什么。
exact:I woke up to screams of terror.\nThe city is sinking!\n\nAll is flooded we need to leave.\nOnly the bridge can save us!\n\n... The bridge is gone. No hope.\nI need to find a higher point.\nGoodbye=我醒来时听到恐怖的尖叫声。\n这座城市正在下沉！\n\n一切都被淹没，我们必须离开。\n只有桥梁能拯救我们！\n\n……桥梁已经消失了。没有希望了。\n我必须找到更高的地方。\n再见。
exact:I woke up to screams of terror.\nThe city is sinking!\n\nAll is flooded we need to leave.\nWill the bridge be gone?\n\nIt's gone! I need to find a higher point.\nGoodbye=我醒来时听到恐怖的尖叫声。\n城市正在下沉！\n\n一切都被淹没，我们必须离开。\n那座桥会消失吗？\n\n它已经消失了！我需要找到一个更高的地方。\n再见
exact:I woke up to screams of terror. But less than in my dreams.\nThe city is sinking! Again!\n\nSomething is wrong.. This is.. unnatrual.\nAll who died are gone this time.\nI saw a platform rise around 5pm.\nI need to find a higher point.\n That way I will survive.=我醒来时听到的是恐怖的尖叫声。但比梦境中的声音要小一些。\n这座城市正在下沉！又来了！\n\n有些事情不对劲……这太不自然了。\n这次死去的人都不见了。\n我在下午5点左右看到一个平台升起。\n我需要找到一个更高的地方。\n 那样我才能活下来。
exact:I'll never stop coming for you=我永远不会停止追你
exact:I'll take you with me...=我要带你一起走……
exact:I'm listening=我在听
exact:I've been here for 4 weeks. I've learned much.\nI have gotten used to the procedures and the protocols of this place.\nDespite what it might seem from the perspective of the workers below.\nBeing a guard here is a differnt kind of imprisoning.\nInstead of constant physical labour you're put through committing actions that'll break a man.\nWhile I don't share the same chains as those below.\nI feel just as shackled.\n\nHowever, I know my way to the upper layers.\nI have seen him. He takes two smoke breaks by the left most fire exit at the bottom. Usually around 11am and 7pm.\nThe only place that's not monitored here is a small storage closet near the stairs atop the upper floor.\nIf I can sneak in there. With the right timing...\nI can give him what he deserves.=我已经在这里待了4周。我学到了很多东西。\n我已经习惯了这里的程序和规定。\n尽管从下面的工作人员的角度来看，这似乎很平常。\n但在这里当守卫是一种不同的监禁方式。\n不是持续的身体劳动，而是要执行一些会让人身心俱疲的动作。\n虽然我没有和下面的人一样被束缚着，\n但我感觉自己同样被束缚着。\n\n不过，我知道如何到达上层。\n我见过他。他会在最左边的消防出口处休息两次，通常是在上午11点到下午7点之间。\n唯一不受监控的地方是上层楼梯附近的一个小储藏室。\n如果我能趁对的时间偷偷进入那里……\n我就能给他应得的惩罚。
exact:I've been here for six weeks now.\nThey told me there will be a retrial for my case!\nTHANK GOD!\nMaybe this time they will actually have a close look at all the evidence I've provided.\nThis also means I can FINALLY leave this place.\nEven if temporarily.\n\nWe're also slowly being moved to another prison I've heard.\nI really hope it's a little nicer because I am SICK of waking up to a swarm of rats running around our cells.\n\nThe activities here are horrible too.\nWe can't even work out since most of the equipment is either broken or extremely dirty.\n\nThey cleared out a couple cell blocks already.\nI think we might be next.\n\nThis does mean I'll have to leave my notes here.\nI don't think I can sneak those with me.\n\ni will find justice for you Jane.\nI loved you.=我已经在这里待了六周了。\n他们告诉我，我的案子将再次审理！\n感谢上帝！\n也许这次他们会认真审查我提供的所有证据。\n这也意味着我终于可以离开这个地方了。\n即使只是暂时离开。\n\n我还听说我们会被转移到另一座监狱里。\n我真心希望那里会好一些，因为我已经受够了每天醒来看到成群的老鼠在我们牢房里乱跑。\n\n这里的活动也很糟糕。\n我们甚至无法锻炼，因为大多数设备要么损坏，要么极其脏乱。\n\n他们已经清理了几个牢房区。\n我觉得我们可能会是下一个被清理的对象。\n\n这意味着我必须把我的笔记留在这里。\n我觉得自己无法偷偷把它们带走。\n\n我会为你讨回公道，简。\n我爱你。
exact:I, Michael Dunton hereby resign from my position on the council.\n\nI feel there are things at play that are bigger than they seem.\nWhile I am certain that I would not be believed if I brought this up myself, I have left my notes and recordings in my office.\n\nI do not wish to be part of what's happening or what's to come.\nStrange things are going on in this council, and in this case.\n\nDuring the 4th and previous conference it seems to me that all sense of logistics are thrown out the window.\nI will take my leave on the day of the 5th and final conference.\n\nIt is best to carry my words with heavy thought.\n\n-Michael Dunton=我，迈克尔·邓顿，特此辞去我在委员会中的职务。\n\n我觉得有些事情的影响比表面看起来要严重得多。\n虽然我确信如果我自己提出这件事，是不会被相信的，但我已经把我的笔记和录音留在了我的办公室里。\n\n我不想成为正在发生的事情或即将发生的事情的一部分。\n在这个委员会中，正在发生一些奇怪的事情。\n\n期间 4在我看来,在前几次会议上,所有后勤意识都被抛出窗外。\n我将在第5次也是最后一次会议当天离开。\n\n最好是在深思熟虑之后才说出我的话。\n\n——迈克尔·邓顿
exact:I.. I can't believe I actually did it. \nHis body flopped right onto the floor. \nI picked him up, now all covered in blood and I dumped him into one of those boxes.\nI wasn't quite sure what to do next so I closed it and pushed it into a giant pool of toxic waste.\nIn hindsight he might've still been alive.\nNot that it matters now..\nMy geiger counter reads dangerous levels now.\nI need to burn my stuff and leave before the radiation kills me..\nBye Bye Aaron.=I.. . .真不敢相信我居然这么做了 \n他的尸体被击倒在地上。 \n我把他抱了起来，现在他全身都是血，我把他扔进了那个箱子里。\n我不太确定接下来该做什么，于是就把它关上，然后扔进了一个巨大的有毒废物池里。\n回顾起来，他或许至今仍活着。\n现在不重要了...\n我的盖格计数器现在显示了危险水平。\n我需要烧掉我的东西，然后在辐射杀死我之前离开……\n再见,亚伦。
exact:ICE LEVIATHAN\r\n\r\nSigurd's danger level: ??? idk I have n veer seen tehm\r\n\r\nScientific name: Iciteren-gigantis\r\n\r\nThe Ice leviathan, being part of the family Piscicolidae is, similarly to the Earth leviathan among the largest invertebrates in the Thistle Nebula. While there have been equally little recorded captures of this creature, there have been a lot of discoveries made since the expedition in the glacial caves of 94-Polarus, which they have made their home.\r\n\r\nWhile it is often assumed that these leviathans primarily hunt land-dwelling prey due to their occasional appearances above the earth. It is quite the opposite.\r\nTheir jaws do not have any teeth but instead have baleen which they use to filter out nutrients from vast frozen oceans.\r\nIt is only in desperate times when they resort to hunting for prey on land. However they might also appear when their breeding grounds are threatened. Be wary of sudden vibrations as you might not immediately realise you are walking above one.\r\n\r\nIce leviathans primarily burrow themselves within deep sheets of ice, carving out large sections creating these ginormous unnatural caverns as resting and breeding places in between feeding sessions. Using their extremely hard and thick skin to break through the ice. \r\nThey have to move often due to the nutrient supply not replenishing quick enough to sustain the leviathan.\r\nAn ice leviathan will only ever make one breeding cavern in their lifetime, it is often much larger than resting caverns and it is always the place they return to when mortally wounded, or when they are approaching the final months of their life. They will stay there until death occurs. It is not known why. The common theory is that Ice Leviathans share a sentimental value with the area where they birthed their young.=利比里亚\r\n\r\n西格德的危险等级：？？？我不知道，我从未见过他们。\r\n\r\n科学名称: Iciteren-gigantis\r\n\r\n冰生巨兽属于鱼虫科，与地球上的冰生巨兽一样，是蓟花星云中最大的无脊椎动物之一。虽然对这种生物的捕获记录同样很少，但自 94-波拉鲁斯冰川洞穴的探险以来，人们已经发现了许多这种生物。\r\n\r\n虽然人们常常认为,这些利维坦人主要猎取土地栖息的猎物,因为他们偶尔出现在地球之上。恰恰相反。\r\n它们的颌部没有牙齿，而是有鲸须，可以利用鲸须从广阔的冰封海洋中过滤出营养物质。\r\n只有在极端困难的情况下，它们才会转向在陆地上寻找猎物。不过，当它们的栖息地受到威胁时，它们也可能出现这种情况。要注意突然的震动，因为你可能不会立刻意识到自己正走在某个震动源之上。\r\n\r\n冰利维坦人主要埋在深厚的冰层中, 形成大量的裂缝, 形成这些巨大的非自然洞穴,用他们极其坚硬和厚厚的皮肤 打破冰层 \r\n由于营养供应无法迅速补充，以维持这种庞然大物的生存，它们不得不频繁移动。\r\n冰 Leviathan 一生只会建造一个繁殖洞穴，这个洞穴通常比休息洞穴要大得多。当它们受到致命伤害，或者接近生命的最后阶段时，总会回到这个地方。它们会一直待在那里直到死亡。目前尚不清楚原因。常见的理论认为，冰 Leviathan 与其孕育幼崽的地方有着情感上的联系。
