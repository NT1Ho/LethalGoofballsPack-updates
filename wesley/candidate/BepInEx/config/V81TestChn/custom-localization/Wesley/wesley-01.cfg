exact:He. Is. Watching.\nHe has his eye.. directly.. upon you.\nYou disturbed his temple.. and he is angry.\n\nI have been trying to rid this universe of this being for longer than you can imagine.\n\nThe things you see.. \nThey aren't real, ignore them.\nHe is trying to melt your mind.\n\nI can help you, if you help me.\n\nBring these seeds to their designated celestial bodies.\nIt will distract him for long enough.\n\nOnce that's done.. return..\nAnd I will make my move.\n\nSometimes a sacrifice is needed.. to banish evil.. for good.=他正在观看。\n他盯紧了你。\n你打扰了他的神殿……所以他很生气。\n\n我试图清除这个宇宙中的这个存在，这一努力已经持续了比你想象的还要久的时间。\n\n你看到的东西... \n他们不是真的,不理他们。\n他试图让你失去理智。\n\n如果你愿意帮助我，我也可以帮助你。\n\n将这些种子带到它们指定的天体上。\n这会让他分心足够长的时间。\n\n完成上述操作后，请返回。\n我会采取行动。\n\n有时需要做出牺牲……来驱逐邪恶……为了带来好处。
