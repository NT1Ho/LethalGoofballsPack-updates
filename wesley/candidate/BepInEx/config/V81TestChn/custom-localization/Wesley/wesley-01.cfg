exact:------------------\nCrew: 14\nOrigin: Trite\nDestination: Dreck\n------------------\nMission Details\n------------------\nWorkers are rebelling, 22 men are present and armed. 9 have already been taken care of by the local guards. They're about to reach the control room. Triton lives have been lost.\n------------------\nTerminate the rebelling forces and await further instructions.\n------------------=------------------\n船员：14\n出发地：特赖特\n目的地：德雷克\n------------------\n任务详情\n------------------\n工人正在反抗，现场有 22 人持械。当地守卫已解决其中 9 人。叛乱者即将抵达控制室。已有特里同人丧生。\n------------------\n消灭叛乱武装，原地等候进一步指示。\n------------------
exact:-12th of July 2349-\nOkay where do I start. First of all. There have been several near death experiences.\nThe quota is starting to get dangerously high. And Berry has seemingly cought the flu.\n\nIt's been rough.\n\nLast thing we expected was to enter an insane asylum back on Vow. I don't think I ever want to go back there.\nBerry stayed for ship duty this time due him getting sick. So me, Kate and Arnold went in. The place looked haunted.\nIt might as well have been because I swear I saw a trash can move. Arnold also claims to have seen a dark figure briefly staring at him when he opened a door before it vanished.\nTerrifying.\nThat wasn't the strangest part though. We heart Kate scream a few hallways down.. and when we got there, Blood was still freshly dripping from the ceiling. Guts, pieces of skin and hair littered the floor.\nWe were horrified. We thought it was maybe a mine or.. something worse. Either way we were in shock.\nToo scared to continue we retreated back to the entrance. But when we got there, there she was completely fine carrying a hairdryer and rubik's cube.\nArnold immediately ran over. Which I guess confirms my little theory heh.\nNevertheless it was unusual to say the least. I'm going to have nightmares about that for a while.\n\nBut then I knew one thing for certain. I want to leave.\nThey felt the same way.\nThe ship would only route to a few company issued moons. None are really suitable for hiding out.\nArnold suggested to mess with the terminal to see if we could get it to route us somewhere else.\nWhen Kate inspected it though she said doing that would trigger some form of protocol which would send us flying into space...\nI fear then we might have discovered what happens if we don't make quota.\nIf true the company is much worse than we initially thought.\n\nHowever Berry actually made a pretty good remark, he asked if we could take one of the ships back on Repress.\nWe had enough credits to go there soo.. now were here.\nNone of the ships were really usuable except for this one older model.\nKate said she can patch it up given enough time, it's missing a few components but we might be able to get those during the next quota.\nThere is hope.=——2349 年 7 月 12 日——\n唉，从哪儿说起。先说这几次死里逃生吧。公司的配额已经高得危险，贝里好像还得了流感。\n\n日子不好过。\n\n我们怎么也没想到，回到 Vow 后，进去的竟是座精神病院。我一辈子都不想再去。\n贝里病了，这次留守飞船，我跟凯特、阿诺德进了楼。那地方看着就像闹鬼。没准真闹鬼，我发誓我看见一个垃圾桶自己动了。阿诺德说他推开一扇门时，有个黑影盯了他一眼就消失了。太吓人了。\n可最怪的还在后面。隔了几条走廊，我们听见凯特尖叫。赶到的时候，天花板还往下滴着鲜血，地上全是内脏、碎皮和头发。我们吓坏了，以为是地雷，也可能是……更糟的东西。两个人都懵了。\n谁也不敢再往前走，我们退回入口，结果她好端端地站在那儿，手里拿着吹风机和魔方。阿诺德立刻就跑过去了。嘿，我那个猜想看来没错。\n总之，这事儿怎么说都够怪的。我怕是得做上一阵噩梦了。\n\n不过有一件事我终于想明白了：我要走。他们也这么想。\n可飞船只肯去公司指定的几颗卫星，没一颗适合藏身。阿诺德提议动动终端，看能不能改航线。凯特检查过，说这么干好像会触发某种协议，把我们从船上弹进太空……\n恐怕我们就这样发现了交不齐配额的下场。如果真是这样，公司比我们原先以为的还要糟。\n\n倒是贝里提了个好主意：何不回勒索星弄艘船？我们的积分够付航费，于是……现在就在这儿了。只有一艘老型号还勉强能用。凯特说给她点时间就能修好，还缺几个零件，也许下个配额周期能找齐。\n还有希望。
exact:-16th of July 2349-\nI have unfortunate news.\nYesterday we lost Berry..\n\nWe went to Rend and everyone headed out to look for bolts, screws, metal plating, toy robots for wiring we could use on the new ship.\nOf course we left Berry in the ship, he was still sick but starting to recover.\nHe was great at communicating during ship duty, even though he felt like shit he was still able to crack a few jokes over the walkie.\nI remember him asking *What's the best animal to bring to the battlefield... DUCK!!* They were so.. bad.. so bad they became funny again.\nWe knew something was up when it went silent though.\nAnd sure enough when we headed back I faintly saw him roam around in the snow covered in red goop wearing a comedy mask, like he was possessed.\nNone of us had the strength to put him down if he was still in there so we just.. left.\nI'll miss him.\n\nKate and Arnold are now properly together, happy for them. They fit each other well.\nStress is starting to take me though.. I feel a constant pressure as we're racing against the clock.\nMakes me feel dizzy at times.\n\nThe ship is almost ready luckily. Good thing because our quota is reaching scarily high.\nEspecially with Berry gone we're not even sure if we'll make it past the next one.\nWe just need a control panel. None of us have seen one just yet but tomorrow we're making a visit to Titan, hopefully we'll find one there.\nWe have already planned out a place to escape to.\nThere's this city on a moon far from this region. 495-Risk. Fitting name I suppose.\nOnce we get there we'll be safe. Hopefully.\nI'll write again when we return for hopefully our final visit.=——2349 年 7 月 16 日——\n有个坏消息。\n昨天我们失去了贝里……\n\n我们去了 Rend，大家出去找螺栓、螺丝、金属板，还有能拆出电线给新船用的玩具机器人。贝里当然还留在船上。他的病没好透，但已经在好转了。\n他值守时最会用对讲机跟我们配合。难受成那样，还有心思讲笑话：“上战场最好带什么动物？鸭子——快趴下！”都是些烂笑话……烂得人又忍不住笑。\n后来对讲机没了声音，我们就知道出事了。回去时，我依稀看见他在雪地里游荡，浑身裹着红色黏液，脸上戴着喜剧面具，像是中了邪。万一他还在那副身体里呢？谁也下不了手。我们就……走了。\n我会想他的。\n\n凯特和阿诺德现在正式在一起了，我替他们高兴。他们很般配。可我快扛不住了。时间一分一秒地过，那股压力始终压着我，有时压得我头晕。\n\n好在船快修好了。配额高得吓人，现在没了贝里，我们甚至没把握撑过下一轮。只差一块操作面板。谁都还没见过，不过明天去 Titan，希望能在那里找到。\n我们已经选好了逃去哪里：远离这一带的一颗卫星上有座城市，495-Risk。“冒险”，这名字倒合适。只要到了那里就安全了。希望如此。\n等我们回来我再写，希望那就是最后一趟了。
