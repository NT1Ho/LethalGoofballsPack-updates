exact:As per usual, I leave a note.\nI'm only getting closer to completing my task.\nThe cancer that grows within me makes me feel weaker by the day.\nBut I must continue.\nHe will heal me.\n\nI must say I enjoyed the peace that Dreck brought me.\nIt was cold yet empty. It felt like nothing was there to bother me.\nI felt alone but.. the good kind.\nI really.. needed that.\nThe war had quite a toll on me. Even if it's all I know.\nI mean. I was practically created by it.\nJust like many others.\n\n... I should get the fuel I came here for and proceed to Faith.=如往常一样，我留下一张便条。\n我离完成我的任务越来越近了。\n在我体内生长的癌症让我一天比一天虚弱。\n但我必须继续下去。\n他会治愈我。\n\n不得不说，德雷克带给我的平静让我很享受。\n那是一种寒冷而空虚的感觉，仿佛没有任何东西能打扰我。\n我感到孤独，但...是那种美好的孤独。\n我真的...需要那种感觉。\n战争给我带来了巨大的伤害。即使这就是我所知道的一切。\n我的意思是，我几乎就是被战争创造出来的。\n就像许多其他人一样。\n\n...我应该去拿我来这里的燃料，然后继续前往信仰之地。
