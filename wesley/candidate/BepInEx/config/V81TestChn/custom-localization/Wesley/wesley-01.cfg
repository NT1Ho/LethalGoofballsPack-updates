exact:Day 289 - Golden Dagger - Origin: Junic\n\nExperiment-1: Possession\nThe subject was given the dagger and left alone in a room. The subject would not let go of the dagger.\nAfter 15.1 hours the subject started chanting strange words. The subject attempted to murder another employee, during with the subject was executed. The employee fell victim to crossfire.\n\nExperiment-2: Grouping\nThe subject was given the dagger and placed in a room with 3 more subjects. The other subjects attempted to carry the dagger but were unable to.\nAfter 27.4 hours the subject started to chant strange words again. The subject covered their face with their hand and decapitated another subject using the dagger before violently ripping out their organs and drawing a strange symbol on the floor. All surviving subjects except for the wielder were removed from the room. After 34.44 minutes of the subject searching for other subjects, the subject stabbed itself through the mouth upwards into the brain using the dagger.\n\nConclusion: Not Weaponisable=第 289 天｜黄金匕首｜来源：朱尼克\n\n实验 1：持有\n将匕首交给受试者，让其独处一室。受试者始终不肯松手。15.1 小时后，受试者开始念诵奇怪的词句，随后试图杀死一名员工。处决受试者时，该员工也在交火中身亡。\n\n实验 2：多人同处\n将匕首交给一名受试者，让其与另外 3 名受试者共处一室。其余人尝试拿起匕首，均未成功。27.4 小时后，持刀者再次开始念诵奇怪的词句。其用手遮住自己的脸，以匕首斩下一名受试者的头，猛烈扯出其内脏，在地板上画出一个奇怪的符号。随后，除持刀者外，所有幸存者均被带离房间。持刀者搜寻他人 34.44 分钟后，把匕首从自己口中向上刺入大脑。\n\n结论：不可用作武器。
exact:Day 374 - Hyper Acid - Origin: Acidir\n\nExperiment-1: Touch\nThe subject's finger was unharmed.\n\nExperiment-2: Spray\nThe subject experienced discomfort but remained healthy.\n\nExperiment-3: Ingest\nThe subject felt slight burning of the throat but remained healthy.\n\nExperiment-4: Dousing\nThe subject lived for a total of 4.68 seconds after being fully drenched. The flesh was fully melted in 8.49 seconds once the subject was fully covered.\nOnly few bones remained.\n\nConclusion: Weaponisable=第 374 天｜强酸｜来源：阿西迪尔\n\n实验 1：触碰\n受试者手指未受损伤。\n\n实验 2：喷洒\n受试者感到不适，健康状况良好。\n\n实验 3：吞服\n受试者喉咙有轻微灼烧感，健康状况良好。\n\n实验 4：浇淋\n全身被酸液浸透后，受试者存活了 4.68 秒。从浸透算起，8.49 秒后血肉完全溶解。\n仅余几块骨头。\n\n结论：可用作武器。
exact:Day 387 - Comedy Mask - Origin: Etern\n\nExperiment-1: Presence\nThe subject was put in a room with a mask for 7.8 hours. The subject claimed to have heard laughs. No further effects noted.\n\nExperiment-2: Wearing\nThe subject entered a zombie like state within 28.78 seconds. The subject was executed.\n\nExperiment-3: Conversion\nTwo subjects were put in a room, one of which converted. The living subject was immedietely attacked and converted. Both were executed.\n\nNOTE\nA secret log was recovered from a body on Etern. It was put into storage area D.\n\nConclusion: Weaponisable=第 387 天｜喜剧面具｜来源：埃特恩\n\n实验 1：共处\n让受试者与一副面具共处一室 7.8 小时。受试者声称听到了笑声。未观察到其他影响。\n\n实验 2：佩戴\n受试者在 28.78 秒内进入类似行尸的状态。已处决。\n\n实验 3：转化\n两名受试者共处一室，其中一人已被转化。活着的受试者立即遭到攻击并被转化。两人均已处决。\n\n注意\n从埃特恩的一具尸体上取回一份秘密日志，现存放于 D 仓储区。\n\n结论：可用作武器。
exact:Day 394 - Cursed Coin - Origin: Polarus\n\nExperiment-1: Proximity\nThe subject was given the coin. It took 6 hours for the subject to enter insanity. The subject claimed to see a ghostly figure.\nPossible schizophrenia.\n\nNOTE\nSeveral employees died with similar symtoms. Every employee who claimed to see a ghost has died.\n\nAny further experiments with this item are prohibited!\n\nConclusion: Not Weaponisable=第 394 天｜诅咒硬币｜来源：波拉鲁斯\n\n实验 1：近距离接触\n将硬币交给受试者。6 小时后，受试者精神失常，自称看到了一个幽灵般的人影。\n疑似精神分裂症。\n\n注意\n数名员工出现相似症状后死亡。所有声称见过幽灵的员工均已死亡。\n\n严禁再用此物进行任何实验！\n\n结论：不可用作武器。
exact:Day 402 - BIO HXNV7 - Origin: Cosmocos\n\nExperiment-1: Touch\nUpon touch the subject became very agressive and seemed to slightly deform. The subject was executed before further experiments could be done.\n\nExperiment-2: Isolation\nThe subject was infected with BIO HXNV7 and put into a room. It took 12.24 seconds for the subject to become agressive. It took 15.48 seconds for the subject to deform. The subject's flesh seemed to merge with the walls it touched. Turning into a concrete statue while completely consious. It took 4.23 minutes for the subject to lose thought. At 4.44 minutes the subject was a concrete statue.\n\nNOTE\nBIO HXNV7 OUTBREAK! SEVERAL INFECTED.\nSTARTING SECTOR WIDE DECONTAMINATION.\nDECONTAMINATION LEVEL 5: INCINERATION.\n\nSEVERAL STILL INFECTED, FEW FULLY TRANSFORMED.\nDON'T LOOK AWAY!\nFACILITY WIDE DECONTAMINATION IMMINENT.\nGOODBYE.\n\nConclusion: Highly Weaponisable=第 402 天｜BIO HXNV7｜来源：科斯莫科斯\n\n实验 1：触碰\n接触后，受试者立即表现出强烈攻击性，身体似有轻微变形。尚未来得及进一步实验，受试者便已被处决。\n\n实验 2：隔离\n使受试者感染 BIO HXNV7 后将其置入房间。12.24 秒时出现攻击行为，15.48 秒时身体变形。受试者的肉体似乎与触碰到的墙壁融合，在意识完全清醒的情况下逐渐变成一尊混凝土雕像。4.23 分钟时丧失思考能力；4.44 分钟时已完全化作混凝土像。\n\n注意\nBIO HXNV7 暴发！多人感染。\n正在启动全区净化。\n净化等级 5：焚烧。\n\n仍有多人处于感染状态，少数已完全转化。\n别移开视线！\n即将启动全设施净化。\n再见。\n\n结论：极具武器化潜力。
exact:Day 79\nOur team has gone mad. Ever since the flash, our technology seems to be malfunctioning.\nIt is unlikely that we’ll be able to leave anytime soon.\nDay 80\nA few on the team say they are experiencing disorientation and dizziness. Unsure as to why but it appears to be a common factor. I wonder if we’ve been hit with a large surge of radiation. We best figure out what’s wrong with the equipment so we can do a proper evaluation.\nDay 81\nThree of us stumbled into the forest, they said, “the forest is calling to us”. If it weren’t for the fact that we need all hands on deck I would let them get lost. I’ve sent two more of us out to go and look for them.\nDay 82\nNobody turned up, not the three who went missing nor the ones I sent out to find them. Fantastic. Now I am starting to sense it too. Slightly disoriented and there’s this strange feel to my skin.\nI’ve told the rest of the team to keep working on getting the equipment fixed up. I’m heading out to the third facility. It’s not too distant. About 12000 meters north-east from here.\nPerhaps they have answers there.\nDay 83\nMy skin feels strange. My back hurts. It feels like something’s crawling under my shoulderblades. The path seems different from what we mapped out. I dare say I am lost.\nRunning out of ink too.\nDay 84\nEverything hurts. My legs below my knees are shrinking. It’s getting hard to walk. My skin has turned purple and thick. There’s something sticking out my back. Something cursed me, something cursed all of us. I don’t believe I’ll be here for much longer. There’s something very wrong here.\nI think I’ll just sit by this tree. I’ll write more tomorrow.=第 79 天\n我们的人都疯了。那道闪光之后，设备也开始失灵了。\n恐怕短时间内走不了。\n第 80 天\n几名队员说他们头晕，分不清方向。原因不明，但症状很相似。我怀疑我们遭遇了强烈的辐射。得先找出设备的故障，才能好好检查一番。\n第 81 天\n有三个人踉踉跄跄走进树林，说“森林在召唤我们”。要不是急需人手，我真想任由他们迷路。我又派了两个人去找。\n第 82 天\n三名失踪者、两名搜寻者，一个都没回来。好极了。现在连我也感觉到了：有点晕，皮肤的感觉也很奇怪。\n我让剩下的队员继续修设备，自己动身去第三座设施。那里不算太远，就在东北方，大约 12000 米。\n也许那里能找到答案。\n第 83 天\n皮肤感觉不对劲，背也疼，像是有什么在肩胛骨底下爬。这条路和地图上不一样。我想，我迷路了。\n墨水也快用完了。\n第 84 天\n我浑身都疼。膝盖以下的腿正在萎缩，走路越来越难。皮肤变紫，也变厚了。背上有什么东西凸了出来。有什么诅咒了我，诅咒了我们所有人。我大概撑不了多久。这里一定出了大问题。\n我想就在这棵树旁坐一会儿。明天再写。
