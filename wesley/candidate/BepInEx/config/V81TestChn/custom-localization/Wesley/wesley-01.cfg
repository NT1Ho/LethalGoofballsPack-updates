exact:He didn't die.. He DIDN'T DIE!!\nAt least I don't think he did.. I saw that box.\nIt was walking..\nIt was stalking me with his corpse still inside it.\nIt can't be possible.\nThere wasn't even machinery inside it.\nNot much at least.\n\nAfter a few minutes it stopped and started cranking itself..\nI ran away.\n\nI am hiding, not sure what to do now.\n\nSOMETHING IS COMING! \nI HEAR SCREAMS! \nI AM SO SOR-=他没有死……他真的没有死！！\n至少我不这么认为……我看到了那个盒子。\n它在移动……\n它带着里面的尸体跟踪着我。\n这不可能吧。\n里面甚至没有机械装置。\n至少没有什么可以移动的部件。\n\n几分钟后，它停止了，然后开始自行运转……\n我逃跑了。\n\n我现在在躲藏，不知道该怎么办。\n\n有东西要来了！ \n我听到尖叫声了！ \n我好害怕……
