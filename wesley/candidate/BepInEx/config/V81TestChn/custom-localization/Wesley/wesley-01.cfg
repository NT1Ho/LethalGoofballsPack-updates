exact:Diary entry 847.\n\nNothing quite remarkable today.\n\n10:30 I woke up and per usual I brushed my teeth, did my hair, changed my clothes and went out for breakfast with the family in the grand hall. Had a laugh with my dad and went back home.\n\n11:40 The cleaners knocked apparently, they should know to use the light by now. How many times would it take for them to remember I can’t hear the knocking.\n\n13:30 We are back out to get lunch. I’ve been practicing art in the meantime. My parents are keen on letting me know it’s a worthless skill to have. They are no fun.\n\n14:05 When we got home the neighbor passed by to update us on the state of the Emperor. He hasn’t been seen for weeks. Granted he’s not likely to leave his palace but he hasn’t been spotted in the windows either.\n\n16:40 I’ve stayed home. There is not much out there to do. My parents went with the neighbor.\n\n18:30 We had dinner in the grand hall. Apparently the Emperor’s absence is a common topic at the moment. I am starting to worry myself if I’m quite honest.\n\n22:10 Watched a scary show with my parents. It’s difficult to understand what’s happening at times but that doesn’t make it less scary. They seemed to enjoy it at least.\n\n\nDiary entry 848.\n\nStrange occurrence on an otherwise regular day.\n\n10:30 I woke up, brushed my teeth, did my hair and went with a slightly different style than usual, hoping someone would notice. I changed clothes and went out for breakfast with the family in the grand hall.\n\n11:30 Yesterday I missed them so today I left the door open so I can see the cleaners arrive when they come and I won’t have to rely on my very functional hearing.\n\n13:30 Lunch time, I’ve worked some more on my art while I waited for time to pass.\n\n15:20 My parents came home for a bit and allowed me to have some sweets. Surprisingly they actually stayed with me until dinner time.\n\n18:30 We went back to the grand hall for dinner. The emperor has not been seen yet. Maybe he’s resting. I’m sure it’s not easy to oversee an entire system.\n\n22:10 That same show as yesterday came on so we watched it together. However in the middle it was interrupted by an emergency broadcast. There wasn’t any imagery nor any subtitles so I’ve no idea what was said. Whatever it was, it seemed to upset my parents, they looked concerned yet.. Relieved. It’s hard to describe. They quickly send me to bed.\n\nI’m sure they’ll tell me what that was tomorrow.\n\n\nDiary entry 849.\nThis isn’t real. I am fairly certain this is a horrible nightmare.\nI will try to write what I saw. I’m fearful.\n\n10:30 I woke up to a cold breeze. I walked over to brush my teeth, make up my hair and change clothes. I found it strange that I couldn’t feel my parents walk around, for a moment I assumed they were off to a neighbor again. Until I stepped out of my room.\n\nThey were there, by the window, hanging from the ceiling. There was an empty noose next to them.\nI haven’t looked at them since.\n12:00 I’ve been sobbing and crying. It’s not just my parents. I haven’t found a single living person. I think it’s everyone.\nI’ve looked out the window in the hallway. And I see more people hanging in the distance.\nI don’t believe this is real.\n\n13:40 I went to an empty apartment on the top floor. I don’t have to see anyone here. I don’t want to see anyone else.\n\n14:44 I felt the emergency bells ringing, it was a deep rumble to my skin which I’ve only felt during tests, I stepped out on the balcony to see what was going on, hoping there would be an answer but there he was. The Emperor. And at least a hundred noblemen all slowly marching out the palace. I screamed hoping for something to happen. Nothing. They kept walking. Nobody even bat an eye. I thought the Emperor would save us. Just like he had done with so many before us. I screamed and begged.\nIt’s hard to write while I’m shaking.\nHe stopped moving in the middle of the plaza. I thought he finally heard my screams but he kneeled and looked up. His mouth moved but it was too far for me to read what he said before he burst into this red mass. I couldn’t move. My body forced me to watch as he erupted into a swarm of tendrils reaching for the ground while he grew into something horrific. The noblemen kept walking and collapsed into him, vanishing into the mass. Last thing I saw before could take control and run was the red mass growing and pulsating.\n\n16:12 I haven't quite calmed down but I’ve at least managed to calm my breathing. This doesn’t feel real. \nI don’t understand what is happening. Or if it even is. The Emperor would never let this happen. This would never happen.\nWe’ve always been happy. I feel dizzy. There is a hole in my mind I cannot fill. It doesn’t make sense. Was it yesterday’s broadcast? What was even said? I wish I could fucking hear.\nIt’s cold here.\nThis must be a nightmare. It’s the only thing that makes sense. I know what they’re like, they’re just like this. They can be the worst reality while feeling completely real. \nThis is the worst reality.\nMy parents would never leave me like this, I know they wouldn’t. And the Emperor, it cannot be real. That must be it. I need to wake up.\nI have to wake up. I have to see mom and dad.=日记条目847。\n\n今天没什么特别的事情发生。\n\n10:30 我醒来后，像往常一样刷牙、梳头发、换衣服，然后和家人一起去大厅吃早餐。和爸爸一起笑了一会儿，之后就回家了。\n\n11:40 清洁人员似乎来过，他们应该知道要使用灯光。他们要记住多少次才能忘记我听不见敲门声呢？\n\n13:30 我们又出去吃午饭了。与此同时，我一直在练习艺术。父母并不喜欢我从事这种毫无价值的技能，他们真让人头疼。\n\n14:05 回到家后，邻居过来告诉我们关于皇帝的情况。他已经好几个星期没被人看到了。虽然他不太可能离开他的宫殿，但也没有人在窗户那里看到他。\n\n16:40 我待在家里。外面没什么事情可做。父母和邻居一起去了。\n\n18:30 我们在大厅吃了晚饭。显然，皇帝的失踪是当前的热门话题。说实话，我开始担心起来。\n\n22:10 和父母一起看了一个恐怖的节目。有时候很难理解节目里发生了什么，但这并不妨碍它看起来很可怕。至少他们似乎很喜欢。\n\n\n日记条目848。\n\n平常的一天却发生了奇怪的事情。\n\n10:30 我醒来后，刷牙、梳头发，然后以一种与平时不同的方式出门，希望有人能注意到。我换好衣服，然后和家人一起去大厅吃早餐。\n\n11:30 昨天我错过了他们，所以今天我把门开着，这样清洁人员来的时候就能看到，而不需要依赖我的听力了。\n\n13:30 到了午餐时间，我在等待时间流逝的同时，继续练习艺术。\n\n15:20 父母回家了一会儿，允许我吃点甜食。令人惊讶的是，他们一直陪着我直到晚餐时间。\n\n18:30 我们回到大厅吃晚饭。皇帝仍然没有被人看到。也许他正在休息。我相信管理整个系统并不容易。\n\n22:10 和昨天一样，节目开始了，我们一起观看。然而在中间，节目被紧急广播中断了。没有画面也没有字幕，所以我不知道说了什么。不管是什么，似乎让父母很不安，他们看起来很担心，但……又松了一口气。很难描述。他们很快让我上床睡觉了。\n\n我相信明天他们会告诉我那是什么。\n\n\n日记条目849。\n这不是真的。我确信这是一场可怕的噩梦。\n我会试着写下我所看到的。我很害怕。\n\n10:30 我醒来时，一阵冷风拂过。我走到窗边刷牙、化妆、换衣服。奇怪的是，我感觉不到父母在房间里走动，有那么一瞬间，我以为他们又去邻居家了。直到我走出房间。\n\n他们就在那里，站在窗边，悬挂在天花板上。旁边有一个空着的绞索。\n从那以后，我就再也没有看过它们了。\n12:00 我一直在哭泣。不只是我的父母。我找不到一个活人。我想每个人都是这样。\n我透过走廊的窗户看外面，看到更远的地方还有更多的人被悬挂着。\n我不相信这是真的。\n\n13:40 我去了顶层的一个空公寓。这里不需要见任何人。我不想见到其他人。\n\n14:44 我感觉到紧急铃声在响，那是一种只有在我做测试时才会感受到的沉闷震动。我走到阳台上，想看看发生了什么，希望会有答案，但皇帝就在那里。至少有上百名贵族正慢慢地走出宫殿。我尖叫着，希望会发生什么。什么也没有。他们继续走着，甚至没有看我一眼。我以为皇帝会拯救我们。就像他以前拯救过许多人一样。我尖叫着，恳求着。\n在我颤抖的时候，很难写字。\n他在广场中央停了下来。我以为他终于听到了我的尖叫，但他跪下来抬头看着我。他的嘴巴动了，但距离太远，我无法读到他说了什么，然后他就变成了这个红色的东西。我无法动弹。我的身体迫使我看着他变成了一群向地面伸出的触手，然后他变成了一个可怕的东西。贵族们继续走着，然后消失在那个红色的东西中。最后我看到的是那个红色的东西正在生长并跳动。\n\n16:12 我还没有完全平静下来，但至少我能够控制自己的呼吸。这感觉不真实。 \n我不明白发生了什么。或者这是不是真的。皇帝永远不会让这种事情发生。这永远不会发生。\n我们一直都很幸福。我感到头晕。我的脑海里有一个无法填补的空洞。这毫无道理。是昨天的广播吗？到底说了什么？我希望我能听到。\n这里很冷。\n这一定是一场噩梦。这是唯一合理的解释。我知道他们是什么样的人，他们就是这样的。他们可以是最糟糕的现实，但感觉却完全真实。 \n这是最糟糕的现实。\n我的父母永远不会这样离开我，我知道他们不会。而皇帝，这不可能是真的。一定是这样。我必须醒来。\n我必须醒来。我必须见到爸爸妈妈。
