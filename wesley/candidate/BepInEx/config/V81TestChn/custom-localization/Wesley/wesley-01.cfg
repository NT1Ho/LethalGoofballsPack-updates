exact:-42 Hyx\n----------------------\n\nPOPULATION: Assimilated.\n\nCONDITIONS: Landscape overtaken by an unknown mass.\n\nFAUNA: A cosmic entity of unknown origin is present.=-42 希克斯（Hyx）\n----------------------\n\n居民：已被同化\n环境：地表已被不明物质覆盖。\n动物：存在一个来历不明的宇宙实体。
exact:-9th of July 2349-\nI found a couple floppy discs in a cabinet somewhere in the building.\nAllows me to put down my thoughts using the big computer in the hangar.\n\nFirst I'll introduce myself, hi, I'm Dan. It's been 7 days since I started working for the company.\nLucky for me I was greeted by a set of kind faces. They sort of explained to me how things work around here.\nWe're a crew of 4, there's Berry, he's pretty funny and good at keeping our spirits up. Then there's Kate who has been here the longest, used to be a mechanic for a failed business.\nAnd there's Arnold. Big guy, pretty smart as well, we call him engine man cause he's always the one carrying the engines hehe.\n(I'm also fairly certain Kate and Arnold have a thing for each other)\nDon't tell them I wrote that, they'll kill me\n\nIt's been rough. We've been going from building to building day by day delivering all our Junk to the company building.\nCan't say I'm quite fond of the place. The company desk reeks, it's nasty. And not only that but the building itself is quite imposing.\nI don't understand why but it feels like it wants to crush me like I'm an ant in the kitchen.\n\nSame with this place, though I feel a bit more safe here, its less menacing. Less like I'm being watched constantly.\nI'm not the only one who feels that way.\nArnold hates the company building too. He's always said there's something off about it.\nMaybe he's on to something.\n\nEither way Kate just radioed in that it's getting late. I better get going.\nI'll write more when I can.=——2349 年 7 月 9 日——\n我在楼里的一个柜子里找到了几张软盘。这下可以用机库的大电脑记点心事了。\n\n先自我介绍。嗨，我叫丹，来公司上班已经 7 天了。运气不错，迎接我的是一群友善的人，大致教会了我这里的规矩。\n我们这组有 4 个人。贝里很逗，总能让大伙儿打起精神。凯特来得最早，以前在一家倒闭的公司当机械师。还有阿诺德，块头大，脑子也好使。我们管他叫“发动机男”，因为每次扛发动机的都是他，嘿嘿。\n（我基本可以确定凯特和阿诺德互相有意思。）\n别说是我写的，他们会宰了我。\n\n日子挺难。每天从一栋楼跑到另一栋楼，再把捡来的破烂全送去公司大楼。那地方我实在喜欢不来。柜台臭烘烘的，恶心。而且整栋楼都让人喘不过气，不知道为什么，总觉得它想把我碾死，像碾死厨房里的一只蚂蚁。\n\n这里也有点那种感觉，只是没那么吓人，多少安全些。至少不像是时时刻刻都被盯着。也不光是我这样想。阿诺德也讨厌公司大楼，一直说那里不对劲。说不定他真察觉到了什么。\n\n不说了。凯特刚用对讲机说天晚了，我得赶紧走。\n有空再写。
