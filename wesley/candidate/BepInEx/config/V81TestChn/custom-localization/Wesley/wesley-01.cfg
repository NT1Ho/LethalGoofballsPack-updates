exact:I am nearing my day of birth yet again. It will be the twenty first.\nWhile to most it would seem a day of happiness.\nI look at it the opposite.\nThis year I have graduated for a course I was happy to start.\nBut time has shown that it might not be within my interest in this form.\nTherefor I feel a part of life was wasted. I have yet to understand what I truly want to do with the years that remain.\nI feel like a rock in a river. With life flowing around me. Unmoved. Waiting for change. Change that might never come if I stay this way.=生日又快到了。是我的第二十一个生日。对多数人来说，这是个高兴的日子，我却恰好相反。\n今年我读完了一门当初很高兴能开始的课程。可日子久了，我才发现，照这样走下去，也许并不是我想要的。我觉得自己浪费了一段人生，却还没弄清楚余下的岁月究竟想做什么。\n我像河里的一块石头。生活从身边流过，我却一动不动，等着改变。可只要我一直这样等下去，改变也许就永远不会来。
exact:I am nowhere=我不属于任何地方
exact:I am trying to compose myself. I must stay strong in front of her. I must be there for her. They took Julie. Me and the others in the building ran for the metro while they broke through the barrier. We went building by building. She was right there with me. We kept running as the gunfire got closer. A bomb went off and the group split apart in a panic. Then when I looked behind me she was gone. She was right god damn there.\n\nIs this some sort of punishment? Is this because I left those poor people I was trying to help?\nAll I hear is screams and gunfire. This isn’t a battle, this is a massacre. People are being lined up and shot. Please god tell me Julie got away. Please.\nWe need her. I don’t want our daughter to grow up without a mother. I don’t want to lose you.\nPlease return to us. I know you’re out there.\nWe won’t be able to stay for long. If you’re not here soon we will have to leave.\nWe’re moving to the end of the metro, there should be a way to get off of Filitrios from there.\nI will leave this note here for you. Please come to us. I love you.=我在努力镇定下来。在她面前我得坚强，我得陪着她。他们把朱莉带走了。防线被突破时，我和楼里的人往地铁跑，一栋接一栋穿过去。她当时就在我身边。枪声越来越近，我们不停地跑。一枚炸弹炸响，人群惊慌四散。我回过头，她就不见了。她他妈刚才明明就在那儿。\n\n这是对我的惩罚吗？就因为我离开了那些本想帮助的可怜人？\n耳边只有惨叫和枪响。这不是战斗，是屠杀。他们让人排好队，一个个枪毙。老天，求你告诉我朱莉逃出去了。求你。\n我们需要她。我不想让女儿从小没有妈妈。我不想失去你。\n求你回来。我知道你还在外面。我们不能久留，你再不来，我们就得走了。我们正往地铁尽头去，从那里应该能离开菲利特里奥斯。\n我把这张便条留给你。来找我们吧。我爱你。
exact:I am uncertain where to begin.\nWhat has occurred was beyond dreadful.\nI find myself lacking the vocabulary to describe it.\nIt has taken me a fair amount of time to even build the courage to leave my bed chamber.\nI am frightened. Deeply frightened. It was a mistake. They died because I ran. I watched him cry in fear as I fled like a coward.\nThese doors will protect me. Opening them would require a considerable source of power. Such sources are rare in today’s day and age. Yet still I fear. There is a sound. I was certain it was my imagination playing tricks on me. I no longer believe that.\nIt’s drawing nearer. Every day I become more certain of that.\nIt spoke. I wish it had not. It echoes through my mind. It leaves me without peace.\nIt’s drawing nearer.\nI should never have viewed that tape.\nI assure you what I am hearing is real.\nThat thing was real.\nI urge you to stay away. I beg of you.\nLet it remain undisturbed.=我不知道该从哪儿写起。发生的事太可怕，我找不到词来形容。过了很久，我才鼓起勇气走出卧室。\n我害怕，怕得要命。那是个错误。他们会死，是因为我逃了。我像个懦夫一样逃跑的时候，还看见他吓得哭了。\n这些门能保护我。要打开它们，得有相当强的电源，这年头可不多见。但我还是怕。有个声音。我原以为是自己在胡思乱想，如今我不信了。\n它越来越近。我一天比一天肯定。\n它开口说话了。真希望它不曾开口。那声音一直在我脑子里回荡，不肯让我安宁。\n它越来越近。\n我根本不该看那盘录像带。\n我向你保证，我听见的是真的。那东西是真的。\n你千万别靠近。我求你。\n让它留在那里，别惊动它。
exact:I cannot rest=我无法安息
exact:I cannot say I am much of a writer, I beg of you, don’t have grave expectations.\nAs for any story it would be good to know who’s behind the pencil. Or keyboard in this instance.\n\nTo introduce myself, my name is Zellenah. Born on Haltar under the family name Cross.\nFor those who are unaware, Haltar is likely one of the wealthiest moons still remaining in our region.\nFirst, an agreement. Then the golden flame. Foolish to have gotten involved.\nOur father couldn’t keep the political talk to himself so I’ve become rather educated on the conflict.\n\nI feel I am already losing the path. Where was I? Ah yes.\nFor the greater part of my life I have spent mindlessly staring at golden halls and sipping the most elegant vintages while relatives endlessly discuss their fortunes with a devotion I could not understand. We’ve always gone on the same trips and visited the same fountains. I couldn’t convey how often I’ve seen the gemstone waters.\nYou could say I’ve always had more of an explorative trait. The predictability of it all became rather stifling. The people are kind, but perhaps a touch soulless. All they conversed about was their wealth and what grandiose places they visited. I found it to be rather dull. Terribly underwhelming. I fear the normality of it all has greatly impacted my joy of what were seemingly magnificent things.\n\nI found myself unwilling to accept such predictability so I left for a few trips outside of our usual experiences.\nA majority of the places I went to were fresh, unique. Often whelming as I had witnessed the same before but on a grander scale.\n\nThen, during one of these visits there were these magnetized pebbles. Not too extraordinary I believe we have all seen magnets before. But these pebbles, when they touched they would brighten up. Not only brighten up, they would share a light that traveled between them. Now that was lovely. I had never seen that before. Truly magnificent. I still have them somewhere I am quite certain. Perhaps in one of my drawers with the crystals which pacifies insects with a soft drone, another magical find.\nEither way I put on a glove and took a hand full of them back to the manor.\nFrom then on all I ever wanted was to collect more of these interesting objects.\nIndeed I did. I went on many trips following this initial find.\nI had gathered plentiful mistiques. It had gotten to a point where they were turning my manors into a dreadful mess.\nThere was a terrible need for a place to put these things. And that’s when I came with the idea of the gallery. A gallery of uniquities.\nI wouldn’t want it to be back on Haltar, you could display something magnificent and they wouldn’t even lift their glasses.\n\nThis place looks delightful and happens to be right in the center of everything. Nearly too good to be true.\nSo I acquired this small moon and began planning out the gallery.\nA few months pass and now we are here.\n\nI appreciate your reading. I find it incredibly relaxing to write.\nPerhaps I might write some more in the future.=我可算不上作家，求诸位别抱太大期望。故事开篇，总该交代执笔者是谁。此刻用的倒是键盘。\n\n我叫泽莱娜，生于哈尔塔，姓克罗斯。不熟悉此地的读者或许有所不知，哈尔塔很可能是本地区现存最富裕的卫星之一。先是一纸协议，继而是金色火焰。当初卷入其中，实属愚蠢。家父总忍不住高谈政治，我也就颇为熟悉那场冲突。\n\n瞧，我已经扯远了。说到哪儿了？哦，对。大半辈子里，我都在对着金碧辉煌的大厅出神，啜饮上好的陈酿，听亲戚们没完没了地谈论各自的财富。那份虔诚，我实在不懂。我们总去同样的地方，看同样的喷泉。我都数不清看过多少次那宝石般的水了。\n也许我生来更爱探索。一切都可预见，实在令人窒息。人们很和气，却似乎少了点灵魂，聊来聊去无非是身家，或是又去过哪处豪华胜地。我只觉得乏味，失望透顶。那些事物原本似乎极其壮美，偏偏太过寻常，我也就再难从中获得乐趣。\n\n我不甘心日子如此一成不变，便出门走了几趟，挑了些平日不去的地方。多数地方都新鲜、独特，却也常常只能算过得去——类似的景象我以前看过，规模还更大。\n\n有一回，我遇见了些带磁性的小石子。磁铁谁没见过，原算不得稀奇。但石子一碰到一起就会发亮，而且两颗石子之间竟有光流动！那可真美，我生平未见。妙极了。我确信还收着它们，也许就在某个抽屉里，和那些发出低鸣便能安抚昆虫的晶石放在一起。那也是件奇妙的收藏。总之，当时我戴上手套，抓了一把石子带回庄园。\n自那以后，我一心只想收集更多这样的奇物。我也确实这么做了。一次次远行，珍奇越积越多，几座庄园都被塞得乱七八糟。我急需一个安放它们的地方，于是有了开设展馆的念头。一座专展奇物的馆。可不能设在哈尔塔；再了不起的藏品摆出来，那些人恐怕连酒杯也懒得抬一下。\n\n这个地方令人欣喜，位置又恰好四通八达，好得几乎不像真的。于是我买下这颗小卫星，开始筹划展馆。几个月过去，便有了今天这番光景。\n\n多谢诸位读到这里。写作竟如此让人放松。以后也许还会再写。
exact:I desire to write again following today's frightful ordeal.\nIt was in the early morning when the trouble began. I had woken up from an annoyingly repetitive beeping coming from my computer. And so I had a gaze at what happened to be a message. It was deeply unsettling.\nIt read as follows: \n“The celestial body designated [98 Galetry] falls under company territory and is marked for collection. Agree to our terms or leave immediately.”.\nOf course I took this sudden message very dear. It had appeared to be rather important though a bit distasteful. So as with any message of seemingly grave importance like this I had informed them, in terms perhaps less diplomatic than advisable, that I had no interest in their proposal.\n\nNot much time had passed and I heard this charming jingle of an elevator of sorts followed by an explosion. Immediately I put on my gloves and armed myself with an antique blade in hopes it would scare away whoever had impolitely seared my front yard. Or at the very least offer me the confidence to confront them.\n\nTo my surprise there was nobody there. Only the wind, a dull quietness and a pod with a big gap presumably from the explosion.\nThen to my surprise, a dreadful swarm of hornets attacked me. I ran away as fast as I could and locked myself in my bed chamber.\nThen I remembered those droning crystals. Unsure where I had left them I began searching. It had taken me a fair moment but in the end I discovered them to be in a small box in one of my closets. I took out a few and slowly opened the door. Nothing in the hallway. Quite curious. I slowly made my way along the gallery towards the entrance, not a hornet in sight. Then to my surprise there was a bulging man standing in the grass. He quietly gazed at me. To my knowledge I was alone, there hadn’t been any visitors in days. I yelled out to him. No response. Frightening. I took a step back. Then he seemed to search for something in his tailor coat. Before long he ran at me holding a shimmering knife. Having neither a plan or any courage in that moment I instinctively held out the small bag of crystals between us. To my surprise this bloated man seemed enamored by them. Staring soullessly into the bag. Only then it dawned on me, this was not an ordinary man at all, but a deteriorating arrangement of skin and cloth piloted by these hornets. The dreadful smell only confirmed that. Terrifying discovery yet I must admit in a way quite divine.\nI had led him to the back room as he followed the bag of crystals. As I had no proper placement for this ominous gentleman, I elected to leave him where he was. I don’t think he minds that much.\n\nFinally I return to my computer only to find it beeping once more. A new message.\n“You have received your first and only warning, The celestial body designated [98 Galetry] falls under company territory and is marked for collection. Agree to our terms or leave immediately.”\nI was left with a choice and perhaps in an act of fear I agreed.\n\nAs long as I help their workers ship the things they found to Gordion without interrupting their work, I should be left alone.\nI’m hopeful.=今天经历了一番惊吓，我又想动笔了。事情始于清晨，电脑烦人地响个不停，把我从睡梦中吵醒。原来是封来信，读来极为不安。原文如下：\n“编号为 [98 Galetry] 的天体属公司领地，已列入征收范围。接受条款，或立即离开。”\n这突如其来的消息，我自然十分重视。措辞虽令人不快，看上去倒是要紧。于是，正如对待一切貌似重大的来信，我用了一些或许不够圆融的字眼，告诉他们我对这项提议毫无兴趣。\n\n过不多久，外头传来一阵悦耳的叮咚声，像是什么电梯到了，紧接着就是一声爆炸。我立刻戴上手套，抄起一把古董刀，希望吓退这位无礼地烧焦我前院的不速之客。至少也好给自己壮壮胆。\n可外面竟空无一人。只有风，沉闷的寂静，还有一只破了大洞的舱体，想来是炸开的。随即一大群胡蜂朝我扑来！我拔腿就跑，将自己反锁在卧室。\n这时我想起了那些会低鸣的晶石。记不得放在哪儿，找了好一阵，才在一个柜子里的小盒子中翻出来。我拿了几块，缓缓开门。走廊上什么也没有。怪哉。我沿着展廊慢慢朝入口走，一只胡蜂也没看见。草地上却站着一个身体肿胀的男人，静静望着我。据我所知，这里只有我一个人，已经好几天没访客了。我喊他。没有回应。真吓人。我退了一步，他像是在剪裁考究的外套里摸索着什么，转眼就握着一把亮闪闪的刀朝我冲来。\n那一刻我既无主意，也无胆量，本能地把装晶石的小袋举在我们中间。这个浮肿的男人竟被迷住了，呆呆地盯着袋子。我这才醒悟：眼前根本不是个普通人，而是一堆正在腐败的皮肉和衣物，由那些胡蜂在里面操纵。那股恶臭更印证了我的猜测。可怖的发现，却也不得不说，竟有几分神妙。\n他追着晶石袋，我便把他领进后屋。这位不祥的先生暂且没有合适的展位，我决定让他留在那里。他大概也不太介意。\n\n好不容易回到电脑前，它又响了。新消息。\n“这是你收到的第一次，也是唯一一次警告。编号为 [98 Galetry] 的天体属公司领地，已列入征收范围。接受条款，或立即离开。”\n我不得不作出选择。也许是出于恐惧，我同意了。\n\n只要我帮他们的工人把找到的东西运往 Gordion，又不妨碍他们做事，他们应该就会放过我。\n但愿如此。
exact:I did not expect this meeting to go the way it did.\n\nWhile I tried to educate the Emperor on the matters back at the Grand Capitol. he seemed uninterested and looked at me with a rather lifeless expression.\nI explained how the Council of Rule is very adamant about not allowing any bioweapons to be used or studied..\nBut then he told me..\nHe wanted me to..\n\nThe Triton Military will decimate the Grand Capitol as well as the moon it sits on.\nThis will be.. soon, on the day of the final conference.\nJudgement day.\n\nAnd he wanted me to give the order.\n\nThis will be the catalyst of a region wide war.\nYet I did as he asked. I gave the order. In the name of the Emperor.\n\nThis means I will not be returning home and I was promised that my family will be moved to Trite to keep them safe from what’s about to come.\nI hope to see them soon.\n\nSoon I will be off to 61-March where I will prepare 3 groups of scientists to set course for the mysterious moon of 42-Cosmocos in hopes of finding something to aid us in the upcoming war against the dominions who will oppose the Triton Military and the Emperor.\n\nThis will not be pleasant. But I am ready.\n\nAgent G- Signing off.=我没料到会谈变成这样。\n\n我向皇帝说明大首都的情况，他却兴致缺缺，只用一种毫无生气的表情看着我。我解释说，执政议会坚决不允许使用或研究生物武器……但他随后告诉我……他要我……\n\n特里同军方将摧毁大首都，以及它所在的整颗卫星。就在……不久之后，最后一次会议当天。审判日。\n\n而他要我下达命令。\n\n这会引爆一场波及整个地区的战争。可我还是照办了。我以皇帝的名义下了令。\n\n这意味着我不能回家了。他们承诺把我的家人送到特赖特，避开即将到来的灾祸。希望不久就能见到他们。\n\n我很快要前往 61-March，安排 3 组科学家动身去神秘的 42-科斯莫科斯。大战将至，我们要与那些反对特里同军方和皇帝的势力交战，但愿能在那里找到助力。\n\n不会好过。但我已准备好了。\n\n特工 G，通话完毕。
exact:I don't feel=我感觉不到
exact:I followed him through the vast halls of this citadel, hoping to see if he revealed anything else.\nBut when I turned the corner, he had vanished into one of the storage rooms. Which is particularly strange I thought.\nAnd when I put my ear up against the door. I heard him talk again.\n\nHe sounded rather monotone. Having a discussion with himself.\nOr so I thought.\nIt wasn't until he said 'my overseer' when I realised he was talking to someone or.. something.\n\nI hid around the corner when he left the storage closet. And he quietly mumbled 'The seed must grow' as he left the hallway.\nI am uncertain what any of this means but I feel something larger is a play here.=我跟着他穿过城堡宽阔的大厅，想看看他还会透露什么。可等我转过拐角，他已闪进一间储藏室。我觉得很奇怪，便把耳朵贴到门上，又听见他说话。\n\n他语调平淡，像是在自言自语。至少我原本这么想。直到听见他叫了一声“我的监管者”，我才明白，他在同某个人……或某种东西说话。\n\n他走出储物间时，我藏在拐角后面。离开走廊前，他低声念叨：“种子必须生长。”我不知道这一切意味着什么，但总觉得这背后还有更大的事。
exact:I found some pen and paper stached below my cold, hard mattress.\nMeaning I can FINALLY write down some of my problems with this BROKEN justice system.\n\nFor one, I AM INNOCENT!\nI would never EVER do that to my wife and children.\nAnd the fact that they never even had a look at the evidence I provided.\nHORRID!\n\nIf I ever get the opportunity to het out of this hell hole..\nI will sue the everliving hell out of those people.\nJustice my ass.\n\nMeanwhile I'm sure that monster is still out there.\nAGHH\nWhat he did to my children, my Jane..\n\nIf I ever find him I'll be happy to watch him ROT behind these same bars that I find myself behind.\nHE belongs in a cell on Alcatras NOT ME!\n\nThough unfortunately they gave me life in prison.\nI don't think I'll ever be able to get true justice.=我在冰冷坚硬的床垫底下找到了藏起来的纸笔。这下终于可以写写我对这套烂透了的司法制度有什么意见了。\n\n第一，我是无辜的！我绝不会对妻子和孩子干那种事。他们甚至没看一眼我交上去的证据。简直可耻！\n\n要是有机会离开这个鬼地方……我一定要把那些人告到底。去他的正义。\n\n那个畜生却肯定还在外面。啊——他对我的孩子们，对我的简，做了那种事……\n\n要是找到他，我很乐意看他在困住我的同一道铁窗后烂掉。该关进阿尔卡特拉斯牢房的人是他，不是我！\n\n可惜他们判了我终身监禁。我想，我大概永远也讨不回公道了。
exact:I found you...=找到你了……
exact:I have made it to faith but my health has rapidly declined.\nI can barely walk.\n\nIt's there, I feel it sitting in my chest...\nGrowing...\nThis tumor.\nI escaped the war..     I SURVIVED\nAnd this is how the universe rewards me?\nLife is suffering.\nAlways has been, from the moment I was created.\nOne month after being born I was already on the battlefield. Posessing memories of someone I'm not.\nThey didn't even give me a name.\nI was a number. A duplicate of someone else.\n...\nMy body is crumbling, I should get going.\nAnd when I'm done.\nAll my problems will go away.\n\n\nMy salvation lies on Berunah.=我到信仰星了，可身体一下子垮了。\n现在连走路都难。\n\n它就在那儿。我能感觉到它盘在胸口……\n在长大……\n这颗肿瘤。\n我逃出了战场……我活下来了！\n宇宙就是这么回报我的吗？\n活着就是受苦。\n从我被造出来的那一刻起就是这样。\n我出生才一个月，就已经上了战场。脑子里装着别人的记忆。\n他们甚至没给我起名字。\n我只是个编号。是另一个人的复制品。\n……\n我的身体快撑不住了，得走了。\n等我办完那件事，\n所有烦恼就都结束了。\n\n\n我的救赎在贝鲁纳。
exact:I hear her in the dark\r\nThere’s a sadness in her voice\r\nSomething is wrong with her\r\n\r\nShe fears being seen\r\nShe’s scared\r\nSomething happened to her\r\n\r\nThere is a darkness in her eyes\r\nIt’s not her\r\nSomething is within\r\n\r\nWatch your back\r\nShe might ask for help\r\nBut it won’t let you=我在黑暗里听见她的声音\n她的声音里透着悲伤\n她有些不对劲\n\n她怕被人看见\n她很害怕\n她身上发生过什么\n\n她眼里有一片黑暗\n那不是她\n她体内有东西\n\n小心背后\n她也许会向你求救\n可它不会让你帮她
exact:I hear my son=我听得见我儿子的声音
exact:I know you're there=我知道你在那里
exact:I must write about this. I believe I have acquired all the information that remains.\nBack in my early days on Haltar, on the television this advertisement would play. It was an elegant place to visit with stunning environments, yet I’ve never quite discovered where this place is or even what it’s called. I only remember greenery with purplish waters and a soft pink sky. It was extraordinary. But it seems as if it never existed, though I am certain it did.\nThroughout my life I have attempted to inquire information of its whereabouts yet nobody seemed to know. I only had rumors to work off of. Some said it was made to disappear due to a chemical accident. Others said it was a hoax entirely, which seemed like a rather dull explanation.\n\nI simply cannot allow the matter to remain unsolved. It has most certainly been removed form every public source of information as nothing has turned up over the many years I have searched for this. But perhaps a physical copy remains in existence somewhere.\n\nI have reached what may generously be described as a plan, the idea fills me with discomfort, though I see no alternative but to attend to it personally. When Marcus returns I will fly out with him in search of what could be one of the only physical copies of this remarkable advertisement. I believe I know where such a copy may still exist.\nYou will see me return soon.=我必须把这件事写下来。我想，尚存的线索我已经收集齐了。小时候在哈尔塔，电视上常播一则广告，介绍一处风景绝美的雅致去处。可我始终没弄清那地方在哪儿，甚至不知道它叫什么。我只记得满目翠绿、泛紫的水和柔粉色的天空，美得出奇。如今它却像从未存在过，尽管我确信它的确存在。\n\n我一生都在打听它的下落，却没人知道，只能凭流言追查。有人说那里发生过化学事故，因此被刻意抹去了踪迹。也有人说从头到尾都是骗局，这种解释未免无趣。\n\n我实在无法容忍此事悬而未决。搜寻多年，始终一无所获，它一定已从一切公开资料中被删去。但也许某处还留着一份实体拷贝。\n\n我姑且算是想出了一个计划。这个主意让我很不自在，可除了亲自去办，我别无选择。等马库斯回来，我就和他一同出航，去找那则非凡广告可能仅存的实体拷贝之一。我想我知道哪里还可能有一份。\n我很快便会回来。
exact:I need to burn these notes later, can't risk anyone finding out about this.\nMy 'friend' Aaron has been a nuisance my entire life. \nHe stole my girlfriend, he stole my job! \nI can't keep acting friendly while he's around. \nI HATE HIM!=这些笔记过后得烧掉，不能让人发现。\n我那个“朋友”亚伦，从小到大都在给我添堵。\n他抢了我的女朋友，又抢了我的工作！\n他在跟前的时候，我再也装不出那副好朋友的样子了。\n我恨他！
