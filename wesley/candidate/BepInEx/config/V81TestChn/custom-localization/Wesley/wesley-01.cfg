exact:FOREST ELDER\r\n\r\nSigurd's danger level: 50%\r\n\r\nScientific name: Satyrid-derceritas\r\nA very close relative to the Satyrid-proceritas. The Elders are a nearly extinct subspecies which are able to grow nearly twice as tall as the Forest Keepers due to their living conditions. However it is also because of their preferred environment that they never seek to leave the dense jungles which have become increasingly rarer.\r\nThe Forest Elder shares a striking resemblance with its smaller counterpart. The main difference being a slightly whiter appearance and their eyes having a red protective layer against attacks from avian wildlife.\r\n\r\nIt has been known that some tribes take the Elders as higher beings, believing they are men chosen by gods who have transformed to become the protectors of the woods they live in.\r\n\r\nDue to the striking similarity to the Forest keeper, read the data entry about the Forest keeper for more information on the Elder’s visual and physical evolution.=森林长老\r\n\r\n西格德的危险等级：50%\r\n\r\n科学名称：Satyrid-derceritas\r\n与Satyrid-proceritas非常相似。森林长老是一种几乎灭绝的亚种，由于生存环境的原因，他们的身高几乎是森林守护者的两倍。不过，也正是因为他们偏爱这样的环境，他们从不试图离开那些日益稀少的茂密丛林。\r\n森林长老与其较小的同类有着惊人的相似之处。主要区别在于它们外观上略显白色，眼睛上还有一层红色的保护层，以抵御鸟类野生动物的攻击。\r\n\r\n有传言称，一些部落将森林长老视为更高层次的存在，认为他们是被神灵选中的人类，从而成为了他们所居住的森林的守护者。\r\n\r\n由于森林长老与森林守护者有着惊人的相似性，如需了解更多关于森林长老的外观和体型特征，请阅读有关森林守护者的数据记录。
