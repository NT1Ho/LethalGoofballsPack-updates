exact:I AM IN SHOCK!\nWhen Jack came in earlier he was completely covered in blood!\nHe has lost his mind!\nHe was holding the dagger in his right hand and the mask in his left held before his face.\nHe looked at me.\nChanting soem unrecognisable words before he walked away. Seemingly heading outside.\n\nI am not sure if he killed an animal or..\nI need to make sure Dave is ok.\nI don't want to be alone with Jack the lunatic.\nMaybe I should go look what's outside.\n\nI fear the worst.=我吓坏了！\n杰克刚才进来的时候浑身是血！\n他疯了！\n他右手握着匕首，左手举着面具挡在脸前。\n他看了我一眼。\n嘴里念着些听不懂的词，然后走了，好像是往外面去。\n\n我不知道他杀的是动物，还是……\n我得去看看戴夫有没有事。\n我可不想跟杰克这个疯子单独待着。\n也许我该出去看看。\n\n我怕最坏的事已经发生了。
exact:I BELIEVE IN YOU=我相信你
exact:I am Geoffrey Samuel Smith, Agent and high commander working directly for the Emperor.\nThis will be my final message.\n\nUntil recent I have believed that my actions since the Catalyst under command of the Emperor were for some greater good.\nI was led to believe that all the sacrifices made were with purpose.\nYet they were in vain.\nIt wasn’t until I had lost all that I had left in my world when I realized.\n\nI now find myself here to execute one final mission.\nOne of my own.\nOver the past few months we have been collecting the many experimental bioweapons that were created because of me.\nI made them believe we got them to study them further. Make them more dangerous.\nThat’s what the emperor would have wanted.\nBut I will no longer follow the wishes of that man.\nHe sits on his golden throne while everyone else suffers by his command.\nI should have done something when he told me to give the order.\nI should have executed him right then and there.\n\nBack in the labs I smashed the glass containers for BIO-HXNV7, the deadliest weapon we have.\nIt will hopefully kill or convert most of the people here.\nThese loyal rats who think they’re on the winning side.\nThere is no winning side.\nAnd I’ll make sure nobody will escape this place.\nNobody will use these atrocities to further this pointless hell!\n\nI called for a facility wide decontamination.\nAnd all of it will burn!=我叫杰弗里·塞缪尔·史密斯，特工，直属皇帝的高级指挥官。\n这是我最后的留言。\n\n直到不久前，我还相信，自那场剧变以来，我奉皇帝之命做的一切都是为了更大的福祉。他们让我相信，所有的牺牲都有意义。\n可那些人都白白牺牲了。直到失去世上仅剩的一切，我才看清。\n\n我来这里执行最后一项任务。\n这一次，是我自己的。\n过去几个月里，我们一直在搜集那些因我而诞生的实验性生物武器。我骗他们说，找回来是为了继续研究，让它们更危险。皇帝一定希望如此。\n但我不会再遵从那个人的意愿。他坐在黄金王座上，所有人却因他的一道道命令受苦。他让我下令的时候，我本该做点什么。我本该当场处决他。\n\n在实验室里，我砸碎了装 BIO-HXNV7 的玻璃容器。那是我们最致命的武器。希望这里的大多数人不是死，就是被转化。\n这些忠心的走狗，还以为自己站在会赢的那一边。\n根本就没有赢家。\n我会确保没有一个人能逃出去。谁也别想再用这些惨无人道的东西，把这场毫无意义的地狱延续下去！\n\n我已经下令对整座设施执行净化。\n一切都会烧光！
