exact:He didn't die.. He DIDN'T DIE!!\nAt least I don't think he did.. I saw that box.\nIt was walking..\nIt was stalking me with his corpse still inside it.\nIt can't be possible.\nThere wasn't even machinery inside it.\nNot much at least.\n\nAfter a few minutes it stopped and started cranking itself..\nI ran away.\n\nI am hiding, not sure what to do now.\n\nSOMETHING IS COMING! \nI HEAR SCREAMS! \nI AM SO SOR-=他没死……他没死！！\n至少我觉得他没死……我看见那个盒子了。\n它在走……\n它一路跟着我，他的尸体还在里面。\n这怎么可能。\n里面连机械装置都没有。\n至少没多少。\n\n过了几分钟，它停下来，开始给自己摇发条……\n我跑了。\n\n我躲起来了，不知道现在该怎么办。\n\n有东西过来了！\n我听见尖叫了！\n对不——
