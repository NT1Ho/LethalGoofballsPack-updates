exact:During my time in this realm of mortality I have made friends of many. Though very few have stuck with me past my time of being around them.\nGrateful I am to those who remain. Those whom I can consider close.\nTrue friends.\nHowever I fear that the friends I have made in the past year become one with those who no longer seek contact with me. The thought haunts me daily. I fear that I might end up alone once more.\nI fear the void we call loneliness.\nOften I sit down, just me and my thoughts. No one to join my pondering. To fill up the void.=在这有限的一生里，我结识过许多朋友。可一旦不再朝夕相处，还愿意与我来往的人就很少了。\n我感激留下的那些人，那些我能视为亲近的人。真正的朋友。\n可我害怕，过去一年里结交的朋友，也会变成那些再也不来找我的人。这个念头日日缠着我。我怕自己又会落得孤身一人。\n我害怕那片叫作孤独的空洞。\n我常常独自坐着，只剩自己的思绪。没有人来陪我一起想，也没有人来填补那片空洞。
