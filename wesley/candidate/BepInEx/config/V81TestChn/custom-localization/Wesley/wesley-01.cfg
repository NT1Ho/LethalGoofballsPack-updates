exact:HAILEY ROBERTSON\n\nFirst name: Hailey\nLast name: Robertson\nMiddle name: -\n\nGender: F\nAge: 32\n\nOccupation: Nurse\nEstablishment: Crosswind Mental Hospital\nPlace: Last Hope\n\nCause of death: Poisoning\n\nHailey Robertson was found deceased in the treatment room of the Crosswind Mental Hospital, She had signs of physical abuse, lacerations to the back and chest, and a small hole was discovered in her forehead.\n\nA notebook was recovered from a burning bin containing a detailed log of the experiments she was put through. Among which were, being forcefully exposed to violent videos of human torture for days on end without breaks. Being suffocated to the edge of death causing minor brain damage. Having her solve complex logic puzzles within certain timeframes and being punished for failing.\n\nShe was often reminded how her four year old son would not be able to survive without her as she was a single mother. This was with the promise of her being let go if she complied.\nUnfortunately he also died of starvation during her capture.\n\nA tiny rod was used to destroy a small part of her brain which likely led to her losing any sort of self. This was one of the final experiments listed within the notebook.\n\nHailey Robertson was one of many victims of such experiments and life altering treatments by the hands of Solover Underhill, the head psychiatrist of the Crosswind Mental Hospital.\n\nShe was a loving, hard working mother who had a hard time following her husband’s passing. She was full of courage and remained positive even during her hardest times.\nShe will be remembered by all.\nMay she Rest in Peace.\n\n—-----------------------------------------\n\nShe is here\nShe has a heart of vengeance\nDo not disturb her=海莉·罗伯逊\n\n名字：海莉\n姓氏：罗伯逊\n中间名：-\n\n性别：女\n年龄：32岁\n\n职业：护士\n工作地点：Crosswind精神医院\n所在地点：Last Hope\n\n死因：中毒\n\n海莉·罗伯逊在Crosswind精神医院的治疗室中被发现死亡。她身上有身体暴力的痕迹，背部和胸部有割伤，前额还有一个小洞。\n\n在一个燃烧的垃圾桶里发现了一本笔记本，里面详细记录了她所经历的实验。其中包括连续数日被迫观看人类折磨的视频；被逼到生命边缘导致轻微脑损伤；必须在规定时间内解决复杂的逻辑谜题，否则就会受到惩罚。\n\n人们经常提醒她，如果她不服从命令，她四岁的儿子将无法生存。作为单亲母亲，她被承诺如果遵守命令，就可以摆脱这种困境。\n不幸的是，在她被捕期间，她的儿子也因饥饿而去世。\n\n一根细小的棒子被用来破坏她大脑的一部分，这可能导致她失去了自我意识。这是笔记本中列出的最后一项实验。\n\n海莉·罗伯逊是Crosswind精神医院的首席精神科医生索沃er·安德希尔所实施的许多实验和改变生活的治疗中的受害者之一。\n\n她是一个充满爱心的、勤奋工作的母亲，丈夫去世后，她很难接受这个现实。尽管面临最艰难的时刻，她仍然保持乐观和坚强。\n所有人都会记住她。\n愿她安息。\n\n——-----------------------------------------\n\n她在这里\n她心怀复仇之心\n请勿打扰她
exact:HAILEY ROBERTSON\r\n\r\nFirst name: Hailey\r\nLast name: Robertson\r\nMiddle name: -\r\n\r\nGender: F\r\nAge: 32\r\n\r\nOccupation: Nurse\r\nEstablishment: Crosswind Mental Hospital\r\nPlace: Last Hope\r\n\r\nCause of death: Poisoning\r\n\r\nHailey Robertson was found deceased in the treatment room of the Crosswind Mental Hospital, She had signs of physical abuse, lacerations to the back and chest, and a small hole was discovered in her forehead.\r\n\r\nA notebook was recovered from a burning bin containing a detailed log of the experiments she was put through. Among which were, being forcefully exposed to violent videos of human torture for days on end without breaks. Being suffocated to the edge of death causing minor brain damage. Having her solve complex logic puzzles within certain timeframes and being punished for failing.\r\n\r\nShe was often reminded how her four year old son would not be able to survive without her as she was a single mother. This was with the promise of her being let go if she complied.\r\nUnfortunately he also died of starvation during her capture. \r\n\r\nA tiny rod was used to destroy a small part of her brain which likely led to her losing any sort of self. This was one of the final experiments listed within the notebook.\r\n\r\nHailey Robertson was one of many victims of such experiments and life altering treatments by the hands of Solover Underhill, the head psychiatrist of the Crosswind Mental Hospital.\r\n\r\nShe was a loving, hard working mother who had a hard time following her husband’s passing. She was full of courage and remained positive even during her hardest times.\r\n\r\nShe will be remembered by all.\r\nMay she Rest in Peace.\r\n\r\n—-----------------------------------------\r\n\r\nShe is here\r\nShe has a heart of vengeance\r\nDo not disturb her=HAILEY ROBERTSON\r\n\r\n名字：海莉\r\n姓氏：罗伯逊\r\n中间名：-\r\n\r\n性别：女性\r\n年龄：32\r\n\r\n职业：护士\r\n建立：横风精神医院\r\n地点：最后希望\r\n\r\n死因：中毒\r\n\r\n海莉·罗伯逊在Crosswind精神医院的治疗室中被发现死亡。她身上有身体暴力的痕迹，背部和胸部有割伤，前额还有一个小孔。\r\n\r\n从一个燃烧的垃圾桶中找到了一本笔记本，里面详细记录了她所经历的种种实验。其中包括连续数日被迫观看人类折磨的视频；被逼到濒临死亡的状态，导致轻微脑损伤；以及在规定时间内完成复杂的逻辑谜题，若失败则会受到惩罚。\r\n\r\n人们经常提醒她，如果她不依靠自己，她四岁的儿子将无法生存，因为她是一个单身母亲。不过，前提是她必须遵守这个条件。\r\n不幸的是,在她被捕时他也死于饥饿。 \r\n\r\n借助术语标记，将以下完整文本译成简体中文。不要删除、增加或解释。\n\n使用一根细小的棒子摧毁了她大脑的一小部分，这可能导致了她失去自我意识。这是笔记本中列出的最后一项实验。\r\n\r\n海莉·罗伯逊是许多受害者之一，她们都曾遭受过索洛弗·安德希尔的折磨。安德希尔是Crosswind精神病医院的主任医师，他利用这些实验和改变生活的疗法来操控人们。\r\n\r\n她是一位充满爱心的、勤奋的母亲，丈夫去世后，她很难接受这个现实。尽管处境艰难，她依然充满勇气，始终保持着积极的心态。\r\n\r\n她将被所有人铭记。\r\n愿她安息。\r\n\r\n—-----------------------------------------\r\n\r\n她在这里。\r\n她有一颗复仇的心。\r\n不要打扰她。
exact:HONEY STINGER\n\n\nSigurd's danger level: 40%\n\n\nScientific name: Vapir-Mellitera\n\n\nThe Honey stinger is a large insect part of the Anthophila, being close to the Melittidae. They tend to inhabit luscious or mountainous areas with the largest colony discovered in the asteroid belt of 56-Vow.\nThe honey stinger has a hard and thick shell on its back to protect itself from any aggressors while the bottom is more soft and vulnerable. It is because of this vulnerability that they prefer to crawl around despite them being excellent at flying.\n\n\nMuch like many species of bees they are born from and serve one queen. While the antics of the honey stinger are not extensively studied, it is known that they possess a more playful behaviour than most other families of bees.\n\n\nThey take a liking to grabbing and claiming objects they find interesting. Most often these are beehives of smaller species of bees. It is unsure if they understand the concept of a smaller version of themselves existing but it is known that after obtaining several of these hives they become increasingly defensive.\n\n\nWhile they do not have any aggressive tendencies towards most species they are quick to attack any human who wanders near them, likely due to the frequent exploitation of their hives.\n\n\nIt is recommended to stay away from the honey stinger when encountered in the wild. They do not like you but they mean no harm. They are only protective of themselves and their hives.=蜂蜜刺蜂\n\n\n西格德的危险等级：40%\n\n\n学名：Vapir-Mellitera\n\n\n蜂蜜刺蜂是Anthophila科的一种大型昆虫，与Melittidae科关系密切。它们通常栖息在肥沃或山区，最大的群体发现于56-Vow小行星带。\n蜂蜜刺蜂的背部有坚硬且厚实的壳，可以保护自身免受攻击者的伤害，而腹部则较为柔软且容易受到伤害。正因这种脆弱性，它们更喜欢爬行，尽管它们非常擅长飞行。\n\n\n与许多蜜蜂种类一样，蜂蜜刺蜂由一只女王繁殖。虽然对蜂蜜刺蜂的行为研究不多，但已知它们比其他蜜蜂家族更具嬉戏行为。\n\n\n它们喜欢抓取并占有自己认为有趣的物品，这些物品通常是其他小型蜜蜂的蜂巢。目前尚不清楚它们是否理解自己较小版本的生存概念，但已知在获得几个这样的蜂巢后，它们会变得越来越具有防御性。\n\n\n虽然它们对大多数物种没有攻击性，但一旦发现人类靠近，它们会迅速发起攻击，这可能是由于人类经常掠夺它们的蜂巢所致。\n\n\n在野外遇到蜂蜜刺蜂时，建议远离它们。它们不喜欢人类，但并不怀有恶意。它们只是保护自己和自己的蜂巢而已。
