exact:Diary entry 847.\n\nNothing quite remarkable today.\n\n10:30 I woke up and per usual I brushed my teeth, did my hair, changed my clothes and went out for breakfast with the family in the grand hall. Had a laugh with my dad and went back home.\n\n11:40 The cleaners knocked apparently, they should know to use the light by now. How many times would it take for them to remember I can’t hear the knocking.\n\n13:30 We are back out to get lunch. I’ve been practicing art in the meantime. My parents are keen on letting me know it’s a worthless skill to have. They are no fun.\n\n14:05 When we got home the neighbor passed by to update us on the state of the Emperor. He hasn’t been seen for weeks. Granted he’s not likely to leave his palace but he hasn’t been spotted in the windows either.\n\n16:40 I’ve stayed home. There is not much out there to do. My parents went with the neighbor.\n\n18:30 We had dinner in the grand hall. Apparently the Emperor’s absence is a common topic at the moment. I am starting to worry myself if I’m quite honest.\n\n22:10 Watched a scary show with my parents. It’s difficult to understand what’s happening at times but that doesn’t make it less scary. They seemed to enjoy it at least.\n\n\nDiary entry 848.\n\nStrange occurrence on an otherwise regular day.\n\n10:30 I woke up, brushed my teeth, did my hair and went with a slightly different style than usual, hoping someone would notice. I changed clothes and went out for breakfast with the family in the grand hall.\n\n11:30 Yesterday I missed them so today I left the door open so I can see the cleaners arrive when they come and I won’t have to rely on my very functional hearing.\n\n13:30 Lunch time, I’ve worked some more on my art while I waited for time to pass.\n\n15:20 My parents came home for a bit and allowed me to have some sweets. Surprisingly they actually stayed with me until dinner time.\n\n18:30 We went back to the grand hall for dinner. The emperor has not been seen yet. Maybe he’s resting. I’m sure it’s not easy to oversee an entire system.\n\n22:10 That same show as yesterday came on so we watched it together. However in the middle it was interrupted by an emergency broadcast. There wasn’t any imagery nor any subtitles so I’ve no idea what was said. Whatever it was, it seemed to upset my parents, they looked concerned yet.. Relieved. It’s hard to describe. They quickly send me to bed.\n\nI’m sure they’ll tell me what that was tomorrow.\n\n\nDiary entry 849.\nThis isn’t real. I am fairly certain this is a horrible nightmare.\nI will try to write what I saw. I’m fearful.\n\n10:30 I woke up to a cold breeze. I walked over to brush my teeth, make up my hair and change clothes. I found it strange that I couldn’t feel my parents walk around, for a moment I assumed they were off to a neighbor again. Until I stepped out of my room.\n\nThey were there, by the window, hanging from the ceiling. There was an empty noose next to them.\nI haven’t looked at them since.\n12:00 I’ve been sobbing and crying. It’s not just my parents. I haven’t found a single living person. I think it’s everyone.\nI’ve looked out the window in the hallway. And I see more people hanging in the distance.\nI don’t believe this is real.\n\n13:40 I went to an empty apartment on the top floor. I don’t have to see anyone here. I don’t want to see anyone else.\n\n14:44 I felt the emergency bells ringing, it was a deep rumble to my skin which I’ve only felt during tests, I stepped out on the balcony to see what was going on, hoping there would be an answer but there he was. The Emperor. And at least a hundred noblemen all slowly marching out the palace. I screamed hoping for something to happen. Nothing. They kept walking. Nobody even bat an eye. I thought the Emperor would save us. Just like he had done with so many before us. I screamed and begged.\nIt’s hard to write while I’m shaking.\nHe stopped moving in the middle of the plaza. I thought he finally heard my screams but he kneeled and looked up. His mouth moved but it was too far for me to read what he said before he burst into this red mass. I couldn’t move. My body forced me to watch as he erupted into a swarm of tendrils reaching for the ground while he grew into something horrific. The noblemen kept walking and collapsed into him, vanishing into the mass. Last thing I saw before could take control and run was the red mass growing and pulsating.\n\n16:12 I haven't quite calmed down but I’ve at least managed to calm my breathing. This doesn’t feel real. \nI don’t understand what is happening. Or if it even is. The Emperor would never let this happen. This would never happen.\nWe’ve always been happy. I feel dizzy. There is a hole in my mind I cannot fill. It doesn’t make sense. Was it yesterday’s broadcast? What was even said? I wish I could fucking hear.\nIt’s cold here.\nThis must be a nightmare. It’s the only thing that makes sense. I know what they’re like, they’re just like this. They can be the worst reality while feeling completely real. \nThis is the worst reality.\nMy parents would never leave me like this, I know they wouldn’t. And the Emperor, it cannot be real. That must be it. I need to wake up.\nI have to wake up. I have to see mom and dad.=日记，第847篇。\n今天没什么特别的。\n\n10:30 起床，照例刷牙、梳头、换衣服，和家人去大厅吃早饭。跟爸爸说笑了一会儿就回家了。\n11:40 听说保洁来敲过门。他们早该知道要用灯提醒我了吧。到底要说几遍，他们才记得我听不见敲门声？\n13:30 又出来吃午饭。这期间我一直在练画画。爸妈老爱提醒我，学这个没用。他们可真没意思。\n14:05 回家时邻居顺路来说了说皇帝的近况。已经几个星期没人见过他了。他本来就不大可能离开宫殿，但现在连窗边也见不到他。\n16:40 我待在家里。外头没多少事可做。爸妈跟邻居出去了。\n18:30 在大厅吃晚饭。好像大家都在谈论皇帝为什么不露面。说真的，我也有点担心了。\n22:10 跟爸妈看了个恐怖节目。有时我弄不懂在演什么，可还是一样吓人。至少他俩看起来挺喜欢。\n\n日记，第848篇。\n平平常常的一天里，出了件怪事。\n\n10:30 起床、刷牙。今天头发换了个梳法，希望有人注意到。换好衣服，和家人去大厅吃早饭。\n11:30 昨天错过了保洁，今天干脆把门开着。这样人来了我就能看见，不用指望我这对“好使”的耳朵。\n13:30 午饭时间。等的时候又画了一会儿画。\n15:20 爸妈回来了一趟，还让我吃了些糖。没想到他们真陪了我一下午，直到该吃晚饭。\n18:30 又去大厅吃饭。还是没人见到皇帝。也许他在休息，管理整个星系一定不容易。\n22:10 昨天那个节目又播了，我们一起看。看到一半突然插播紧急广播，既没有画面也没有字幕，我完全不知道说了什么。爸妈看了都不太对劲，像是担心，又像……松了口气。说不清。他们很快就打发我睡了。\n明天他们一定会告诉我广播说了什么。\n\n日记，第849篇。\n这不是真的。我几乎可以肯定，这是场可怕的噩梦。我要试着写下看到的东西。我害怕。\n\n10:30 一阵冷风把我吹醒。我起来刷牙、梳头、换衣服。奇怪的是，我感觉不到爸妈在屋里走动。起初还以为他们又去邻居家了。直到我走出房间。\n他们就在窗边，吊在天花板上。旁边还有一个空绳套。从那以后我就没敢再看他们。\n12:00 我一直在哭。不只是爸妈。我一个活人都没找到。我觉得所有人都……我从走廊的窗户望出去，远处还吊着好多人。我不信这是真的。\n13:40 我到了顶楼的一间空公寓。在这里不用再看到谁。我不想再看见别人了。\n14:44 我感觉到了警钟。那股低沉的震动透过皮肤传过来，以前只有测试时才感觉得到。我走到阳台上，想知道出了什么事，希望能找到答案。皇帝就在那里。他和至少一百个贵族正缓缓走出宫殿。我大叫，希望能发生点什么。什么也没有。他们继续走，连看都没看我一眼。我以为皇帝会来救我们，就像他曾救过那么多人一样。我大声喊，求他救命。\n手抖得快写不下去了。\n他在广场中央停住了。我以为他终于听见我的喊声，他却跪下，仰起了头。他的嘴唇在动，可我站得太远，来不及读出唇语，他就爆成了一团红色的东西。我动弹不得，只能眼睁睁看着无数卷须从他身上迸出来，伸向地面，而他越长越大，变成了怪物。贵族们还在往前走，一个个倒进他身体里，被红团吞没。我终于能拔腿逃跑时，最后看见的是那团还在膨胀、一跳一跳的红肉。\n16:12 我还没平静下来，至少喘得没那么厉害了。这不像是真的。我不明白发生了什么。究竟有没有发生？皇帝绝不会让这种事发生。这不可能发生。\n我们一直都很幸福。我头好晕。脑子里好像有个洞，怎么也填不满。说不通。是昨天的广播吗？到底说了什么？我他妈真希望自己听得见。\n这里好冷。\n一定是噩梦。只有这个解释说得通。我知道噩梦是什么样的，就是这样。明明是最坏的情形，却感觉一切都是真的。\n这就是最坏的现实。\n爸妈绝不会这样丢下我，我知道他们不会。还有皇帝，这不可能是真的。一定是这样。我得醒来。\n我一定要醒来。我要见爸爸妈妈。
