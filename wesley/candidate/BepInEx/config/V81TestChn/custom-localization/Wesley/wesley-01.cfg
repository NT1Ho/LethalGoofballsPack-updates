exact:DROOP\r\n\r\nSigurd's danger level: uhhhh I dnot know but thsi sou nds horrifyign\r\n\r\nScientific name: Vorictus-detoma\r\n\r\nThe Vorictus-detoma, garnered the name “Droop” due to its drooping appearance. Its arms, legs and neck are exceptionally long, likely due to the body deformation which happens in the process of a Droop’s creation.\r\n\r\nThe Droop is not officially classified as a non-human creature, while it no longer possesses the humanity it once did, it technically is still human. Only with the effects of prolonged exposure to V-Radiation.\r\n\r\nV-Radiation is an incredibly rare phenomenon and has previously had very adverse and unexplainable effects on creatures and places, often leading to deformation and destruction. Sightings of V-Radiation were extremely rare up until the Grand war where it was occasionally used to cause mass destruction. However, even by supporters of the use of biological warfare, it was greatly frowned upon due to its cruel and otherworldly effects often rendering places uninhabitable.\r\n\r\nWhile there have not been many encounters, the majority of the Droop were likely everyday civilians affected during the war. \r\nDirect exposure to gamma or beta rays of V-Radiation vaporises the average unprotected human, leaving behind what can only be described as a shadow or a memory where they once were. It is not certain what exactly it is that they leave behind but it is thought to no longer be alive. However there have been rumors of these shadows stalking or moving in the dark.\r\nWhen exposed to alpha rays of V-Radiation you won’t immediately notice any harmful effects aside from a slight headache or brief dizziness. But from the moment of exposure you have been infected with a unique type of radiation sickness. While it doesn’t break your DNA, it does change it which only becomes noticeable after a few days. Skin might start feeling heavy and organs might move around during a very painful process. If the infected is still alive 13 days past the first exposure, changes start happening to the brain, often noting highly irregular brainwaves. From this point onwards it is only a husk of its former self. While it is on a technical level not death, this is what we consider the moment of death. The person is unrecoverable and the body is deformed to an unrecognisable level where the skin and muscles resemble a droopy obsidian. \r\n\r\nThere has not been any research from this point onwards.=垂首怪\n\n西格德的危险等级：呃，不知道，但听着就瘆人，字都打不利索了\n\n学名：Vorictus-detoma\n垂首怪得名于其下垂的体态。手臂、双腿和脖子都长得异乎寻常，可能是形成过程中身体变形所致。\n\n它并未被正式列为非人类生物。尽管昔日的人性已不复存在，严格来说，它仍是人，只是长期暴露在 V 辐射下。\n\nV 辐射极为罕见。此前的记录表明，它会对生物和当地环境产生严重且无法解释的影响，往往造成变形与毁坏。直到大战期间，才偶尔有人用它制造大规模破坏。即使在赞成生物战的人当中，这种做法也备受谴责：它的作用残酷而诡异，往往让整片地区再也无法居住。\n\n已知遭遇不多，但大多数垂首怪很可能曾是战时受波及的普通平民。\n普通人在毫无防护的情况下直接接触 V 辐射的伽马或贝塔射线，会被瞬间汽化，只在原地留下一道仿佛影子、又仿佛记忆的痕迹。没人知道那到底是什么，一般认为它已没有生命。不过，也有传言称这些影子会在黑暗中移动，甚至尾随人。\n接触 V 辐射的阿尔法射线时，起初除了轻微头痛或短暂眩晕，几乎察觉不到异常。但从接触的那一刻起，一种特有的放射病就已发作。它不会破坏 DNA，却会将其改变，几天后症状才显现。患者可能觉得皮肤沉重，器官在剧痛中移位。如果初次接触后 13 天仍然存活，大脑便开始变化，往往能测得极不规则的脑电波。此后留下的只是从前那个人的一具空壳。严格来说还没死，但我们将这视为死亡的时刻。患者已无法挽回，身体扭曲得面目全非，皮肤和肌肉像下垂的黑曜石。\n\n此后的情况尚无研究。
