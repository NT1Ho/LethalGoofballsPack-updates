exact:Captains Log. Log 3. Location, Acidir.\n\nI’ve hardly had a moment to record my findings.\nNavigating Etern was a nightmare with those bloody Nutcrackers roaming the desert.\nWe were down to a crew of 26 after that veritable screw-up - and I’m afraid things have only gotten worse since we arrived on Acidir.\nBut first - my findings on Etern.\n\nA silver lining - I recovered a log from the corpse of a scientist pertaining to Cosmocos’ location.\nIt seems that he created some sort of AI for the sole purpose of retrieving these coordinates.\nUnfortunately, the AI seems to malfunction while reciting them...\n\nCertainly, it’s some system error in the mad-man’s machine.\nMost definitely.\nBut...for some reason, it feels to me that Cosmocos...does not want to be found.\nAnd yet the more I recall, the more intense my desire becomes to try and locate it.\nTo see the way the walls of crystal shimmer in the light of those strange bulbs that hang from the trees...\n\nI know that my dreary mind couldn’t create things of such beauty of its own accord.\nI’m far too boring for that.\n\nNevertheless.\nI left a log with the rising map on Atlantica, and I’ve discovered that the 6th letter of the coordinates is a lowercase Z. Zee. Zed.\n\nWe’ll soon be leaving Acidir.\n5 went mad after coming into contact with the Crescent of Curses and decided to go for a swim with the local pond life.\n3 ran screaming into the woods, and it’s been hours since we saw them.\nThe ship will fly soon when the conditions become too dangerous.\nIf they’re not back before then…\n\nOur next destination is Polarus.\nThis was the closest moon to Cosmocos before it’s disappearance.\nWe’ll stop by Gratar in lieu of the ramblings in the scientists log.\n\nThis is Cunningham. Signing off.=船长日志。日志3。地点，阿西迪尔。\n\n我几乎没有时间记录我的发现。\n在那些该死的胡桃夹子在沙漠中游荡的情况下，航行于埃特恩简直是一场噩梦。\n在那次彻底的失败之后，我们的船员只剩下26人——恐怕自从我们抵达阿西迪尔以来，情况只会变得更糟。\n但首先，我要分享一下我在埃特恩的发现。\n\n有一线希望——我从一位科学家的尸体中找到了一份日志，其中提到了科斯莫科斯的地点。\n看来他创造了某种人工智能，唯一的目的就是获取这些坐标。\n不幸的是，在背诵这些坐标时，人工智能似乎出现了故障……\n\n当然，这是那个疯子机器中的某种系统错误。\n绝对如此。\n但是……出于某种原因，我觉得科斯莫科斯……并不希望被发现。\n然而，我越回忆越觉得，我迫切需要找到它。\n想要看到那些水晶墙在树上悬挂的奇怪灯泡的光线下闪烁的样子……\n\n我知道，我那单调的心灵无法自行创造出如此美丽的事物。\n我太无趣了，无法做到这一点。\n\n尽管如此。\n我在大西洋的地图上留下一原木 我发现 6坐标的字母是小写Z泽。泽德\n\n我们很快就要离开阿西迪尔了。\n5号在与诅咒新月接触后变得疯狂，决定和当地的池塘生物一起游泳。\n3号则尖叫着跑进了森林，我们已经几个小时没有看到他们了。\n当条件变得过于危险时，飞船很快就会起飞。\n如果他们在此之前没有回来……\n\n我们的下一个目的地是波拉鲁斯。\n这是科斯莫科斯消失前最近的卫星。\n我们将在格拉塔尔停留，以代替科学家的日志中的描述。\n\n这里是坎宁安。结束报告。
exact:Captains Log. Log 4. Location, Polarus.\n\nFirst, my findings on Gratar.\nWe managed to trick that conniving AI into revealing the final letter to us.\nIt’s P.\nIt’s a capital P.\nIt’s smart - but we were smarter.\nThe ones of us that survived, anyway.\nI think it realised we were deceiving it and it decimated 10 of us.\nWe’re down to a pathetic team of 8, half of whom are too disturbed to carry on their duties as usual.\n\nOur ‘skeleton crew’ might be real skeletons, soon enough.\nBut I only need them to help pilot the ship for the last leg of our journey.\n\nBecause I’ve found it.\nI know where Cosmocos is.\n\n...I wonder if it felt the same loss that I felt...when I left?\nLike my heart was wrenched from my chest.\nTo get to know something...some- someone…so magnificent...to know that you leave them blighted...wounded and sick...\n\nI’ll be with you soon, old friend.\nI’ll heal you.\nI only need the opportunity.\nAnd then we’ll be one again.\n\nCunningham. Signing off.=船长日志。日志4。地点：波拉鲁斯。\n\n首先，关于格拉塔尔的调查结果。\n我们成功诱使那个心术不正的AI透露了最后的字母。\n是P。\n是一个大写的P。\n它很聪明——但我们更聪明。\n至少，我们中幸存下来的人都是如此。\n我认为它意识到我们在欺骗它，于是消灭了我们中的10个人。\n现在我们只剩下8个人，其中一半的人精神过于混乱，无法继续履行职责。\n\n我们的“骨架团队”可能很快就会变成真正的骨架。\n但我只需要他们来帮助我们驾驶飞船，完成最后的旅程。\n\n因为我已经找到了答案。\n我知道科斯莫科斯在哪里。\n\n……我想知道，当我离开时，它是否也感受到了同样的失落感……\n就像我的心被从胸腔中撕裂一样。\n能够了解某样东西……某个如此壮丽的存在……知道自己会留下它们受伤、痛苦……\n\n我会很快与您在一起，老朋友。\n我会治愈您。\n我只需要机会。\n然后我们就会再次合为一体。\n\n坎宁安。结束。
exact:Captain’s Log. Log 2. Location, Atlantica.\n\nAfter visiting Etern, we diverted course to Atlantica due to reports of ‘unnatural occurrences’ having taken place here.\nAnd I’m glad we did - most excitingly, we have discovered a map of Cosmocos on this small island not far from the mainland.\nWe lost a crewmate trying to swim over and resorted to using jetpacks instead.\nAnd despite our loss...seeing some evidence of Cosmocos was exhilarating.\nIt solidifies in my mind that these weren’t just delusions of mine, it was real.\nI was there.\nI saw it.\nI’m familiar with this terrain.\nI may not be able to recall with perfect clarity, but it is knowledge I possess.\nOr...possessed.\n\nAlso of significant note - a body was discovered on Etern along with a log not dissimilar to mine.\nI believe we’ve obtained another piece of the puzzle, so to speak.\nI’ve etched it into the map.\nPlease excuse my haste, Atlantica is sinking and I must return to the ship.\n\nOur course is set for Acidir.\nWith one less crewmate, we should be vigilant.\n\nCunningham, signing off.=船长日志。日志2。地点，亚特兰蒂卡。\n\n在访问了埃特恩之后，由于有报道称这里发生了“非自然现象”，我们改变了航线，前往亚特兰蒂卡。\n我很高兴我们这么做了——最令人兴奋的是，我们在不远处的一个小岛上发现了科斯莫科斯的地图。\n我们失去了一名船员，他试图游过去，最终不得不使用喷气背包。\n尽管有这个损失……但看到一些科斯莫科斯的痕迹真是令人兴奋。\n这让我确信这些并非我的幻觉，而是真实存在的。\n我确实在那里。\n我亲眼看到了。\n我对这片地形很熟悉。\n虽然我可能无法完全回忆起来，但这确实是我的知识。\n或者……曾经是我的知识。\n\n另外，值得注意的是——在埃特恩发现了一具尸体，以及一张与我的日志相似的记录。\n我认为我们获得了另一块拼图，可以这么说。\n我已经把它记在地图上了。\n请原谅我的匆忙，亚特兰蒂卡正在下沉，我必须返回飞船。\n\n我们的航线已确定，前往阿西迪尔。\n少了一名船员后，我们应该更加警惕。\n\n坎宁安，结束通话。
exact:Captain’s log. Log 1. Location: Infernis.\n\nNo information on the whereabouts of Cosmocos after its unusual disappearance.\n32 of us on the ground and found nothing of note.\nWe will be leaving shortly due to dangerous conditions...as if no one could have seen that coming.\nStepping off the ship was like walking into an oven.\nI am still struggling to recall any of the knowledge I possessed on Cosmocos - but there is something still urging me to continue in my pursuits.\n\nNext point of interest is the so-called Death Labs on Etern.\nNot an exciting prospect for the team, but they will manage.\n\nAfter that...Acidir.\nTo investigate the fantastically named Crescent of Curses.\nHoping it leads us in the direction of it’s true origins.\n\nThis is Cunningham, signing off.=船长日志。日志1。地点：因弗尼斯。\n\n关于科斯莫科斯异常失踪后的行踪，没有任何信息。\n我们中有32人留在地面上，没有发现任何值得注意的事情。\n由于危险的情况，我们将很快离开……仿佛没有人能预料到这一点。\n从飞船上下来就像走进了一个烤箱。\n我仍然努力回忆起我对科斯莫科斯的了解——但似乎还有某种力量在驱使我继续探索。\n\n下一个目标是位于埃特恩的所谓死亡实验室。\n这对团队来说并不是什么令人兴奋的事情，但他们会尽力应对。\n\n之后……是阿西迪尔。\n为了调查那个名字奇特的诅咒新月。\n希望它能引导我们找到它的真正起源。\n\n这是坎宁安，结束报告。
