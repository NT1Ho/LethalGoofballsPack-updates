exact:I really am cursed to live out my days recording with subpar recording devices.\n\nThis is professor Harrington and I have found myself to be on Utril.\nThe days may be darker than the nights yet it has a strange sense of beauty.\nIt is not a place I ever expected to visit.\nThe wildlife is unlike the usual, not very diverse.\nGenerally consistent of spore lizards and arachnids.\nIt was surprising to learn that it wasn't the spiders that were the aggressive ones here.\nThey were much more keen on posing for a picture.\nEither way,\nI'm needed back in the labs.\nProfessor Harrington, over and out.=我这辈子大概是中了诅咒，只配用蹩脚的录音器材。\n\n我是哈林顿教授，目前身在尤特里尔。这里白天也许比夜里还黑，却有种奇异的美。我从没想过自己会来这里。野生动物与惯常所见不同，种类不多，主要是孢子蜥蜴和蛛形动物。令人意外的是，这里有攻击性的居然不是蜘蛛。蜘蛛倒更乐意摆好姿势让我拍照。\n不说了，实验室需要我回去。\n哈林顿教授，通话结束。
exact:I remember that moment... clear as day.\nI was at work when I received a message from my wife Jane.'There's people in the house'.\nI told her to grab the gun from my desk and hide with the kids in the bedroom closet.\n'I am on my way' I said.\n\nWhile driving home I got a call from my nextdoor neighbor.\nShe said she heard screams and gunshots from our apartment.\nAnd that her husband called the police.\nI should have never gone home after I heard that...\n\nWhen I finally got home, I burst through the door and...\nI found her..\nOn the floor in the kitchen..\nShe had been shot multiple times and her body was partially flayed.\n\nAnd before I could even see what he did to my children, the cops ran in and I was arrested on the spot.\n\nBut as we drove away. I saw him I SAW HIM.\nHis crooked smile and those fiery eyes staring at me through the bushes, still covered in Jane's blood.\n\nI will never forget that face.=那一刻……我记得清清楚楚。上班时，我收到妻子简的消息：“家里有人。”我叫她拿上我书桌里的枪，带孩子们躲进卧室衣柜。“我马上回来。”我说。\n\n开车往家赶的时候，隔壁的邻居给我打电话。她听见我家里传来惨叫和枪声，说她丈夫已经报警了。听到这儿，我真不该再回去……\n\n终于赶到家，我撞开门……看见了她……躺在厨房地上……她中了好几枪，身上的皮被剥去了一部分。\n\n我甚至还没来得及看他对孩子们做了什么，警察就冲进来，当场把我铐走。\n\n可警车开走时，我看见他了。我看见了！他躲在灌木后，歪着嘴笑，那双像着了火的眼睛直盯着我，身上还沾着简的血。\n\n我绝不会忘记那张脸。
exact:I sought to become all=我曾想成为一切
exact:I thought I would write about our findings.\nDuring the excavation we laid eyes upon an ancient golden mask.\nI bet this is worth millions considering where it came from!\n\nIt was perhaps used by the ancient people of this moon.\nNot quite sure what for however. I do feel it has a creepy look to it.\nMaybe my fellow archeologist Jack might have an idea.\nHere's a sketch:=我想把我们的发现记下来。\n挖掘时，我们见到了一副古老的黄金面具。\n光凭它的来历，我敢说这东西就值好几百万！\n\n也许这颗卫星上的古人曾用过它。\n至于做什么用，我说不好。它的模样倒是让我有点发毛。\n也许我那位考古同行杰克能看出些门道。\n草图如下：
exact:I understand that I am writing on an official document but I have overheard something I feel like I shouldn't have. However it seems important enough to have it written down for later.\nWhile I walked through the halls near the office secions. I heard a faint discussion through one of the closed doors.\nIt was the Emperor talking to his closest agent.\n\nWhile I do not exactly recall what was said, I do remember them discussing the case as it stands. Their strategy is unusual.\nThe agent seemed sceptical while the Emperor remained adamant. Understandibly so.\n\nApparently their next argument will be that biological weapons might come in use if, say, a swarm of unidentified lifeforms from beyond the known regions invade that of ours.\nNot impossible but certainly not plausible.\n\nI am going to try figuring out more about the Emperor's plans.=我知道这是份正式文件，可我无意中听到了不该听的事。它重要到值得记下来，留作日后查证。经过办公区附近的走廊时，一扇紧闭的门后传出隐约的交谈声。是皇帝和他最亲信的特工。\n\n具体用词记不清了，只记得他们在讨论眼下的案子。策略颇不寻常。特工似有疑虑，皇帝却毫不动摇。也可以理解。\n\n他们下一条论据似乎是，假如已知区域之外有大批未知生命入侵，我们就可能用得上生物武器。不能说绝无可能，可也实在难以置信。\n\n我会试着进一步查清皇帝的计划。
exact:I wanted to give an update to my time here.\nThe cloning process is very complex but the technology is easy to produce.\nWhen they explained to me the current state of the project I was told that they had figured out how to grow a spore lizard from practically nothing to a fully functioning adult in the matter of days.\nHowever there was one fatal flaw.\nDue to GYN-H chemicals used in the process of speeding up the development of the creature, a unique form of cancer would grow in the brain which, after about a month would kill it.\nBut I think I came up with a solution, LYN-H is a very similar chemical to GYN-H, It's only down one component.\nI've theorised this could be the required change.\nProfessor Harrington, over and out.=记一下我在这里的近况。克隆的过程很复杂，技术本身却容易复制。他们向我介绍项目进展时说，已经能在几天内几乎从零开始，培育出一只机能完备的成年孢子蜥蜴。\n但有个致命缺陷：为加速发育而使用的 GYN-H 会导致大脑长出一种特殊肿瘤，大约一个月后就会致死。\n不过，我想到了一个可能的解决办法。LYN-H 与 GYN-H 十分相似，只少一种成分。我推测，需要的改变或许恰恰就是这一点。\n哈林顿教授，通话结束。
exact:I was there=我当时在场
exact:I was uneased before, now I'm scared.\nI have seen some of the equipment scattered around the caverns. Abandoned by whomwever used to work here. Possibly left in an emergency I thought. But then I started seeing bones and bodies.\nThere were empty birdcages sitting on the floor about an hour back. My theory is that there might be something toxic in the air. Possibly some sort of gas leak. Suffocating everyone who was down here at the time. It could be in the air still.\nEither way, I need to make it quick. The rumbling is getting closer. And I do not entertain what that could mean.=刚才还只是不安，现在我害怕了。洞穴里散落着设备，是以前在这儿干活的人丢下的。我起先琢磨，他们大概遇到紧急情况，走得匆忙。可接着我看见了骨头和尸体。\n大约一小时前，我还看见地上摆着空鸟笼。我怀疑空气里有毒，也许是某种气体泄漏，把当时井下的人全闷死了。那气体现在可能还在。\n无论如何，我得快点。隆隆声越来越近，我不愿去想那意味着什么。
exact:I woke up to screams of terror.\nThe city is sinking!\n\nAll is flooded we need to leave.\nOnly the bridge can save us!\n\n... The bridge is gone. No hope.\nI need to find a higher point.\nGoodbye=我被惊恐的尖叫声吵醒。\n城市在下沉！\n\n到处都淹了，我们得走。\n只有那座桥能救我们！\n\n……桥没了。没希望了。\n我得找个更高的地方。\n再见。
exact:I woke up to screams of terror.\nThe city is sinking!\n\nAll is flooded we need to leave.\nWill the bridge be gone?\n\nIt's gone! I need to find a higher point.\nGoodbye=我被惊恐的尖叫声吵醒。\n城市在下沉！\n\n到处都淹了，我们得走。\n那座桥会不会已经没了？\n\n没了！我得找个更高的地方。\n再见。
exact:I woke up to screams of terror. But less than in my dreams.\nThe city is sinking! Again!\n\nSomething is wrong.. This is.. unnatrual.\nAll who died are gone this time.\nI saw a platform rise around 5pm.\nI need to find a higher point.\n That way I will survive.=我被惊恐的尖叫声吵醒。比梦里听见的少些。\n城市在下沉！又来了！\n\n不对劲……这……不正常。\n这一次，死去的人全都不见了。\n我看见一座平台在下午 5 点左右升起。\n我得找个更高的地方。\n这样我就能活下来。
exact:I'll never stop coming for you=我永远不会停止追你
exact:I'll take you with me...=我要带你一起走……
exact:I'm listening=我在听
exact:I've been here for 4 weeks. I've learned much.\nI have gotten used to the procedures and the protocols of this place.\nDespite what it might seem from the perspective of the workers below.\nBeing a guard here is a differnt kind of imprisoning.\nInstead of constant physical labour you're put through committing actions that'll break a man.\nWhile I don't share the same chains as those below.\nI feel just as shackled.\n\nHowever, I know my way to the upper layers.\nI have seen him. He takes two smoke breaks by the left most fire exit at the bottom. Usually around 11am and 7pm.\nThe only place that's not monitored here is a small storage closet near the stairs atop the upper floor.\nIf I can sneak in there. With the right timing...\nI can give him what he deserves.=我来这里已经 4 周，学到了不少。这里的程序和规章，我都熟悉了。下面那些工人眼里，看守或许挺自在。其实当看守，不过是另一种坐牢。工人不停地出力，我们却被逼着干足以把人逼垮的事。我戴的不是他们那副镣铐，却觉得自己被锁得一样牢。\n\n不过，我知道怎么上去。我见到他了。他每天到最底层最左边的消防通道抽两次烟，通常在上午 11 点和晚上 7 点。这里只有一处没有监控：上层楼梯顶端附近的小储物间。要是能溜进去，再算好时间……\n我就能让他付出应有的代价。
