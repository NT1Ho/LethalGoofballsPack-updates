exact:G.A.R.Y. : Unregistered personel found within the factory.\n\nG.A.R.Y. : Alert, all employees must die.\n\nCunningham : We don't work here.\n\nG.A.R.Y. : Alert, all intruders must die.\n\nCunningham : Aren't intruders supposed to be arrested?\n\nG.A.R.Y. : Alert, this is.. correct.\n\nCunningham : Arest us.\n\nG.A.R.Y. : Alert, all intruders are now under arrest. Calling management for questioning.\n\nCunningham : Management has arrived.\n\nG.A.R.Y. : I killed management, following code 5, all intruders must die.\n\nCunningham : UH I'M M NEW!\n\nG.A.R.Y. : Alert, order overwritten, awaiting new orders.\n\nCunningham : Tell me the hidden code of finding Cosmocos.\n\nG.A.R.Y. : The hidden code is,\n\n[DATA CORRUPTED]\n\nCunningham : That was easier than expected.\n\nG.A.R.Y. : Alert, no records of new management has been found, following code 5, all intruders must die.\n\nCunningham : OH MOTHERF-=G.A.R.Y.：在工厂内发现未登记人员。\n\nG.A.R.Y.：警报，所有员工必须死。\n\n坎宁安：我们不是这儿的员工。\n\nG.A.R.Y.：警报，所有入侵者必须死。\n\n坎宁安：入侵者不是应该被逮捕吗？\n\nG.A.R.Y.：警报，这……没错。\n\n坎宁安：逮捕我们吧。\n\nG.A.R.Y.：警报，所有入侵者现已被捕。正在联系管理层前来审问。\n\n坎宁安：管理层到了。\n\nG.A.R.Y.：管理层已被我杀死。依据第 5 号规程，所有入侵者必须死。\n\n坎宁安：呃，我、我是新来的！\n\nG.A.R.Y.：警报，命令已被覆盖。等待新指令。\n\n坎宁安：告诉我寻找 Cosmocos 的隐藏代码。\n\nG.A.R.Y.：隐藏代码是——\n\n[DATA CORRUPTED]\n\n坎宁安：比想象中容易。\n\nG.A.R.Y.：警报，未发现新任管理层的记录。依据第 5 号规程，所有入侵者必须死。\n\n坎宁安：我靠——
