exact:HAILEY ROBERTSON\n\nFirst name: Hailey\nLast name: Robertson\nMiddle name: -\n\nGender: F\nAge: 32\n\nOccupation: Nurse\nEstablishment: Crosswind Mental Hospital\nPlace: Last Hope\n\nCause of death: Poisoning\n\nHailey Robertson was found deceased in the treatment room of the Crosswind Mental Hospital, She had signs of physical abuse, lacerations to the back and chest, and a small hole was discovered in her forehead.\n\nA notebook was recovered from a burning bin containing a detailed log of the experiments she was put through. Among which were, being forcefully exposed to violent videos of human torture for days on end without breaks. Being suffocated to the edge of death causing minor brain damage. Having her solve complex logic puzzles within certain timeframes and being punished for failing.\n\nShe was often reminded how her four year old son would not be able to survive without her as she was a single mother. This was with the promise of her being let go if she complied.\nUnfortunately he also died of starvation during her capture.\n\nA tiny rod was used to destroy a small part of her brain which likely led to her losing any sort of self. This was one of the final experiments listed within the notebook.\n\nHailey Robertson was one of many victims of such experiments and life altering treatments by the hands of Solover Underhill, the head psychiatrist of the Crosswind Mental Hospital.\n\nShe was a loving, hard working mother who had a hard time following her husband’s passing. She was full of courage and remained positive even during her hardest times.\nShe will be remembered by all.\nMay she Rest in Peace.\n\n—-----------------------------------------\n\nShe is here\nShe has a heart of vengeance\nDo not disturb her=海莉·罗伯逊\n\n名：海莉　姓：罗伯逊　中间名：—\n性别：女　年龄：32\n职业：护士　工作单位：横风精神病院　地点：最后的希望\n死因：中毒\n\n海莉·罗伯逊被发现死于横风精神病院的治疗室。她身上有遭受虐待的痕迹，背部和胸口有撕裂伤，前额有一个小孔。\n调查人员从燃烧的垃圾桶里抢救出一本笔记，详细记录了她遭受的实验。她被迫一连数日不间断地观看折磨他人的暴力录像，被掐到濒死，造成轻微脑损伤。她还必须在规定时间内解开复杂的逻辑谜题，失败就要受罚。\n他们反复提醒她，她是单身母亲，四岁的儿子没她就活不下去，又许诺只要配合就放她走。不幸的是，她被囚禁期间，孩子也饿死了。\n他们用一根细杆破坏了她的一小部分脑组织，她很可能因此彻底失去了自我。这是笔记中最后几项实验之一。\n横风精神病院的首席精神科医生索洛弗·安德希尔用这些实验和治疗毁掉了许多人的一生，海莉只是其中之一。\n她是个勤劳慈爱的母亲。丈夫过世后，她过得很艰难，却始终勇敢，即使在最苦的时候也没有失去希望。\n所有人都会记得她。愿她安息。\n\n————————\n她就在这里\n她一心想要复仇\n不要惊扰她
