exact:CORPSE CRAWLER\r\n\r\nScientific name: Cerec-retoma\r\nThe Cerec-retoma is a device made up of a hollowed rotting corpse stuffed with machinery using parts of the nervous system as internal wiring to reduce the cost of creation. The body itself seems to serve no other purpose other than to keep the components together. Hence how it has earned the name “Corpse crawler”.\r\n\r\nIt walks around through the means of four hydraulic legs which use various liquids drained from the body among which are spinal fluid and blood rather than water. The extraction happens shortly after the insertion which as a side effect severs the spine and the head from the body in a very short, yet painful method.\r\n\r\nThe body is riddled with spikes protruding through the flesh and skin and can be used as a defensive method against anything that seeks to attack or destroy it.\r\n\r\nThese devices were likely designed and produced by the Trite Control Corporation as the first appearances were sighted on celestial bodies surrounding the fractured remains of the Triton Empire shortly after the creation of the corporation in 2249. There they acted as remotely controlled scouts being able to search and explore through the cameras hidden within the head of the device. The usage of a human body with their organs as components meant that these scouts are purposefully temporary. The rot of the corpse making it near impossible to understand what its original internals may have looked like before deactivation.\r\nLater models discovered around 2296 no longer possessed the ability of being remotely controlled but were instead fully autonomous.\r\n\r\nThe corpse crawler bears a striking resemblance to the Areck-hetoma, otherwise known as the Arachnohead which was likely an inspiration for the design.=CORPS 回收公司\r\n\r\n科学名称：Cerec-retoma\r\nCerec-retoma是一种由中空腐烂的尸体构成的装置，内部填充了各种机械部件，并利用神经系统的部分结构作为内部连接，从而降低了制造成本。这个“尸体”本身似乎没有其他用途，只是用来固定这些部件而已。因此，它才获得了“尸体爬行者”这一名称。\r\n\r\n它通过四条液压腿移动，这些腿使用从体内提取的各种液体，其中包括脊髓液和血液，而非水。提取过程在插入之后不久进行，其副作用是以一种非常短暂但痛苦的方式将脊柱和头部与身体分离。\r\n\r\n这个身体布满了从肉体和皮肤中突出的尖刺，可以作为防御手段，抵御任何试图攻击或破坏它的生物。\r\n\r\n这些设备很可能是由特赖特控制公司设计和制造的。它们首次出现在特赖特帝国残骸周围的天体上，那是在该公司在2249中成立后不久。在这些天体上，这些设备充当了远程控制的侦察器，能够通过设备头部隐藏的摄像头进行搜索和探索。由于这些设备使用了人体器官作为部件，因此这些侦察器是临时性的。由于尸体的腐烂，很难了解它们在停用前的原始内部结构。\r\n在 2296 左右发现的后续型号不再具备远程控制功能，而是完全实现了自主运行。\r\n\r\n这种尸体爬行者与Areck-hetoma有着惊人的相似之处，后者也被称为Arachnohead，很可能是该设计的灵感来源。
