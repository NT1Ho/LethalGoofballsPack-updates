exact:Backwater Gunkfish\n\nSigurd's danger level: 0% but these little goopy goblins wont leave me ALONE\n\nScientific name: Infectum linteum\n\nThe Backwater Gunkfish is a type of Gunkfish of the family Mobulidae. Unlike the other types of Gunkfish, the Backwater Gunkfish spends most of its time on land. It can inhabit any damp, warm space where a water source is present. Its body is fat, flat, squishy and gelatinous, the width of a doormat. Its tail, slightly harder than the rest of its soft body, can range from 2-3 feet in length. When stressed, its tail is often curled up over its head to position for firing mucus or to shake and rattle as a deterrent.\n\nThe Backwater Gunkfish feeds off organic material on surfaces, and for this reason, it is found most often around polluted water, swamps, or dirty sewers. When frightened, the Gunkfish can use an opening in its tail to release a burst of a thick, green mucus mixed with saliva to defend itself; the Backwater Gunkfish keeps an especially large "reserve" for emergency situations and can squirt multiple times. When needed, it uses part of this extra reserve to excrete from its body, increasing its mobility on land.\n\nThe Backwater Gunkfish is harmless and is considered a natural cleaner of its preferred environments. Its mucus is a disinfectant; though it is not safe or healthy to consume, it is unlikely to cause major harm if it enters the body through the eyes or nose. Its smell is often described as a mix of vinegar and lard, and it is slightly warm when freshly excreted.\n\nThough not directly harmful, the Backwater Gunkfish is often considered a notorious pest to water treatment facilities and petroleum refineries. The gunkfish itself is evasive, capable of fitting itself into very small holes and pipes, and its mucus is arduous to remove once it has hardened, forming a substance comparable to ice. For all these reasons, the Backwater Gunkfish has lead to many accidents and should be taken seriously. Today, pest removal services are well-accustomed to safe Gunkfish removal and relocation operations, and there are many affordable options if you believe there is one in the area. The best way to prevent a Gunkfish infestation is to keep your environment clean and dry and to close off any access to standing water.=后水黏鱼\n\n西格德的危险等级：0%，但这些黏糊糊的小妖精不会让我独自待着\n\n学名：Infectum linteum\n\n后水黏鱼是黏鱼科的一种黏鱼。与其他黏鱼不同，后水黏鱼大部分时间都在陆地上生活。它可以在任何有水源的潮湿温暖环境中生存。它的身体呈脂肪状，扁平、柔软且像胶状物，宽度相当于一块门垫。它的尾巴比身体其他部分更硬，长度在2-3英尺之间。当受到压力时，它的尾巴会卷曲在头上，用于喷射黏液或作为威慑而摇晃和发出响声。\n\n后水黏鱼以表面上的有机物质为食，因此经常出现在被污染的水域、沼泽或肮脏的下水道中。受到惊吓时，黏鱼会用尾巴上的开口释放一股混合了唾液和黏液的绿色黏液来防御自己；后水黏鱼会储存大量黏液以备紧急情况使用，并且可以多次喷射。在需要时，它会用部分额外的黏液来排出体外，从而提高在陆地上的移动能力。\n\n后水黏鱼是无害的，被认为是其栖息地环境的天然清洁者。它的黏液具有消毒作用；虽然食用它既不安全也不健康，但如果通过眼睛或鼻子进入体内，也不太可能造成严重的伤害。它的气味常被描述为醋和猪油混合的味道，刚排出时会有轻微的温暖感。\n\n尽管后水黏鱼本身并不直接造成伤害，但它通常被认为是水处理设施和石油精炼厂的严重害虫。这种黏鱼非常难以捕捉，能够钻入非常小的孔洞和管道中，而且一旦黏液硬化，就很难清除，形成的物质类似于冰。由于这些原因，后水黏鱼经常导致许多事故，因此应该予以重视。如今，害虫清除服务已经非常擅长安全移除和转移黏鱼，如果你认为某个区域有黏鱼，有很多经济实惠的选择。预防黏鱼侵扰的最佳方法是保持环境清洁干燥，并关闭任何通往积水的地方。
