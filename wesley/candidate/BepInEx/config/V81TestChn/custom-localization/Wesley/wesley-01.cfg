exact:At the behest of Captain Donahue, I am to record my own personal experiences here on Cosmocos.\n\nI was first to stumble upon this strange extraterrestrial lifeform.\nIt seemed to be, upon first glance, perhaps a plant, or something akin to coral - something like Diploria.\nBut when I placed my hand upon it, even through my suit, I felt - I felt as if incredible knowledge was poured into me.\nKnowledge of things vastly unfamiliar and unbelievably alien to me - but also of things familiar, things around me that others had been educated on, but I’d never had the opportunity to learn.\nIt was incredible, exhilarating.\nUnlike anything I’ve ever experienced.\n\nBut the most exhilarating thing of all was this unusual connection I feel that I’ve fostered with this thing.\nThis being.\nIn a sense, it felt...like a person, is perhaps the best way to put it, in terms we are capable of understanding.\nLike Cosmocos isn’t just a moon.\nLike it’s...a huge, alien life-form, sitting here in space with its own incredible ecosystem.\n\nBizarre as it may be, I can say with confidence that I could feel what seemed to be a rush of emotions from Cosmocos itself.\nI still feel it now, in truth.\nWhich sounds like insanity, doesn’t it? But it was beautiful.\nLike a rush of warmth, kindness, generosity.\nI really feel like Cosmocos wants to teach us things.\nLike it wants to help us grow and nurture us.\n\nThe Captain has commanded that no one is to interact with this celestial brain aside from himself for our own safety.\nI do feel slightly disheartened by this, as I was hoping to commune with it again.\n\nI have so much more to say.\nIt’ll be difficult to record all of this knowledge I’ve been gifted with in a comprehensible format on these recorders, but I’ll do my best over the next few cycles.\n\nLieutenant Commander Cunningham, signing off.=应多纳休船长的要求，我将在这里记录我在Cosmocos上的个人经历。\n\n我第一个偶然发现了这种奇特的外星生命形式。\n乍一看，它似乎是一种植物，或者类似于珊瑚的东西——像是 Diploria 之类的生物。\n当我把手放在它上面时，即使穿着防护服，我也能感觉到——仿佛有无数的知识倾注进了我的体内。\n也了解我周围的熟悉事物, 其他人曾接受过教育, 但我从来没有机会学习。\n这真是令人难以置信、令人兴奋不已。\n与我所经历过的任何事情都不同。\n\n但最令人兴奋的是，我感觉到自己与这个事物之间建立了一种不同寻常的联系。\n这是。\n从某种意义上说，它感觉……就像一个人，或许用这个我们能理解的方式来形容最为恰当。\n就像宇宙号并不只是月亮。\n就像是一个巨大的、外星的生命体，它独自存在于太空中，拥有自己令人难以置信的生态系统。\n\n尽管这听起来很奇怪，但我可以肯定地说，我能感受到来自Cosmocos本身的某种情绪冲击。\n说实话，我现在仍然有这种感觉。\n这听起来像是精神错乱,但它是美丽的。\n像一股温暖、善良和慷慨的力量。\n我真的觉得Cosmocos想要教给我们一些东西。\n就像它想要帮助我们成长和培育我们一样。\n\n根据命令，为了我们的安全，除了船长本人之外，其他人不得与这个天体大脑进行任何交互。\n我确实对此感到有些失望，因为我原本希望能再次与之交流。\n\n我还有很多话要说。\n将这些我所获得的知识以易于理解的格式记录下来是非常困难的，但我会在接下来的几个周期里尽力做到这一点。\n\n副指挥官坎宁安签名确认。
