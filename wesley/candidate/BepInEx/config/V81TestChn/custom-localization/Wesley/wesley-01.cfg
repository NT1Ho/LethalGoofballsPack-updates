exact:Captains Log. Log 3. Location, Acidir.\n\nI’ve hardly had a moment to record my findings.\nNavigating Etern was a nightmare with those bloody Nutcrackers roaming the desert.\nWe were down to a crew of 26 after that veritable screw-up - and I’m afraid things have only gotten worse since we arrived on Acidir.\nBut first - my findings on Etern.\n\nA silver lining - I recovered a log from the corpse of a scientist pertaining to Cosmocos’ location.\nIt seems that he created some sort of AI for the sole purpose of retrieving these coordinates.\nUnfortunately, the AI seems to malfunction while reciting them...\n\nCertainly, it’s some system error in the mad-man’s machine.\nMost definitely.\nBut...for some reason, it feels to me that Cosmocos...does not want to be found.\nAnd yet the more I recall, the more intense my desire becomes to try and locate it.\nTo see the way the walls of crystal shimmer in the light of those strange bulbs that hang from the trees...\n\nI know that my dreary mind couldn’t create things of such beauty of its own accord.\nI’m far too boring for that.\n\nNevertheless.\nI left a log with the rising map on Atlantica, and I’ve discovered that the 6th letter of the coordinates is a lowercase Z. Zee. Zed.\n\nWe’ll soon be leaving Acidir.\n5 went mad after coming into contact with the Crescent of Curses and decided to go for a swim with the local pond life.\n3 ran screaming into the woods, and it’s been hours since we saw them.\nThe ship will fly soon when the conditions become too dangerous.\nIf they’re not back before then…\n\nOur next destination is Polarus.\nThis was the closest moon to Cosmocos before it’s disappearance.\nWe’ll stop by Gratar in lieu of the ramblings in the scientists log.\n\nThis is Cunningham. Signing off.=船长日志 3。地点：阿西迪尔。\n\n我几乎抽不出时间记录调查结果。埃特恩的沙漠里到处游荡着那些该死的胡桃夹子，想找条路简直是噩梦。\n那次行动彻底搞砸了，船员只剩 26 人。到了阿西迪尔，情况恐怕更糟。不过先说说在埃特恩的发现。\n\n坏消息里总算有件好事：我从一位科学家的遗体上找到一份日志，里面提到了科斯莫科斯的位置。\n他似乎专门造了个 AI 来取得这组坐标。可惜那 AI 一念坐标就像出了故障……\n\n一定是那疯子的机器出了点系统错误。\n肯定是。\n可……不知为什么，我总觉得科斯莫科斯……不想让人找到。可我想起的事越多，就越渴望找到它。想再看一眼树间垂下的奇异灯泡，看水晶墙在那光里闪烁……\n\n我这颗乏味的脑袋，绝不可能凭空想出那么美的东西。我可没那本事。\n\n回到正题。\n我在亚特兰蒂卡升起的地图旁留了一份日志。我已经查明：坐标的第 6 个字母是小写 z。Zee。Zed。\n\n我们很快就要离开阿西迪尔。5 个人接触诅咒新月后发了疯，决定跳进池塘，和里面的生物一起游泳。还有 3 个人尖叫着冲进树林，已经几个小时没见到他们了。环境一旦危险到不能再待，飞船就会起飞。要是他们到那时还没回来……\n\n下一站是波拉鲁斯。科斯莫科斯消失前，它是离那里最近的卫星。考虑到那科学家在日志里的那番胡话，我们会在格拉塔尔停一下。\n\n我是坎宁安，通话完毕。
exact:Captains Log. Log 4. Location, Polarus.\n\nFirst, my findings on Gratar.\nWe managed to trick that conniving AI into revealing the final letter to us.\nIt’s P.\nIt’s a capital P.\nIt’s smart - but we were smarter.\nThe ones of us that survived, anyway.\nI think it realised we were deceiving it and it decimated 10 of us.\nWe’re down to a pathetic team of 8, half of whom are too disturbed to carry on their duties as usual.\n\nOur ‘skeleton crew’ might be real skeletons, soon enough.\nBut I only need them to help pilot the ship for the last leg of our journey.\n\nBecause I’ve found it.\nI know where Cosmocos is.\n\n...I wonder if it felt the same loss that I felt...when I left?\nLike my heart was wrenched from my chest.\nTo get to know something...some- someone…so magnificent...to know that you leave them blighted...wounded and sick...\n\nI’ll be with you soon, old friend.\nI’ll heal you.\nI only need the opportunity.\nAnd then we’ll be one again.\n\nCunningham. Signing off.=船长日志 4。地点：波拉鲁斯。\n\n先说格拉塔尔的收获。我们设法骗过那个诡计多端的 AI，让它说出了最后一个字母。\n是 P。\n大写 P。\n它很聪明，可我们更胜一筹。至少活下来的这几个算是吧。\n我想它发现我们在骗它，一下子就杀了我们 10 个人。现在只剩可怜的 8 个，其中一半受惊太重，已经没法照常当值了。\n\n如今只有几副骨头撑着这条船，再过不久，没准真就剩骨头了。不过我只需要他们帮忙把最后这一程开完。\n\n因为我找到了。\n我知道科斯莫科斯在哪儿了。\n\n……我离开时，它是不是也和我一样，觉得失去了什么……\n像是心被硬生生从胸口扯了出去。能认识一个如此美好的东西……一位……一个如此美好的朋友，却明知自己留下的是一个遭到摧残、伤病交加的它……\n\n老朋友，我很快就来陪你。\n我会治好你。\n我只需要一个机会。\n到那时，我们就又能合为一体。\n\n坎宁安，通话完毕。
exact:Captain’s Log. Log 2. Location, Atlantica.\n\nAfter visiting Etern, we diverted course to Atlantica due to reports of ‘unnatural occurrences’ having taken place here.\nAnd I’m glad we did - most excitingly, we have discovered a map of Cosmocos on this small island not far from the mainland.\nWe lost a crewmate trying to swim over and resorted to using jetpacks instead.\nAnd despite our loss...seeing some evidence of Cosmocos was exhilarating.\nIt solidifies in my mind that these weren’t just delusions of mine, it was real.\nI was there.\nI saw it.\nI’m familiar with this terrain.\nI may not be able to recall with perfect clarity, but it is knowledge I possess.\nOr...possessed.\n\nAlso of significant note - a body was discovered on Etern along with a log not dissimilar to mine.\nI believe we’ve obtained another piece of the puzzle, so to speak.\nI’ve etched it into the map.\nPlease excuse my haste, Atlantica is sinking and I must return to the ship.\n\nOur course is set for Acidir.\nWith one less crewmate, we should be vigilant.\n\nCunningham, signing off.=船长日志 2。地点：亚特兰蒂卡。\n\n离开埃特恩后，我们因这里有“反常现象”的报告改航亚特兰蒂卡。幸好来了：离大陆不远的一座小岛上，竟有一幅科斯莫科斯的地图。\n一位船员试图游过去时丧生，我们只得改用喷气背包。尽管失去了同伴……见到科斯莫科斯确实存在的证据，还是让我激动不已。\n我越发确信那不是我的臆想。它是真的。\n我去过那里。\n我亲眼见过。\n我熟悉那片地形。我的记忆也许不够清晰，但我是知道的。\n或者说……曾经知道。\n\n还有一件大事：在埃特恩发现了一具尸体，旁边有份和我的颇相似的日志。可以说，我们又拼上了一块拼图。我把它刻进了地图。\n恕我写得仓促，亚特兰蒂卡正在下沉，我必须赶回飞船。\n\n航向已设为阿西迪尔。我们少了一名船员，千万要保持警惕。\n\n坎宁安，通话完毕。
exact:Captain’s log. Log 1. Location: Infernis.\n\nNo information on the whereabouts of Cosmocos after its unusual disappearance.\n32 of us on the ground and found nothing of note.\nWe will be leaving shortly due to dangerous conditions...as if no one could have seen that coming.\nStepping off the ship was like walking into an oven.\nI am still struggling to recall any of the knowledge I possessed on Cosmocos - but there is something still urging me to continue in my pursuits.\n\nNext point of interest is the so-called Death Labs on Etern.\nNot an exciting prospect for the team, but they will manage.\n\nAfter that...Acidir.\nTo investigate the fantastically named Crescent of Curses.\nHoping it leads us in the direction of it’s true origins.\n\nThis is Cunningham, signing off.=船长日志 1。地点：因弗尼斯。\n\n自从科斯莫科斯离奇消失，至今仍没有它的下落。我们 32 人下到地面，一无所获。\n环境太危险，很快就得走……说得好像谁都没料到一样。一出船舱就像走进烤炉。\n我仍想不起自己在科斯莫科斯时掌握的那些知识，可总有个念头催我继续追寻。\n\n下一个要查的地方是埃特恩上所谓的“死亡实验室”。这可不是什么能让队员们高兴的差事，不过他们应付得来。\n\n再之后……阿西迪尔。去调查那件名字起得煞有介事的“诅咒新月”。希望能借此查出它究竟来自哪里。\n\n我是坎宁安，通话完毕。
