exact:Ah well would you look at that\nI think I got this thing workin\nMight serve me some entertainment in these caves\nIt's not easy spendin all day down here\nCan't see the sun, can't read the time\nIt's actually quite sad\nDiggin for these shiny crystals and I don't even kno what they are\nThey were sendin birds in earlier\nHaven't heard from them since\nAh well\nBetter get back to work=哟，你瞧。\n这玩意儿好像真让我修好了。\n窝在洞里，多少有个解闷的了。\n整天待在底下可不好受。\n看不见太阳，也不知道几点。\n想想还挺惨。\n天天挖这些亮晶晶的东西，连它们是什么都不知道。\n先前他们往里送了些鸟。\n后来就再没动静了。\n唉，算了。\n回去干活吧。
