exact:And every night he went back to that spot.\nHoping to see that light again.\nBut he didn't. For days he waited, hoping.\nAnd it wasn't until the seventh day when he heard it again. He saw it in the sky.\nHe was certain it was real.\nThe message was equally vague. Now he was determined.\n\nHe explained it to his friends. It took a lot of convincing to get them to join him for one night.\n\nAnd that night it was there. They all saw it. Moving across the sky.\nYet only he was able to hear it.\nBut they believed him.\nThey weren't sure what to make of it.\nThey all sat there, pondering, wondering.\nWhat or... who is this?=每晚他都会回到那个地方，\n希望再次看到那道光芒。\n但他没有。他等待了好几天，满怀希望。\n直到第七天，他才再次听到那道光芒。他在天空中看到了它。\n他确信那是真的。\n那道光芒的含义同样模糊不清。但现在，他下定决心了。\n\n他向朋友们解释了这一切。要让他们同意与他会合一个晚上，需要很大的说服力。\n\n那个夜晚，那道光芒果然出现了。他们都看到了它，它在天空中移动。\n然而，只有他能听到那道光芒。\n但他们相信了他。\n他们不确定该如何理解这件事。\n他们都坐在那里，思考着，疑惑着。\n这究竟是什么？或者……这是谁呢？
