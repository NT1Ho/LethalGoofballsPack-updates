exact:FOREST ELDER\r\n\r\nSigurd's danger level: 50%\r\n\r\nScientific name: Satyrid-derceritas\r\nA very close relative to the Satyrid-proceritas. The Elders are a nearly extinct subspecies which are able to grow nearly twice as tall as the Forest Keepers due to their living conditions. However it is also because of their preferred environment that they never seek to leave the dense jungles which have become increasingly rarer.\r\nThe Forest Elder shares a striking resemblance with its smaller counterpart. The main difference being a slightly whiter appearance and their eyes having a red protective layer against attacks from avian wildlife.\r\n\r\nIt has been known that some tribes take the Elders as higher beings, believing they are men chosen by gods who have transformed to become the protectors of the woods they live in.\r\n\r\nDue to the striking similarity to the Forest keeper, read the data entry about the Forest keeper for more information on the Elder’s visual and physical evolution.=森林长者\n\n西格德的危险等级：50%\n\n学名：Satyrid-derceritas\n森林长者是 Satyrid-proceritas 的近亲，也是一个濒临灭绝的亚种。得益于栖息地的条件，它们的身高能长到森林守卫的近两倍。也正因对环境挑剔，它们从不主动离开日渐稀少的茂密丛林。\n长老与体型较小的近亲极为相似。最显著的不同是体色略白，眼部覆有一层红色保护膜，用来抵御鸟类袭击。\n\n据记载，有些部落将长老奉为高等存在，相信它们原本是被神选中的人，后来化作了栖身之林的守护者。\n\n两者相似之处甚多。想了解长老的视觉和身体如何演化，可参阅森林守卫的图鉴条目。
