exact:I AM IN SHOCK!\nWhen Jack came in earlier he was completely covered in blood!\nHe has lost his mind!\nHe was holding the dagger in his right hand and the mask in his left held before his face.\nHe looked at me.\nChanting soem unrecognisable words before he walked away. Seemingly heading outside.\n\nI am not sure if he killed an animal or..\nI need to make sure Dave is ok.\nI don't want to be alone with Jack the lunatic.\nMaybe I should go look what's outside.\n\nI fear the worst.=我震惊了！\n当杰克早些时候进来时，他的全身都沾满了血迹！\n他已经失去理智了！\n他右手握着匕首，左手则戴着面具，遮住了他的脸。\n他看着我。\n他边念着那些难以辨认的词语，边离开。似乎是要走向外面。\n\n我不确定他是杀了一头动物，还是……\n我需要确保戴夫没事。\n我不想和那个疯子杰克单独在一起。\n也许我该去看看外面有什么\n\n我担心最坏的情况会发生。
