exact:I am nearing my day of birth yet again. It will be the twenty first.\nWhile to most it would seem a day of happiness.\nI look at it the opposite.\nThis year I have graduated for a course I was happy to start.\nBut time has shown that it might not be within my interest in this form.\nTherefor I feel a part of life was wasted. I have yet to understand what I truly want to do with the years that remain.\nI feel like a rock in a river. With life flowing around me. Unmoved. Waiting for change. Change that might never come if I stay this way.=我又即将迎来自己的出生日了。今天就是二十一号。\n对大多数人来说，这似乎是一个幸福的日子。\n但我却觉得恰恰相反。\n今年我完成了一门我原本很乐意学习的课程。\n但时间已经证明，以这种方式可能并不符合我的兴趣。\n因此，我觉得生命的一部分被浪费了。我仍然不明白自己真正想用剩下的岁月去做什么。\n我感觉自己就像河中的一块石头，生命在周围流淌，我却毫无反应，只是等待变化。如果继续这样下去，也许永远都不会有变化了。
exact:I am nowhere=我不属于任何地方
exact:I am trying to compose myself. I must stay strong in front of her. I must be there for her. They took Julie. Me and the others in the building ran for the metro while they broke through the barrier. We went building by building. She was right there with me. We kept running as the gunfire got closer. A bomb went off and the group split apart in a panic. Then when I looked behind me she was gone. She was right god damn there.\n\nIs this some sort of punishment? Is this because I left those poor people I was trying to help?\nAll I hear is screams and gunfire. This isn’t a battle, this is a massacre. People are being lined up and shot. Please god tell me Julie got away. Please.\nWe need her. I don’t want our daughter to grow up without a mother. I don’t want to lose you.\nPlease return to us. I know you’re out there.\nWe won’t be able to stay for long. If you’re not here soon we will have to leave.\nWe’re moving to the end of the metro, there should be a way to get off of Filitrios from there.\nI will leave this note here for you. Please come to us. I love you.=我正在努力保持冷静。我必须在她面前坚强。我必须陪伴在她身边。他们抓走了朱莉。我和大楼里的其他人一起跑向地铁，而他们则突破障碍。我们一栋栋地前进。她就在我身边。随着枪声越来越近，我们继续奔跑。一枚炸弹爆炸了，队伍在恐慌中分开了。然后当我回头看时，她已经不在了。她真的就在那里。\n\n这是某种惩罚吗？是因为我离开了那些我试图帮助的可怜人吗？\n我听到的只有尖叫声和枪声。这不是战斗，这是一场大屠杀。人们被排队并枪决。请上帝告诉我朱莉安全脱险了。求你了。\n我们需要她。我不想让我们的女儿在没有母亲的环境中长大。我不想失去你。\n请回到我们身边吧。我知道你还在外面。\n我们无法停留太久。如果你不能很快回来，我们就不得不离开。\n我们正在前往地铁的终点站，从那里应该可以找到离开的方法。\n我会在这里留下这张纸条给你。请回到我们身边吧。我爱你。
exact:I am uncertain where to begin.\nWhat has occurred was beyond dreadful.\nI find myself lacking the vocabulary to describe it.\nIt has taken me a fair amount of time to even build the courage to leave my bed chamber.\nI am frightened. Deeply frightened. It was a mistake. They died because I ran. I watched him cry in fear as I fled like a coward.\nThese doors will protect me. Opening them would require a considerable source of power. Such sources are rare in today’s day and age. Yet still I fear. There is a sound. I was certain it was my imagination playing tricks on me. I no longer believe that.\nIt’s drawing nearer. Every day I become more certain of that.\nIt spoke. I wish it had not. It echoes through my mind. It leaves me without peace.\nIt’s drawing nearer.\nI should never have viewed that tape.\nI assure you what I am hearing is real.\nThat thing was real.\nI urge you to stay away. I beg of you.\nLet it remain undisturbed.=我不确定从哪里开始。\n所发生的事实在令人恐惧之外，更加可怕。\n我发现自己的词汇量不足以描述它。\n我花了相当长的时间才鼓起勇气离开我的床铺。\n我感到害怕。极度害怕。那是个错误。他们死了，因为我逃跑了。当我像懦夫一样逃跑时，我看着他因恐惧而哭泣。\n这些门会保护我。打开它们需要巨大的能量来源。在当今这个时代，这样的能量来源非常罕见。但我仍然感到恐惧。有声音在响。我确信那只是我的想象在欺骗我。但我不再相信这一点了。\n它正在接近。每一天，我都对这一点越来越确信。\n它说话了。真希望它没有这么做。它的声音在我脑海中回响。这让我无法平静。\n它越来越近了。\n我根本就不应该观看那个录像带。\n我向您保证，我所听到的是真实的情况。\n那个东西是真实的。\n我恳请您远离。我请求您不要这样做。\n保持原样，不要删除、添加或解释。
exact:I cannot rest=我无法安息
exact:I cannot say I am much of a writer, I beg of you, don’t have grave expectations.\nAs for any story it would be good to know who’s behind the pencil. Or keyboard in this instance.\n\nTo introduce myself, my name is Zellenah. Born on Haltar under the family name Cross.\nFor those who are unaware, Haltar is likely one of the wealthiest moons still remaining in our region.\nFirst, an agreement. Then the golden flame. Foolish to have gotten involved.\nOur father couldn’t keep the political talk to himself so I’ve become rather educated on the conflict.\n\nI feel I am already losing the path. Where was I? Ah yes.\nFor the greater part of my life I have spent mindlessly staring at golden halls and sipping the most elegant vintages while relatives endlessly discuss their fortunes with a devotion I could not understand. We’ve always gone on the same trips and visited the same fountains. I couldn’t convey how often I’ve seen the gemstone waters.\nYou could say I’ve always had more of an explorative trait. The predictability of it all became rather stifling. The people are kind, but perhaps a touch soulless. All they conversed about was their wealth and what grandiose places they visited. I found it to be rather dull. Terribly underwhelming. I fear the normality of it all has greatly impacted my joy of what were seemingly magnificent things.\n\nI found myself unwilling to accept such predictability so I left for a few trips outside of our usual experiences.\nA majority of the places I went to were fresh, unique. Often whelming as I had witnessed the same before but on a grander scale.\n\nThen, during one of these visits there were these magnetized pebbles. Not too extraordinary I believe we have all seen magnets before. But these pebbles, when they touched they would brighten up. Not only brighten up, they would share a light that traveled between them. Now that was lovely. I had never seen that before. Truly magnificent. I still have them somewhere I am quite certain. Perhaps in one of my drawers with the crystals which pacifies insects with a soft drone, another magical find.\nEither way I put on a glove and took a hand full of them back to the manor.\nFrom then on all I ever wanted was to collect more of these interesting objects.\nIndeed I did. I went on many trips following this initial find.\nI had gathered plentiful mistiques. It had gotten to a point where they were turning my manors into a dreadful mess.\nThere was a terrible need for a place to put these things. And that’s when I came with the idea of the gallery. A gallery of uniquities.\nI wouldn’t want it to be back on Haltar, you could display something magnificent and they wouldn’t even lift their glasses.\n\nThis place looks delightful and happens to be right in the center of everything. Nearly too good to be true.\nSo I acquired this small moon and began planning out the gallery.\nA few months pass and now we are here.\n\nI appreciate your reading. I find it incredibly relaxing to write.\nPerhaps I might write some more in the future.=我不敢说自己是个出色的作家，请你们不要对我抱有过高的期望。\n关于任何故事，了解那些在键盘前敲下文字的人是很重要的。或者在这种情况下，是那些在电脑前操作的人。\n\n自我介绍：我的名字是Zellenah。我出生于Haltar，家族姓氏为Cross。\n对于那些不清楚的人来说，Haltar可能是我们地区现存最富有的卫星之一。\n首先，达成一项协议。然后是金色火焰。参与其中真是愚蠢。\n我们的父亲无法保持政治对话,\n\n我感觉到自己已经迷失了方向。我之前在哪里？啊，对了。\n在我生命的大部分时间里，我都在无意识地凝视着金色的殿堂，品尝着最上等的葡萄酒，而我的亲戚们则不停地讨论着他们的财富，那种热情让我难以理解。我们总是一起去同样的旅行，参观同样的喷泉。我无法形容自己见过多少次那些宝石般的水源。\n可以说，我一直都更喜欢探索性强的体验。一切的可预测性让我感到有些压抑。那些人虽然友善，但可能有点缺乏灵魂。他们谈论的只有自己的财富以及他们去过的那些宏伟地方。我觉得这相当乏味，实在令人失望。恐怕这种常规化的生活方式大大影响了我对那些看似壮丽事物的兴趣。\n\n我发现自己不愿意接受这种可预测性，因此我尝试了一些超出我们常规体验的旅行。\n我到过的多数地方都十分新鲜且独特。很多时候，这些地方让我感到震撼，因为我在之前已经见过类似的事物，只是规模更大而已。\n\n在其中的一次参观中，发现了这些被磁化的小石子。我觉得这并不特别，因为我们以前都见过磁铁。但这些小石子一旦接触，就会发出光芒。不仅如此，它们还会传递光线。这真是太美妙了。我以前从未见过这样的现象。真是令人惊叹。我肯定还在某个地方保存着它们，也许放在我的抽屉里，那里还有那些能驱赶昆虫的魔法水晶。又是一个神奇的发现。\n要么我戴上手套 把满满都是的手套拿回庄园\n从那时起，我所渴望的只是收集更多这些有趣的物品。\n确实如此。在最初发现这个之后，我进行了许多旅行。\n我收集了大量的迷情物。情况已经发展到这样的地步：它们把我的宅邸变成了一片混乱不堪的景象。\n当时，人们非常需要一个存放这些物品的地方。于是，我提出了建立画廊的想法。一个展示独特物品的画廊。\n我不想让这个东西又回到哈塔尔，你可以展示一些非常壮观的东西，但他们甚至都不会抬起他们的杯子。\n\n这个地方看起来非常迷人，而且正好位于一切的中心。简直好得令人难以置信。\n我获得了这颗小卫星，并开始规划画廊的设计。\n几个月过去了，现在我们在这里。\n\n感谢您的阅读。我觉得写作是一种非常放松的活动。\n或许我将来会写更多
exact:I desire to write again following today's frightful ordeal.\nIt was in the early morning when the trouble began. I had woken up from an annoyingly repetitive beeping coming from my computer. And so I had a gaze at what happened to be a message. It was deeply unsettling.\nIt read as follows: \n“The celestial body designated [98 Galetry] falls under company territory and is marked for collection. Agree to our terms or leave immediately.”.\nOf course I took this sudden message very dear. It had appeared to be rather important though a bit distasteful. So as with any message of seemingly grave importance like this I had informed them, in terms perhaps less diplomatic than advisable, that I had no interest in their proposal.\n\nNot much time had passed and I heard this charming jingle of an elevator of sorts followed by an explosion. Immediately I put on my gloves and armed myself with an antique blade in hopes it would scare away whoever had impolitely seared my front yard. Or at the very least offer me the confidence to confront them.\n\nTo my surprise there was nobody there. Only the wind, a dull quietness and a pod with a big gap presumably from the explosion.\nThen to my surprise, a dreadful swarm of hornets attacked me. I ran away as fast as I could and locked myself in my bed chamber.\nThen I remembered those droning crystals. Unsure where I had left them I began searching. It had taken me a fair moment but in the end I discovered them to be in a small box in one of my closets. I took out a few and slowly opened the door. Nothing in the hallway. Quite curious. I slowly made my way along the gallery towards the entrance, not a hornet in sight. Then to my surprise there was a bulging man standing in the grass. He quietly gazed at me. To my knowledge I was alone, there hadn’t been any visitors in days. I yelled out to him. No response. Frightening. I took a step back. Then he seemed to search for something in his tailor coat. Before long he ran at me holding a shimmering knife. Having neither a plan or any courage in that moment I instinctively held out the small bag of crystals between us. To my surprise this bloated man seemed enamored by them. Staring soullessly into the bag. Only then it dawned on me, this was not an ordinary man at all, but a deteriorating arrangement of skin and cloth piloted by these hornets. The dreadful smell only confirmed that. Terrifying discovery yet I must admit in a way quite divine.\nI had led him to the back room as he followed the bag of crystals. As I had no proper placement for this ominous gentleman, I elected to leave him where he was. I don’t think he minds that much.\n\nFinally I return to my computer only to find it beeping once more. A new message.\n“You have received your first and only warning, The celestial body designated [98 Galetry] falls under company territory and is marked for collection. Agree to our terms or leave immediately.”\nI was left with a choice and perhaps in an act of fear I agreed.\n\nAs long as I help their workers ship the things they found to Gordion without interrupting their work, I should be left alone.\nI’m hopeful.=我渴望在经历了今天的可怕经历之后再次写作。\n麻烦是在清晨开始的。我被电脑发出的恼人重复哔哔声吵醒，然后看到了一条消息。这消息让我感到非常不安。\n消息内容如下： \n“被指定为[98 Galetry]的天体属于公司领地，需要被收集。请同意我们的条件，否则立即离开。”\n当然，我非常重视这条突如其来的消息。虽然它看起来很重要，但有些令人不悦。因此，就像对待任何如此重要的消息一样，我以不太得体的方式告诉他们，我对他们的提议并不感兴趣。\n\n没过多久，我听到一种类似电梯的嗡嗡声，接着是一声爆炸。我立刻戴上手套，拿起一把古董刀，希望这能吓跑那些不请自来的人，或者至少让我有勇气面对他们。\n\n令我惊讶的是，那里没有人。只有风声、一片沉寂，还有一个显然因爆炸而出现大裂缝的舱体。\n然后，令我更加惊讶的是，一群可怕的马蜂向我袭来。我拼命逃跑，把自己锁在卧室里。\n接着我想起了那些嗡嗡响的晶体。不确定把它们放在哪里，我开始寻找。过了一会儿，我发现它们在一个壁橱里的一个小盒子里。我拿出几颗晶体，慢慢打开门。走廊里什么也没有。真奇怪。我沿着走廊走向入口，但看不到一只马蜂。然后，令我惊讶的是，有一个肿胀的男人站在草地上。他静静地注视着我。据我所知，只有我一个人，已经好几天没有客人来了。我朝他喊了一声，但没有回应。真是可怕。我后退了一步。然后他似乎在他的西装外套里寻找着什么。不久后，他拿着一把闪闪发光的刀向我冲过来。当时我既没有计划，也没有勇气，于是本能地把那小袋晶体放在他们之间。令我惊讶的是，这个肿胀的男人似乎被它们迷住了，他空洞地盯着袋子。直到那时我才意识到，这并不是一个普通的人，而是一群马蜂操控着的腐烂的皮肤和布料。那可怕的气味进一步证实了这一点。虽然这个发现很可怕，但我不得不承认，在某种程度上，这似乎是一种神圣的事情。\n我把他带到后面的房间，让他跟着那小袋晶体。由于我没有合适的安置方式，我决定让他留在那里。我觉得他应该不会介意。\n\n最后，我回到电脑前，发现它又开始发出哔哔声。又一条消息。\n“你已经收到了第一次也是最后一次警告，被指定为[98 Galetry]的天体属于公司领地，需要被收集。请同意我们的条件，否则立即离开。”\n我面临着一个选择，也许出于恐惧，我同意了。\n\n只要我帮助他们把找到的东西运到Gordion，而不打扰他们的工作，我就应该被允许独自待着。\n我抱有希望。
exact:I did not expect this meeting to go the way it did.\n\nWhile I tried to educate the Emperor on the matters back at the Grand Capitol. he seemed uninterested and looked at me with a rather lifeless expression.\nI explained how the Council of Rule is very adamant about not allowing any bioweapons to be used or studied..\nBut then he told me..\nHe wanted me to..\n\nThe Triton Military will decimate the Grand Capitol as well as the moon it sits on.\nThis will be.. soon, on the day of the final conference.\nJudgement day.\n\nAnd he wanted me to give the order.\n\nThis will be the catalyst of a region wide war.\nYet I did as he asked. I gave the order. In the name of the Emperor.\n\nThis means I will not be returning home and I was promised that my family will be moved to Trite to keep them safe from what’s about to come.\nI hope to see them soon.\n\nSoon I will be off to 61-March where I will prepare 3 groups of scientists to set course for the mysterious moon of 42-Cosmocos in hopes of finding something to aid us in the upcoming war against the dominions who will oppose the Triton Military and the Emperor.\n\nThis will not be pleasant. But I am ready.\n\nAgent G- Signing off.=我没想到这次会面会如此发展。\n\n尽管我试图向皇帝解释在大首都发生的事情，但他似乎并不感兴趣，用一种相当无生气的表情看着我。\n我解释了统治委员会坚决不允许使用或研究任何生物武器……\n但随后他告诉我……\n他希望我……\n\n特赖特军队将摧毁大首都以及它所在的月球。\n这将会在最终会议的那一天发生……\n审判日。\n\n他希望我下达命令。\n\n这将成为一场地区性战争的催化剂。\n但我还是按照他的要求做了。我以皇帝的名义下达了命令。\n\n这意味着我将无法回家，而且有人承诺会把我家人转移到特赖特，以确保他们免受即将到来的灾难。\n我希望能很快见到他们。\n\n很快我将前往 61-March，在那里我将组织 3组科学家，让他们前往神秘的 42-Cosmocos卫星，希望能找到一些东西来帮助我们应对即将到来的与那些反对特里顿军事力量和皇帝的势力之间的战争。\n\n这不会是一件愉快的事情。但我已经准备好了。\n\nG-特工 结束报告。
exact:I don't feel=我感觉不到
exact:I followed him through the vast halls of this citadel, hoping to see if he revealed anything else.\nBut when I turned the corner, he had vanished into one of the storage rooms. Which is particularly strange I thought.\nAnd when I put my ear up against the door. I heard him talk again.\n\nHe sounded rather monotone. Having a discussion with himself.\nOr so I thought.\nIt wasn't until he said 'my overseer' when I realised he was talking to someone or.. something.\n\nI hid around the corner when he left the storage closet. And he quietly mumbled 'The seed must grow' as he left the hallway.\nI am uncertain what any of this means but I feel something larger is a play here.=我跟随他穿过了这座城堡的广阔大厅，希望他能透露出更多信息。\n当我转过拐角时，他已经消失在其中一个储藏室里。这特别奇怪，我心想。\n当我把耳朵贴在门上时，我又听到他在说话。\n\n他的声音相当单调，似乎在自言自语。\n或者我这么认为\n直到他说“我的监督者”时，我才意识到他是在和某个人或某物说话。\n\n当他离开储藏室时，我躲在角落里。他离开走廊时，轻声嘟囔着“种子必须生长”。\n我不确定这些术语到底意味着什么，但我觉得这里似乎在暗示着一些更为重要的东西。
exact:I found some pen and paper stached below my cold, hard mattress.\nMeaning I can FINALLY write down some of my problems with this BROKEN justice system.\n\nFor one, I AM INNOCENT!\nI would never EVER do that to my wife and children.\nAnd the fact that they never even had a look at the evidence I provided.\nHORRID!\n\nIf I ever get the opportunity to het out of this hell hole..\nI will sue the everliving hell out of those people.\nJustice my ass.\n\nMeanwhile I'm sure that monster is still out there.\nAGHH\nWhat he did to my children, my Jane..\n\nIf I ever find him I'll be happy to watch him ROT behind these same bars that I find myself behind.\nHE belongs in a cell on Alcatras NOT ME!\n\nThough unfortunately they gave me life in prison.\nI don't think I'll ever be able to get true justice.=我在冰冷坚硬的床垫下面发现了一些笔和纸。\n这意味着我终于可以写下我对这个糟糕的司法系统的不满了。\n\n首先，我是无辜的！\n我绝对不会对我妻子和孩子做出那样的事情。\n而且他们甚至都没有查看我提供的证据。\n真是可怕！\n\n如果我有机会逃离这个地狱般的地方……\n我会起诉那些人，让他们付出惨痛的代价。\n正义什么的，根本不存在。\n\n与此同时，我确信那个怪物还在外面。\n啊啊啊\n他对我的孩子们做了什么，我的简……\n\n如果我找到他，我很乐意看到他像我一样被关在牢房里。\n他应该被关在阿尔卡特拉斯的牢房里，而不是我！\n\n不过不幸的是，他们给了我无期徒刑。\n我觉得我永远无法得到真正的正义。
exact:I found you...=找到你了……
exact:I have made it to faith but my health has rapidly declined.\nI can barely walk.\n\nIt's there, I feel it sitting in my chest...\nGrowing...\nThis tumor.\nI escaped the war..     I SURVIVED\nAnd this is how the universe rewards me?\nLife is suffering.\nAlways has been, from the moment I was created.\nOne month after being born I was already on the battlefield. Posessing memories of someone I'm not.\nThey didn't even give me a name.\nI was a number. A duplicate of someone else.\n...\nMy body is crumbling, I should get going.\nAnd when I'm done.\nAll my problems will go away.\n\n\nMy salvation lies on Berunah.=我已经实现了信仰，但我的健康状况迅速恶化。\n我几乎无法行走。\n\n它就在那里，我感觉它存在于我的胸膛中……\n在生长……\n这个肿瘤。\n我逃过了战争……我活了下来。\n这就是宇宙对我的回报吗？\n生活充满了痛苦。\n一直如此，从我被创造出来的那一刻起。\n出生一个月后，我就已经身处战场。脑海中浮现着某个我不认识的人们的记忆。\n他们甚至没有给我一个名字。\n我只是个数字，是另一个人的复制品。\n……\n我的身体正在崩溃，我应该离开了。\n当这一切结束后，\n我所有的问题都将消失。\n\n\n我的救赎在于贝鲁纳（Berunah）。
exact:I hear her in the dark\r\nThere’s a sadness in her voice\r\nSomething is wrong with her\r\n\r\nShe fears being seen\r\nShe’s scared\r\nSomething happened to her\r\n\r\nThere is a darkness in her eyes\r\nIt’s not her\r\nSomething is within\r\n\r\nWatch your back\r\nShe might ask for help\r\nBut it won’t let you=我在黑暗中听到她的声音\r\n她的声音里带着悲伤\r\n她有些不对劲\r\n\r\n她害怕被看到\r\n她很害怕\r\n她发生了什么事\r\n\r\n她的眼中充满了黑暗\r\n那不是她\r\n有什么东西在她的体内\r\n\r\n小心你的背后\r\n她可能会寻求帮助\r\n但不会让你得逞
exact:I hear my son=我听得见我儿子的声音
exact:I know you're there=我知道你在那里
exact:I must write about this. I believe I have acquired all the information that remains.\nBack in my early days on Haltar, on the television this advertisement would play. It was an elegant place to visit with stunning environments, yet I’ve never quite discovered where this place is or even what it’s called. I only remember greenery with purplish waters and a soft pink sky. It was extraordinary. But it seems as if it never existed, though I am certain it did.\nThroughout my life I have attempted to inquire information of its whereabouts yet nobody seemed to know. I only had rumors to work off of. Some said it was made to disappear due to a chemical accident. Others said it was a hoax entirely, which seemed like a rather dull explanation.\n\nI simply cannot allow the matter to remain unsolved. It has most certainly been removed form every public source of information as nothing has turned up over the many years I have searched for this. But perhaps a physical copy remains in existence somewhere.\n\nI have reached what may generously be described as a plan, the idea fills me with discomfort, though I see no alternative but to attend to it personally. When Marcus returns I will fly out with him in search of what could be one of the only physical copies of this remarkable advertisement. I believe I know where such a copy may still exist.\nYou will see me return soon.=我必须写下这件事。我认为我已经获得了所有剩余的信息。\n在我初到Haltar的时候，电视上播放着这样的广告。那是一个值得一游的优雅之地，环境令人惊叹。不过，我一直不清楚这个地方的准确位置，甚至不知道它叫什么名字。我只记得有绿植、紫色的水域，以及淡粉色的天空。那真是非同寻常。但似乎那地方从未真正存在过，尽管我确信它确实存在过。\n在我的一生中，我一直试图打听它的下落，但似乎没有人知道。我只能依靠一些传闻来了解情况。有人说它因为化学事故而消失了。还有人说这完全是一场骗局，但这个解释似乎相当无趣。\n\n我绝对不能让这件事一直悬而未决。经过多年的搜索，我发现这个事情已经从所有公开的信息来源中消失了，没有任何线索。但也许 somewhere 还存在着一份实体副本。\n\n我大致制定出了一个计划，但这个想法让我感到不适，不过我别无选择，只能亲自去处理这件事。等马库斯回来后，我会和他一起出发，寻找这份非凡广告的实物副本。我相信我知道这样的副本可能还存在于何处。\n你会看到我很快回来的
exact:I need to burn these notes later, can't risk anyone finding out about this.\nMy 'friend' Aaron has been a nuisance my entire life. \nHe stole my girlfriend, he stole my job! \nI can't keep acting friendly while he's around. \nI HATE HIM!=我以后必须销毁这些笔记，不能让任何人发现这件事。\n我的“朋友”亚伦一直是个麻烦人物。 \n他抢走了我的女朋友，还夺走了我的工作！ \n他在身边的时候，我实在无法保持友善的态度。 \n我恨他！
exact:I promise that \nI'm going.\nI'm not staying there=参考术语（仅在原文出现时使用）。 \n忠实翻译如下：\n我承诺，我会离开。我不会留在那里。
exact:I promise that \nI'm going.\nI'm not staying there\nI'm going.\nI'm not staying there=我保证 \n我就要走了。\n我不会住在那里。\n我就要走了。\n我不会住在那里。
exact:I promise that \nI'm going.\nI'm not staying there\nI'm going.\nI'm not staying there\nI promise that.=我保证 \n我就要走了。\n我不会住在那里。\n我就要走了。\n我不会住在那里。\n我保证会这么做。
