exact:At the behest of Captain Donahue, I am to record my own personal experiences here on Cosmocos.\n\nI was first to stumble upon this strange extraterrestrial lifeform.\nIt seemed to be, upon first glance, perhaps a plant, or something akin to coral - something like Diploria.\nBut when I placed my hand upon it, even through my suit, I felt - I felt as if incredible knowledge was poured into me.\nKnowledge of things vastly unfamiliar and unbelievably alien to me - but also of things familiar, things around me that others had been educated on, but I’d never had the opportunity to learn.\nIt was incredible, exhilarating.\nUnlike anything I’ve ever experienced.\n\nBut the most exhilarating thing of all was this unusual connection I feel that I’ve fostered with this thing.\nThis being.\nIn a sense, it felt...like a person, is perhaps the best way to put it, in terms we are capable of understanding.\nLike Cosmocos isn’t just a moon.\nLike it’s...a huge, alien life-form, sitting here in space with its own incredible ecosystem.\n\nBizarre as it may be, I can say with confidence that I could feel what seemed to be a rush of emotions from Cosmocos itself.\nI still feel it now, in truth.\nWhich sounds like insanity, doesn’t it? But it was beautiful.\nLike a rush of warmth, kindness, generosity.\nI really feel like Cosmocos wants to teach us things.\nLike it wants to help us grow and nurture us.\n\nThe Captain has commanded that no one is to interact with this celestial brain aside from himself for our own safety.\nI do feel slightly disheartened by this, as I was hoping to commune with it again.\n\nI have so much more to say.\nIt’ll be difficult to record all of this knowledge I’ve been gifted with in a comprehensible format on these recorders, but I’ll do my best over the next few cycles.\n\nLieutenant Commander Cunningham, signing off.=奉唐纳休船长之命，我要记录自己在科斯莫科斯的亲身经历。\n\n我是第一个撞见那个奇异外星生命的人。乍一看，它似乎是株植物，又有点像珊瑚，像脑纹珊瑚。可我把手放上去时，隔着防护服我都能感觉到……仿佛无比丰沛的知识正涌入我的脑海。有的是我闻所未闻、陌生得难以置信的事；也有就在身边、别人学过而我却从没机会了解的东西。太不可思议了，让人兴奋不已。我从未有过这样的经历。\n\n但最令我激动的，是我觉得自己和这个东西，和这个生命，建立了一种奇特的联系。要用我们能理解的话来说，它……像一个人。科斯莫科斯似乎不只是一颗卫星，它像一个栖居在太空中的庞大外星生命，身上有着不可思议的生态系统。\n\n这听起来古怪，可我确信，自己感到了一阵情绪，从科斯莫科斯本身涌来。说真的，我现在还能感觉到。是不是像疯话？可那感觉多么美好。一阵暖意，满是善意和慷慨。我真的觉得科斯莫科斯想教我们一些东西，想呵护我们，帮助我们成长。\n\n船长已经下令，为了大家的安全，除他以外，谁都不能再和这个天体大脑接触。我很失落，本来还盼着再与它交流一次。\n\n我还有好多话想说。要用这些记录仪把获赠的知识记下来，还得让人能看懂，并不容易。不过接下来几个周期，我会尽力。\n\n坎宁安少校，通话完毕。
