exact:Hello employee.\nYou may not know me but.. I know you.\nSince the death of your soulmate you have been taken by grief, you have felt like your existence is once again pointless.\nYou continuously put yourself in danger, inching closer and closer to the end each time.\nLets see if you have what it takes to survive, if you still appreciate the body that has been given to you.\nIn front of you there hangs a Decimator, an explosive device that will destroy everything in this room when the timer hits zero.\nThere also hangs another employee, you may know him as he has been in your crew for months, he will be the key to your freedom, All you need to do is remove the right wire with the knife you now posses.\nBut beware, if he dies by your hands, neither of you will make it out alive.\nLive or die, make your choice.=你好，员工。\n你可能不认识我，但我认识你。\n自从你的灵魂伴侣去世后，你就被悲伤所吞噬，感觉自己的存在再次变得毫无意义。\n你不断将自己置于危险之中，每一次都离死亡更近一步。\n让我们看看你是否还有生存下去的勇气，是否还能珍惜这个赐予你的身体。\n在你面前悬挂着一个毁灭者，这是一种爆炸装置，当计时器归零时，它会摧毁这个房间里的所有东西。\n还有另一个员工也悬挂在那里，你可能认识他，因为他已经在你的团队里待了几个月了。他将是你获得自由的关键。你只需要用你现在拥有的刀子切断正确的电线即可。\n但请小心，如果他被你杀死，你们俩都不会活着离开这里。\n生或死，做出你的选择。
exact:Hello everyone, this is your favourite radio host from\n-Across the stars-\nIt is currently 11:13 AM and it looks like the weather is quite upset today but lets not have that ruin our Mondays ey.\n\nUnfortunately I have to be the bearer of bad news, we have had reports of an attack that happened on the Grand Capitol of Calist. As of now we are unsure of the severity of the attack but I'm sure we'll find out soon enough.\n\nIn some other news the nuclear power plants in the C sector of Fission have been closed down due to a failure to meet safety regulations.\nThank god for that,\nThat place sounded like you'd be glowing green from simply being there.\nThere have also been constructions sightings on the moon of Oldred, which is interesting considering that's about the single worst place to build literally anything.\n\nEither way, that's it for me.\nI've got some classic hits lined up for your usual monday madness so stay tuned. Thank you for listening to\n-Across The Stars-=大家好，这里是你们最喜爱的广播主持人\n-穿越星辰-\n目前时间是上午11:13，看起来今天的天气不太妙，但让我们不要让这破坏了我们的周一时光。\n\n不幸的是，我必须传达一个坏消息，我们收到了关于卡利斯特大首都发生袭击的报告。目前我们还不清楚袭击的严重程度，但我相信我们很快就会知道答案。\n\n另外，Fission区域的C部门核电站因为违反安全规定而关闭了。\n谢天谢地，\n那个地方听起来就算只是待在那里都会变成绿色。\n在奥尔德雷德的月球上也有建筑建设的迹象，这很有趣，因为那简直是建造任何东西的最糟糕地点。\n\n不管怎样，我的报道就到这里了。\n我有一些经典节目安排好了，等着你们参加每周一的疯狂活动，请继续收听\n-穿越星辰-
exact:Hello everyone, you are listening to Across the Stars and I’d like to apologize for my absence in the past few days.\n\nTimes are tough.\n\nIt’s currently 2:23 pm and I’m sorry to announce that this will be my final broadcast.\n\nMy sources are dwindling and finding any good news has been like searching a needle in a haystack.\nThere’s just not much good out there anymore.\n..It’s all terrible.\n\nFor those still out there. I’m telling you to leave.\nFind the closest to you and go.\nGo to the Domes.\nThere will be salvation on Demetrica.\n\nI will be going too.\n\nThe Triton military has been growing in numbers and they’ll launch a system wide attack to conquer our side of the region.\nAnd I don’t want anyone to experience the horrors of what that will bring.\nSo I’m telling you again, leave.\nRun for the Domes.\n\nWe will be going dark.\nThis was Across the Stars.\nThank you.\n\nI’ll see you there.=大家好，你们正在收听《穿越星辰》。对于过去几天的缺席，我表示歉意。\n\n形势严峻。\n\n当前时间是2:23点，很抱歉地宣布，这将是我的最后一次广播。\n\n我的信息来源正在减少，而找到任何好消息就像在干草堆中寻找一根针一样困难。\n现在市面上已经没有多少好东西了。\n......这一切都很可怕。\n\n给那些还在外面的人我命令你离开。\n找到离你最近的就走\n去穹顶\n在德梅特里卡，将会迎来救赎。\n\n我也会去。\n\n特立顿军队的数量正在不断增加，他们将发动一场全系统的攻击来征服我们这一区域。\n我并不希望任何人经历由此带来的恐怖后果。\n所以我再次告诉你们，离开吧。\n跑到穹顶。\n\n我们将暂时无法访问。\n这是《穿越星辰》。\n谢谢。\n\n我会在那儿与您见面。
exact:Hi, it's harry with mighty mortor!\nIt's like a mortar but it's a mortor!\nMordor wouldn't have fallen with this mortar!\n\nRegular defences don't work well.\nPeople get their houses broken into all the time!\nBurglars, thieves, your neighbors, nosy aunts, crazy exes, giants bees, nintendo, not even I will be able to break in with this thing in your backyard!\n\nNormal mortars can only fire one shell at the time.\nThis thing can launch 30 of them within the blink of an eye!\nBet nobody expects that on their weather forecast!\n\nYou can put it in your backyard, put it on your car!\nAttach it to your wallet, you'll spot it from afar!\nYou can even use it to collect water when you get deserted on an uninhabited island!\n\nMortors mortar, only 300.000 per piece!\nBut if you call now with in the next 20 minutes, we'll give you a second one absolutely free!=嗨，我是harry，来自mighty mortor！\n这就像是一台mortor，但实际上是个真正的mortor！\n没有这个mortor，Mordor就不会沦陷！\n\n普通的防御手段根本不起作用。\n人们的房子总是被闯入者破坏！\n小偷、流氓、邻居、爱管闲事的阿姨、疯狂的前任、巨大的蜜蜂、任天堂……就算是我，也根本无法用这东西闯进你们的后院！\n\n普通的mortor一次只能发射一枚炮弹。\n而这东西能在瞬间发射30枚炮弹！\n估计天气预报里都不会提到这个功能！\n\n你可以把它放在后院，或者挂在车上！\n还可以把它别在钱包上，从远处就能看到它！\n甚至在无人岛荒凉时，你也可以用它来收集水！\n\n迫击炮,仅 300.000 每一块!\n但如果你在接下来的20分钟内打电话过来，我们就会免费再给你一套！
