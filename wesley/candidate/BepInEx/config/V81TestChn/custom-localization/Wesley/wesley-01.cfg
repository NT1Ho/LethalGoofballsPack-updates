exact:As per usual, I leave a note.\nI'm only getting closer to completing my task.\nThe cancer that grows within me makes me feel weaker by the day.\nBut I must continue.\nHe will heal me.\n\nI must say I enjoyed the peace that Dreck brought me.\nIt was cold yet empty. It felt like nothing was there to bother me.\nI felt alone but.. the good kind.\nI really.. needed that.\nThe war had quite a toll on me. Even if it's all I know.\nI mean. I was practically created by it.\nJust like many others.\n\n... I should get the fuel I came here for and proceed to Faith.=照例留张便条。离完成任务又近了一步。体内的肿瘤不断长大，我一天比一天虚弱。但我得继续。他会治好我。\n\n得说一句，我很喜欢德雷克的安静。这里又冷又空，仿佛没有什么会来打扰我。我是孤身一人，可……是那种自在的孤独。我真的……需要它。战争把我折磨得够呛，尽管我从来只知道战争。说起来，我几乎就是它造出来的。还有许多人也是。\n\n……我该拿上来这里要找的燃料，继续前往信仰星了。
