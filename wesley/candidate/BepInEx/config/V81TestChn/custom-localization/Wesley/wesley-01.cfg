exact:Bracken -- AKA flower man!\n\nit was flower man, you can't say othrwise! i wanted to find his body .You were the cowards\n\nScientific name: Rapax-folium\nThere is debate on the genus to which the Bracken belongs. It is a bipedal vertebrate with skin the color and texture of a red beat. The name was coined for what appear to be leaves protruding from its upper spine. The purpose of these is believed to be for intimidation, however not much is known about the specifics of bracken behaviour due to its illusiveness and low population.\n\nWe know a little from accounts by wildlife experts who have encountered it. is a lone hunter with high intelligence. Its behavior can seem aloof; it exhibits high aggression even when unprovoked, yet it quickly backs off when confronted. However, brackens are known to up their hostility when cornered or simply watched for a long time. For this reason it's recommended to keep an eye on it but not to stare it down. No specimens have been collected dead or alive. It's theorized that upon death their bodies undergo a rapid decomposition process which is unique from other large animals.=黑影（Bracken）——又名花人！\n\n一定是花人，别想错了！我想找到他的尸体。你们才是胆小鬼。\n\n学名：Rapax-folium\n关于黑影所属的属，目前还存在争议。它是一种双足脊椎动物，皮肤颜色和质地类似于红色布料。其名称来源于它上脊柱上突出的叶片，这些叶片被认为用于威慑敌人。然而，由于黑影的隐秘性以及种群数量稀少，对其行为特性了解甚少。\n\n从野生动物专家的描述中可以得知一些信息。它是一种独行猎手，智力很高。它的行为看起来很冷漠，即使在没有受到挑衅的情况下也会表现出高度攻击性，但当被直面时又会迅速退缩。不过，黑影在被逼到角落或长时间注视时，会变得更加凶猛。因此，建议观察它，但不要直接挑衅它。目前还没有发现活体或死体的黑影标本。据推测，黑影死亡后，其尸体会经历一种与其他大型动物不同的快速分解过程。
