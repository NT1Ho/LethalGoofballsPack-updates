exact:He threatened me! That- that- heartless-\n\nI don’t know why I ever felt compelled to try and convince that man of anything, knowing he is capable of such evil.\nHe is not a man reasoned with.\n\nCosmocos has the most beautiful terrain I’ve ever laid eyes upon.\nSuch gorgeous, diverse plant life.\nA heart.\nI really feel as though it has what the more spritual of us would call a soul.\nAnd the Captain has a gall to suggest that Cosmocos has tricked me, somehow.\n\nPerhaps these feelings are not my own.\nPerhaps these are feelings Cosmocos has imposed upon me.\n\nRegardless of whether these emotions are pre-disposed or not - with everyone ounce of my being, I feel certain that Cosmocos is a thinking, feeling moon.\nIsn’t that incredible?\nShouldn’t that be protected?\n\nI’m going to be the one to protect it, if no one else will.\n\nWhatever the cost.\nIf I fail, at worst, they’ll send me back to March for proper proceedings.\nMy knowledge is too valuable.\n\nAnd then I’ll make it my mission to come back.\nIf they succeed in doing this to Cosmocos...\nI’ll see it done that it is made whole again.\n\nCunningham, signing off.=他威胁我！那个-那个无情的家伙-\n\n我不知道为什么我会觉得有必要试图说服那个男人，明明知道他有能力做出如此邪恶的事情。\n他不是那种可以与之商量的男人。\n\n科斯莫科斯的地形是我见过最美丽的。\n那里有如此丰富多样的植物。\n还有一颗心。\n我真的感觉那里有着我们那些更精神的人所说的灵魂。\n而船长竟然敢说科斯莫科斯以某种方式欺骗了我。\n\n也许这些感觉并非我自己的。\n也许这些是科斯莫科斯强加给我的感觉。\n\n无论这些情感是否是天生的——用我所有的力量，我确信科斯莫科斯是一个有思想、有感情的卫星。\n这不是很不可思议吗？\n难道不应该保护它吗？\n\n如果其他人都不愿意，我将成为保护它的那个人。\n\n无论代价如何。\n如果我失败了，最坏的情况就是他们会将我送回三月，接受适当的法律程序。\n我的知识太宝贵了。\n\n然后我会下定决心回来。\n如果他们真的对科斯莫科斯做了这样的事……\n我会确保它再次完整。\n\n坎宁安，结束通话。
