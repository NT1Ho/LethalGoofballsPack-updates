exact:Backwater Gunkfish\n\nSigurd's danger level: 0% but these little goopy goblins wont leave me ALONE\n\nScientific name: Infectum linteum\n\nThe Backwater Gunkfish is a type of Gunkfish of the family Mobulidae. Unlike the other types of Gunkfish, the Backwater Gunkfish spends most of its time on land. It can inhabit any damp, warm space where a water source is present. Its body is fat, flat, squishy and gelatinous, the width of a doormat. Its tail, slightly harder than the rest of its soft body, can range from 2-3 feet in length. When stressed, its tail is often curled up over its head to position for firing mucus or to shake and rattle as a deterrent.\n\nThe Backwater Gunkfish feeds off organic material on surfaces, and for this reason, it is found most often around polluted water, swamps, or dirty sewers. When frightened, the Gunkfish can use an opening in its tail to release a burst of a thick, green mucus mixed with saliva to defend itself; the Backwater Gunkfish keeps an especially large "reserve" for emergency situations and can squirt multiple times. When needed, it uses part of this extra reserve to excrete from its body, increasing its mobility on land.\n\nThe Backwater Gunkfish is harmless and is considered a natural cleaner of its preferred environments. Its mucus is a disinfectant; though it is not safe or healthy to consume, it is unlikely to cause major harm if it enters the body through the eyes or nose. Its smell is often described as a mix of vinegar and lard, and it is slightly warm when freshly excreted.\n\nThough not directly harmful, the Backwater Gunkfish is often considered a notorious pest to water treatment facilities and petroleum refineries. The gunkfish itself is evasive, capable of fitting itself into very small holes and pipes, and its mucus is arduous to remove once it has hardened, forming a substance comparable to ice. For all these reasons, the Backwater Gunkfish has lead to many accidents and should be taken seriously. Today, pest removal services are well-accustomed to safe Gunkfish removal and relocation operations, and there are many affordable options if you believe there is one in the area. The best way to prevent a Gunkfish infestation is to keep your environment clean and dry and to close off any access to standing water.=死水泥鱼\n\n西格德的危险等级：0%，可这群黏糊糊的小鬼就是不肯放过我！\n\n学名：Infectum linteum\n\n死水泥鱼属于蝠鲼科。与其他黏液鱼不同，它大部分时间生活在陆地上，任何温暖潮湿且有水源的地方都能栖身。身体肥厚扁平，柔软如胶，宽度相当于一张门垫。尾巴比躯体稍硬，长约 2–3 英尺。受惊时常把尾巴卷到头顶，准备喷射黏液，也会摇动尾巴发出响声以示威吓。\n\n它靠啃食物体表面的有机物为生，因此常见于污水、沼泽和肮脏的下水道。受到惊吓时，它会从尾部开口喷出混有唾液的浓稠绿色黏液来自卫。它为紧急情况储备的黏液格外多，可以连续喷射数次。必要时也会将部分黏液排到体表，帮助自己在陆上移动。\n\n这种鱼本身无害，还能清洁栖息地。它的黏液有消毒作用，虽不宜食用，但即便进入眼鼻，通常也不会造成严重伤害。刚排出的黏液略带温热，据说闻起来像醋混着猪油。\n\n尽管没有直接危害，它却是污水处理厂和炼油厂出了名的祸害。鱼身灵活，能钻进极小的孔洞和管道；黏液一旦硬化，便形成类似冰的物质，很难清除。这些特性已经酿成多起事故，不容轻视。如今，专业除害人员已能熟练地安全捕捉并转移黏液鱼。如果怀疑附近有鱼，可以找到不少收费实惠的服务。预防成灾的最好办法是保持环境清洁干燥，封住所有通往积水处的入口。
