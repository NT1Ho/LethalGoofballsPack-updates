exact:I am Geoffrey Samuel Smith, Agent and high commander working directly for the Emperor.\nThis will be my final message.\n\nUntil recent I have believed that my actions since the Catalyst under command of the Emperor were for some greater good.\nI was led to believe that all the sacrifices made were with purpose.\nYet they were in vain.\nIt wasn’t until I had lost all that I had left in my world when I realized.\n\nI now find myself here to execute one final mission.\nOne of my own.\nOver the past few months we have been collecting the many experimental bioweapons that were created because of me.\nI made them believe we got them to study them further. Make them more dangerous.\nThat’s what the emperor would have wanted.\nBut I will no longer follow the wishes of that man.\nHe sits on his golden throne while everyone else suffers by his command.\nI should have done something when he told me to give the order.\nI should have executed him right then and there.\n\nBack in the labs I smashed the glass containers for BIO-HXNV7, the deadliest weapon we have.\nIt will hopefully kill or convert most of the people here.\nThese loyal rats who think they’re on the winning side.\nThere is no winning side.\nAnd I’ll make sure nobody will escape this place.\nNobody will use these atrocities to further this pointless hell!\n\nI called for a facility wide decontamination.\nAnd all of it will burn!=我是杰弗里·塞缪尔·史密斯，作为直接隶属于皇帝的特工和高级指挥官。\n这是我的最后一条消息。\n\n直到最近，我一直认为自己在皇帝指挥下的行为是为了某种更大的利益。\n我被告知，所有做出的牺牲都是出于目的。\n然而，这些努力都是徒劳的。\n直到我失去了世界上所有剩下的东西时，我才意识到这一点。\n\n我现在在这里执行最后一项任务。\n我自己的一个\n在过去的几个月里，我们收集了许多因我而制造的实验性生物武器。\n我让他们相信，我们会让他们继续研究这些数字标记，让它们变得更加危险。\n这就是皇帝所期望的。\n我会不再遵循那个人的意愿行事。\n他坐在他的金色宝座上，而其他人则在他的命令下受苦。\n当他让我下达命令时，我本应该采取一些行动的。\n我本应该在当时就处决他。\n\n在实验室里，我打碎了用于存放BIO-HXNV7的玻璃容器，这是我们最致命的武器。\n希望这能杀死或消灭这里的大多数人。\n这些忠心的老鼠认为自己是赢家。\n没有赢家。\n我会确保没有人能够逃离这个地方。\n没有人会利用这些暴行来推进这个毫无意义的地狱!\n\n我要求对整个设施进行去污染处理。\n全部烧掉!
