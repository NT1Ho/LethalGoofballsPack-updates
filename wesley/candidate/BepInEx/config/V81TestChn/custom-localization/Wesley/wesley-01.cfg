exact:Crystaline cube\n\nThese cubic shaped anomalies are covelant crystals.\nPossibly made from a chemical reaction.\n\nSlightly luminescent.\n\nHighly volatile. Known to release rays of electricity and another unidentified material.\n\nNot many cleavage planes. Mainly in cubic formations.\nAppears to generate piezoelectricity even when slightly moved.\n\nInteresting patern.\n\nCrystalised Chisel\n\nThe item was left near a cube. After a few electric pulses from the cube it turned crystalline.\n\nDoes not appear to have the same properties as the cube.\nUseless.\n\n\nThese cubes could be used for highly efficient power sources if their volatile abilities are harnessed in a proper way.\n\nDo not get close or leave any items near them.\nEspecially while charged.=水晶立方体\n\n这些立方形的异常物体是结晶的晶体。\n可能是由化学反应形成的。\n\n略带发光特性。\n\n极易挥发。已知会释放电光和其他未知物质。\n\n几乎没有解理面。主要呈立方形态。\n即使轻微移动，似乎也能产生压电效应。\n\n有趣的纹理图案。\n\n结晶的凿子\n\n这个物品被留在了一个立方体的附近。经过几次来自立方体的电脉冲后，它变成了结晶状态。\n\n似乎与立方体没有相同的属性。\n毫无用处。\n\n\n如果合理利用这些立方体的挥发特性，它们可以用来制造高效的能源。\n\n不要靠近它们，也不要在它们附近留下任何物品。\n尤其是在带电状态下。
