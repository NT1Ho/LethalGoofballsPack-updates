exact:Bracken -- AKA flower man!\n\nit was flower man, you can't say othrwise! i wanted to find his body .You were the cowards\n\nScientific name: Rapax-folium\nThere is debate on the genus to which the Bracken belongs. It is a bipedal vertebrate with skin the color and texture of a red beat. The name was coined for what appear to be leaves protruding from its upper spine. The purpose of these is believed to be for intimidation, however not much is known about the specifics of bracken behaviour due to its illusiveness and low population.\n\nWe know a little from accounts by wildlife experts who have encountered it. is a lone hunter with high intelligence. Its behavior can seem aloof; it exhibits high aggression even when unprovoked, yet it quickly backs off when confronted. However, brackens are known to up their hostility when cornered or simply watched for a long time. For this reason it's recommended to keep an eye on it but not to stare it down. No specimens have been collected dead or alive. It's theorized that upon death their bodies undergo a rapid decomposition process which is unique from other large animals.=布拉肯（黑影），又叫花人！\n明明就是花人，别跟我犟！我本来想去找他的尸体。胆小鬼是你们！\n\n学名：Rapax-folium\n布拉肯究竟属于哪个属，尚有争议。它是双足脊椎动物，皮肤的颜色和质感酷似红甜菜。它的俗名来自上段脊柱伸出的叶片状结构，据推测有威吓作用。由于行踪隐秘、数量稀少，人们对其行为所知不多。\n从曾与之遭遇的野生动物专家口中，我们得知它智力很高，独自狩猎。它看似冷淡，即使不受挑衅也可能表现出强烈攻击性，但在正面遭遇时又会迅速退开。被逼入绝境或遭人长时间注视时，它的敌意会加重。因此，最好时刻留意它，却别和它一直对视。至今没有采集到活体或尸体标本。据推测，布拉肯死后会迅速分解，有别于其他大型动物。
