exact:He. Is. Watching.\nHe has his eye.. directly.. upon you.\nYou disturbed his temple.. and he is angry.\n\nI have been trying to rid this universe of this being for longer than you can imagine.\n\nThe things you see.. \nThey aren't real, ignore them.\nHe is trying to melt your mind.\n\nI can help you, if you help me.\n\nBring these seeds to their designated celestial bodies.\nIt will distract him for long enough.\n\nOnce that's done.. return..\nAnd I will make my move.\n\nSometimes a sacrifice is needed.. to banish evil.. for good.=他。在。看。\n他的目光……正落在……你身上。\n你惊扰了他的神殿……他动怒了。\n\n我一直想把这个东西从宇宙中除去，时间久到你无法想象。\n\n你看见的那些东西……\n都不是真的，别理会。\n他想摧毁你的心智。\n\n只要你帮我，我就能帮你。\n\n把这些种子带到各自指定的天体上。\n这样就能让他分心，给我争取足够的时间。\n\n办完之后……回来……\n我就可以动手了。\n\n有时，唯有献祭……才能永远……驱除邪恶。
