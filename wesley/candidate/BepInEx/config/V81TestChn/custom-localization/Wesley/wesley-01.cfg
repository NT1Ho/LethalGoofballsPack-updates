exact:If anyone has followed me from across the stars, I made it to my apartment, Julie is here with my daughter, they’re safe. The armies aren’t here yet but the city is preparing for an invasion. I just don’t think they’re ready.\nI mean I’ve read the reports. This city doesn’t have nearly enough to withstand whatever army they’ll throw at us.\nI’m fearful.\n\nBags are packed and we are about ready to leave. But if I’m speaking in honesty, it doesn’t quite sit right with me. I know I have done all that I could to warn people but I am not sure if it was right for me to just.. Leave like that. \nI’ve thought about going back but then I’d be leaving my family. There are countless people listening to my station and I hope they don’t feel abandoned. I know what that’s like unfortunately.\nIt’s rough. Like the lifeboat sailed away and now you’re drowning alone, unsure of how to survive. I’ve been there.\nTimes are worse now.=Julie和我女儿在一起, 他们很安全。军队尚未到来, 但城市正在准备入侵。我只是觉得他们还没准备好。\n我的意思是，我已经阅读了相关报告。这座城市根本没有足够的力量来抵抗他们可能派来的任何军队。\n我感到害怕。\n\n行李都收拾好了 我们准备出发了但如果我是诚实地说,我知道我已尽我所能警告人们,像这样离开。 \n我考虑过回去，但那样的话我就不得不离开我的家人。有无数的人在收听我的节目，我希望他们不会感到被抛弃。不幸的是，我明白那种感受。\n这很艰难。就像救生艇已经驶离，现在你独自溺水，不知道该如何生存。我也经历过这种感觉。\n现在的情况更糟了。
