uh, we really need to get better voice recorders for this.\nuhh anyways, yesterday we have finally concluded construction of the secondary research facillity here.\nThe equipment will arrive in a few days from now. Then we can offically start studdying on this side of the moon.\nWhich is splendid because have made a recent discovery...\nThis weird stuff..\nSome sort of fungi perhaps?\n\nI am not entirely sure what this is just yet but it has a.. regenerative ability.. at speeds unlike anything we have seen before.\n\nWe discovered this when we used a metal pipe to carefully stab a hole into it.\nAnwyays.\nI should wrap this up now, I'll record another log once we've got something.\n\nProfessor Harrington, over and out.=呃，真该换几台好点的录音机了。嗯，总之，昨天我们终于建好了这里的第二座研究设施。再过几天设备就会运到，到那时我们就能正式研究这颗星球的这一面了。正好，我们最近有了个发现……\n这种古怪的东西……也许是某种真菌？\n\n我还没弄清它到底是什么，但它有种……再生能力……速度之快，我们见所未见。我们拿金属管小心地在上面戳了个洞，就是那时候发现的。\n\n好了，今天就到这里。有了结果我再录下一篇。\n\n哈林顿教授，通话结束。
