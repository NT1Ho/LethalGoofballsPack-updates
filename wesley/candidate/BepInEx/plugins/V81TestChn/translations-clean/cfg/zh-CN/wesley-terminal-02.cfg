Transcript: interview one\n\nYear: 3\n\nDay: 74\n\nEmployee: 15-1\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: It's alright, it gets the family paid.\n\nInterviewer: How are the working conditions?\n\nEmployee: It's not the worst, a few accidents have happened but so far it's been OK.\n\nInterviewer: How would you recommend this job?\n\nEmployee: I can't say I'd recommend this job but if you are in desperate need of money like most of us, it's an alright job.=访谈记录 1\n\n年份：3\n\n日期：第 74 天\n\n员工：15-1\n\n\n采访者：你对这份工作满意吗？\n\n员工：还行，够养家。\n\n采访者：工作条件怎么样？\n\n员工：不算最差。出过几起事故，到现在还过得去。\n\n采访者：你会怎么向别人推荐这份工作？\n\n员工：说不上推荐吧。但你要是跟我们大多数人一样急等钱用，这活儿还凑合。
Transcript: interview three\n\nYear: 3\n\nDay: 96\n\nEmployee: 17-5\n\n\nInterviewer: How pleased are you with this job?\n\nEmployee: To be quite frank, it's horrible. If I could take any other job right now, I would.\n\nInterviewer: How are the working conditions?\n\nEmployee: They're horrible. There's no safety equipment, an accident can happen at any time. I am pretty sure there's only one first aid area. And the only reason it's there is because it's required.\nYou all know this moon incredible pressure below its thin crust, one mistake and it might just burst.. It'll flood the entire surface with boiling hot oil, likely killing most.. if not all of us.\n\nInterviewer: How would you recommend this job?\n\nEmployee: I simply wouldn't.\n\nInterviewer: this is the third person we've interviewed now... I swear if the next one is just like the others. I am going to start threatening these assholes and force some words oh.. it's still recording.=访谈记录：第三次访谈\n第3年，第96天　员工：17-5\n\n采访者：你对这份工作有多满意？\n员工：说实话，糟透了。现在只要还有别的工作可选，我就走了。\n采访者：工作条件如何？\n员工：糟透了。这里没有安全设备，随时可能出事故。我敢说就一个急救点，还是因为规定非设不可。你们都知道，这颗星球的薄壳下面压力有多大。只要出一次错，它就可能爆开……滚烫的油会淹没整个地表。我们就算不死光，也得死一大半。\n采访者：你会怎样推荐这份工作？\n员工：我不会推荐。\n采访者：这都采访第三个人了……我发誓，要是下一个还这样，我就开始威胁这帮混蛋，逼他们说点——哦……还录着呢。
