Tape 1, Infernis.\n\nThis is Captain Commander Cunningham.\nI have decided to start recording our sites of research and the environments we find ourselves in.\n\nOur current location is Infernis.\nThis fiery hellscape has done nothing but slow us down.\nThe seismic activity here is quite high so I'm not expecting to stay long.\nGood thing.\nThe mineshafts are riddled with bugs and are very much preventing us from doing anything.\n\nI rate this place a B+.\nCunningham, signing off.=因弗尼斯（Infernis）第1卷。\n\n我是坎宁安船长。\n我决定开始记录我们的研究地点以及我们所处的环境。\n\n我们当前的位置是因弗尼斯。\n这个火热的地狱般的地方让我们行动变得缓慢。\n这里的地震活动非常频繁，所以我预计不会在这里停留太久。\n幸好如此。\n矿井里布满了虫子，这让我们无法进行任何活动。\n\n我给这个地方打B+分。\n坎宁安，结束通话。
Tape 2, Atlantica.\n\nThis is Captain Cunningham.\nGoing to Atlantica wasn't something we had initially planned. It was purely our curiosity that has led us here.\n\nAs of now we have not yet encountered anything unnatural as the reports have said.\nHowever, I do feel something is off about this place. It is pretty but something in me is telling me to leave.\n\nSo far I would rate this place a C.\nHowever I might've changed my mind by the time we go.\nCunningham, signing off.=Tape 2, 亚特兰蒂卡（Atlantica）。\n\n我是坎宁安船长。\n最初我们并没有计划前往亚特兰蒂卡。纯粹是出于好奇才来到这里。\n\n目前还没有遇到任何不寻常的事情，就像报道中所说的那样。\n不过，我觉得这个地方有些不对劲。虽然它很美，但有什么东西在提醒我离开。\n\n到目前为止，我会给这个地方打C级评价。\n不过，等我们真正到达那里时，我的看法可能会改变。\n坎宁安，结束通话。
Tape 3, Etern.\n\nThis is Captain Cunningham.\nI have not been able to record much here and we will be leaving as soon as possible.\n\nOur trip to Etern has been an absolute disaster. I’ve seen more nutcrackers searching for us than there are grains of sand in this desert.\nWe’ve lost many and I’m not keen on losing any more of us.\n\nEtern gets an S+.\nI highly discourage anyone from going here.\nCunningham, signing off.=埃特恩3号，埃特恩。\n\n我是坎宁安队长。\n我在这里没能记录到太多信息，我们会尽快离开这里。\n\n我们前往埃特恩的旅程简直是一场灾难。我看到寻找我们的怪人数量比这片沙漠中的沙粒还要多。\n我们已经失去了很多人，我不想再失去任何人了。\n\n埃特恩被评为S+级。\n我强烈不建议任何人前往这里。\n坎宁安，结束通话。
Tape 4, Acidir.\nThis is Captain Cunningham.\n\nWhen we arrived here the crew seemed fine.\nI use the term fine very loosely here.. They managed.\n\nHowever I feel the longer we stay, the worse things seem to be getting.\nI'm not sure if it's the air, the manor or the lakes of acid. But a few of us have already gone missing.\n\nI rate Acidir an S.\nCunningham, signing off.=Tape 4, Acidir。\n这里是坎宁安船长。\n\n当我们到达这里时，船员们似乎都很好。\n在这里，我用的“很好”这个词非常宽泛……他们应付得不错。\n\n然而，我觉得我们停留的时间越长，情况似乎就越糟糕。\n我不确定是空气的问题，还是庄园的问题，又或者是酸湖的问题。但已经有几个人失踪了。\n\n我认为Acidir的等级为S。\n坎宁安，结束通话。
Tape 5, Gratar.\n\nThis is Captain Commander Cunningham.\nIt hasn’t been long since we got here.\nIt already appears to be a nice fresh breath of air compared what we have been through before.\n\nThe view is undeniably.. Stunning and the local wildlife has yet to try and kill us.\nWe will be going in soon to have a chat with this AI before we take off again.\n\nThus far I rate Gratar a low C.\nCunningham, signing off.=Tape 5, Gratar。\n\n这里是坎宁安船长。\n我们到这里已经不长时间了。\n与之前经历的情况相比，这里似乎是一股清新的空气。\n\n景色确实令人惊叹，当地的野生动物还没有试图攻击我们。\n我们很快会进去与这个人工智能交谈，然后再起飞。\n\n到目前为止，我对格拉塔尔的评价是低分C。\n坎宁安，结束通话。
