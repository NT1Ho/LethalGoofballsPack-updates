The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\n> The Beginning\nThe Employee\nThe Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Beginning - 0 days since impact.\n—--------------------------------------\nIn the town of Rosemaw, a small hike into the forest a meteor fragment had impacted.\nIt is not unusual for small fragments to reach the surface and make contact so it wasn’t immediately reported by the public.\n\nA few days later a few hikers had noticed an unusual looking fungus but chose to leave it be. These hikers only began to take notice once it started spreading and growing over a small patch in the forest. They didn’t think much of it and avoided the area for the time being.=希克塞利亚的腐败\n—--------------------------------------\n自最初陨石撞击以来，记录下来的事件时间线。\n> 开端\n员工\n官员\nI.T.D.A.\n掩盖行动\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\n开端 - 撞击后0天。\n—--------------------------------------\n在罗丝马乌镇，一小部分人徒步进入森林时，发现了一块陨石碎片撞击地面。\n小型陨石碎片到达地表并造成接触并不罕见，因此公众并未立即报告此事。\n\n几天后，一些徒步者注意到一种看起来不寻常的真菌，但选择不去理会它。这些徒步者直到这种真菌开始在森林中的一小片区域蔓延和生长时才开始注意它。他们并没有太在意，暂时避开了该区域。
The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\n> The Employee\nThe Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Employee - 4 days since impact.\n—--------------------------------------\nRichard Pollar, more commonly known as Rich, arrived at the local bakery for work an hour before opening time. He started preparing the kitchen for the day, organising and cleaning the kitchen when he noticed red blobs of an unusual liquid sticking to the equipment and the furniture.\nThe liquid was thick and lukewarm to the touch, a gooey substance. Rich was both intrigued and disgusted by the discovery and went looking for the source. He couldn’t find anything else out of the ordinary until he got to the stove. He was frightened by what he saw. It was a rat covered in tendrils with strange goop oozing from one of its empty eyesockets, bubbling and twitching as it did. Before Rich could fully understand what he was looking at, it scurried away, fleeing to someplace outside.\nHe was shaking and frantically called his employer before loosely explaining what happened.\nRich was quickly dismissed with the assumption of it being another one of his psychotic breaks.\nMeaning to prove that what he witnessed was real, he went to chase it down, leaving a note for the other employees explaining where he went.\nRich followed the trail of goop through the town, into the forest all the way to the area where the fungus was spotted by hikers before. There he found it, laying still on this yellow-orangish rock. Rich was bemused and stared at it for a while. He assumed it was dead considering its state and the fact it wasn’t moving anymore. The only movement he saw were these small tendrils sticking out of its body.\nUnsure of what to make of it he decided to investigate, he was scared but his curiosity carried him forward. The fungus he had heard about has seemingly spread through a significant chunk of the forest.\nAs Rich wandered through the infested area, he laid eyes upon more of these critters in a similar condition. Witnessing this he got scared and ran back towards the bakery and told his coworkers, who had arrived by this time, what he had seen. To ensure they would believe him he had taken some pictures to show.\nThe coworkers seemed very concerned upon being shown the pictures. Similarly confused and disgusted they decided to investigate on their own, leaving Rich at the bakery, who at this time was still shaking.\nAn hour passed and Rich grew concerned, maybe they got lost, maybe they were still investigating, who knows. But he grew more and more concerned by the minute. Another hour later he finally made the decision to call the authorities. Fearing they’d dismiss him if he spoke the truth, he only said there was an emergency at the bakery. And there he stayed until an officer arrived.=希克塞利亚的腐败\n—--------------------------------------\n自最初陨石撞击以来，记录下来的事件时间线。\n开端\n> 员工\n官员\nI.T.D.A.\n掩盖事件\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\n员工 - 撞击后4天。\n—--------------------------------------\n理查德·波拉尔，更常被称为里奇，在开店前一个小时到达当地的面包店上班。他开始为当天做准备，整理和清洁厨房时，注意到设备上和家具上沾有红色液体斑点。\n这种液体摸起来浓稠而温热，是一种黏糊糊的物质。里奇对这一发现既感到好奇又感到厌恶，于是去寻找源头。直到他走到炉灶前，他才发现了其他异常情况。他所看到的景象让他感到恐惧。那是一只被奇怪触须覆盖的老鼠，其中一个空眼窝里渗出了黏稠的液体，它还在抽搐和冒泡。在里奇完全明白发生了什么之前，那只老鼠已经逃走了，消失在某个地方。\n他浑身发抖，疯狂地叫来了他的雇主，然后简要地解释了发生的事情。\n里奇很快就被认为这是他又一次精神崩溃，被轻易地驳回了。\n为了证明他所看到的都是真实的，他决定追上去，并给其他员工留了一张纸条，说明自己去了哪里。\n里奇沿着那条黏糊糊的痕迹在镇上走，一直走到森林里，最终找到了之前徒步旅行者发现真菌的地方。在那里，他发现那只真菌静静地躺在黄色或橙色的岩石上。里奇看着它，感到困惑，认为它已经死了，因为它不再动弹了。他看到的唯一动静就是那些从小小的触须中伸出的部分。\n不确定该如何处理这件事，他决定继续调查。虽然害怕，但他的好奇心驱使他继续前进。他听说过的真菌似乎已经扩散到了森林的很大一片区域。\n当里奇在受感染的区域漫步时，他发现了更多处于类似状态的生物。看到这一幕后，他感到害怕，跑回面包店，告诉此时已经到达的同事他所看到的情况。为了确保他们相信他，他还拍了一些照片作为证据。\n同事们看到照片后显得非常担忧。他们同样感到困惑和厌恶，决定自行调查，而里奇则留在了面包店，此时他仍然在颤抖。\n一个小时过去了，里奇开始担心，也许他们迷路了，或者还在调查中，谁知道呢。但随着时间的推移，他的担忧越来越严重。又过了一个小时，他最终决定联系当局。由于担心如果说实话他们会驳回他的报告，他只说面包店发生了紧急情况。他就这样待着，直到一名官员到达。
The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\n> The Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Officer - 4 days since impact.\n—--------------------------------------\nAn officer by the name of Michael Benson, Mike for short. Arrived at the scene finding a distressed Richard sitting in the bakery. Mike asked about the emergency to which Rich tried to explain that his coworkers left to investigate something in the forest but hadn’t returned for hours. Mike grew suspicious and calmly asked why he’s as distressed as he is. Rich told Mike there’s horrifying things happening in the forest around the infested area.\nMike called this in and went to have a look for himself, unsure if he was telling the truth. But only after a few more officers arrived at the scene.\nMike arrived at the forest and cautiously took a few steps in when he already began to see signs of something being off.\nThe ground was covered in yellowish rock with this red substance oozing out of the ground. Slightly deeper into the forest, plants seemed to turn gray, die or get covered in this same yellow rock.\nMike returned to the edge of the forest and called for a search party. This has to be reported, it has become a real anomaly he thought. Half an hour later four more officers arrived and the search started.\nAs Mike ventured deeper into the forest he began to see the same things Rich had described, Critters, seemingly deceased with tendrils erupting from their bodies. Starting to get a notion of dread he continued. As he stumbled further into the woods it became less and less lively.\nThen he noticed something red, moving away from him, sliding across the rocky ground, leaving a trail of that same red substance. As Mike got closer the picture got clearer, it was similar to the critters he had seen earlier. When he walked in a big circle to the front of it he saw what it really was.\nIt was the front half of a moose, a large tentacle slid out of its mouth alongside a significant amount of red ooze. Where its back half was meant to be was nothing but tendrils and intestine slowly moving it forward.\nFrightened, Mike quickly stepped back. He wasn’t sure what to do. It looked like it was trying to scream or yell but no sound erupted from its mouth. Another tentacle protruded through one of its eyes, pushing it out of its socket followed by blood and ooze.\nNow horrified, Mike grabbed the weapon out of his holster and fired a bullet into its head, meaning to end its suffering.\nIt ceased to move for a moment but quickly got back to it, now oozing from the wound.\nMike was filled with dread and ran away from there. On his way back he found something else.\nThe missing employees laid there, lifeless on the hard rock surface. He called it in and told the other officers to head back. The employees were in a terrible condition, it looked like their limbs had torn themselves from their bodies, oozing out of their eyes and mouths. Witnessing this he ran back immediately and met up with the other officers in the bakery. This has quickly turned into a seemingly deadly fungal invasion.=希克塞利亚的腐败\n—--------------------------------------\n自最初的流星撞击以来，所有事件的记录时间线。\n开端\n员工\n> 官员\nI.T.D.A.\n掩盖事件\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\n官员 - 撞击后4天。\n—--------------------------------------\n一名名叫迈克尔·本森的官员，简称迈克。他赶到现场时，发现理查德坐在面包店里，看起来非常痛苦。迈克询问了紧急情况，理查德试图解释他的同事离开去调查森林里的状况，但已经数小时没有回来。迈克开始怀疑，并平静地询问他为何如此痛苦。理查德告诉迈克，被感染的区域周围的森林里正在发生可怕的事情。\n迈克立即报告此事，并亲自去查看情况，不确定理查德是否说了真话。但直到其他几名官员赶到现场后，他才离开。\n迈克进入森林，小心翼翼地走了几步，就发现了一些异常现象。\n地面上覆盖着黄色的岩石，红色物质从地面渗出。在森林深处，植物似乎变成了灰色，或者死亡了，或者被同样的黄色岩石覆盖。\n迈克回到森林边缘，召集了一支搜索队。他认为这必须被报告，因为这已经变成了一个真正的异常现象。半小时后，又有四名官员赶到，搜索开始了。\n随着迈克深入森林，他开始看到理查德描述的那些现象：一些生物，看起来已经死亡，身体上长出了触须。他开始感到恐惧，继续前进。当他越走越深时，森林变得越来寂静。\n然后他注意到有红色的东西从他身边移动过来，沿着岩石地面滑行，留下一串同样的红色物质。当迈克靠近时，情况变得更加清晰，它和他之前看到的生物很相似。当他绕到它的前面时，他看到了它的真实面目。\n那是一只驼鹿的前半部分，一个巨大的触须从它的嘴里伸出，伴随着大量的红色液体。它的后半部分变成了触须和肠子，缓慢地向前移动。\n迈克非常害怕，迅速后退。他不知道该怎么办。它似乎想要尖叫或喊叫，但没有任何声音从它的嘴里发出。另一个触须从它的眼睛中伸出，将其从眼眶中推出，随后是血液和液体。\n现在，迈克感到极度恐惧，拿起武器，向它的头部射出一颗子弹，试图结束它的痛苦。\n它暂时停止了移动，但很快又恢复了活动，伤口处仍然有液体渗出。\n迈克充满了恐惧，逃离了那里。在返回的路上，他又发现了其他东西。\n那些失踪的员工躺在坚硬的岩石表面上，已经没有生命迹象。他立即报告此事，并告诉其他官员返回。这些员工的状况非常糟糕，看起来他们的四肢已经从身体上撕裂出来，眼睛和嘴巴里也有液体渗出。目睹了这一场景后，他立即跑回面包店，与其他官员会合。这很快变成了一场看似致命的真菌侵袭。
The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\nThe Officer\n> The I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe I.T.D.A. - 7 days since impact.\n—--------------------------------------\nThe town has been evacuated and all survivors involved have been brought in for questioning and isolation. The I.T.D.A. Has labeled this situation as critical and has begun quarantining the area. Nobody was allowed to enter or leave the quarantine zone. The military had been called in for additional security.\nSeveral teams of experienced biologists and scientists had made it to the site to analyze and halt the anomalous threat. It was immediately proven not to be any sort of fungi but something else that had yet to be documented. This spread seemed to overtake whatever they put in front of it, consuming it entirely. Attempts of halting the spread were made such as burning it which only temporarily made the tendrils disappear. They had attempted several other chemical solutions to no avail. The closest they had gotten was by using a liquid which super freezes anything it comes into contact with. It only significantly slowed it down.\nFrom this point several nearby towns were also evacuated as the spread and the quarantine area grew. Slowly but surely the area was becoming a wasteland.\nIt was discovered that direct contact with the substance could result in an infection which ends in a grueling eruption of tendrils, torn limbs and death.\nThe I.T.D.A. had officially labeled the spread as a world-ending level hazard. And as there have been no viable methods to halt the spreading or cure anyone infected. The I.T.D.A after a discussion with the Council of Rule on Calist, had marked Hyxellia as a moon in quarantine. Nobody could enter. Nobody could leave. Those who tried were either stopped or killed.\nThe population remaining on Hyxellia were scared, unable to send out or receive communication from a source outside of the moon, the only source they had were the I.T.D.A. which assured the public that the threat will be dealt with.\nBiologists had well documented the workings of this spread which has gained the name “The Red Death”. In a detailed report it was documented how the red death consumed and spread:\nThe yellow rock-like material isn’t technically stone as many assumed but more similar to a very thick, dense, solidified skin. Instead of being stretchy, the density makes it much harder and rock-like. Below the yellow crust is a much softer meat-like material, this material is able to retract or expand, even move as if it’s one large living being organising its fleshy layer. This soft layer has seen to form these tentacles or tendrils for either defensive or even offensive measures. The spread itself is quite unique, these cells will attempt to eat whatever is around them and immediately replace the consumed material with a new cell. The process of consumption also generates this red substance. Drilling procedures have noted that deep inside the soft layer there’s large tunnels where the substance flows similar to our veins. The substance which gets generated doesn’t always end up within these veins, it often surfaces and forms large bubbles of goop below the crust, sometimes bursting through, leaving holes within the crust and forming large puddles of goop.\nAt the two week mark, the Red Death had consumed nearly half the moon. The cause seemed lost. This was the end times. Anyone still on Hyxellia was awaiting a horrible fate with no way of saving them.\nMany military personnel as well as teams sent in by the I.T.D.A. have chosen to end their own lives to avoid a worse end.=希克塞利亚的腐败\n—--------------------------------------\n自最初的流星撞击以来，记录下来的事件时间线。\n开端\n员工\n官员\n> I.T.D.A.\n掩盖\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\nI.T.D.A. - 撞击后7天。\n—--------------------------------------\n该镇已被疏散，所有幸存者都被带去接受询问和隔离。I.T.D.A.将这种情况标记为紧急事件，并开始对区域实施隔离。任何人都不允许进入或离开隔离区。军队也被调来加强安保。\n几支由经验丰富的生物学家和科学家组成的团队已经到达现场，分析并阻止这种异常威胁。很快证明这并不是某种真菌，而是另一种尚未被记录的物质。这种扩散似乎会吞噬任何挡在它面前的事物，将其完全摧毁。他们尝试了多种方法来阻止扩散，比如燃烧，但这只是暂时让触须消失。他们还尝试了其他化学方法，但都没有成功。最接近的方法是使用一种液体，它可以使接触到的任何东西迅速冻结。但这只能显著减缓扩散速度。\n从这一点开始，附近的几个镇子也被疏散，因为扩散和隔离区域不断扩大。这个地区逐渐变成了一片荒地。\n人们发现，直接接触这种物质会导致感染，最终引发剧烈的触须、断裂的肢体和死亡。\nI.T.D.A.正式将这种扩散标记为世界末日级别的危险。由于目前没有有效的办法来阻止扩散或治愈感染者，在与Calist理事会讨论后，I.T.D.A.将希克塞利亚标记为隔离卫星。没有人可以进入或离开。试图进入或离开的人要么被阻止，要么被杀死。\n留在希克塞利亚的人口非常害怕，无法从月球以外的来源发送或接收信息，他们唯一的消息来源就是I.T.D.A.，后者向公众保证会处理这一威胁。\n生物学家已经详细记录了这种扩散的机制，它被称为“红死病”。在一份详细的报告中，记录了红死病如何吞噬和扩散：\n这种黄色岩石状物质实际上并不是石头，而是类似于非常厚、致密、固化的皮肤。它不是可伸缩的，而是密度极高，更像岩石。在黄色外壳下面是更柔软的肉状物质，这种物质能够收缩或扩张，就像一个巨大的生物组织其肉质层一样。这个柔软层形成了这些触须或触须，用于防御甚至进攻。这种扩散本身非常独特，这些细胞会试图吞噬周围的一切，并立即用新的细胞替换被吞噬的物质。吞噬过程还会产生这种红色物质。钻探程序发现，在柔软层的深处有大型隧道，物质在其中流动，类似于我们的血管。产生的物质并不总是进入这些血管，它经常浮出表面，在外壳下形成大块的粘稠物，有时会破裂，在外壳上留下孔洞，形成大块粘稠物。\n两周后，红死病几乎吞噬了半个月球。原因不明。这就是末日。仍然留在希克塞利亚的人都在等待可怕的命运，没有任何办法可以拯救他们。\n许多军事人员以及I.T.D.A.派来的团队选择自杀，以避免更糟糕的结局。
The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\nThe Officer\nThe I.T.D.A.\n> The Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Coverup - 16 days since impact.\n—--------------------------------------\nHyxellia had been nearly entirely consumed and the I.T.D.A. had ceased any further attempts at rescuing the moon.\nFollowing this the I.T.D.A. had sent out a message to Calist, where the council would decide over the fate of the moon.\nThe response was immediate and due to the level of contagiousness of the Red Death, the council had decided to not only keep the moon in quarantine but also silence anyone aware of the situation.\nHyxellia was to be removed from the star maps and public knowledge entirely as if it had never existed in the first place. They had gone through great lengths to achieve this.\nNearing full corruption, few reports were sent out by biologists in hopes they would be rescued.\nThey spoke of having heard sounds from deep space, calling them cosmic, possibly a language they couldn’t understand. They said it felt like something was watching them. Something beyond what they could understand. Something they couldn’t feel but only feel its presence of.\nIn the final moments of life on Hyxellia, a warning was sent out:\n“Stay away. It is watching us. It sees us. It will come for us all.”\nHyx is a threat, well documented and hidden.\n\n[These documents have been classified by the Council of Rule]\nUnder no circumstance can they be released to the public.\nThey will be kept on Hyxellia to ensure no living being is able to access them.=希克塞利亚的腐败\n—--------------------------------------\n自最初流星撞击以来，记录下来的事件时间线。\n开端\n员工\n官员\nI.T.D.A.\n> 掩盖行动\n—--------------------------------------\n[本记录依据对当事人的访谈及相关报告，详细还原了事件经过。]\n\n掩盖行动 - 自撞击以来已过去16天。\n—--------------------------------------\n希克塞利亚几乎完全被摧毁，I.T.D.A.也停止了任何进一步的救援尝试。\n此后，I.T.D.A.向卡利斯特发送了一封信，要求议会决定月球的命运。\n回应迅速，由于“红死病”的传染性极强，议会决定不仅将月球置于隔离状态，还要让所有知情者保持沉默。\n希克塞利亚将从星图上彻底抹去，仿佛它从未存在过一样。他们付出了巨大努力来实现这一目标。\n在腐败达到顶峰之际，生物学家们几乎没有发出任何救援请求的报告。\n他们提到听到了来自深空的声音，称其为宇宙之声，可能是他们无法理解的语言。他们说感觉好像有什么东西在注视着他们。有些东西超出了他们的理解范围。他们无法感知，只能感受到它的存在。\n在希克塞利亚生命最后的时刻，发出了一个警告：\n“远离。它在注视着我们。它看到了我们。它会来找我们所有人。”\n希克斯是一个威胁，其存在已被详细记录并隐藏起来。\n\n[这些文件已由统治议会列为机密。]\n在任何情况下，都不能向公众公开。\n它们将被保存在希克塞利亚，以确保没有任何生物能够获取它们。
The earthquakes are getting louder and I can hear parts of the cavern collapsing in the distance ahead of me.\nThe amount of bodies I have seen have left me horrified. While some of them were slumped over. Others looked like they were trying to run.\nIt's getting harder for me to breathe. And my legs are getting tired.\nI have found a few crystals of value. Not many but I should not succomb to my greed. This deposit is lost and I don't want to die trying to find it.\nI'm turning around and heading back. I want to see my cat Bean again.\nI just need to remember the way I came.=地震的声音越来越响，我能听到前方洞穴的部分结构正在崩塌。\n我看到的尸体数量让我感到恐惧。有些尸体蜷缩着，而另一些则看起来像是试图逃跑。\n我的呼吸变得越来越困难，双腿也变得疲惫。\n我找到了一些有价值的晶体。虽然不多，但我不能屈服于贪婪。这个矿藏已经失去了，我不想在寻找它时死去。\n我打算转身回去。我想再见到我的猫Bean。\n我只需要记住来时的路。
The past few weeks have been difficult.\nMy memory hasn't been the same since the crash.\nI do not recall much from before.\nAll that remains is some faint visions of self healing flesh, independently growing eyes and a bright flash before panic ensued.\n4 of us fled to one of ships and escaped the scene. \nI don't know what happened to the other two teams who were present at the time.\nI have now come to know that the entirety of Cosmocos vanished. And what we were standing on was merely a severed chunk of it.\n\nNobody has dared to return. We called it Desolation.\nI'll attach the coordinates to this log for anyone brave enough to have a look for themselves.\nAfter my recovery I might be able to help the people out over here.\nI've heard some interesting projects being discussed.\n\nProfessor Harrington, over and out.=过去几周非常艰难。\n自从那次崩溃之后，我的记忆已经不再如从前。\n我几乎不记得之前的事情了。\n剩下的只有一些模糊的幻象，比如自我修复的肉体、独立生长的眼睛，以及在一阵恐慌之前出现的明亮闪光。\n4 我们逃到一条船上 逃离现场 \n我不知道当时在场的其他两个团队发生了什么。\n我现在得知，整个科斯莫科斯都消失了。而我们曾经站立的地方，不过是一块被切下的碎片而已。\n\n没有人敢回来。我们将其称为荒芜。\n我会把坐标记录在这份日志中，供那些勇敢的人自行查看。\n等我恢复之后，或许能够帮助这里的人们。\n我听说有一些有趣的项目正在讨论中。\n\n哈林顿教授，再见。
The plan worked. We lost good men but we took control over the facility.\nIn the control room I gained access to the ships which we are now loading up to make our escape.\nIt appears as though the guards called in an emergency.\nI expect more of them to come soon.\nI'll shoot a couple pipes on my way out in hopes that some of them suffocate in the leaking gas.\nBut more importantly. I went searching. And I found.\nJareck Hill was here 6 days ago. The log I read indicates that he now finds himself in another facility.\nThe flight route was set to 842 Core. I expect to find him there. With a proper disguise.\n\nPerhaps I can sneak in.. I must try.=计划成功了。我们失去了优秀的人员，但成功控制了该设施。\n在控制室里，我获得了进入飞船的权限，我们现在正在为逃跑做准备。\n看起来守卫们发出了紧急呼叫。\n预计很快会有更多的守卫赶来。\n在离开时，我会射杀几根管道，希望其中一些人在泄漏的气体中窒息而死。\n但更重要的是，我进行了搜索，并且找到了线索。\nJareck Hill在6天前来到这里。我查阅的记录显示，他现在身处另一个设施中。\n飞行路线被设定为842地核。我预计会在那里找到他，而且我会做好伪装。\n\n也许我可以偷偷进入……我必须试试。
The plan:\n\nI am going to kill Aaron.\nI must.\nI don't want there to be any evidence after so. \nI'll have to burn everyhing. Anyways.\nOnce he has arrived aI will lead him over to a small room where we used to hang out as children.\nAnd when he thinks he's safe I'll hrab my baseball bat and if not kill him, knock him unconsious.\nI'll hide his body in one of those giant standing Jack-in-the-box boxes that used to scare me to death.\nI'll have to improvise after.=计划：\n\n我要杀死亚伦。\n必须这么做。\n我不想留下任何证据。 \n我得把一切烧掉。不管怎样。\n等他到了那里，我会带他去一个我们小时候常聚的小房间。\n当他以为自己安全时，我会拿起我的棒球棒，如果他还清醒，就杀了他，让他失去意识。\n我会把他的尸体藏在那些巨大的立式玩具箱里，那些玩具箱以前总是让我害怕得要死。\n之后我得随机应变了。
The purifying shrine\n\nThis device was designed to harvest and project the power of the purifying stones and spread their effect across areas far and wide.\n\nThe farmers most often used these to stabilize their farmland and increase the rate at which their crops grew.=净化神殿\n\n该装置旨在收集并释放净化石的力量，将其效果传播到广阔的区域。\n\n农民们最常使用这些装置来稳定农田，并提高作物的生长速度。
The stones of purification\n\nThese stones hold incredible power.\nThrough the crystal growing within, it can be used to alter matter.\n\nTo rid food of mold, crops of insects, water of plagues.\nIt can speed the growth of plants, heal the wounded, increase their strength.\n\nOnly when put together in precise ways can their power be used.=净化之石\n\n这些石头拥有不可思议的力量。\n通过内部生长的晶体，它们可以用来改变物质。\n\n可以去除食物中的霉菌、农作物中的害虫、水中存在的瘟疫。\n它们还能加速植物的生长、治愈伤者、增强他们的力量。\n\n只有以精确的方式组合这些石头，它们的力量才能被发挥出来。
The volcano was supposed to be dead!\nAt least that's what they told us.\nAny poor soul out there is currently being fried in the fiery rains of death.\nIf we don't call in rescue..\nWe might not see the light of day again.=这座火山本应已经熄灭了！\n至少他们是这么告诉我们的。\n现在，任何不幸的人都在死亡的烈焰雨中煎熬着。\n如果我们不呼叫救援……\n我们可能再也无法见到阳光了。
There has been a fair passage of time between now and the previous time I have written.\nI had not expected this arrangement would prove so demanding. It feels as though every few days a new ship arrives at my door, not to be enamored by the mystiques of my gallery but rather to dispose of the debris they have gathered.\nI have attempted to inquire about their work yet they seem either hesitant to explain or convey that they know as much as I do.\nEither way, I have made the wise decision to automate the process of exporting these worthless pieces to Gordion. I cannot imagine taking care of such matters personally without leaving me exhausted.\n\nThere has however been one thing I became aware of regarding this mysterious company. They do not take kindly to their employees and demand them work an absurd amount where failure appears to be met with termination in the quite literal sense.\nI have always been aware of the cruelty within this region from the tales but I had never imagined it to be this terrible. Not until I met this gentleman of the name Marcus Brad.\n\nI wouldn't say it was the most pleasant of encounters.\nThis company ship had landed and were doing their own usual business. I on the other hand was altering some of the displays, not quite paying the attention to my surroundings as I likely should have.\nUpon turning, I discovered an armed stranger silently standing a few paces behind me, which in honesty I found considerably less pleasant than the display I had been arranging moments earlier. It was quite alarming even and my response was rather lacking. He demanded that I help him with his harrowing situation which, at the time, I wasn’t aware of how bad it was. His suit appeared worn, bloodied with a scorch mark covering the left side of his helmet. An intimidating figure.\nI exclaimed I wouldn’t know how and even if I did there would be a chance this mysterious company would return with evil intent.\nHe appeared serious, slightly frustrated even. Still pointing the weapon in my direction I attempted to politely ask for his name and how I could be of service.\n“My name is Marcus.”, he replied. “I have survived this company for at least five weeks now. You wouldn’t believe what they put us through. You need to help me escape them. Sooner or later they will try to kill me again.”. This ominous response left me curious and so I tried to inquire what exactly he meant with, they will try to kill him again. \nHe replied: “We have a quota we have to meet every few days. It keeps getting higher every time we succeed. I don’t believe it stops. It gets higher and higher until it’s impossible to reach. What happens if we don’t meet the quota? We die. The ship enters space and opens the doors sucking us into space to die an excruciating death. I survived this once, only because I could crawl into this airtight space within the ship’s internals before the doors opened and.. Took the others.”.\nI was stunned by this news. I confess I initially expected exaggeration.\nI could now sense that it wasn’t frustration in his voice but desperation. Perhaps a hint of sadness and dread.\nI offered a proposal, if he’s able to find and bring me uniquities or antiquities. I would search for a way of hiding him from and possibly tricking this company. Which he accepted.\n\nSince that eye opening encounter I have had a security system installed at the counter in case somebody deranged comes upon me with malicious intent.\nSo it appears for now I will be keeping myself busy with devising a plan alongside some other research I have been doing.\nI am certain I will write again.=从我上次写作到现在，已经过去了相当长的时间。\n我没想到这种安排会如此麻烦。感觉每隔几天就会有一艘新船来到我的门口，它们并非被我画廊的神秘氛围所吸引，而是想要处理掉它们收集到的垃圾。\n我试图询问他们的工作情况，但他们似乎要么不愿意解释，要么表示他们和我一样清楚情况。\n无论哪种方式,我已经做出了明智的决定 将这些没用的物品出口到戈尔迪翁的过程自动化我无法想象自己会亲自处理这些事情 而不让我精疲力尽\n\n不过，关于这家神秘公司，我有件事注意到。他们对员工非常苛刻，要求员工完成极其艰巨的工作，而一旦失败，他们就会以字面意义上的解雇来惩罚员工。\n我一直通过故事了解到这个地区存在的残酷现象，但我从未想象过它会如此可怕。直到我遇到了名叫马库斯·布拉德的这位先生。\n\n我不会说这是最愉快的相遇。\n这艘公司的船只已经靠岸，他们正在从事自己惯常的业务。而我则正在调整一些展示设备，没有完全注意周围的环境，虽然我本应该如此。\n转身时，我发现一个武装的陌生人静静地站在我身后几步远的地方。说实话，这让我感到相当不愉快，比我刚才所准备的场面还要糟糕。他要求我帮助他解决他的困境，当时我并不清楚情况有多严重。他的制服看起来很破旧，身上有血迹，头盔的左侧还有一个烧焦的痕迹。真是个令人畏惧的人物。\n我大声喊道，我不知道该如何做，即使我知道了，这个神秘的公司也有可能带着恶意回来。\n他看起来很严肃，甚至有些沮丧。他仍然用武器指向我的方向，我试图礼貌地询问他的名字以及我能为他做些什么。\n他回答说,“我的名字是Marcus......”。 “我从该公司活了至少五个星期。你不会相信他们给我们带来了什么。你需要帮助我摆脱他们他们迟早会试图再次杀我。”这个不祥的反应让我好奇, 所以我想问他到底是什么意思, 他们会试图再次杀死他。 \n他回答说：“我们有一项必须每隔几天就完成的任务指标。每次成功完成后，这个指标就会越来越高。我认为它永远不会停止上升，直到达到无法再达到的限度。如果我们没有完成这个指标，会发生什么？我们会死掉。飞船进入太空后，门会打开，把我们吸入太空，让我们遭受极度的痛苦而死。我曾经活下来，只是因为在门打开之前，我能爬进飞船内部的密封空间……其他人则没能成功。”\n这个消息让我震惊了。我承认，最初我以为这不过是一种夸张的说法。\n我能够感觉到，他声音中的并非沮丧，而是绝望。或许还带着一丝悲伤和恐惧。\n我提出了一个提议：如果他能够找到并带给我一些独特的或古老的物品，我会想办法把他隐藏起来，甚至有可能欺骗这家公司。他同意了我的提议。\n\n自从那次令人警醒的遭遇之后，我在柜台处安装了一个安全系统，以防那些心怀恶意的人以恶意为之而找到我。\n目前看来，我将继续忙于制定计划，同时开展一些其他研究。\n我确信自己会再次写作。
There has been a terrible turn of events.\n\nThe whole crew is celebrating, currently, after the Captain has confirmed my mad ramblings to be based in truth.\nThat Cosmocos possesses incredible alien knowledge, and is willing to share it with us.\nGranted - initially, I was not entirely coherent when I tried to convey my experience with the celestial brain, but...tch, I’ll hold my tongue.\n\nHe’s ordered to remove the brain and prepare for it to be taken back with us to 61-March.\nBut this will kill Cosmocos, I know this for certain.\nSlowly, over time, atrophied, until it is a husk.\nI don’t know why the Captain, having been offered the same kindness from Cosmocos, would even consider doing something like this.\nIt’s not right.\nPerhaps he doesn’t know?\nPerhaps we were not offered the same thing?\nPerhaps he knows...and he doesn’t care?\nHe’s not a man known for his kindness, after all.\n\nI asked that we put it to a vote.\nNot a single person sided with me.\n\nI don’t know what to do.\nI don’t know what I could possibly do to dissuade the Captain that wouldn’t have me thrown in a pod set on course for a jail cell back on 61.\n\nBut I have to do something.\nThis isn’t what Cosmocos wants.\nAnd I refuse to see it die like this.\n\nLieutenant Commander Cunningham, signing off.=发生了极其糟糕的事情。\n\n目前，全体船员都在庆祝，因为船长确认了我的疯狂想法是建立在真相之上的。\n科斯莫科斯拥有令人难以置信的外星知识，并且愿意与我们分享。\n当然，最初当我试图描述与那颗天体大脑的经历时，我并不连贯……但是，我会保持沉默。\n\n他被命令移除那颗大脑，并准备将其带回61-March。\n但我知道，这样做会杀死科斯莫科斯。\n它会慢慢萎缩，最终变成一副空壳。\n我不明白，既然科斯莫科斯也给予过同样的善意，船长为什么还要这么做。\n这不对。\n也许他不知道？\n也许我们没有得到同样的对待？\n也许他知道……但他不在乎？\n毕竟，他并不是一个以善良著称的人。\n\n我提议进行投票。\n但没有一个人支持我。\n\n我不知道该怎么办。\n我不知道能做些什么来阻止船长，否则我就会被送回61-March，进入监狱。\n\n但我必须做点什么。\n这不是科斯莫科斯想要的。\n我拒绝看到它就这样死去。\n\n坎宁安中校，结束通话。
There's heads\nI swear\nThere are heads in the dark place\nWhy wont they believe me\n\n..\nMaybe they're right\nIgnore me\nI'm not okay=有头目\n我发誓\n在黑暗的地方有头目\n为什么他们不相信我\n\n..\n也许他们是对的\n别理我\n我并不好
These old voice recorders are the worst.. \nRight.. \nWe've got word from captain Donahue over at the primary facility. \nThey have found.. something.. \nIt appears to be something new, something unexplored. \nThey think it might be some sort of plant which sounds exciting. \n\nHere however we've made steady progress. \nAs mentioned before, this cosmic growth is able to grow.. eyes wherever it pleases. \nAt first we thought it might be some sort of defense mechanism. \nBut there's no active predators on Cosmocos from the data we've gathered. \nBut then we noticed something strange.. \n\nOne of the eyes growing in our incubators was able to move and look around, illuminating whatever it looked at. \nThis place is full of surprises. \nMore information soon. \n\nProfessor Harrington, over and out.=这些老录音机最糟糕... \n对... \n我们收到唐纳休船长在主设施的消息 \n他们发现了... 什么东西... \n似乎有些新事物, 一些未探索的东西 \n他们认为这也许是某种植物 听起来很刺激 \n\n然而,我们在这方面取得了稳步进展。 \n如前所述,这种宇宙增长能够生长... 眼睛可以随心所欲地成长 \n起初我们以为它可能是某种防御机制 \n但是从我们收集到的数据来看 宇宙号上没有活跃的掠食者 \n但后来我们发现一些奇怪的事情... \n\n我们孵化器中成长的一只眼睛 能够移动和环顾四周, 启发着它所看到的任何东西。 \n这地方充满惊喜 \n很快会收到更多资料。 \n\n哈灵顿教授 完毕
They brought this newfound knowledge to the village. They told everyone.\nWhile of course there were a lot of sceptics, there were few who had seen this light before when they were young. It had never spoken to them however.\nMaybe it wasn't a creature. Or something akin to that. Maybe it was the essence of their moon. Like a spirit, a presence as they described it.\nIt only made sense...\nAnd so they wished to see it again. To hopefully hear it speak, again.\nThey built shrines to please this presence.\nAnd even those of others.\nThey started giving them names, bodies, appearences, identities.\nThey would bring gifts to please them.\nThey would care for nature. The well being of their moon. Hoping to hear it again.\n\n... They never did, but they kept trying.=他们将这一新发现的知识带到了村庄里，告诉了每一个人。\n虽然当然有很多怀疑者，但很少有人在年轻时见过这种光芒。然而，这种光芒从未与他们有过联系。\n也许那不是某种生物，或者类似的东西。也许它就是他们月亮的精髓。就像一种精神，一种他们所描述的存在。\n这似乎很有道理……\n因此，他们希望再次见到它，希望能再次听到它的声音。\n他们建造了神殿来安抚这种存在。\n甚至也为了其他人的利益而这样做。\n他们给这种存在起名，赋予它形态、外观和身份。\n他们献上礼物来讨好它。\n他们关心自然，关心他们月亮的福祉。希望再次听到它的声音。\n\n……他们从未实现过，但他们一直努力着。
They have to be perfect, we cannot bathe in a stew of mediocrity if we wish to thrive in our future. With slight alterations, one perfect specimen might be worth a hundred regulars in action. The process might be slow but we require patience. An empire built in a day will end in one too. We must be patient, build our machines. Then watch as we bring order and end this quiet age.=这些必须做到完美，如果我们希望在未来取得成功，就不能容忍平庸的混杂物。通过微小的调整，一个完美的样本可能就能替代一百个普通的样本。这个过程可能会很缓慢，但我们需要耐心。一个在一天内建立起来的帝国也会以同样的方式终结。我们必须有耐心，打造我们的机器。然后，让我们带来秩序，结束这个宁静的时代。
They see fear\nThey fear\nFear\nI fear them=他们看到恐惧\n他们害怕\n恐惧\n我害怕他们
They won't let us near it.\nThey won't let us touch the smoothness of the crytal.\nThey won't let us feel the embrace of its glowy shell.\nThey won't let us experience the relief.\nThey won't stop us from becoming one.\nThey won't stop us from being enlightened.\nThey won't stop us. They can't stop us.\nThey won't stop us. They can't stop us.\nThey won't stop us. They can't stop us.=他们不会让我们靠近它。\n他们不会让我们触摸到晶体的光滑表面。\n他们不会让我们感受到它那发光的外壳的拥抱。\n他们不会让我们体验到解脱的感觉。\n他们不会阻止我们成为一体。\n他们不会阻止我们获得启迪。\n他们不会阻止我们。他们无法阻止我们。\n他们不会阻止我们。他们无法阻止我们。\n他们不会阻止我们。他们无法阻止我们。
They're everywhere!\nBees, spiders and whatever else lived out there.\nI think they killed most of the people here.\nI'm heading out the fire exit to wait outside.\nIt's that or getting eaten alive in here..\nTell my family I love them.=到处都是！\n蜜蜂、蜘蛛还有其他生物在那里生活。\n我觉得它们已经杀死了这里的大部分人。\n我要从消防出口出去，在外面等待。\n要么就在这里被吃掉……\n告诉我的家人我爱他们。
They’re here. We’ve tried to leave the city but we’re boxed in. There’s borders beyond which you might get shot and I’d rather not take the risk.\nWe’re stuck in an apartment building waiting for an opportunity to leave. Not even sure if that opportunity will arrive at all but I must stay hopeful. If not for me, for my Julie and my daughter. They mean the world to me. I cannot afford to lose hope.\n\nThey are coming at the city with full force. I can hear the gunfire from here. I think we might be able to get to the metro station and escape through there. There’s a safety curfew in place, anyone out at night is at risk of getting shot, we must travel before then and be quick.\nThe clock is ticking so we’re preparing to go.\nJust like I always said, there is hope.=他们已经到了这里。我们试图离开这座城市，但被包围了。有边界线，一旦越过就会被枪击，我宁愿不要冒这个风险。\n我们被困在一栋公寓楼里，等待离开的机会。甚至不确定这个机会是否会到来，但我必须保持希望。如果不是为了我自己，也是为了我的朱莉和我的女儿。她们对我来说非常重要，我不能失去希望。\n\n他们正全力向这座城市进攻。我能听到枪声。我觉得我们或许可以到达地铁站，从那里逃出去。现在实行宵禁，晚上外出的人都有被枪击的风险，我们必须尽快行动。\n时间紧迫，我们准备出发了。\n就像我一直说的，还有希望。
Things are getting weirder.\nIt has only been slightly over a week since the renowned Crescent of Curses arrived on our doorstep.\n\nI fear unlike the other artefacts we collected, this one appears to radiate some sort of aura which messes with the brain.\n\nAt least the filter has been replaced.\nUnfortunately it was only after one of us took a warm bath and melted overnight.\n\nWe need to get rid of that thing.=事情变得越来越奇怪了。\n自从著名的诅咒新月（Crescent of Curses）出现在我们家门口，仅仅过了一周多一点。\n\n我担心，与我们收集的其他文物不同，这个物品似乎散发着某种能量，会对大脑产生影响。\n\n至少那个过滤器已经被更换了。\n不幸的是，这只是在我们其中一个人洗了个热水澡后，过滤器在夜间融化了。\n\n我们必须处理掉那个东西。
This facility isn't big. It's composed of two sections. The work area and the guards office above.\nThe work area has 4 sleeping chambers, 6 beds in each if they're all like mine.\nAll connected to one long hallway leading down to the mine past the cafeteria.\nOn the other end are the stairs to the guard office.\nWhich I know has at leat an armory and a control room.\nI've noticed a pattern where they sent a different guard to check on us every day.\nReminding us that we'll be left for the vultures if we don't comply.\nSo far I've counted 7 faces. They're armed with automatic weapons each time. But we only need to get the jump on one.\nOne weapon, 24 men against 6.. I like these odds.=该设施并不大。它由两部分组成：工作区以及上方的警卫办公室。\n工作区有4个睡眠室，每个睡眠室里有6张床，这些床和我的床一样。\n所有建筑都连接着一条长长的走廊，这条走廊通向矿井，穿过食堂。\n在另一端是通往警卫办公室的楼梯。\n据我所知，那里至少有一个军械库和一个控制室。\n我注意到一个规律，他们每天都会派不同的警卫来查看我们的情况。\n提醒我们，如果我们不遵守规定，就会成为秃鹫的猎物。\n到目前为止，我已经数到了 7 个目标。每次他们都会配备自动武器。但我们只需要抓住其中一个目标。\n一种武器 24 男子反对或反对 6. .我喜欢这种机会
This is \n-Across The Stars-\nBack with the 11-ish am news, I’m a little late today.\nThere’s a lot to catch up on nowadays.\nIt’s been a cloudy week and it looks like it’ll be cloudy for a little while longer.\n\nThe reports have not been great.. quite the opposite in fact.\nIf you haven’t heard it already, Trite has suffered its most devastating attack yet.\n..The cities have fallen.\nI’ll repeat it once more, the cities of Trite have fallen.\nAccording to my sources most of the people were able to flee in time.\nI wish I could say I know what will happen next.\nBut..\nI can’t.\nWhat the Triton Military will do next is a mystery.\n\nAll I can say is go to the Domes of Demetrica, and survive.\n\nThere will be some comforting tunes, please, stay tuned.\nAnd for those still listening, thank you.=这是 \n-穿越星辰-\n带着11点左右的上午新闻回来，今天有点晚。\n现在有很多事情需要跟进。\n这一周天气阴沉，看起来还会持续一段时间。\n\n报道并不乐观……事实上，情况恰恰相反。\n如果你还没有听说，特赖特遭受了迄今为止最严重的打击。\n……特赖特的城市已经沦陷了。\n我再重复一遍，特赖特的城市已经沦陷了。\n根据我的消息来源，大多数人及时逃走了。\n我希望我能说我知道接下来会发生什么。\n但是……\n我无法预测。\n特赖特军队接下来会做什么仍然是个谜。\n\n我只能说，去德梅特里卡的穹顶，活下去。\n\n会有一些令人安慰的音乐，请继续关注。\n对于仍然在收听的人，谢谢。
This is writ with bloodied hands.\nParts of Jareck's brain still between my fingernails.\nI succeeded.\n\nMy chest is bleedin. A searing pain from one side to the other. I believe he shot me in my ambush.\nThough I only geel it now.\nMy adrenaline kept me going. I was on top of him.\nEvery fist that struck his face was fueled by unmatched anger.\nI asked what happened to my wife and child..\nHe didn't even know who I was.\nI now realise the road I drove would lead to nowhere.\nI killed the man I hated so much.\nYet nothing's changed. I feel no different.\nMy family is still missing. And soon my breath will be my last.\nI was damned from the day I was taken.=这是用沾满鲜血的手写成的。\n贾雷克的大脑部分组织仍留在我的指甲间。\n我成功了。\n\n我的胸口在流血，一阵灼热的疼痛从一侧蔓延到另一侧。我相信他在伏击时击中了我。\n尽管我现在只感到麻木。\n肾上腺素让我继续战斗。我终于压制住了他。\n每一记重拳都源于难以抑制的愤怒。\n我问我的妻子和孩子发生了什么……\n他甚至不知道我是谁。\n现在我意识到，我所走的这条路最终会通向无果。\n我杀死了自己如此憎恨的人。\n然而一切都没有改变。我感觉没什么不同。\n我的家人仍然失踪。很快，我的呼吸也将成为最后一口气。\n从被抓的那天起，我就被诅咒了。
This poor guy didn't deserve this.\nI wonder if there are any other innocent prisoners here.\n\nIf I knew this I would've made sure he wasn't put with the others.\nBut.\nWe're all just following orders here.\n\nIt's vile what we do here.\nPoor guy thought he'd be moved.\nWe don't keep prisoners here.\nWe kill them and turn their bodies into soil.\nSoil which is used to grow crops at an extraordinary rate.\nThese crops are then sold back to the public.\n\nPeople would go crazy if they knew about this.\nI would too.\nBut that's just our job.\n\nI hate it but.. it's how money gets made.=这个可怜的家伙不值得遭受这样的对待。\n我想知道这里是否还有其他无辜的囚犯。\n\n如果我知道这一点，我就会确保他不会和其他人放在一起。\n不过...\n我们在这里只是按照指示行事而已。\n\n我们在这里的行为真是恶劣。\n可怜的家伙以为他会被感动\n我们这里不关押囚犯。\n我们杀死他们，将他们的尸体转化为土壤。\n以极高的速度用于种植农作物的土壤。\n这些农作物随后会被重新出售给公众。\n\n如果人们知道了这件事，他们会抓狂的。\n我也会这么做。\n但那只是我们的工作。\n\n我讨厌这样，但这就是赚钱的方式。
This tape contains highly classified material and must not see the eyes of the public\n\nA hidden bio-weapon testing facility has been discovered on the 13th Asteroid orbiting 56-vow\n\nYou have been tasked to find and extract what remains of  the weapons tested here\n\nThe facility has been destroyed but there are several rogue bio-weapons primed to kill anyone  and everyone in any way possible\n\nGood luck=这张磁带包含高度机密的信息，不得让公众看到。\n\n在绕56-vow小行星运行的第13颗小行星上，发现了一个隐藏的生物武器测试设施。\n\n你的任务就是找到并提取这里测试的武器的残余物。\n\n该设施已被摧毁，但仍有几件失控的生物武器处于待命状态，随时可能以任何方式杀死任何人。\n\n祝你好运。
This will be my last day here, after today, I will be fleeing once more.\nBut to someplace safe this time.\nWe had come to the decision that the decades of research was simply too valuable to destroy.\nSo we have handed them the tools, the research and they will likely proceed with making their own soldier in labs.\nThe prospect of that is horrifying.\nOr.. well \nIt would have been had I not removed any mention of LYN-H, the one thing that prevents clones from dying shortly after being created.\nThe armies they grow will all drop dead within a month after being created.\nTime to find a brighter horizon.\nProfessor Harrington, over.. and out.=这是我在这里的最后一天,今天之后,我将再次逃离。\n这次要前往一个安全的地方。\n我们决定，数十年的研究成果实在太过宝贵，不应被毁掉。\n因此，我们已经为他们提供了所需的工具和研究资料，他们很可能会在实验室里自行制造出自己的士兵。\n这样做的前景是可怕的。\n或者... 好 \n要不是我删除了关于LYN-H的任何提及，那情况本可能有所不同。LYN-H是防止克隆体在创建后不久就死亡的关键因素。\n他们培育的军队在创建后一个月内都会全军覆灭。\n是时候寻找一个更光明的未来了。\n哈灵顿教授 完毕
To start off my statement I would like everyone to remember why the use of biological warfare was made illegal in the first place.\nNot two hundred years ago, over in the Altra region when the study and use of biological weapons was allowed still.\nA conflict between two dominions turned to bloodshed. This war is now known as one of the most devastating wars in all of time across the known regions.\n\nAnd it was the weaponry they used which marked this war as the deadliest one in history thus far.\nThe most commonly used was the melting gas made with the spores of an acidic super-fungi.\nWhen it touched the skin or was inhaled, it would melt the victim from the inside out. And the majority of victims were not military but civilians.\n\nSurely I do not speak for myself when I say-\nThis musn't happen again.=在开始我的陈述之前，我想让每个人都记住，为什么使用生物武器最初就被定为非法行为。\n就在两百年前，在阿尔特拉地区，对生物武器的研究和使用仍然是被允许的。\n一场两个势力之间的冲突演变成了流血战争。这场战争现在被认为是已知地区历史上最具破坏性的战争之一。\n\n而正是他们使用的武器，使这场战争成为迄今为止历史上最致命的战争。\n最常用的武器是一种由酸性超级真菌孢子制成的融化气体。\n当这种气体接触到皮肤或被吸入时，它会从内部将受害者融化。而大多数受害者并非军人，而是平民。\n\n我当然不能代表我自己说——\n这种情况不应该再次发生。
