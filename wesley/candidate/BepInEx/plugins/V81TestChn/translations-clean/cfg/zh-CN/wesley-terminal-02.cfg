The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\n> The Beginning\nThe Employee\nThe Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Beginning - 0 days since impact.\n—--------------------------------------\nIn the town of Rosemaw, a small hike into the forest a meteor fragment had impacted.\nIt is not unusual for small fragments to reach the surface and make contact so it wasn’t immediately reported by the public.\n\nA few days later a few hikers had noticed an unusual looking fungus but chose to leave it be. These hikers only began to take notice once it started spreading and growing over a small patch in the forest. They didn’t think much of it and avoided the area for the time being.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n> 开端\n店员\n警员\nI.T.D.A.\n掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\n开端　撞击后第0天\n\n陨石碎片落在罗斯莫镇附近，往林子里走一小段路就到。小块陨石落到地表并不罕见，所以起初没有居民报告。\n几天后，几名徒步者注意到一种样子古怪的真菌，当时谁也没碰它。直到它蔓延开来，占据了一小片林地，他们才多看了几眼。他们并没放在心上，只是暂时绕开了那里。
The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\n> The Employee\nThe Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Employee - 4 days since impact.\n—--------------------------------------\nRichard Pollar, more commonly known as Rich, arrived at the local bakery for work an hour before opening time. He started preparing the kitchen for the day, organising and cleaning the kitchen when he noticed red blobs of an unusual liquid sticking to the equipment and the furniture.\nThe liquid was thick and lukewarm to the touch, a gooey substance. Rich was both intrigued and disgusted by the discovery and went looking for the source. He couldn’t find anything else out of the ordinary until he got to the stove. He was frightened by what he saw. It was a rat covered in tendrils with strange goop oozing from one of its empty eyesockets, bubbling and twitching as it did. Before Rich could fully understand what he was looking at, it scurried away, fleeing to someplace outside.\nHe was shaking and frantically called his employer before loosely explaining what happened.\nRich was quickly dismissed with the assumption of it being another one of his psychotic breaks.\nMeaning to prove that what he witnessed was real, he went to chase it down, leaving a note for the other employees explaining where he went.\nRich followed the trail of goop through the town, into the forest all the way to the area where the fungus was spotted by hikers before. There he found it, laying still on this yellow-orangish rock. Rich was bemused and stared at it for a while. He assumed it was dead considering its state and the fact it wasn’t moving anymore. The only movement he saw were these small tendrils sticking out of its body.\nUnsure of what to make of it he decided to investigate, he was scared but his curiosity carried him forward. The fungus he had heard about has seemingly spread through a significant chunk of the forest.\nAs Rich wandered through the infested area, he laid eyes upon more of these critters in a similar condition. Witnessing this he got scared and ran back towards the bakery and told his coworkers, who had arrived by this time, what he had seen. To ensure they would believe him he had taken some pictures to show.\nThe coworkers seemed very concerned upon being shown the pictures. Similarly confused and disgusted they decided to investigate on their own, leaving Rich at the bakery, who at this time was still shaking.\nAn hour passed and Rich grew concerned, maybe they got lost, maybe they were still investigating, who knows. But he grew more and more concerned by the minute. Another hour later he finally made the decision to call the authorities. Fearing they’d dismiss him if he spoke the truth, he only said there was an emergency at the bakery. And there he stayed until an officer arrived.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n开端\n> 店员\n警员\nI.T.D.A.\n掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\n店员　撞击后第4天\n\n当地面包房的员工理查德·波拉尔，人们通常叫他里奇。开门前一小时，他就到了店里。他正收拾、擦洗厨房，准备一天的生意，忽然看到设备和家具上粘着一团团古怪的红色液体。\n这东西又稠又黏，摸上去温温的。里奇既好奇又恶心，便去找源头。其他地方都没什么异常，直到他查到炉子旁边。眼前的一幕吓坏了他。一只老鼠浑身长满卷须，空眼窝里渗出怪异的黏液，直冒泡，身子一抽一抽的。他还没回过神，它就蹿到外头不见了。\n他浑身发抖，慌忙打电话给老板，语无伦次地说了个大概。老板只当他又发病了，根本不信。为了证明自己没看错，他给同事留了张便条，交代去向，然后追了出去。\n里奇循着黏液穿过小镇，一路进了树林，来到徒步者最先发现真菌的地方。他找到了那只老鼠。它静静躺在一块橙黄色岩石上。他愣愣地看了好一会儿，看它那副模样，又一动不动，就以为它已经死了。只有身上伸出的小卷须还在动。\n他不知道该怎么解释。害怕归害怕，好奇心还是推着他往前走。传闻中的真菌看来已经蔓延到好大一片树林。他又看见几只小动物，也是同样的惨状，终于怕得掉头跑回面包房。他把情况讲给已经到店的同事，还拍了照片给他们看，免得他们不信。\n同事们看过照片，都十分不安，跟他一样既困惑又恶心。他们决定亲自去查，把还在发抖的里奇留在店里。\n一个小时过去了，他开始担心。也许他们迷路了，也许还在调查，谁说得准。时间一分一秒地过去，他越想越不安。又过了一小时，他终于报了警。他怕说实话又没人信，只说面包房出了急事。随后便留在那里，直到一名警员赶到。
The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\n> The Officer\nThe I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Officer - 4 days since impact.\n—--------------------------------------\nAn officer by the name of Michael Benson, Mike for short. Arrived at the scene finding a distressed Richard sitting in the bakery. Mike asked about the emergency to which Rich tried to explain that his coworkers left to investigate something in the forest but hadn’t returned for hours. Mike grew suspicious and calmly asked why he’s as distressed as he is. Rich told Mike there’s horrifying things happening in the forest around the infested area.\nMike called this in and went to have a look for himself, unsure if he was telling the truth. But only after a few more officers arrived at the scene.\nMike arrived at the forest and cautiously took a few steps in when he already began to see signs of something being off.\nThe ground was covered in yellowish rock with this red substance oozing out of the ground. Slightly deeper into the forest, plants seemed to turn gray, die or get covered in this same yellow rock.\nMike returned to the edge of the forest and called for a search party. This has to be reported, it has become a real anomaly he thought. Half an hour later four more officers arrived and the search started.\nAs Mike ventured deeper into the forest he began to see the same things Rich had described, Critters, seemingly deceased with tendrils erupting from their bodies. Starting to get a notion of dread he continued. As he stumbled further into the woods it became less and less lively.\nThen he noticed something red, moving away from him, sliding across the rocky ground, leaving a trail of that same red substance. As Mike got closer the picture got clearer, it was similar to the critters he had seen earlier. When he walked in a big circle to the front of it he saw what it really was.\nIt was the front half of a moose, a large tentacle slid out of its mouth alongside a significant amount of red ooze. Where its back half was meant to be was nothing but tendrils and intestine slowly moving it forward.\nFrightened, Mike quickly stepped back. He wasn’t sure what to do. It looked like it was trying to scream or yell but no sound erupted from its mouth. Another tentacle protruded through one of its eyes, pushing it out of its socket followed by blood and ooze.\nNow horrified, Mike grabbed the weapon out of his holster and fired a bullet into its head, meaning to end its suffering.\nIt ceased to move for a moment but quickly got back to it, now oozing from the wound.\nMike was filled with dread and ran away from there. On his way back he found something else.\nThe missing employees laid there, lifeless on the hard rock surface. He called it in and told the other officers to head back. The employees were in a terrible condition, it looked like their limbs had torn themselves from their bodies, oozing out of their eyes and mouths. Witnessing this he ran back immediately and met up with the other officers in the bakery. This has quickly turned into a seemingly deadly fungal invasion.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n开端\n店员\n> 警员\nI.T.D.A.\n掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\n警员　撞击后第4天\n\n警员迈克尔·本森，人称迈克。赶到面包房时，他看到理查德坐在那里，惊魂不定。迈克问出了什么事。里奇说，同事去林子里查一件事，已经好几个小时没回来。迈克起了疑心，平静地问他为什么怕成这样。里奇说，林中那片受侵染的地方正在发生可怕的事。\n迈克把情况报了上去。他不知道里奇说的是不是真的，决定亲眼看看，但等另外几名警员到了才出发。他小心地往树林里走了几步，就看出不对了。\n地上覆着发黄的岩层，里面渗出红色物质。再往里走，草木有的发灰，有的已枯死，还有的裹上了同样的黄色岩层。迈克退到林边，呼叫搜查队。他想，这已经是货真价实的异常事件，必须上报。半小时后又到了四名警员，搜查开始。\n越往深处走，他就越多地看到里奇描述的景象。小动物像是早已死去，身体里却钻出卷须。他心里发毛，还是继续往前走。林子里越来越没有生气。\n前方有个红色的东西，在岩面上滑动，拖着一道同样的红痕。迈克走近一看，它和先前那些动物有点像。他绕了个大圈来到正面，才看清那到底是什么。\n那是一头驼鹿的前半身。一根粗大的触手连同大量红色黏液从嘴里滑出。本该是后半身的地方只剩卷须和肠子，正慢慢拖着它前进。\n迈克惊得往后退，不知该怎么办。它好像想叫，嘴里却发不出一点声音。又一条触手穿过眼睛，把眼球挤出眼窝，血和黏液跟着流了下来。迈克吓坏了，拔枪朝它脑袋开了一枪，想让它少受点苦。它停了一下，很快又动了起来，这次连弹孔也在往外渗黏液。\n迈克拔腿就跑。回去的路上，他发现了失踪的店员。他们躺在坚硬的岩面上，已没了气息。他用无线电上报，叫其他警员撤回。死者惨不忍睹，四肢像是自行从躯干上扯了下来，眼睛和嘴里渗着黏液。迈克立刻跑回面包房与其他人会合。事态急转直下，看来这场真菌入侵足以致命。
The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\nThe Officer\n> The I.T.D.A.\nThe Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe I.T.D.A. - 7 days since impact.\n—--------------------------------------\nThe town has been evacuated and all survivors involved have been brought in for questioning and isolation. The I.T.D.A. Has labeled this situation as critical and has begun quarantining the area. Nobody was allowed to enter or leave the quarantine zone. The military had been called in for additional security.\nSeveral teams of experienced biologists and scientists had made it to the site to analyze and halt the anomalous threat. It was immediately proven not to be any sort of fungi but something else that had yet to be documented. This spread seemed to overtake whatever they put in front of it, consuming it entirely. Attempts of halting the spread were made such as burning it which only temporarily made the tendrils disappear. They had attempted several other chemical solutions to no avail. The closest they had gotten was by using a liquid which super freezes anything it comes into contact with. It only significantly slowed it down.\nFrom this point several nearby towns were also evacuated as the spread and the quarantine area grew. Slowly but surely the area was becoming a wasteland.\nIt was discovered that direct contact with the substance could result in an infection which ends in a grueling eruption of tendrils, torn limbs and death.\nThe I.T.D.A. had officially labeled the spread as a world-ending level hazard. And as there have been no viable methods to halt the spreading or cure anyone infected. The I.T.D.A after a discussion with the Council of Rule on Calist, had marked Hyxellia as a moon in quarantine. Nobody could enter. Nobody could leave. Those who tried were either stopped or killed.\nThe population remaining on Hyxellia were scared, unable to send out or receive communication from a source outside of the moon, the only source they had were the I.T.D.A. which assured the public that the threat will be dealt with.\nBiologists had well documented the workings of this spread which has gained the name “The Red Death”. In a detailed report it was documented how the red death consumed and spread:\nThe yellow rock-like material isn’t technically stone as many assumed but more similar to a very thick, dense, solidified skin. Instead of being stretchy, the density makes it much harder and rock-like. Below the yellow crust is a much softer meat-like material, this material is able to retract or expand, even move as if it’s one large living being organising its fleshy layer. This soft layer has seen to form these tentacles or tendrils for either defensive or even offensive measures. The spread itself is quite unique, these cells will attempt to eat whatever is around them and immediately replace the consumed material with a new cell. The process of consumption also generates this red substance. Drilling procedures have noted that deep inside the soft layer there’s large tunnels where the substance flows similar to our veins. The substance which gets generated doesn’t always end up within these veins, it often surfaces and forms large bubbles of goop below the crust, sometimes bursting through, leaving holes within the crust and forming large puddles of goop.\nAt the two week mark, the Red Death had consumed nearly half the moon. The cause seemed lost. This was the end times. Anyone still on Hyxellia was awaiting a horrible fate with no way of saving them.\nMany military personnel as well as teams sent in by the I.T.D.A. have chosen to end their own lives to avoid a worse end.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n开端\n店员\n警员\n> I.T.D.A.\n掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\nI.T.D.A.　撞击后第7天\n\n小镇已疏散，所有涉事的幸存者都被带走问话、隔离。I.T.D.A. 将事态列为危急，开始封锁该地。隔离区禁止出入，并调派军队加强警戒。\n数支由资深生物学家和其他科学家组成的小组赶到现场，试图分析并阻止这种异常威胁。他们很快证明它根本不是真菌，而是一种从未记录的东西。摆在它面前的一切似乎都会被它吞没，彻底消失。多种化学手段都无效。最接近成功的一次，是使用一种能让接触物瞬间深度冻结的液体，但也只能大幅减慢扩散。\n随着侵染和隔离区一同扩大，附近数个城镇也被疏散。这里逐渐沦为荒地。研究发现，直接接触这种物质可能遭感染，最终无数卷须会痛苦地破体而出，四肢撕裂，人也随之死去。\nI.T.D.A. 正式将其列为足以毁灭世界的灾害。既没有办法阻止扩散，也无法医治感染者。与卡利斯特的执政议会商议后，I.T.D.A. 将希克塞利亚全星列为隔离区。不得进入。不得离开。胆敢尝试者，不是被拦下，就是被击毙。\n留在希克塞利亚的居民惶恐不安，既无法向外界发信，也收不到外界的消息。唯一的消息来源是 I.T.D.A.，它向公众保证威胁会得到控制。\n生物学家详细记录了如今被称为“红死病”的扩散过程。报告中写道：\n黄色岩状物并非人们以为的石头，而像一层极厚、极密、凝固的皮肤。它毫无弹性，高密度使它像岩石一样坚硬。黄壳下面柔软得多，像肉，会收缩、膨胀，甚至移动，仿佛一个巨大的生物在调整自身的肉层。这一层会生成触手或卷须，用以防御，甚至主动攻击。它的扩散方式很特别：细胞试图吃掉周围的一切，随即用新细胞取而代之。吞噬过程还产生红色物质。钻探显示，软层深处有巨大的管道，红色物质在其中流动，就像血液在血管里流动。生成的物质并不全流进管道，它常常上涌，在壳下形成巨大的黏液泡。气泡有时会冲破外壳，留下孔洞，积成大片黏液池。\n两周过去，红死病已经吞掉了近半颗星球。挽救它已看不到希望。末日到了。仍留在希克塞利亚的人等待着可怖的命运，已无人能救。许多军人和 I.T.D.A. 派来的小组成员选择了自尽，以免遭受更惨的下场。
The Corruption of Hyxellia\n—--------------------------------------\nDocumented timeline of recorded events since the initial meteoric impact.\nThe Beginning\nThe Employee\nThe Officer\nThe I.T.D.A.\n> The Coverup\n—--------------------------------------\n[This a detailed construction of events put together through interviews and reports with those involved]\n\nThe Coverup - 16 days since impact.\n—--------------------------------------\nHyxellia had been nearly entirely consumed and the I.T.D.A. had ceased any further attempts at rescuing the moon.\nFollowing this the I.T.D.A. had sent out a message to Calist, where the council would decide over the fate of the moon.\nThe response was immediate and due to the level of contagiousness of the Red Death, the council had decided to not only keep the moon in quarantine but also silence anyone aware of the situation.\nHyxellia was to be removed from the star maps and public knowledge entirely as if it had never existed in the first place. They had gone through great lengths to achieve this.\nNearing full corruption, few reports were sent out by biologists in hopes they would be rescued.\nThey spoke of having heard sounds from deep space, calling them cosmic, possibly a language they couldn’t understand. They said it felt like something was watching them. Something beyond what they could understand. Something they couldn’t feel but only feel its presence of.\nIn the final moments of life on Hyxellia, a warning was sent out:\n“Stay away. It is watching us. It sees us. It will come for us all.”\nHyx is a threat, well documented and hidden.\n\n[These documents have been classified by the Council of Rule]\nUnder no circumstance can they be released to the public.\nThey will be kept on Hyxellia to ensure no living being is able to access them.=希克塞利亚的侵蚀\n自最初的陨石撞击以来，已记录事件的时间线。\n开端\n店员\n警员\nI.T.D.A.\n> 掩盖真相\n［根据对当事人的访谈及相关报告，还原事件经过。］\n\n掩盖真相　撞击后第16天\n\n希克塞利亚几乎全被吞没。I.T.D.A. 停止了挽救这颗星球的一切尝试，随后向卡利斯特发出消息，由理事会决定它的命运。\n答复立即送达。鉴于红死病极易传播，理事会决定继续隔离，并封住所有知情者的口。希克塞利亚要从星图和公众记忆中彻底抹去，仿佛它从未存在过。为此，他们不惜大费周章。\n在侵染即将覆盖全星时，生物学家发出了最后几份报告，希望有人来救他们。他们说，自己听见来自深空的声音，像是宇宙本身传来的，也可能是一种他们听不懂的语言。他们觉得有东西正注视着他们。那东西超出了他们所能理解的范围，触摸不到，只能感觉到它的存在。\n在希克塞利亚上生命的最后时刻，有人发出了警告：\n“别靠近。它在看我们。它看得见我们。它会来找我们所有人。”\n希克斯的威胁有详实的记录，也遭到了严密的隐瞒。\n\n［这些文件已由执政议会列为机密］\n在任何情况下均不得向公众公布。文件将留在希克塞利亚，确保没有任何活物能够取得。
The earthquakes are getting louder and I can hear parts of the cavern collapsing in the distance ahead of me.\nThe amount of bodies I have seen have left me horrified. While some of them were slumped over. Others looked like they were trying to run.\nIt's getting harder for me to breathe. And my legs are getting tired.\nI have found a few crystals of value. Not many but I should not succomb to my greed. This deposit is lost and I don't want to die trying to find it.\nI'm turning around and heading back. I want to see my cat Bean again.\nI just need to remember the way I came.=地震的响声越来越大。我听得见前方远处的洞穴一截截坍塌。\n一路看到的尸体多得让我发怵。有的瘫倒着，有的像是正要逃跑。\n我呼吸越来越费劲，腿也走不动了。\n我找到几块值钱的水晶。不多，可我不能太贪心。那处矿床已经找不着了，我不想为找它把命也搭上。\n我决定掉头回去。我还想再见见我的猫豆豆。\n只要我能想起来时的路。
The past few weeks have been difficult.\nMy memory hasn't been the same since the crash.\nI do not recall much from before.\nAll that remains is some faint visions of self healing flesh, independently growing eyes and a bright flash before panic ensued.\n4 of us fled to one of ships and escaped the scene. \nI don't know what happened to the other two teams who were present at the time.\nI have now come to know that the entirety of Cosmocos vanished. And what we were standing on was merely a severed chunk of it.\n\nNobody has dared to return. We called it Desolation.\nI'll attach the coordinates to this log for anyone brave enough to have a look for themselves.\nAfter my recovery I might be able to help the people out over here.\nI've heard some interesting projects being discussed.\n\nProfessor Harrington, over and out.=这几个星期真难熬。坠毁后，我的记性就大不如前，先前的事几乎都想不起来了。\n只剩几个模糊的画面：自己愈合的血肉、独自生长的眼睛，还有一片强光。然后所有人都慌了。\n我们4个人逃上一艘船，离开了现场。另外两队怎么样了，我不知道。\n如今我才得知，整个科斯莫科斯都消失了。我们脚下的不过是从它身上断下来的一块碎片。\n\n没人敢回去。我们管那里叫“荒芜”。我会把坐标附在日志里，谁有胆量，可以亲自去看。\n等身体恢复了，也许我能帮上这里的人。我听他们谈起过几个挺有意思的项目。\n\n哈林顿教授，通话结束。
The plan worked. We lost good men but we took control over the facility.\nIn the control room I gained access to the ships which we are now loading up to make our escape.\nIt appears as though the guards called in an emergency.\nI expect more of them to come soon.\nI'll shoot a couple pipes on my way out in hopes that some of them suffocate in the leaking gas.\nBut more importantly. I went searching. And I found.\nJareck Hill was here 6 days ago. The log I read indicates that he now finds himself in another facility.\nThe flight route was set to 842 Core. I expect to find him there. With a proper disguise.\n\nPerhaps I can sneak in.. I must try.=计划成了。我们折了几个好兄弟，但拿下了设施。在控制室里，我取得了飞船的控制权。现在我们正往船上装东西，准备逃走。\n守卫似乎发出了紧急求援。他们的人应该很快就到。出去时我要朝管道开几枪，希望泄出的气体能闷死他们几个。\n更要紧的是，我去查了。还真查到了。\n贾雷克·希尔6天前来过这里。日志说他已经转去了另一座设施。航线设的是842 地核。我想我能在那里找到他。只要乔装得像样一点……\n\n也许我能混进去。我必须试试。
The plan:\n\nI am going to kill Aaron.\nI must.\nI don't want there to be any evidence after so. \nI'll have to burn everyhing. Anyways.\nOnce he has arrived aI will lead him over to a small room where we used to hang out as children.\nAnd when he thinks he's safe I'll hrab my baseball bat and if not kill him, knock him unconsious.\nI'll hide his body in one of those giant standing Jack-in-the-box boxes that used to scare me to death.\nI'll have to improvise after.=计划：\n\n我要杀了亚伦。\n我必须这么做。\n事后不能留下任何证据。\n得把所有东西都烧了。总之，\n等他到了，我就领他去我们小时候常待的那个小房间。\n等他以为安全了，我就拿起棒球棍，打不死也要把他打晕。\n那儿立着几个巨大的吓人盒，小时候里面弹出来的小丑差点把我吓死。我会把他的身体藏进其中一个。\n再往后就只好随机应变了。
The purifying shrine\n\nThis device was designed to harvest and project the power of the purifying stones and spread their effect across areas far and wide.\n\nThe farmers most often used these to stabilize their farmland and increase the rate at which their crops grew.=净化圣坛\n\n这座装置可以汲取净化石的力量，将其投射出去，让大片区域都受到影响。\n\n农民最常用它稳定耕地，并加快作物生长。
The stones of purification\n\nThese stones hold incredible power.\nThrough the crystal growing within, it can be used to alter matter.\n\nTo rid food of mold, crops of insects, water of plagues.\nIt can speed the growth of plants, heal the wounded, increase their strength.\n\nOnly when put together in precise ways can their power be used.=净化石\n\n这些石头蕴藏着惊人的力量。\n借助内部生长的晶体，可以改变物质。\n\n让食物免受霉菌侵蚀，让庄稼免受虫害，让水源免受疫病污染。\n它们可以加速植物生长，治愈伤者，增强伤者的力量。\n\n只有按精确的方式组合，才能发挥这些力量。
The volcano was supposed to be dead!\nAt least that's what they told us.\nAny poor soul out there is currently being fried in the fiery rains of death.\nIf we don't call in rescue..\nWe might not see the light of day again.=那分明该是座死火山！\n至少他们是这么告诉我们的。\n外面那些可怜人，这会儿正被要命的火雨活活烤焦。\n要是不叫救援……\n我们可能再也见不到天日了。
There has been a fair passage of time between now and the previous time I have written.\nI had not expected this arrangement would prove so demanding. It feels as though every few days a new ship arrives at my door, not to be enamored by the mystiques of my gallery but rather to dispose of the debris they have gathered.\nI have attempted to inquire about their work yet they seem either hesitant to explain or convey that they know as much as I do.\nEither way, I have made the wise decision to automate the process of exporting these worthless pieces to Gordion. I cannot imagine taking care of such matters personally without leaving me exhausted.\n\nThere has however been one thing I became aware of regarding this mysterious company. They do not take kindly to their employees and demand them work an absurd amount where failure appears to be met with termination in the quite literal sense.\nI have always been aware of the cruelty within this region from the tales but I had never imagined it to be this terrible. Not until I met this gentleman of the name Marcus Brad.\n\nI wouldn't say it was the most pleasant of encounters.\nThis company ship had landed and were doing their own usual business. I on the other hand was altering some of the displays, not quite paying the attention to my surroundings as I likely should have.\nUpon turning, I discovered an armed stranger silently standing a few paces behind me, which in honesty I found considerably less pleasant than the display I had been arranging moments earlier. It was quite alarming even and my response was rather lacking. He demanded that I help him with his harrowing situation which, at the time, I wasn’t aware of how bad it was. His suit appeared worn, bloodied with a scorch mark covering the left side of his helmet. An intimidating figure.\nI exclaimed I wouldn’t know how and even if I did there would be a chance this mysterious company would return with evil intent.\nHe appeared serious, slightly frustrated even. Still pointing the weapon in my direction I attempted to politely ask for his name and how I could be of service.\n“My name is Marcus.”, he replied. “I have survived this company for at least five weeks now. You wouldn’t believe what they put us through. You need to help me escape them. Sooner or later they will try to kill me again.”. This ominous response left me curious and so I tried to inquire what exactly he meant with, they will try to kill him again. \nHe replied: “We have a quota we have to meet every few days. It keeps getting higher every time we succeed. I don’t believe it stops. It gets higher and higher until it’s impossible to reach. What happens if we don’t meet the quota? We die. The ship enters space and opens the doors sucking us into space to die an excruciating death. I survived this once, only because I could crawl into this airtight space within the ship’s internals before the doors opened and.. Took the others.”.\nI was stunned by this news. I confess I initially expected exaggeration.\nI could now sense that it wasn’t frustration in his voice but desperation. Perhaps a hint of sadness and dread.\nI offered a proposal, if he’s able to find and bring me uniquities or antiquities. I would search for a way of hiding him from and possibly tricking this company. Which he accepted.\n\nSince that eye opening encounter I have had a security system installed at the counter in case somebody deranged comes upon me with malicious intent.\nSo it appears for now I will be keeping myself busy with devising a plan alongside some other research I have been doing.\nI am certain I will write again.=距上次动笔，已过去好一阵子。当初没料到这笔安排会这么累人。仿佛每隔几天便有一艘新船登门，来人无意领略我馆藏的奥妙，只想处理他们捡来的破烂。我问过他们的工作，他们要么不太愿意解释，要么表示知道的并不比我多。总之，我明智地决定，将这些不值钱的东西自动运往戈尔迪翁。若要事事亲力亲为，我非累垮不可。\n\n关于那家神秘的公司，我倒弄清了一件事。他们苛待员工，要求高得荒唐，完不成便要被“终止”——恐怕得按字面意思理解。从前听人讲故事，我就知道这片区域残酷，却没想过竟能残酷到这种地步。直到我遇见一位名叫马库斯·布拉德的先生。\n\n我们的初次会面称不上愉快。公司的船降落后，船员照例做起生意。我正调整展品，没怎么留心周围。一转身才发觉，几步之外悄无声息地站着个持枪的陌生人。说实话，这可比我刚才摆弄的展品扫兴多了。我吓了一跳，一时没能作出像样的反应。他要我帮他脱离险境，那时我还不清楚他的处境有多糟。他的防护服破旧带血，头盔左侧一大片焦痕，模样颇为骇人。\n我脱口而出，说我哪知道该怎么帮他，即便知道，那家公司也可能回来寻仇。他神情严肃，甚至有些烦躁。枪口仍指着我，我只好尽量礼貌地问他尊姓大名、有什么可以效劳。\n“我叫马库斯，”他说，“我在这家公司活了至少五个星期了。他们让我们经受了什么，你不会相信的。你得帮我逃走。他们迟早还会再杀我一次。”这句不祥的话让我起了好奇心，我便问他，“再杀一次”究竟是什么意思。\n他说：“每隔几天我们就得完成配额。每完成一次，下一次就更高。我看它永远不会停，会一直涨到谁也完不成。完不成会怎么样？我们就得死。飞船开到太空，舱门打开，把人全吸出去，痛苦地死掉。我逃过一次。只是因为在舱门打开、把其他人……带走以前，我爬进了船体内部的一处气密空间。”\n我愣住了。坦白讲，我原以为他夸大其词。现在我才听出，那声音里的不是烦躁，而是绝望，或许还带着悲伤和恐惧。我向他提了个条件：只要他能为我找到并带回奇珍或古物，我就想办法把他藏起来，也许连那家公司都能骗过。他答应了。\n\n那次令我大开眼界的会面之后，我给柜台装了安保系统，以防哪天真有个心怀恶意的疯子找上门。看来近些日子，除了手头其他研究，我还得忙着想出一个计划。相信我还会再写。
There has been a terrible turn of events.\n\nThe whole crew is celebrating, currently, after the Captain has confirmed my mad ramblings to be based in truth.\nThat Cosmocos possesses incredible alien knowledge, and is willing to share it with us.\nGranted - initially, I was not entirely coherent when I tried to convey my experience with the celestial brain, but...tch, I’ll hold my tongue.\n\nHe’s ordered to remove the brain and prepare for it to be taken back with us to 61-March.\nBut this will kill Cosmocos, I know this for certain.\nSlowly, over time, atrophied, until it is a husk.\nI don’t know why the Captain, having been offered the same kindness from Cosmocos, would even consider doing something like this.\nIt’s not right.\nPerhaps he doesn’t know?\nPerhaps we were not offered the same thing?\nPerhaps he knows...and he doesn’t care?\nHe’s not a man known for his kindness, after all.\n\nI asked that we put it to a vote.\nNot a single person sided with me.\n\nI don’t know what to do.\nI don’t know what I could possibly do to dissuade the Captain that wouldn’t have me thrown in a pod set on course for a jail cell back on 61.\n\nBut I have to do something.\nThis isn’t what Cosmocos wants.\nAnd I refuse to see it die like this.\n\nLieutenant Commander Cunningham, signing off.=事情急转直下。\n\n船长证实了我先前那通疯话确有其事。全船的人都在庆祝。科斯莫科斯当真掌握着不可思议的外星知识，也愿意与我们分享。好吧，起初我试着讲述与那颗星体大脑接触的经历时，确实有些语无伦次，可是……啧，我还是闭嘴吧。\n\n他下令取出大脑，准备带回61-March。这会杀死科斯莫科斯，我确信无疑。它会慢慢衰弱，直到只剩一具空壳。\n我不明白，船长也得到了科斯莫科斯同样的善意，怎么能动这种念头？这不对。也许他不知道？也许我们得到的并不一样？也许他知道……只是不在乎？毕竟他素来就不是个仁慈的人。\n\n我提议投票。没有一个人站在我这边。\n\n我不知道该怎么办。我能怎样劝船长回心转意，又不至于被扔进太空舱，直接送回61号的牢房？\n\n可我必须做点什么。这不是科斯莫科斯想要的。我绝不肯眼看着它这样死去。\n\n少校坎宁安，记录完毕。
There's heads\nI swear\nThere are heads in the dark place\nWhy wont they believe me\n\n..\nMaybe they're right\nIgnore me\nI'm not okay=有人头\n我发誓\n黑暗里有人头\n他们为什么就是不信我\n\n……\n也许他们是对的\n别理我\n我不太对劲
These old voice recorders are the worst.. \nRight.. \nWe've got word from captain Donahue over at the primary facility. \nThey have found.. something.. \nIt appears to be something new, something unexplored. \nThey think it might be some sort of plant which sounds exciting. \n\nHere however we've made steady progress. \nAs mentioned before, this cosmic growth is able to grow.. eyes wherever it pleases. \nAt first we thought it might be some sort of defense mechanism. \nBut there's no active predators on Cosmocos from the data we've gathered. \nBut then we noticed something strange.. \n\nOne of the eyes growing in our incubators was able to move and look around, illuminating whatever it looked at. \nThis place is full of surprises. \nMore information soon. \n\nProfessor Harrington, over and out.=这些旧录音机真够呛……好了。\n我们收到了主设施多纳休船长的消息。他们发现了……什么东西。从没人研究过的新东西。他们猜是某种植物，听着挺让人兴奋。\n\n我们这边也在稳步推进。先前说过，这种宇宙增生体能在任何地方长出……眼睛。起初我们以为是防御机制，可我们收集到的数据显示，科斯莫科斯上没有活跃的捕食者。接着我们发现了一件怪事……\n\n培育箱里长出来的一只眼睛竟会转动，环顾四周，而且它看向哪里，哪里就会亮起来。这里处处是惊喜。有进展再说。\n\n哈林顿教授，通话结束。
They brought this newfound knowledge to the village. They told everyone.\nWhile of course there were a lot of sceptics, there were few who had seen this light before when they were young. It had never spoken to them however.\nMaybe it wasn't a creature. Or something akin to that. Maybe it was the essence of their moon. Like a spirit, a presence as they described it.\nIt only made sense...\nAnd so they wished to see it again. To hopefully hear it speak, again.\nThey built shrines to please this presence.\nAnd even those of others.\nThey started giving them names, bodies, appearences, identities.\nThey would bring gifts to please them.\nThey would care for nature. The well being of their moon. Hoping to hear it again.\n\n... They never did, but they kept trying.=他们把新发现带回村子，讲给所有人听。怀疑的人自然不少，但也有几个人年轻时见过那道光。只是它从没对他们说过话。\n也许那并不是个生灵，也不是任何类似的东西。也许那是这颗星球的本质，如他们所说，是个灵，是冥冥中与他们同在的存在。这样就说得通了……\n他们渴望再见到它，再听它开口。为了取悦它，他们造起圣坛，又为别的存在供奉圣坛。他们赋予它们名字、形体、容貌和身份，带来礼物，爱护自然、照料脚下的星球，只盼再听见那声音。\n\n……他们再也没听见，却始终没有放弃。
They have to be perfect, we cannot bathe in a stew of mediocrity if we wish to thrive in our future. With slight alterations, one perfect specimen might be worth a hundred regulars in action. The process might be slow but we require patience. An empire built in a day will end in one too. We must be patient, build our machines. Then watch as we bring order and end this quiet age.=它们必须完美。若想将来兴盛，我们就不能泡在平庸的泥汤里。只要稍加改造，一个完美个体在实战中或许就抵得上一百个普通个体。进度也许很慢，我们要有耐心。一日筑起的帝国，也会在一日之间覆灭。耐下心来，造好我们的机器。然后看我们如何建立秩序，终结这静默时代。
They see fear\nThey fear\nFear\nI fear them=他们看见恐惧\n他们害怕\n恐惧\n我害怕他们
They won't let us near it.\nThey won't let us touch the smoothness of the crytal.\nThey won't let us feel the embrace of its glowy shell.\nThey won't let us experience the relief.\nThey won't stop us from becoming one.\nThey won't stop us from being enlightened.\nThey won't stop us. They can't stop us.\nThey won't stop us. They can't stop us.\nThey won't stop us. They can't stop us.=他们不让我们靠近它。\n不让我们摸一摸那光滑的水晶。\n不让我们投入它发光的外壳的怀抱。\n不让我们感受那份解脱。\n他们阻止不了我们合为一体。\n他们阻止不了我们获得启明。\n他们阻止不了我们。他们办不到。\n他们阻止不了我们。他们办不到。\n他们阻止不了我们。他们办不到。
They're everywhere!\nBees, spiders and whatever else lived out there.\nI think they killed most of the people here.\nI'm heading out the fire exit to wait outside.\nIt's that or getting eaten alive in here..\nTell my family I love them.=到处都是！\n蜜蜂、蜘蛛，还有原先住在外头的其他东西。\n这里的人恐怕大半都被它们杀了。\n我要从消防通道出去，在外面等。\n总比待在这里被活吃了强……\n告诉我的家人，我爱他们。
They’re here. We’ve tried to leave the city but we’re boxed in. There’s borders beyond which you might get shot and I’d rather not take the risk.\nWe’re stuck in an apartment building waiting for an opportunity to leave. Not even sure if that opportunity will arrive at all but I must stay hopeful. If not for me, for my Julie and my daughter. They mean the world to me. I cannot afford to lose hope.\n\nThey are coming at the city with full force. I can hear the gunfire from here. I think we might be able to get to the metro station and escape through there. There’s a safety curfew in place, anyone out at night is at risk of getting shot, we must travel before then and be quick.\nThe clock is ticking so we’re preparing to go.\nJust like I always said, there is hope.=他们来了。我们试过出城，可路都被封了。越过警戒线就可能挨枪子，我不想拿命去赌。\n我们困在一栋公寓楼里，等机会离开。我甚至不知道等不等得到，可我得有盼头。就算不为自己，也得为朱莉和女儿。她们是我的一切。我不能灰心。\n\n他们正全力攻城。我在这里都能听到枪声。也许我们能赶到地铁站，从那里逃走。现在实行宵禁，晚上出门就有挨枪的危险。得赶在那之前，动作要快。\n时间不多了，我们准备动身。\n就像我一直说的，总还有希望。
Things are getting weirder.\nIt has only been slightly over a week since the renowned Crescent of Curses arrived on our doorstep.\n\nI fear unlike the other artefacts we collected, this one appears to radiate some sort of aura which messes with the brain.\n\nAt least the filter has been replaced.\nUnfortunately it was only after one of us took a warm bath and melted overnight.\n\nWe need to get rid of that thing.=事情越来越怪了。\n那件大名鼎鼎的诅咒新月送到门口，才过去一个多星期。\n\n恐怕它和我们收集过的其他遗物不同。它似乎会散发某种气息，搅乱人的心智。\n\n好歹滤芯已经换了。\n可惜换之前，有个人洗了个热水澡，一夜之间整个人都融化了。\n\n我们得处理掉那东西。
This facility isn't big. It's composed of two sections. The work area and the guards office above.\nThe work area has 4 sleeping chambers, 6 beds in each if they're all like mine.\nAll connected to one long hallway leading down to the mine past the cafeteria.\nOn the other end are the stairs to the guard office.\nWhich I know has at leat an armory and a control room.\nI've noticed a pattern where they sent a different guard to check on us every day.\nReminding us that we'll be left for the vultures if we don't comply.\nSo far I've counted 7 faces. They're armed with automatic weapons each time. But we only need to get the jump on one.\nOne weapon, 24 men against 6.. I like these odds.=这座设施不大，分为作业区和上层守卫室。作业区有4间寝室，要是都跟我的一样，每间有6张床。它们连着同一条长廊，经过食堂就通向下面的矿井。另一头是去守卫室的楼梯。我知道那里至少有一间军械库和一间控制室。\n我发现他们每天换一个守卫来查房，提醒我们不听话就等着喂秃鹫。到现在我数过7张面孔。他们每次都带着自动武器。可我们只要打其中一个措手不及。\n一把枪，24个人对6个……这胜算我喜欢。
This is \n-Across The Stars-\nBack with the 11-ish am news, I’m a little late today.\nThere’s a lot to catch up on nowadays.\nIt’s been a cloudy week and it looks like it’ll be cloudy for a little while longer.\n\nThe reports have not been great.. quite the opposite in fact.\nIf you haven’t heard it already, Trite has suffered its most devastating attack yet.\n..The cities have fallen.\nI’ll repeat it once more, the cities of Trite have fallen.\nAccording to my sources most of the people were able to flee in time.\nI wish I could say I know what will happen next.\nBut..\nI can’t.\nWhat the Triton Military will do next is a mystery.\n\nAll I can say is go to the Domes of Demetrica, and survive.\n\nThere will be some comforting tunes, please, stay tuned.\nAnd for those still listening, thank you.=这里是《穿越星辰》。又到了上午11点左右的新闻时间，今天我来晚了点。近来要讲的事真多。\n这星期天一直阴着，看样子还要阴上一阵。\n\n传来的消息不太好……其实是糟透了。也许你还没听说，特赖特遭到了迄今最惨烈的袭击。……各座城市已经沦陷。我再说一遍，特赖特的各座城市已经沦陷。据我的消息来源，多数人都及时逃了出来。我真希望自己知道接下来会怎样。可我……不知道。特里同军方下一步会怎么走，无人知晓。\n\n我能说的只有：去德梅特里卡的穹顶，活下去。\n\n接下来放几首能让人宽心的歌。请别换台。感谢还在收听的各位。
This is writ with bloodied hands.\nParts of Jareck's brain still between my fingernails.\nI succeeded.\n\nMy chest is bleedin. A searing pain from one side to the other. I believe he shot me in my ambush.\nThough I only geel it now.\nMy adrenaline kept me going. I was on top of him.\nEvery fist that struck his face was fueled by unmatched anger.\nI asked what happened to my wife and child..\nHe didn't even know who I was.\nI now realise the road I drove would lead to nowhere.\nI killed the man I hated so much.\nYet nothing's changed. I feel no different.\nMy family is still missing. And soon my breath will be my last.\nI was damned from the day I was taken.=我用沾满血的手写下这些字。指甲缝里还有贾雷克的脑浆。我做到了。\n\n我的胸口在流血，从这一头到那一头，烧灼般地疼。他大概是在我扑过去时开的枪。我直到现在才感觉到。当时只靠一股冲劲撑着，我骑在他身上，一拳一拳砸向他的脸。每一拳里都是我这辈子没尝过的恨。\n我问他，我的妻儿怎么样了……他甚至不知道我是谁。\n我现在才明白，我一路追到这里，根本没有出路。我杀了自己最恨的人，却什么都没改变。我心里也没有半点不同。\n我的家人依旧下落不明，我很快就要咽下最后一口气。从被带走的那天起，我就已经完了。
This poor guy didn't deserve this.\nI wonder if there are any other innocent prisoners here.\n\nIf I knew this I would've made sure he wasn't put with the others.\nBut.\nWe're all just following orders here.\n\nIt's vile what we do here.\nPoor guy thought he'd be moved.\nWe don't keep prisoners here.\nWe kill them and turn their bodies into soil.\nSoil which is used to grow crops at an extraordinary rate.\nThese crops are then sold back to the public.\n\nPeople would go crazy if they knew about this.\nI would too.\nBut that's just our job.\n\nI hate it but.. it's how money gets made.=这个可怜人不该遭这种罪。这里还有多少无辜的囚犯？\n\n早知道，我说什么也不会让他们把他和其他人关在一起。可我们在这儿，都只是奉命行事。\n\n我们干的事真恶心。可怜的家伙，还以为自己会被转走。我们这里不留囚犯。我们杀了他们，把尸体变成土，用这种土让作物长得快得出奇，再把收成卖给老百姓。\n\n要是大家知道，准会疯掉。换我也一样。可这就是我们的工作。\n\n我恨透了这事，可……钱就是这么挣来的。
This tape contains highly classified material and must not see the eyes of the public\n\nA hidden bio-weapon testing facility has been discovered on the 13th Asteroid orbiting 56-vow\n\nYou have been tasked to find and extract what remains of  the weapons tested here\n\nThe facility has been destroyed but there are several rogue bio-weapons primed to kill anyone  and everyone in any way possible\n\nGood luck=本录像带载有绝密资料，严禁向公众披露。\n\n在环绕 56-Vow 的第 13 号小行星上，发现了一处隐蔽的生物武器试验设施。\n\n你的任务是找到在此测试的武器，并带回其残余部分。\n\n设施已遭摧毁，但仍有数件失控的生物武器随时可能发动攻击，用尽手段杀死它们遇见的每一个人。\n\n祝你好运。
This will be my last day here, after today, I will be fleeing once more.\nBut to someplace safe this time.\nWe had come to the decision that the decades of research was simply too valuable to destroy.\nSo we have handed them the tools, the research and they will likely proceed with making their own soldier in labs.\nThe prospect of that is horrifying.\nOr.. well \nIt would have been had I not removed any mention of LYN-H, the one thing that prevents clones from dying shortly after being created.\nThe armies they grow will all drop dead within a month after being created.\nTime to find a brighter horizon.\nProfessor Harrington, over.. and out.=这是我在这儿的最后一天。今天过后，我又得逃了。这一次，要逃到安全的地方。\n我们商定了，几十年的研究实在太珍贵，不能一把火毁掉。于是我们把工具和研究都交给了他们。他们多半会在实验室里培育自己的士兵。这念头真叫人不寒而栗。\n或者说……本该如此。幸好，我删去了所有提到 LYN-H 的内容。克隆体造出来后，全靠它才不会很快死去。\n他们培育的军队，一个月之内就会全部倒下。\n该去找一片更明朗的天地了。\n哈林顿教授，通话……结束。
To start off my statement I would like everyone to remember why the use of biological warfare was made illegal in the first place.\nNot two hundred years ago, over in the Altra region when the study and use of biological weapons was allowed still.\nA conflict between two dominions turned to bloodshed. This war is now known as one of the most devastating wars in all of time across the known regions.\n\nAnd it was the weaponry they used which marked this war as the deadliest one in history thus far.\nThe most commonly used was the melting gas made with the spores of an acidic super-fungi.\nWhen it touched the skin or was inhaled, it would melt the victim from the inside out. And the majority of victims were not military but civilians.\n\nSurely I do not speak for myself when I say-\nThis musn't happen again.=在开始陈述前，请各位想想，当初为何要禁止生物战。还不到两百年前，在阿尔特拉地区，人们仍可研究和使用生物武器。两个领地之间的争端演变成了流血冲突。如今，整个已知区域都把它列为有史以来最具毁灭性的战争之一。\n\n所用的武器，更让它成了迄今死伤最惨重的一场。最常用的是以强酸性超级真菌的孢子制成的溶解气体。无论接触皮肤还是吸入体内，它都会让受害者从里到外溶解。而大多数受害者并非军人，是平民。\n\n我相信这句话绝不只代表我一个人——\n这样的事，绝不能重演。
Transcript emergency recording\n—----------------------- 2:50\n\nS. Underhill: I know you’re there Cavil.\nS. Underhill: You realise we possess the ability to read the security transcripts from our headquarters.\nS. Underhill: Your pod sent out a distress signal, Cavil. I know where you are.\nC. Darter: Fuck you.\nS. Underhill: Do you believe you are doing the right thing?\nC. Darter: Stopping you from murdering innocents? Yes. Yes I believe I am.\nS. Underhill: By murdering innocents of your own?\nC. Darter: I didn’t mean to.\nS. Underhill: Yet you did. In an attempt to sabotage my plans you killed not just one, but two. You gave Sarah the illusion of escape. But Julian would’ve been left to die all alone. You are a hypocrite.\nC. Darter: I have your documents. I know what you did. Your experiments at the Crosswind Mental Hospital in Last Hope. Hailey Robertson, remember her? It’s all there. It will all be public soon enough.\nS. Underhill: And you think that changes things? We can tell the public anything and they’ll believe it.\nC. Darter: If this gets out you become a risk. Risks don’t tend to live long.\nS. Underhill: Then what. I’ve finished my machine. You think they’ll stop? It’s working. It’s working really well. You may have sabotaged your mission but we’ll find that ship, one way or another. Then project Mycete will be perfect. The soldiers we produce will be impenetrable, unstoppable. We will rescue so many cities from their lawlessness. We will unite what’s left after the silent age. You can stop the engineer, but not his machine.\nC. Darter: You’re lost, Sol. You’re lost in your own fantasy.\nS. Underhill: Don’t you see it? The cities we’ve saved? The people exist in peace. We brought them that peace. We’ve perfected it. You give people too much will, they destroy themselves. You give them too little, they destroy their government. You give them just enough, they’re happy. It doesn’t even have to be real. History is an archive of mistakes, an encyclopedia of lessons, we are the only ones who chose not to ignore them.\nC. Darter: You can’t call it peace when you’re the one bringing war. Maybe I can’t stop the project. But I can stop you.\n—----------------------- \nEmergency recording ended=紧急录音文字记录\n—----------------------- 2:50\n\n索洛弗·安德希尔：卡维尔，我知道你在。\n索洛弗·安德希尔：你知道，总部能读到安保录音的文字记录。\n索洛弗·安德希尔：你的逃生舱发出了求救信号。卡维尔，我知道你在哪儿。\n卡维尔·达特：去你妈的。\n索洛弗·安德希尔：你觉得自己做得对？\n卡维尔·达特：阻止你屠杀无辜的人？对。我当然觉得对。\n索洛弗·安德希尔：办法就是你自己也杀几个无辜的人？\n卡维尔·达特：我没想让他们死。\n索洛弗·安德希尔：可他们还是死了。为了破坏我的计划，你害死的不止一个，是两个。你让莎拉以为自己可以逃走。可朱利安呢？你原本打算留下他，独自等死。你真虚伪。\n卡维尔·达特：你的文件在我手里。你干过什么我一清二楚。最后希望的横风精神病院，你在那里做的实验。海莉·罗伯逊，还记得她吗？全写在里面。很快所有人都会知道。\n索洛弗·安德希尔：你觉得这能改变什么？我们跟公众说什么，他们就信什么。\n卡维尔·达特：一旦泄露，你自己就成了风险。风险通常活不长。\n索洛弗·安德希尔：然后呢？我的机器已经造好了。你以为他们会停手？它能用，而且好用得很。你或许搞砸了这趟任务，可那艘船我们总会找到。到时候，真菌计划就完美了。我们制造的士兵将刀枪不入、势不可挡。我们会把多少城市从无法无天的境地中解救出来。静默时代留下的一切将重归一统。你阻止得了工程师，阻止不了他的机器。\n卡维尔·达特：索尔，你已经迷失了。你活在自己的幻想里。\n索洛弗·安德希尔：你看不见吗？那些被我们拯救的城市，人们安居乐业。和平是我们给的。我们已经掌握了分寸。给人太多自由意志，他们就自取灭亡。给得太少，他们就推翻政府。给得刚刚好，他们便心满意足。那自由甚至都不必是真的。历史是记载错误的档案，是写满教训的百科全书；只有我们选择了正视它。\n卡维尔·达特：挑起战争的人是你，凭什么管它叫和平？也许我阻止不了这个计划。但我阻止得了你。\n—-----------------------\n紧急录音结束
Transcript security recording - Day 14 \n—----------------------- 15:12 - Cargo dock\n\nC. Darter: That’s everything in cargo?\nS. Dent: Just about, yeah.\nC. Darter: Good, I’ll signal Julian so he can start the engines.\nS. Dent: He knows how to fly this thing? I thought he was only here in case things like.. that.. Jump out on us.\nC. Darter: He doesn’t need to know how to fly, the autopilot takes care of that. He only needs to power the engines and make sure nothing goes up in flames in the process.\nS. Dent: oh, I assumed there was some manual labour involved in the taking off part but that makes sense. Well I’ll be in the office on Level 2 documenting our discoveries.\nC. Darter: Alright.\n\n—----------------------- 17:20 - Central hallway\n\nS. Dent: Hey, is everything in order?\nJ. Charter: I have nothing to report on, there hasn’t been a breach of containment.\nS. Dent: That’s good.\nJ. Charter: Sorry for asking but, what is that stuff we collected?\nS. Dent: It’s a type of Eumycota.. or fungi in layman's terms, a white mold that seems to form these spike-like pustules which it uses to inject itself into any unfortunate creature that happens to step on it.\nJ. Charter: I see. So that’s what was wrong with that spider.\nS. Dent: Yeah, so don’t touch the mold.\nJ. Charter: What are you planning on doing with it?\nS. Dent: That is classified.\nJ. Charter: Understood.\nS. Dent: I’ve got some work to do so I’ll be off.\nJ. Okay. Stay safe.\n\n—----------------------- 22:43 - Communications\n\nS. Underhill: What’s the status.\nC. Darter: We have contained some new samples for the project.\nS. Underhill: Is it promising?\nC. Darter: ..Potentially, I have not conducted extensive research just yet.\nS. Underhill: That will be your priority from now on.\nC. Darter: Of course. As you wish.\nS. Underhill: I sense that you are displeased. Is there anything I should know about?\nC. Darter: It doesn’t feel right. It’s immoral. We shouldn’t build a future on the torture of innocents.\nS. Underhill: If the loss of innocent lives worries you then I would recommend reminding yourself that our sins are as many as the others.\nC. Darter: It isn’t right.\nS. Underhill: Perhaps you don’t understand.\nC. Darter: Understand what? The fact that innocent people are being cut to pieces for an opportunity of finding someone who we then also torture with the notion of it will help build our future? You mean that?\nS. Underhill: We have our projects, our corporations, people, governments, ideologies, politics, empires.. together it forms a society.. The people strive to climb higher, rule, gain control, to sit at the top of whatever they feel gives them power, yet even when they get there, they still feel it.. that entity looming over their shoulder from a step on the ladder too high for anyone to reach. They hide behind the facade of smaller corporations. You know their influence. They allow us to exist as long as we provide, no matter the methods or the cost. If they won't care, why should we.\nC. Darter: The.. entity?\nS. Underhill: I expect a report tomorrow before the end of the day. Otherwise you will be considered for repurposing.\nC. Darter: ..Understood.=安保录音文字记录　　第14天\n15:12　货运码头\n\n卡维尔·达特：货物都在这儿了？\n莎拉·丹特：嗯，差不多了。\n卡维尔·达特：好，我给朱利安发信号，让他启动引擎。\n莎拉·丹特：他会开这玩意儿？我以为他只是来防着那种……东西……突然扑上来。\n卡维尔·达特：他不用会开。自动驾驶会管。他只要启动引擎，别让什么东西半路着火就行。\n莎拉·丹特：哦，我还以为起飞总得手动干点什么呢。也对。那我去2层办公室记录我们的发现了。\n卡维尔·达特：好。\n\n17:20　中央走廊\n\n莎拉·丹特：嘿，一切正常吗？\n朱利安·查特：没有情况需要报告。收容没有失效。\n莎拉·丹特：那就好。\n朱利安·查特：冒昧问一句，我们采集回来的是什么？\n莎拉·丹特：是一种真菌门生物……说白了就是真菌。一种白霉，会生出尖刺状的脓疱，哪个倒霉生物踩上去，它就借此把自己注进对方体内。\n朱利安·查特：明白了。那只蜘蛛就是这么回事。\n莎拉·丹特：对，所以别碰那些霉菌。\n朱利安·查特：你们打算拿它做什么？\n莎拉·丹特：这是机密。\n朱利安·查特：明白。\n莎拉·丹特：我还有工作，先走了。\n朱利安·查特：好。注意安全。\n\n22:43　通讯室\n\n索洛弗·安德希尔：情况如何？\n卡维尔·达特：我们为项目收容了一些新样本。\n索洛弗·安德希尔：有希望吗？\n卡维尔·达特：……有可能。还没来得及深入研究。\n索洛弗·安德希尔：从现在起，优先研究它。\n卡维尔·达特：当然，如您所愿。\n索洛弗·安德希尔：我听出你有些不快。有什么事我该知道吗？\n卡维尔·达特：我觉得这样不对。这不道德。我们的未来不该建立在折磨无辜者的基础上。\n索洛弗·安德希尔：如果你为无辜者丧命而不安，不妨提醒自己：我们的罪行也不过和别人一样多。\n卡维尔·达特：这不对。\n索洛弗·安德希尔：也许你还不明白。\n卡维尔·达特：明白什么？我们把无辜的人切成碎块，只为有机会找到合适的人，然后以建设未来为由，连那个人也一起折磨？你是指这个吗？\n索洛弗·安德希尔：有项目，有企业，有人民、政府、思想、政治和帝国……合在一起就成了社会。人总想往上爬，想统治，想掌权，想站在一切能给自己权力的东西顶上。可就算爬到顶，他们还是能感觉到……那个实体就在背后，从谁也够不着的那一级阶梯上俯视着他们。他们藏在一家家小公司的门面背后。你知道他们的影响力。我们只要能交出东西，他们就允许我们存在，不问手段，不计代价。他们都不在乎，我们何必在乎？\n卡维尔·达特：那个……实体？\n索洛弗·安德希尔：明天结束前，我要看到报告。否则，我们会考虑给你另作安排。\n卡维尔·达特：……明白。
Transcript security recording - Day 15 \n—----------------------- 11:56 - Lab\n\nS. Dent: Out of all the specimens we have gathered, this one seems the most potent.\nC. Darter: On that I agree. We would only have to bioengineer the instinctual need to spread out of the samples before it can be merged and experimented with.\nS. Dent: Of course. I noted on the spider back on Utril that the exoskeleton seemed to have hardened with an increased density to help it protect itself from brute force impact.\nC. Darter: I wonder if it would do the same to a bone structure or if it would respond to the skin instead.\nS. Dent: Either way it would likely induce extreme pain, shock and possibly death were we to try that on an animal or even a person.\nC. Darter: I am aware. Though I doubt Solover cares as long as we can get a subject to survive.\nS. Dent: You’re probably right. But try finding medical research where animals didn’t suffer.\nC. Darter: Does it ever bother you? The screeches of pain whenever we have to test on a live subject.\nS. Dent: Yeah.. Of course it does. I don’t enjoy it. I try to remind myself that we’re doing this now so that people in the future will be able to live a better life. It doesn’t make it better but it’s how I deal with it.\nC. Darter: I suppose that makes sense.\n\n—----------------------- 12:46 - Central hallway\n\nC. Darter: Stand guard at the lab in case anything goes awry.\nJ. Charter: Yes sir.\n—----------------------- 13:08 - Lab\n\nJ. Charter: Everything okay here?\nS. Dent: Yeah, did something happen?\nJ. Charter: No no, I was sent by Cavil. He said I should keep watch in case anything happened.\nS. Dent: Fair enough. We’re only working with a highly infectious aggressive fungi haha.\nJ. Charter: Yeah hah.\nJ. Charter: The experiments that are conducted here, are they very dangerous?\nS. Dent: In the wrong hands, yes, very. Handle them wrong and we could have an outbreak. A scenario like that can only end nasty.\nJ. Charter: Good thing you’re so skilled then.\nS. Dent: Yeah, thanks.\nJ. Charter: I am curious though, do you feel.. safe.. Here? On the ship?\nS. Dent: Well. Not always. These are very dangerous things we’re working with. But in the end it’s part of the job, it’s what we signed up for. I feel you of all people would probably know that.\nJ. Charter: We have our duties, even if it’s dangerous. We’re building a future. That’s important.=安保录音文字记录　　第15天\n11:56　实验室\n\n莎拉·丹特：我们收集到的所有标本里，这一个看来效力最强。\n卡维尔·达特：我同意。只要先用生物工程去掉样本自行扩散的本能，就可以进行融合，再做实验。\n莎拉·丹特：当然。我在尤特里尔观察过那只蜘蛛，它的外骨骼似乎硬化了，密度也提高了，能更好地承受猛烈撞击。\n卡维尔·达特：我好奇它对骨骼会不会产生同样的作用，又或者起反应的其实是皮肤。\n莎拉·丹特：无论哪种，把它用在动物甚至人身上，都可能造成剧痛、休克，甚至死亡。\n卡维尔·达特：我知道。不过只要能让一个受试者活下来，我怀疑索洛弗根本不在乎。\n莎拉·丹特：大概吧。可你倒是找一项没让动物受过苦的医学研究来。\n卡维尔·达特：你从来不难受吗？每次拿活体做实验，那些痛得刺耳的惨叫声。\n莎拉·丹特：难受……当然难受。我并不喜欢。我只能提醒自己，我们今天做这些，是为了以后的人能过得更好。这没让事情变好，但我是这么撑下来的。\n卡维尔·达特：我想我能理解。\n\n12:46　中央走廊\n\n卡维尔·达特：守在实验室外面，以防不测。\n朱利安·查特：是，长官。\n13:08　实验室\n\n朱利安·查特：这里一切正常吗？\n莎拉·丹特：正常，出什么事了？\n朱利安·查特：没有，没有。卡维尔让我来的。他说让我盯着点，以防出事。\n莎拉·丹特：有道理。毕竟我们弄的“只不过”是一种传染性极强、攻击性十足的真菌，哈哈。\n朱利安·查特：是啊，哈。\n朱利安·查特：你们在这儿做的实验，很危险吗？\n莎拉·丹特：落在不懂的人手里，当然，非常危险。处理不当就可能暴发感染。那种事绝不会有好下场。\n朱利安·查特：幸好你这么在行。\n莎拉·丹特：嗯，谢谢。\n朱利安·查特：不过我有点好奇。在这里……在这艘船上，你觉得安全吗？\n莎拉·丹特：唔，不总是。我们打交道的东西很危险。但说到底这是工作的一部分，我们来之前就知道。你应该比谁都明白。\n朱利安·查特：再危险也有自己的职责。我们在建设未来，这很重要。
