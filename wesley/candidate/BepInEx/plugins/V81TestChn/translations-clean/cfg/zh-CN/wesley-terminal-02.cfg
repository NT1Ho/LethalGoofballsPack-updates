dia of lessons, we are the only ones who chose not to ignore them.\nC. Darter: You can’t call it peace when you’re the one bringing war. Maybe I can’t stop the project. But I can stop you.\n—----------------------- \nEmergency recording ended=紧急录音记录\n—----------------------- 2:50\n\nS. 安德希尔：我知道你在那儿，卡维尔。\nS. Underhill：您知道，我们拥有读取总部安全记录的能力。\nS. 安德希尔：你的太空舱发出了求救信号，卡维尔。我知道你在哪里。\nC. Darter：去你的。\nS. 安德希尔：你觉得自己做得对吗？\nC. Darter：阻止你杀害无辜者？是的。我认为我确实可以做到这一点。\nS. 安德希尔：通过杀害无辜的人来实现？\nC. Darter：我不是有意为之。\nS. 安德希尔：不过你确实这么做了。为了破坏我的计划，你不仅杀了一个人，而是两个。你让莎拉有了逃脱的假象。但朱利安却只能独自死去。你真是个伪君子。\nC. Darter：我已经拿到了你的文件。我知道你做了什么。你在Last Hope的Crosswind精神医院进行的实验。Hailey Robertson，还记得她吗？所有的事情都在里面了。很快这些都会被公开。\nS. Underhill：你认为这真的改变了事情吗？我们可以向公众说任何事情，他们都会相信。\nC. Darter：如果这件事泄露出去，你就会成为风险对象。风险通常不会持续很长时间。\nS. 安德希尔：那又怎样？我的机器已经完成了。你认为他们会停止吗？它运转得很顺利，效果非常好。也许你破坏了你的计划，但无论如何，我们都会找到那艘飞船。那样一来，Mycete项目就会完美实现。我们制造的士兵将不可战胜，无法被阻止。我们将从那些混乱的城市中拯救出许多城市。在无声时代结束后，我们将统一剩下的地区。你可以阻止工程师，但无法阻止他的机器。\nC. Darter：你迷失了，Sol。你沉浸在自己的幻想之中。\nS. 安德希尔：你没看到吗？我们拯救的那些城市，那些人们生活在和平之中。我们为他们带来了这种和平。我们已经将其完善到了极致。如果你给予人们太多的力量，他们就会自我毁灭；如果你给予他们太少的力量，他们就会破坏自己的政府。如果你给予他们恰到好处的力量，他们就会幸福。甚至不需要这种和平是真实的。历史就是错误的档案，是经验的百科全书，而我们才是唯一选择不去忽视这些错误的人。\nC. Darter：如果你才是带来战争的人，那就不叫和平。也许我无法阻止这个项目，但我可以阻止你。\n—----------------------- \n紧急录制结束
