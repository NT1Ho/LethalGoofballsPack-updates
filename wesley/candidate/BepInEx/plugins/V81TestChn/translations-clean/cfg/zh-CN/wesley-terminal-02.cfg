Transcript security recording - Day 18\n—----------------------- 00:23 - Pod-1\n\nC. Darter: These might be the last words you’ll hear from me. Escape pods don’t have a great track record when it comes to landings.\nC. Darter: Sarah is dead. The damn bastard shot her in the neck. Following orders before he launched himself out the airlock. Watched him sobbing through the hallway.\nC. Darter: I didn’t want them to get hurt. It just happened.\nC. Darter: She was innocent.\nC. Darter: Sol, if you ever read the logs. I want you to know I’m not sorry for sabotaging your mission. You are a corrupt piece of shit who deserves to be put with the innocents you’re slaughtering.\nC. Darter: I’ve got your documents. I’ve read your history. You were always like this.\nC. Darter: Watch what happens when the common people figure out who you really are.=安保录音文字记录｜第 18 天\n—----------------------- 00:23　1 号逃生舱\n\n卡维尔·达特：这也许是你最后一次听见我的声音。逃生舱在着陆这件事上，向来没什么好记录。\n卡维尔·达特：莎拉死了。那个混蛋一枪打中了她的脖子。奉命行事，然后自己从气闸出去了。我看着他一路哭着走过走廊。\n卡维尔·达特：我没想让他们受伤。事情就这么发生了。\n卡维尔·达特：她是无辜的。\n卡维尔·达特：索尔，如果有一天你读到这些日志，给我记住：我破坏了你的任务，一点也不后悔。你这个烂透了的人渣，就该被扔进你正在屠杀的那些无辜人中间。\n卡维尔·达特：文件在我手里。你的过去我全读过了。你一直都是这种人。\n卡维尔·达特：等普通人看清了你的真面目，你就等着瞧吧。
