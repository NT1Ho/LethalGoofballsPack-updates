Something has gone wrong. One of the anomalies in our storage areas have gone missing after a loud pulse like sound.\nOur security cameras show nobody entering or leaving this area, it disappeared on its own.\n\nAnd the employee who was watching over storage at the time has now been turned to crystal.\n\nI fear this might call for an emergency evacuation considering we don't know what we're dealing with yet.\n\nI now ask for immediate help.\n\n- Head of operation QS_4=出事了。仓储区传来一声巨响，像脉冲一样，随后一件异常物就失踪了。\n监控没有拍到任何人进出。它是自己消失的。\n\n当时看守仓库的员工现在已经变成了水晶。\n\n我们还不知道面对的是什么。恐怕有必要紧急疏散。\n\n请求立即支援。\n\n——QS_4 行动负责人
