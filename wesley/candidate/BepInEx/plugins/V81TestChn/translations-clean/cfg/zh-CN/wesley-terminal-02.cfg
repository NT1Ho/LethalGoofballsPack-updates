WHITE MOLD\n\n\nScientific name: Cretyrus-botaharum\n\n\nThis is a dangerous species of mold which thrives in bright areas. It is capable of growing in dark places but prefers not to, very rarely it be found in shadow or complete darkness.\n\n\nThe mold grows en masse and is able to spread across large surfaces with rapid succession. Additionally, on occasion it clusters up and grows spike-like formations which act as a way of detecting motion and a means to spread itself through direct infection of any poor creature which gets stung by it.\n\n\nThe spike-like formations are able to sense both heat and vibrations through the air. It knows what sort of creatures are easier to spread through and which are not. Those it deems not viable, it tries to scare off by shaking its spikes. However it will not hesitate to sting when the opportunity arises regardless of what steps on it.\n\n\nUnlike most infections, this one does not try to kill or harm the host, instead it tries to adapt to its host and strengthen the skeleton or exoskeleton, making them bulkier and more violent as a faster method of spreading to other creatures through the addition of spikes growing out of the bones it has strengthened. Comparisons have been made with Rabies lyssavirus, a disease which similarly alters behaviour to become more violent as a means to spread.\n\n\nThe I.T.D.A. has investigated several infestations of this mold and deemed it not to be a critical level invasive species and has successfully cleared large patches of the mold.\nThey highly advise everyone to report any instances of the white mold appearing and avoid direct contact.=白霉\n\n学名：Cretyrus-botaharum\n\n一种危险的霉菌，在明亮处生长旺盛。它也能在暗处生长，却很少出现在阴影中或完全黑暗的地方。\n\n白霉会成片生长，迅速蔓延到大片表面。有时菌体会聚成一簇，长出尖刺。这些尖刺既能探测动静，也能刺中倒霉的生物，通过直接感染来传播。\n\n尖刺能感知热量和空气中的振动。白霉能分辨哪些生物更适合帮它传播。碰上不合适的，它会抖动尖刺，试图把对方吓走。不过，无论是什么踩上去，只要有机会，它都会刺下去。\n\n与多数感染不同，白霉并不试图伤害或杀死宿主。它会适应宿主，加强其骨骼或外骨骼，使宿主变得粗壮、暴躁。强化后的骨骼上还会长出尖刺，加快向其他生物传播的速度。这种现象常被拿来与狂犬病病毒相比，后者同样通过使宿主更具攻击性来促进传播。\n\nI.T.D.A. 调查过多起白霉侵染事件，认定它尚不属于最高威胁级别的入侵物种，并已成功清除了大片菌落。该机构强烈建议大家一旦发现白霉就上报，并避免直接接触。
We are now four weeks into the debate meaning next week will be the final and deciding council conference.\nWhile the Council of Rule is still highly against the study and use of biological warfare, there must be a way to convince them otherwise.\n..I understand that it is a very dangerous idea which..\nIn theory..\nCould ruin more lives than I can count as well as cause a financial catastrophe within this region..\n\nBut I trust the Emperor knows this and I am sure he has a plan which I will be made aware of soon.\nHe does not sit upon the throne without reason.\n\nAfter this log I might write a letter to my wife Madeline as I will be leaving 235-Calist the next morning for a meeting with the Emperor.\nI hope to find some clarity about his plans to better structure our case.\n\nAgent G- Signing off.=辩论已经进行了四周，下周就是理事会最后一次会议，届时将作出决定。执政议会仍坚决反对研究和使用生物战手段，但总有办法说服他们。\n……我明白，这个想法十分危险。理论上……它可能毁掉数不清的性命，还可能给这个地区带来一场金融灾难……\n\n但我相信皇帝也知道这一点。他一定有计划，想必很快就会让我知晓。他坐在皇位上，自有他的道理。\n\n写完这篇日志，我也许会给妻子玛德琳写封信。明早我要离开235-卡利斯特，去面见皇帝。我希望能弄清他的打算，以便把我们的主张讲得更有条理。\n\nG 干员，记录完毕。
We found the.. anomalous object. It was quite far from the primary facility so we decided to construct a tunnel directly to it.\nThere's lots of plants and growth in the way, it will likely take quite a bit.\n\nBut when that's finished we will finally be able to further study this.. thing.\nIt's going to take some heavy machinery so we might just bring one of our special apparatuses.=我们找到了那个……异常物。它离主设施相当远，我们决定挖一条隧道直达那里。\n沿途尽是植物和增生物，恐怕要花上不少时间。\n\n等隧道修好，终于就能进一步研究那个……东西了。\n这得动用重型机械，我们或许会带上一台特制的设施电源。
We heard noises in the walls.\nA buddy of mine went to investigate one of the vents and..\nThere were so many of them..\nThe bees they..\nI can still hear his screams as they were digging into his eyesockets and flying into his mouth.\nIf rescue won't come quick, I don't know what else might follow.=墙里有响动。\n我一个朋友去检查通风口，结果……\n里面全都是……\n那些蜜蜂，它们……\n它们钻进他的眼窝，飞进他的嘴里。我现在还听得见他的惨叫。\n如果救援不快点来，我不知道接下来还会发生什么。
We should never have accepted that Crescent of Curses.\nSome of us have gone mad!\n\nThis morning we discovered three more skeletons at the bottom of the lakes.\nI fear out of sheer madness they went for an acidic swim.\n\nI too have experienced some strange things.\nSometimes when I look down a hallway, it starts expanding.\nLike there are more than a million other ways to go.\n\nIt shows things that nobody can see.=我们就不该收下那件诅咒新月。\n我们当中已经有人疯了！\n\n今早，我们又在湖底发现了三具骨架。\n我怕他们是彻底疯了，竟然去酸湖里游泳。\n\n我自己也遇到了些怪事。\n有时我朝走廊望去，它就开始往外延伸，\n仿佛分出了一百万条岔路。\n\n它让人看见旁人看不见的东西。
We were able to reach out to one of those giant emergency service centers on Polarus.\nOne of those near the overly protected vaults.\nI wonder what kind of crazy stuff they hide in there.\nAnyway, rescue is on the way. We're scared but only a few more hours and we will be safe.=我们联系上了波拉鲁斯的一座大型应急服务中心，就在那些戒备森严得过头的金库附近。\n我倒想知道，他们到底把什么稀奇古怪的东西藏在里面。\n总之救援在路上了。大家都很害怕，但再过几个小时就安全了。
We, quarry sector_4 on Cubatres have found an unidentified crystal.\n\nWe discovered this.. anomaly earlier today. It would light up nearby torches and lightbulbs.\nIt also seems to turn nearby objects into similarly look crystal.\nThis happened earlier to some of our equipment.\n\nI ask to have experts send over to identify what this could be and if it is of any use to our company.\n\nFor the time being it will be stored in Storage Area C.\n\n- Head of operation QS_4=我们是库巴特雷斯第 4 采石区，发现了一块身份不明的水晶。\n\n今天早些时候发现了这个……异常物。它能让附近的火把和灯泡自行亮起。\n附近的物体似乎还会变成与它形貌相似的晶体。\n我们有些设备刚刚就发生了这种变化。\n\n请派专家过来鉴定，并判断它对公司是否有用。\n\n暂时存放在 C 仓储区。\n\n——QS_4 行动负责人
Well, we found something.\n\nIt appears this strange growth is neither a fungi.. nor its own organism.\nIt's its own new thing.\nIt is able to remember certain growing patern from a genetic blueprint.\nMeaning it's alive!\nBut seamingly not in the traditional way we precieve living things.\nOur entire understanding of life was just flipped upside down.\nIt is even able to grow these weird.. bulbs resembling eyes.\nIt is unsure if these eyes serve a purpose.. Well.. They must.. Otherwise it wouldn't be growing them.\n\nWe will refer to this as.. Cosmic Growth from now on.\nThat's all I can say for now.\n\nProfessor Harrington, over and out.=嗯，我们有所发现。\n\n这种古怪的增生物既不是真菌……也不是什么独立的生物。它是全新的东西。它能记住遗传蓝图里的特定生长模式。也就是说，它是活的！但似乎并不符合我们一直以来对生命的认识。这一下，我们对生命的理解全给颠覆了。\n它甚至能长出奇怪的……像眼睛一样的球茎。还不清楚这些眼睛有什么用……好吧，一定有用，否则何必长出来呢？\n\n今后我们就叫它“宇宙增生体”。目前能说的只有这些。\n\n哈林顿教授，通话结束。
What is happiness?\n\nIs it your dirty workplace?\nIs it your filthy house?\n\nIs it your crippling need for a therapist because you realised the universe is completely stacked against you and you will likely suffer the same fate as millions of others as the pressure of your worthless life becomes to much for the imagination of the mind leading to eventual damnination?\n\n\nNo!\n\n\nHappiness is the one who sends you money!\nHappiness is the one who created your job!\nHappiness is the one who protects you!\nHappiness is the Emperor!\nAnd if you work hard enough,\nYou will be personally invited to live in his golden city!\n\nHappiness is Empra!\n\nEmpra is happiness!=什么是幸福？\n\n是你那肮脏的工作场所？是你那污秽不堪的家？\n\n还是你突然发现整个宇宙都在跟你作对，自己多半要落得和千百万人一样的下场，这毫无价值的人生压得人想都不敢想，最终只能走向毁灭，所以你连一刻都离不开心理医生？\n\n不！\n\n给你发钱的那一位，就是幸福！给你创造工作的那一位，就是幸福！保护你的那一位，就是幸福！皇帝就是幸福！只要你足够努力，就会收到他本人的邀请，住进他的黄金之城！\n\n恩普拉就是幸福！\n幸福就是恩普拉！
Year 154, day 12.\n\nToday is a scary day. \nProtocol wipeout was approved and the nuclear bomb will be installed tomorrow. \nKnowing where it came from I no longer feel quite as safe here. \nI can only imagine what could go wrong. \nWorse. \nHow it could ruin years of research and experimentation! \nIn case you don't know.. \nProtocol wipeout is only called during.. events of disaster. \nDestroying. \nEverything. \nAs much as I am facinated with the craft, I refuse to let it destroy all we've done. \nPerhaps I could modify some of its components. \nWe'll see. \nNow that project hawk is complete, we have received plans for new machines that will be used in the Grand War that just broke out. \nIt will be called, Project Nutcracker. \nI'm excited. \nMe out.=第 154 年，第 12 天。\n\n今天真让人害怕。\n清除协议获批，明天就要安装核弹。\n知道它是从哪儿来的以后，我待在这里就没那么安心了。\n我只能想象可能会出什么岔子。\n更糟的是，\n这么多年的研究和实验，说不定都要毁了！\n你要是不知道……\n清除协议只有在……发生灾难时才会启动。\n摧毁。\n一切。\n我再怎么着迷于这门技术，也不能让它毁掉我们做过的一切。\n也许我能改动其中几个部件。\n到时候再看。\n大战刚爆发，鹰计划也已完成。我们收到了新机器的设计图，打算投入这场战争。\n新项目要叫胡桃夹子计划。\n我很期待。\n就记到这儿。
Year 154, day 136.\n\nBusiness as usual. \nProject nutcracker is well on the way. \nThese droids are getting more advanced by the day. \nEspecially since Geoffrey joined us a week ago. \nGreat stuff. \nMe out.=第 154 年，第 136 天。\n\n一切照旧。\n胡桃夹子计划进展顺利。\n这些机器人一天比一天先进，\n尤其是杰弗里上周加入以后。\n真不错。\n就记到这儿。
Year 154, day 139.\n\nUhh giants are still as prevalent as allways. \nUh. \nWe started to experiment with emotional manipulation alongside project nutcracker. \nWe just need the proper items to uh bind it to. \nMe out.=第 154 年，第 139 天。\n\n呃，巨人还是跟往常一样，遍地都是。\n嗯。\n除了胡桃夹子计划，我们也开始实验怎么操控情绪。\n现在就差找到合适的物品，把它……呃，附在上面。\n就记到这儿。
Year 154, day 146.\n\nWe used masks.. Big mistake. \nThey seem to get stuck to their wearers.. \nuh.. \nNo other side effects have been noted. \n\nI haven't seen it myself but I've heard project nutcracker was a succes! \nIt sounds like they're actually alive! \nuh.. \nWe also noticed that Geoffrey went missing recently. \nWe are looking into that. \nMe out.=第 154 年，第 146 天。\n\n我们用了面具……大错特错。\n面具好像会黏在佩戴者身上……\n呃……\n没发现其他副作用。\n\n我没亲眼看见，不过听说胡桃夹子计划成功了！\n听起来它们真的活了！\n呃……\n我们还发现杰弗里最近失踪了。\n正在调查。\n就记到这儿。
Year 154, day 15.. something.\n\nI am on the run. \nThose masks.. took them. \nThey're not them anymore. \nThey took my team! Converted half of them! \nThe nutcrackers are not droids like I thought. \nI.. I saw one of them. \nIt shot me.. right in the chest before I got here. \nI'm bleeding out. \nI think the nutcrackers.. \nThey're my coworkers.. \nOr what's left of them. \nI think those masked men.. \nI think they.. \n\n*Gunshot*=第 154 年，第 15……十几天吧。\n\n我在逃命。\n那些面具……夺走了他们。\n他们已经不是原来的他们了。\n我的团队被夺走了！有一半被它们转化了！\n胡桃夹子不是我以为的那种机器人。\n我……我看见其中一个了。\n我来这里之前，它开了枪……正中胸口。\n我的血快流干了。\n我觉得那些胡桃夹子……\n它们是我的同事……\n或者说，是同事们剩下的部分。\n我觉得那些戴面具的人……\n我觉得他们……\n\n*枪声*
Yesterday Jack claimed to have found an ancient dagger.\nHe was eager to tell the crew but he does not want to let go of it.\nThis is quite strange behaviour for Jack so I went to investigate this blade.\n\nHe left it next to his bed while he was asleep.\nI snuck in and tried to grab it but.. It was incredibly heavy.\nWhich is weird considering jack was able to carry it fine.\nHowever, in his sleep, I heard him mumble about some ancient note or.. ritual..\nCertainly strange.=昨天杰克说他找到了一把古代匕首。\n他急着告诉船员们，却一直不肯松手。\n杰克平常可不这样，我就去查了查那把刀。\n\n睡着时，他把刀放在床边。\n我悄悄溜进去想拿起来，可是……它沉得吓人。\n奇怪，杰克明明拿得轻轻松松。\n不过，我听见他在睡梦中嘟囔什么古老的便条，还是……仪式……\n确实古怪。
You are now listening to\n-Across The Stars-\nI'm your favourite radio host and I'm here with your 11 AM news.\n On the dot for a change.\nIt looks like our Thursday will be sunny with little clouds in the sky.\nAlways nice after nothing but storms.\n\nJust like the past weeks the war is still raging on and we don’t see it ending anytime soon with how things are currently going.\nIn fact, the new factories on Oldred are doing nothing but throwing more gas on the fire.\nAs if the inferno isn’t large enough.\nCities are burning and for what.\nSurely not for sticks and marshmallows…\nI bring good news too though.\nThere have been talks of a safe place away from the war.\nA place to hide out until the nightmare is over.\nSomewhere to live.\nThe Domes of Demetrica.\n\nI’m out of time, I’ve got some more hits coming up to fill up the void of your day to day work schedule.\nStay tuned and thank you for listening to\n-Across The Stars-=您正在收听《穿越星辰》。我是您最喜爱的主持人，现在为您播报上午11点新闻。难得准点了一回。\n看来这个星期四将是晴天，天空少云。连着挨了那么多场风暴，总算是件好事。\n\n和过去几周一样，战火仍在蔓延。照这局势，短期内看不到停战的希望。事实上，奥尔德雷德新建的工厂简直是在火上浇油。就好像这场大火还不够旺似的。城市在燃烧，又是为了什么？总不会是为了架树枝烤棉花糖吧……\n不过我也带来了好消息。听说远离战火的地方有一处避难所，能让人躲到噩梦结束，有个安身之处。那里就是德梅特里卡的穹顶。\n\n时间到了。接下来还有几首热门歌曲，为你日复一日的工作填填空。请别换台，感谢您收听《穿越星辰》。
