WHITE MOLD\n\n\nScientific name: Cretyrus-botaharum\n\n\nThis is a dangerous species of mold which thrives in bright areas. It is capable of growing in dark places but prefers not to, very rarely it be found in shadow or complete darkness.\n\n\nThe mold grows en masse and is able to spread across large surfaces with rapid succession. Additionally, on occasion it clusters up and grows spike-like formations which act as a way of detecting motion and a means to spread itself through direct infection of any poor creature which gets stung by it.\n\n\nThe spike-like formations are able to sense both heat and vibrations through the air. It knows what sort of creatures are easier to spread through and which are not. Those it deems not viable, it tries to scare off by shaking its spikes. However it will not hesitate to sting when the opportunity arises regardless of what steps on it.\n\n\nUnlike most infections, this one does not try to kill or harm the host, instead it tries to adapt to its host and strengthen the skeleton or exoskeleton, making them bulkier and more violent as a faster method of spreading to other creatures through the addition of spikes growing out of the bones it has strengthened. Comparisons have been made with Rabies lyssavirus, a disease which similarly alters behaviour to become more violent as a means to spread.\n\n\nThe I.T.D.A. has investigated several infestations of this mold and deemed it not to be a critical level invasive species and has successfully cleared large patches of the mold.\nThey highly advise everyone to report any instances of the white mold appearing and avoid direct contact.=WHITE MOLD\n\n\n科学名称：Cretyrus-botaharum\n\n\n这是一种危险的霉菌，喜欢在明亮的地方生长。它能够在黑暗的地方生长，但更倾向于避免这种情况。非常罕见的情况下，它会出现在阴影或完全黑暗的地方。\n\n\n这种霉菌会大量生长，并能够迅速扩散到较大的表面上。此外，它偶尔会聚集起来，形成尖刺状的结构，这些结构可以感知运动，并通过直接感染被其叮咬的生物来传播自身。\n\n\n这些尖刺状结构能够感知空气中的热量和振动。它知道哪些生物更容易传播，哪些则不然。对于那些它认为无法传播的生物，它会通过摇动尖刺来吓退它们。然而，一旦有机会，它不会犹豫地发动攻击，无论面临何种威胁。\n\n\n与大多数感染不同，这种霉菌并不试图杀死或伤害宿主，而是试图适应宿主，并强化骨骼或外骨骼，使其体积更大、更具攻击性，从而通过从强化后的骨骼上长出尖刺来更快地传播给其他生物。有人将其与狂犬病病毒进行了比较，后者也是一种通过改变行为使其更具攻击性来传播的病毒。\n\n\nI.T.D.A.已经调查了多次这种霉菌的侵扰情况，并认为它不属于严重入侵物种，并且已经成功清除了大片霉菌区域。\n他们强烈建议所有人报告任何出现白色霉菌的情况，并避免直接接触。
We are now four weeks into the debate meaning next week will be the final and deciding council conference.\nWhile the Council of Rule is still highly against the study and use of biological warfare, there must be a way to convince them otherwise.\n..I understand that it is a very dangerous idea which..\nIn theory..\nCould ruin more lives than I can count as well as cause a financial catastrophe within this region..\n\nBut I trust the Emperor knows this and I am sure he has a plan which I will be made aware of soon.\nHe does not sit upon the throne without reason.\n\nAfter this log I might write a letter to my wife Madeline as I will be leaving 235-Calist the next morning for a meeting with the Emperor.\nI hope to find some clarity about his plans to better structure our case.\n\nAgent G- Signing off.=我们现在已经进行了四周的辩论，因此下周将举行最终的、决定性的理事会会议。\n尽管规则委员会仍然强烈反对研究和使用生物武器，但必须找到一种方法来说服他们改变这一立场。\n我明白这是一个非常危险的想法……\n理论上……\n这可能会毁掉无数人的生活，同时还会给这个地区带来严重的经济灾难。\n\n不过，我相信皇帝已经知晓此事，我确信他有一个计划，很快我就会得到相关消息。\n他坐在王位上并非毫无理由。\n\n在这份日志之后，我可能会给我的妻子玛德琳写一封信，因为第二天早上我就要离开 235-卡利斯特，去参加与皇帝的会议。\n我希望能更清楚地了解他的计划，以便更好地构建我们的案件。\n\n特工G - 签名。
We found the.. anomalous object. It was quite far from the primary facility so we decided to construct a tunnel directly to it.\nThere's lots of plants and growth in the way, it will likely take quite a bit.\n\nBut when that's finished we will finally be able to further study this.. thing.\nIt's going to take some heavy machinery so we might just bring one of our special apparatuses.=我们发现了那个异常物体。它距离主要设施相当远，所以我们决定直接修建一条隧道通往那里。\n途中会有很多植物和生长物，这可能需要花费相当长的时间。\n\n但一旦隧道建成，我们就能进一步研究这个物体了。\n这需要一些重型机械，所以我们可能会带上一种特殊的设备。
We heard noises in the walls.\nA buddy of mine went to investigate one of the vents and..\nThere were so many of them..\nThe bees they..\nI can still hear his screams as they were digging into his eyesockets and flying into his mouth.\nIf rescue won't come quick, I don't know what else might follow.=我们听到墙里有声音。\n我的一个朋友去检查其中一个通风口，..\n通风口太多了..\n那些蜜蜂它们..\n我至今还能听到他的尖叫声，当时它们正钻进他的眼窝，飞进他的嘴里。\n如果救援不能迅速到来，我不知道还会发生什么。
We should never have accepted that Crescent of Curses.\nSome of us have gone mad!\n\nThis morning we discovered three more skeletons at the bottom of the lakes.\nI fear out of sheer madness they went for an acidic swim.\n\nI too have experienced some strange things.\nSometimes when I look down a hallway, it starts expanding.\nLike there are more than a million other ways to go.\n\nIt shows things that nobody can see.=我们本就不该接受诅咒新月（Crescent of Curses）的存在。\n我们中的一些人已经疯了！\n\n今天早上，我们在湖底又发现了三具骨架。\n恐怕他们纯粹是出于疯狂，才去游了酸性的水。\n\n我也经历了一些奇怪的事情。\n有时候当我沿着走廊望去时，走廊开始膨胀起来。\n仿佛还有超过一百万条路可以走。\n\n那些路能展示出一些无人能看见的东西。
We were able to reach out to one of those giant emergency service centers on Polarus.\nOne of those near the overly protected vaults.\nI wonder what kind of crazy stuff they hide in there.\nAnyway, rescue is on the way. We're scared but only a few more hours and we will be safe.=我们成功联系到了波拉鲁斯上的一个大型紧急服务中心。\n就在那些受到严格保护的金库附近。\n不知道他们那里藏着什么疯狂的东西。\n无论如何，救援已经赶到了。虽然我们很害怕，但再过几个小时我们就会安全了。
We, quarry sector_4 on Cubatres have found an unidentified crystal.\n\nWe discovered this.. anomaly earlier today. It would light up nearby torches and lightbulbs.\nIt also seems to turn nearby objects into similarly look crystal.\nThis happened earlier to some of our equipment.\n\nI ask to have experts send over to identify what this could be and if it is of any use to our company.\n\nFor the time being it will be stored in Storage Area C.\n\n- Head of operation QS_4=我们，库巴特雷斯采石场_4，在库巴特雷斯发现了一块不明晶体。\n\n我们今天早些时候发现了这个异常现象。它会点亮附近的火把和灯泡。\n它似乎还能将附近的物体转化为外观类似晶体的形态。\n之前我们的某些设备也出现了类似情况。\n\n我请求专家前来鉴定这到底是什么，以及它是否对我们的公司有任何用处。\n\n暂时将其存储在C存储区域中。\n\n- 行动负责人QS_4
Well, we found something.\n\nIt appears this strange growth is neither a fungi.. nor its own organism.\nIt's its own new thing.\nIt is able to remember certain growing patern from a genetic blueprint.\nMeaning it's alive!\nBut seamingly not in the traditional way we precieve living things.\nOur entire understanding of life was just flipped upside down.\nIt is even able to grow these weird.. bulbs resembling eyes.\nIt is unsure if these eyes serve a purpose.. Well.. They must.. Otherwise it wouldn't be growing them.\n\nWe will refer to this as.. Cosmic Growth from now on.\nThat's all I can say for now.\n\nProfessor Harrington, over and out.=嗯，我们发现了一些东西。\n\n看起来这种奇怪的生长物既不是真菌，也不是独立的生物体。\n它是一种全新的生命形式。\n它能够根据基因蓝图记住特定的生长模式。\n这意味着它是活着的！\n但显然不是我们以传统方式所理解的那种活着。\n我们对生命的整个认知都被颠覆了。\n它甚至能够长出这些类似眼睛的奇怪球体。\n目前还不确定这些眼睛有什么作用……不过，它们一定有什么作用，否则它就不会长出它们了。\n\n从现在开始，我们将这种生长物称为“宇宙生长体”。\n目前我就说这么多。\n\n哈林顿教授，结束通话。
What is happiness?\n\nIs it your dirty workplace?\nIs it your filthy house?\n\nIs it your crippling need for a therapist because you realised the universe is completely stacked against you and you will likely suffer the same fate as millions of others as the pressure of your worthless life becomes to much for the imagination of the mind leading to eventual damnination?\n\n\nNo!\n\n\nHappiness is the one who sends you money!\nHappiness is the one who created your job!\nHappiness is the one who protects you!\nHappiness is the Emperor!\nAnd if you work hard enough,\nYou will be personally invited to live in his golden city!\n\nHappiness is Empra!\n\nEmpra is happiness!=什么是幸福？\n\n是你的肮脏工作场所吗？\n是你的脏乱房子吗？\n\n是因为你极度需要心理治疗师，因为你意识到宇宙对你完全不利，你可能会遭受和数百万其他人一样的命运，因为你毫无价值的生活给心灵带来的压力太大，最终导致毁灭吗？\n\n\n不是！\n\n\n幸福是那个给你钱的人！\n幸福是创造你工作的人！\n幸福是保护你的人！\n幸福就是皇帝！\n如果你足够努力，\n你将被亲自邀请住在他那金色的城市里！\n\n幸福就是恩普拉！\n\n恩普拉就是幸福！
Year 154, day 12.\n\nToday is a scary day. \nProtocol wipeout was approved and the nuclear bomb will be installed tomorrow. \nKnowing where it came from I no longer feel quite as safe here. \nI can only imagine what could go wrong. \nWorse. \nHow it could ruin years of research and experimentation! \nIn case you don't know.. \nProtocol wipeout is only called during.. events of disaster. \nDestroying. \nEverything. \nAs much as I am facinated with the craft, I refuse to let it destroy all we've done. \nPerhaps I could modify some of its components. \nWe'll see. \nNow that project hawk is complete, we have received plans for new machines that will be used in the Grand War that just broke out. \nIt will be called, Project Nutcracker. \nI'm excited. \nMe out.=年份 154日、天 12.\n\n今天是一个可怕的一天。 \n协议销毁工作已获批准,明天将安装核弹。 \n知道它来自哪里 我不再觉得这里很安全了 \n我只能想象会出什么差错 \n更糟糕。 \n怎么会毁掉多年的研究和实验呢? \n万一你不知道... \n仅在灾难发生期间才会要求销毁议定书。 \n毁灭 \n所有的东西。 \n虽然我对这艘船很着迷 我拒绝让它毁掉我们所做的一切 \n也许我可以修改其中的一些内容。 \n等着瞧吧 \n现在项目老鹰已经完成了, 我们收到新机器的计划 将在刚爆发的大战争中使用。 \n它将被称为,胡桃项目。 \n我很兴奋 \n我出来。
Year 154, day 136.\n\nBusiness as usual. \nProject nutcracker is well on the way. \nThese droids are getting more advanced by the day. \nEspecially since Geoffrey joined us a week ago. \nGreat stuff. \nMe out.=154年，第136天。\n\n一切如常。 \n胡桃夹子项目进展顺利。 \n这些机器人一天比一天先进。 \n尤其是自从杰弗里一周前加入我们之后。 \n真是太棒了。 \n我出去了。
Year 154, day 139.\n\nUhh giants are still as prevalent as allways. \nUh. \nWe started to experiment with emotional manipulation alongside project nutcracker. \nWe just need the proper items to uh bind it to. \nMe out.=年份 154日、天 139.\n\n乌赫巨人仍然像所有行道一样普遍 \n呃... ... \n我们开始实验情感操控 与项目螺旋桨。 \n我们只需要合适的物品 把它绑起来 \n我出来。
Year 154, day 146.\n\nWe used masks.. Big mistake. \nThey seem to get stuck to their wearers.. \nuh.. \nNo other side effects have been noted. \n\nI haven't seen it myself but I've heard project nutcracker was a succes! \nIt sounds like they're actually alive! \nuh.. \nWe also noticed that Geoffrey went missing recently. \nWe are looking into that. \nMe out.=154年，第146天。\n\n我们使用了面具……大错特错。 \n它们似乎会粘在佩戴者身上…… \n呃…… \n没有其他副作用被记录到。 \n\n我自己没亲眼看到，但我听说胡桃夹子项目很成功！ \n听起来它们真的有生命迹象！ \n呃…… \n我们还注意到杰弗里最近失踪了。 \n我们正在调查这件事。 \n我退出了。
Year 154, day 15.. something.\n\nI am on the run. \nThose masks.. took them. \nThey're not them anymore. \nThey took my team! Converted half of them! \nThe nutcrackers are not droids like I thought. \nI.. I saw one of them. \nIt shot me.. right in the chest before I got here. \nI'm bleeding out. \nI think the nutcrackers.. \nThey're my coworkers.. \nOr what's left of them. \nI think those masked men.. \nI think they.. \n\n*Gunshot*=年份 154日、天 15..东西。\n\n我在逃命 \n那些面具... 拿走了 \n他们不再是他们了 \n他们抢走了我的球队!变换一半! \n螺旋桨不像我想的那样是机器人 \nI.. . .我看到其中一个 \n它射中了我... 就在我到这之前的胸部 \n我流血了 血流出来了 \n我觉得螺旋桨... \n他们是我的同事 \n或者他们剩下的什么 \n我觉得那些蒙面人... \n我想他们... \n\n*枪击*
Yesterday Jack claimed to have found an ancient dagger.\nHe was eager to tell the crew but he does not want to let go of it.\nThis is quite strange behaviour for Jack so I went to investigate this blade.\n\nHe left it next to his bed while he was asleep.\nI snuck in and tried to grab it but.. It was incredibly heavy.\nWhich is weird considering jack was able to carry it fine.\nHowever, in his sleep, I heard him mumble about some ancient note or.. ritual..\nCertainly strange.=昨天，杰克声称找到了一把古老的匕首。\n他非常想告诉船员们，但又不想放手。\n这对杰克来说真是奇怪的行为，所以我决定调查一下这把刀。\n\n他在睡觉的时候把匕首放在床边。\n我偷偷溜进去试图夺走它，但是……它实在太重了。\n这很奇怪，因为杰克明明能够轻松携带它。\n然而，在睡梦中，我听到他低声谈论着一些古老的笔记或……仪式。\n确实很奇怪。
You are now listening to\n-Across The Stars-\nI'm your favourite radio host and I'm here with your 11 AM news.\n On the dot for a change.\nIt looks like our Thursday will be sunny with little clouds in the sky.\nAlways nice after nothing but storms.\n\nJust like the past weeks the war is still raging on and we don’t see it ending anytime soon with how things are currently going.\nIn fact, the new factories on Oldred are doing nothing but throwing more gas on the fire.\nAs if the inferno isn’t large enough.\nCities are burning and for what.\nSurely not for sticks and marshmallows…\nI bring good news too though.\nThere have been talks of a safe place away from the war.\nA place to hide out until the nightmare is over.\nSomewhere to live.\nThe Domes of Demetrica.\n\nI’m out of time, I’ve got some more hits coming up to fill up the void of your day to day work schedule.\nStay tuned and thank you for listening to\n-Across The Stars-=您现在正在收听\n-跨越星辰-\n我是您最喜爱的广播主持人，这里是您上午11点的新闻节目。\n 时间到了，又是一天。\n看来今天的星期四会是个晴天，天空中有一些云朵。\n在经历了连续的暴风雨之后，这样的天气真是令人愉快。\n\n就像过去几周一样，战争仍在持续，从目前的情况来看，我们看不到战争很快结束的迹象。\n事实上，奥尔德雷德的新工厂只是在火上浇油。\n仿佛大火还不够猛烈似的。\n城市正在燃烧，而燃烧的原因是什么呢？\n肯定不是为了烤干树枝和棉花糖……\n不过，我也有好消息要告诉您。\n有人谈论着一个远离战争的安全之地。\n一个可以躲藏的地方，直到这场噩梦结束。\n一个可以居住的地方。\n德梅特里卡的穹顶。\n\n时间不多了，我还有更多内容要报道，以填补您日常工作的空白。\n请继续收听，感谢您收听\n-跨越星辰-
