Apparatus MK3\n\nPlugs for apparatus sockets.\nTitanium top.\nTitanium base.\nCrystal pulser and crystal holder.\nHighly dense glass.\n\nThis device might be able to harness the power of the crystaline cubes and use them to power ships, facilities and possibly entire cities.\n\nThe pulser will ensure the crystals are perpetually generating vast amounts of electricity at all times.\n\nThe titanium in combination with this kind of glass will prevent it from overheating and destroying itself on the spot.=设施电源MK3\n\n用于设施电源插座的插头。\n顶部采用钛材料。\n底部采用钛材料。\n水晶脉冲器与水晶支架。\n高密度玻璃材质。\n\n该设备或许能够利用水晶立方体的能量，为船只、设施，甚至整个城市提供动力。\n\n脉冲器将确保水晶持续不断地产生大量电力。\n\n钛材料与这种玻璃材质的结合，能够防止设备过热并造成自身损坏。
