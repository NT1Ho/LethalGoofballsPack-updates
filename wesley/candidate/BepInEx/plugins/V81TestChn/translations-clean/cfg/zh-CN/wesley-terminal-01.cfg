Ah well would you look at that\nI think I got this thing workin\nMight serve me some entertainment in these caves\nIt's not easy spendin all day down here\nCan't see the sun, can't read the time\nIt's actually quite sad\nDiggin for these shiny crystals and I don't even kno what they are\nThey were sendin birds in earlier\nHaven't heard from them since\nAh well\nBetter get back to work=哟，你瞧。\n这玩意儿好像真让我修好了。\n窝在洞里，多少有个解闷的了。\n整天待在底下可不好受。\n看不见太阳，也不知道几点。\n想想还挺惨。\n天天挖这些亮晶晶的东西，连它们是什么都不知道。\n先前他们往里送了些鸟。\n后来就再没动静了。\n唉，算了。\n回去干活吧。
And every night he went back to that spot.\nHoping to see that light again.\nBut he didn't. For days he waited, hoping.\nAnd it wasn't until the seventh day when he heard it again. He saw it in the sky.\nHe was certain it was real.\nThe message was equally vague. Now he was determined.\n\nHe explained it to his friends. It took a lot of convincing to get them to join him for one night.\n\nAnd that night it was there. They all saw it. Moving across the sky.\nYet only he was able to hear it.\nBut they believed him.\nThey weren't sure what to make of it.\nThey all sat there, pondering, wondering.\nWhat or... who is this?=此后每晚，他都回到那个地方，盼着再看见那道光。可他一直没看见。一连几天，他只是等着、盼着。直到第七天，他才又听见它，看见它划过天空。\n他确信它是真的。传来的消息还是一样含糊，可这回他下定了决心。\n\n他把这一切告诉朋友们，费了好大劲才说动他们陪他守上一夜。\n\n那一夜，它来了。大家都看见它从天空划过，却只有他能听见。可这一次他们信了他。没人知道该如何解释，一群人就这么坐着，想了又想。\n这究竟是什么……又或是，谁？
