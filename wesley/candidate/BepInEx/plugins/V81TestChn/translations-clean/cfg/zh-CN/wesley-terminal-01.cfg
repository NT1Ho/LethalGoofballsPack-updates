He threatened me! That- that- heartless-\n\nI don’t know why I ever felt compelled to try and convince that man of anything, knowing he is capable of such evil.\nHe is not a man reasoned with.\n\nCosmocos has the most beautiful terrain I’ve ever laid eyes upon.\nSuch gorgeous, diverse plant life.\nA heart.\nI really feel as though it has what the more spritual of us would call a soul.\nAnd the Captain has a gall to suggest that Cosmocos has tricked me, somehow.\n\nPerhaps these feelings are not my own.\nPerhaps these are feelings Cosmocos has imposed upon me.\n\nRegardless of whether these emotions are pre-disposed or not - with everyone ounce of my being, I feel certain that Cosmocos is a thinking, feeling moon.\nIsn’t that incredible?\nShouldn’t that be protected?\n\nI’m going to be the one to protect it, if no one else will.\n\nWhatever the cost.\nIf I fail, at worst, they’ll send me back to March for proper proceedings.\nMy knowledge is too valuable.\n\nAnd then I’ll make it my mission to come back.\nIf they succeed in doing this to Cosmocos...\nI’ll see it done that it is made whole again.\n\nCunningham, signing off.=他威胁我！那个、那个没心没肺的——\n\n明知道他能做出那种恶事，我为什么还非要试着说服他？那个人根本不讲道理。\n\n科斯莫科斯的地貌是我见过最美的，植物繁盛，千姿百态。它有一颗心。我真的觉得，它有我们当中那些有信仰的人所说的“灵魂”。船长居然有脸说，科斯莫科斯不知怎么骗了我。\n\n也许这些感受并不属于我。也许它们是科斯莫科斯强加给我的。\n\n可无论这份情感从何而来，我全心全意相信，科斯莫科斯是一颗会思考、有感情的卫星。这还不够不可思议吗？它难道不值得保护吗？\n\n如果没人肯，我就自己保护它。\n\n不惜一切。就算失败，最坏也只是被押回 March 接受正式审理。我掌握的知识太宝贵，他们舍不得。\n\n到时候，我就把重返这里当作自己的使命。如果他们真要对科斯莫科斯下手……我一定会让它恢复完整。\n\n坎宁安，通话完毕。
He. Is. Watching.\nHe has his eye.. directly.. upon you.\nYou disturbed his temple.. and he is angry.\n\nI have been trying to rid this universe of this being for longer than you can imagine.\n\nThe things you see.. \nThey aren't real, ignore them.\nHe is trying to melt your mind.\n\nI can help you, if you help me.\n\nBring these seeds to their designated celestial bodies.\nIt will distract him for long enough.\n\nOnce that's done.. return..\nAnd I will make my move.\n\nSometimes a sacrifice is needed.. to banish evil.. for good.=他。在。看。\n他的目光……正落在……你身上。\n你惊扰了他的神殿……他动怒了。\n\n我一直想把这个东西从宇宙中除去，时间久到你无法想象。\n\n你看见的那些东西……\n都不是真的，别理会。\n他想摧毁你的心智。\n\n只要你帮我，我就能帮你。\n\n把这些种子带到各自指定的天体上。\n这样就能让他分心，给我争取足够的时间。\n\n办完之后……回来……\n我就可以动手了。\n\n有时，唯有献祭……才能永远……驱除邪恶。
Hello employee.\nYou may not know me but.. I know you.\nSince the death of your soulmate you have been taken by grief, you have felt like your existence is once again pointless.\nYou continuously put yourself in danger, inching closer and closer to the end each time.\nLets see if you have what it takes to survive, if you still appreciate the body that has been given to you.\nIn front of you there hangs a Decimator, an explosive device that will destroy everything in this room when the timer hits zero.\nThere also hangs another employee, you may know him as he has been in your crew for months, he will be the key to your freedom, All you need to do is remove the right wire with the knife you now posses.\nBut beware, if he dies by your hands, neither of you will make it out alive.\nLive or die, make your choice.=员工，你好。\n你也许不认识我，可我……认识你。\n自从挚爱死后，你一直被悲痛吞没，觉得自己的存在又一次失去了意义。你一再以身犯险，每一次都离终点更近一步。\n让我们看看，你还有没有本事活下去，还珍不珍惜这副赐给你的身体。\n你面前吊着一台毁灭装置。计时器归零时，房间里的一切都会炸毁。\n旁边还吊着另一名员工。也许你认识他，他已经和你同船几个月了。他是你重获自由的关键。你只需用手中那把刀，取下正确的那根线。\n但要当心：要是他死在你手里，你们两个谁也别想活着出去。\n生，还是死？选吧。
Hello everyone, this is your favourite radio host from\n-Across the stars-\nIt is currently 11:13 AM and it looks like the weather is quite upset today but lets not have that ruin our Mondays ey.\n\nUnfortunately I have to be the bearer of bad news, we have had reports of an attack that happened on the Grand Capitol of Calist. As of now we are unsure of the severity of the attack but I'm sure we'll find out soon enough.\n\nIn some other news the nuclear power plants in the C sector of Fission have been closed down due to a failure to meet safety regulations.\nThank god for that,\nThat place sounded like you'd be glowing green from simply being there.\nThere have also been constructions sightings on the moon of Oldred, which is interesting considering that's about the single worst place to build literally anything.\n\nEither way, that's it for me.\nI've got some classic hits lined up for your usual monday madness so stay tuned. Thank you for listening to\n-Across The Stars-=大家好，这里是《穿越星辰》，又和你们最喜欢的主持人见面啦。\n现在是上午 11:13。看起来今天天公不作美，可别让它毁了我们的星期一，对吧？\n\n很遗憾，得给大家带来一个坏消息。据报，卡利斯特大首都遭到袭击。眼下还不清楚袭击有多严重，不过相信很快就会有消息。\n\n再看另一条新闻：裂变星 C 区的核电站因未达到安全标准而关停。谢天谢地，那地方听起来光是站一会儿，人就会开始冒绿光。另有人目击奥尔德雷德卫星上出现施工活动。这就有意思了，真要建点什么，恐怕再没有比那里更糟的地方。\n\n好了，我就说到这儿。照例给大家的疯狂星期一备好了几首经典金曲，别换台。感谢收听《穿越星辰》。
Hello everyone, you are listening to Across the Stars and I’d like to apologize for my absence in the past few days.\n\nTimes are tough.\n\nIt’s currently 2:23 pm and I’m sorry to announce that this will be my final broadcast.\n\nMy sources are dwindling and finding any good news has been like searching a needle in a haystack.\nThere’s just not much good out there anymore.\n..It’s all terrible.\n\nFor those still out there. I’m telling you to leave.\nFind the closest to you and go.\nGo to the Domes.\nThere will be salvation on Demetrica.\n\nI will be going too.\n\nThe Triton military has been growing in numbers and they’ll launch a system wide attack to conquer our side of the region.\nAnd I don’t want anyone to experience the horrors of what that will bring.\nSo I’m telling you again, leave.\nRun for the Domes.\n\nWe will be going dark.\nThis was Across the Stars.\nThank you.\n\nI’ll see you there.=大家好，你正在收听《穿越星辰》。过去几天没能播出，我想向大家道歉。\n\n日子很艰难。\n\n现在是下午 2:23。很遗憾，这是我最后一次广播。\n\n消息来源越来越少，要找到一条好消息，简直像大海捞针。外头已经没多少好事了。……全是噩耗。\n\n还在听的人，我要你们离开。找离你最近的那一处，快走。去穹顶。德梅特里卡还有生路。\n\n我也会去。\n\n特里同军队不断增兵，即将向整个星系发动进攻，征服我们所在的这片区域。我不希望任何人亲眼见到随之而来的惨状。所以我再说一次：离开这里。往穹顶跑。\n\n我们要停播了。这里曾是《穿越星辰》。谢谢你们。\n\n我们在那里见。
Hi, it's harry with mighty mortor!\nIt's like a mortar but it's a mortor!\nMordor wouldn't have fallen with this mortar!\n\nRegular defences don't work well.\nPeople get their houses broken into all the time!\nBurglars, thieves, your neighbors, nosy aunts, crazy exes, giants bees, nintendo, not even I will be able to break in with this thing in your backyard!\n\nNormal mortars can only fire one shell at the time.\nThis thing can launch 30 of them within the blink of an eye!\nBet nobody expects that on their weather forecast!\n\nYou can put it in your backyard, put it on your car!\nAttach it to your wallet, you'll spot it from afar!\nYou can even use it to collect water when you get deserted on an uninhabited island!\n\nMortors mortar, only 300.000 per piece!\nBut if you call now with in the next 20 minutes, we'll give you a second one absolutely free!=嗨，我是哈里！来看看这门威猛迫击炮！迫击炮叫 mortar，我这门偏叫 mortor！有这门炮，连魔多都不会失守！\n\n一般的防盗设施可不管用。天天都有人家里被闯！可要是后院架着它，管他是破门贼、小偷、邻居、爱管闲事的姨妈、发疯的前任、巨蜂，还是任天堂，连我自己都别想进来！\n\n普通迫击炮一次只能打一发。这玩意儿一眨眼能轰出30发！我赌天气预报没报过这种炮弹雨！\n\n后院能放，车上能装！挂在钱包上，隔老远都看得见！流落荒岛时，拿它接水都成！\n\nMortor 迫击炮，每门只要300.000！接下来20分钟内来电订购，第二门白送！
