# Wesley / 简体中文。仅精确匹配显示文本。
------------------\nCrew: 14\nOrigin: Trite\nDestination: Dreck\n------------------\nMission Details\n------------------\nWorkers are rebelling, 22 men are present and armed. 9 have already been taken care of by the local guards. They're about to reach the control room. Triton lives have been lost.\n------------------\nTerminate the rebelling forces and await further instructions.\n------------------=------------------\n船员：14\n起源：特赖特\n目的地：德雷克\n------------------\n任务详情\n------------------\n工人在造反, 22 男人在场并携带武器。 9 当地警卫已经照顾好。他们马上就要到控制室了Triton人命已经丧失\n------------------\n终止叛乱势力，等待进一步指示。\n------------------
-12th of July 2349-\nOkay where do I start. First of all. There have been several near death experiences.\nThe quota is starting to get dangerously high. And Berry has seemingly cought the flu.\n\nIt's been rough.\n\nLast thing we expected was to enter an insane asylum back on Vow. I don't think I ever want to go back there.\nBerry stayed for ship duty this time due him getting sick. So me, Kate and Arnold went in. The place looked haunted.\nIt might as well have been because I swear I saw a trash can move. Arnold also claims to have seen a dark figure briefly staring at him when he opened a door before it vanished.\nTerrifying.\nThat wasn't the strangest part though. We heart Kate scream a few hallways down.. and when we got there, Blood was still freshly dripping from the ceiling. Guts, pieces of skin and hair littered the floor.\nWe were horrified. We thought it was maybe a mine or.. something worse. Either way we were in shock.\nToo scared to continue we retreated back to the entrance. But when we got there, there she was completely fine carrying a hairdryer and rubik's cube.\nArnold immediately ran over. Which I guess confirms my little theory heh.\nNevertheless it was unusual to say the least. I'm going to have nightmares about that for a while.\n\nBut then I knew one thing for certain. I want to leave.\nThey felt the same way.\nThe ship would only route to a few company issued moons. None are really suitable for hiding out.\nArnold suggested to mess with the terminal to see if we could get it to route us somewhere else.\nWhen Kate inspected it though she said doing that would trigger some form of protocol which would send us flying into space...\nI fear then we might have discovered what happens if we don't make quota.\nIf true the company is much worse than we initially thought.\n\nHowever Berry actually made a pretty good remark, he asked if we could take one of the ships back on Repress.\nWe had enough credits to go there soo.. now were here.\nNone of the ships were really usuable except for this one older model.\nKate said she can patch it up given enough time, it's missing a few components but we might be able to get those during the next quota.\nThere is hope.=-12th of July 2349-\n好吧,我从哪里开始。首先,我说...已有几例近乎死亡的经历。\n配额开始变得危险地高。而且Berry似乎感染了流感。\n\n一直很艰难\n\n我们最没想到的是，竟然又回到了Vow上的精神病院。我觉得我永远都不想再回到那里了。\n由于贝里生病了，这次他留下来负责船只的维护工作。所以我和凯特以及阿诺德一起去了那里。那个地方看起来很阴森。\n可能正是因为如此，我发誓我确实看到有一个垃圾桶移动了。阿诺德还声称，当他打开一扇门时，有一个黑暗的身影短暂地盯着他，然后就消失了。\n吓人。\n不过，最奇怪的并不是这些。我们在几条走廊的另一端听到了凯特的尖叫声……当我们赶到那里时，血仍然从天花板上滴下来。地板上有内脏、皮肤碎片和头发。\n我们感到非常震惊。我们以为那可能是一颗地雷，或者……更糟糕的东西。无论如何，我们都处于极度震惊的状态。\n我们吓得不敢继续前进，只好退回到入口处。但当我们到达那里时，她完好无损地站在那里，手里还拿着吹风机和魔方。\n阿诺德立刻跑了过去。我想这证实了我的小理论，呵呵。\n不过，至少可以说，这种行为很不寻常。我接下来一段时间都会为此做噩梦。\n\n但我知道一件事是肯定的。我想离开。\n他们也有同样的感受。\n船只驶往几家公司发月球没有一个真的适合躲起来。\n阿诺德建议尝试操控终端，看看是否能让它引导我们前往其他地方。\n当凯特检查它时，她说这样做会引发某种协议，会导致我们被抛入太空……\n因此，我担心我们可能已经发现了如果不完成配额会发生什么情况。\n如果这是真的，那这家公司的状况比我们最初想象的要糟糕得多。\n\n不过，Berry确实提出了一个相当不错的建议，他询问我们是否可以将其中一艘飞船重新用于压制行动。\n我们原本有足够的资金去那里，所以现在我们来到了这里。\n除了这个旧型号的船外,没有一艘是真正可用的。\n凯特表示，只要给予足够的时间，她可以修复这个问题。虽然缺少一些部件，但我们在下一个配额期间或许能够补上这些部件。\n有希望。
-16th of July 2349-\nI have unfortunate news.\nYesterday we lost Berry..\n\nWe went to Rend and everyone headed out to look for bolts, screws, metal plating, toy robots for wiring we could use on the new ship.\nOf course we left Berry in the ship, he was still sick but starting to recover.\nHe was great at communicating during ship duty, even though he felt like shit he was still able to crack a few jokes over the walkie.\nI remember him asking *What's the best animal to bring to the battlefield... DUCK!!* They were so.. bad.. so bad they became funny again.\nWe knew something was up when it went silent though.\nAnd sure enough when we headed back I faintly saw him roam around in the snow covered in red goop wearing a comedy mask, like he was possessed.\nNone of us had the strength to put him down if he was still in there so we just.. left.\nI'll miss him.\n\nKate and Arnold are now properly together, happy for them. They fit each other well.\nStress is starting to take me though.. I feel a constant pressure as we're racing against the clock.\nMakes me feel dizzy at times.\n\nThe ship is almost ready luckily. Good thing because our quota is reaching scarily high.\nEspecially with Berry gone we're not even sure if we'll make it past the next one.\nWe just need a control panel. None of us have seen one just yet but tomorrow we're making a visit to Titan, hopefully we'll find one there.\nWe have already planned out a place to escape to.\nThere's this city on a moon far from this region. 495-Risk. Fitting name I suppose.\nOnce we get there we'll be safe. Hopefully.\nI'll write again when we return for hopefully our final visit.=-16th of July 2349-\n我有一些不幸的消息。\n昨天我们失去了Berry。\n\n我们去了Rend，大家都出去寻找螺栓、螺丝、金属板以及可以用来组装新船的玩具机器人。\n当然，我们把贝里留在了船上，他仍然生病，但开始康复了。\n他在舰船值班期间很擅长沟通，尽管他感觉很糟糕，但仍然能够通过对讲机讲些笑话来缓解气氛。\n我记得他问过：“带什么动物上战场最合适……鸭子！！！”他们当时实在太……糟糕了，以至于这成了个有趣的笑话。\n不过，当它变得安静时，我们就知道有些事情不对劲了。\n果然，当我们返回时，我隐约看到他穿着红色面纱，在雪地里徘徊，还戴着喜剧面具，看起来就像被什么附身了一样。\n如果他还留在里面，我们都没有力气把他放倒，所以我们就……离开了。\n我会想念他的。\n\n凯特和阿诺德现在终于在一起了，真为他们感到高兴。他们很合得来。\n不过，压力开始让我感到不适了……在和时间赛跑的过程中，我始终处于一种持续的压力之下。\n有时这会让我感到头晕。\n\n船已经快准备好了因为我们的配额已经达到了惊人的高。\n尤其是贝里离开后，我们甚至不确定是否还能熬过下一个阶段。\n我们只需要一个控制面板。我们还没有见过这样的设备，但明天我们会去泰坦星，希望能在那里找到。\n我们已经规划好了一个可以逃往的地方。\n有一个城市位于远离这个地区的月球上。495-风险。我想这个名字很合适。\n一旦我们到了那里 我们就安全了希望是这样\n当我们再次来访时，我会再次写下这些内容，希望这是我们的最后一次访问。
-9th of July 2349-\nI found a couple floppy discs in a cabinet somewhere in the building.\nAllows me to put down my thoughts using the big computer in the hangar.\n\nFirst I'll introduce myself, hi, I'm Dan. It's been 7 days since I started working for the company.\nLucky for me I was greeted by a set of kind faces. They sort of explained to me how things work around here.\nWe're a crew of 4, there's Berry, he's pretty funny and good at keeping our spirits up. Then there's Kate who has been here the longest, used to be a mechanic for a failed business.\nAnd there's Arnold. Big guy, pretty smart as well, we call him engine man cause he's always the one carrying the engines hehe.\n(I'm also fairly certain Kate and Arnold have a thing for each other)\nDon't tell them I wrote that, they'll kill me\n\nIt's been rough. We've been going from building to building day by day delivering all our Junk to the company building.\nCan't say I'm quite fond of the place. The company desk reeks, it's nasty. And not only that but the building itself is quite imposing.\nI don't understand why but it feels like it wants to crush me like I'm an ant in the kitchen.\n\nSame with this place, though I feel a bit more safe here, its less menacing. Less like I'm being watched constantly.\nI'm not the only one who feels that way.\nArnold hates the company building too. He's always said there's something off about it.\nMaybe he's on to something.\n\nEither way Kate just radioed in that it's getting late. I better get going.\nI'll write more when I can.=-9th of July 2349-\n我在公司大楼的某个柜子里发现了一对软盘。\n现在我可以借助机库里的大型计算机来暂时放下我的思绪了。\n\n首先，让我自我介绍一下，嗨，我是丹。自从我开始在公司工作已经过去了7天。\n幸运的是，我遇到了一群友善的人。他们向我解释了这里的一切运作方式。\n我们是一队人 4贝瑞,他很有趣 而且很擅长保持我们的精神然后还有凯特,他在这里 最长的,曾经是机械师 一个失败的业务。\n还有阿诺德。他是个大块头，也很聪明，我们叫他“发动机男”，因为他总是负责搬运发动机，哈哈。\n（我敢肯定凯特和阿诺德之间有一些暧昧关系）\n别告诉他们是我写的这些话，他们会杀我的。\n\n这段时间很辛苦。我们日复一日地从一个建筑楼到另一个建筑楼，把所有的垃圾送到公司大楼里。\n说实话，我不太喜欢这个地方。公司办公室的气味很糟糕。而且，这座建筑本身也相当令人望而生畏。\n我不明白为什么，但感觉它就像要把我像厨房里的蚂蚁一样碾碎。\n\n同样，虽然在这里我感觉稍微安全一些，但也不那么令人感到威胁。不像在这里时，总感觉有人在监视着我。\n不止我一个人有这种感觉。\n阿诺德也很讨厌公司大楼。他总是说这里有些不对劲。\n也许他是对的。\n\n不管怎样，凯特刚刚通过无线电通知时间已经很晚了。我得走了。\n等我有时间了，我会再写一些东西。
