MANNEQUINS\n\nSigurd's danger level: 95%\n\nScientific name: Vir plascterus\nThe Vir plascterus is a silent threat which thrives among many non-hostile copies of itself. They are often referred to as mannequins due to their striking resemblance to clothing store mannequins and their outer body being made of plastic.\nProper research has not been conducted and therefore it is unclear what they actually are. \nIt is theorised that these are similar creations to the Vir colligerus, otherwise known as Coil-heads.\n\nAt the very least they have many behavioral traits in common, they only move when not observed by anything living. It has been noted that on occasion they abandon this rule and dash for the target. Unlike the Coil-head they do not make any noise while moving around. It is highly advised to stay vigilant of your surroundings as one might run up from behind.=人体模型\n\n西格德的危险等级：95%\n\n学名：Vir plascterus\n这种生物悄无声息，混在众多长相相同、却没有敌意的模型中间。它们外壳由塑料构成，与服装店的模特极为相似，因此常被称为人体模型。\n目前尚无充分研究，无法确定它们究竟是什么。\n一种推测认为，它们与弹簧头（Vir colligerus）是同类造物。\n\n至少两者有许多相似的习性：通常只有在没有任何活物注视时才移动。不过，偶尔也有人见到人体模型打破这条规律，径直冲向目标。与弹簧头不同，它们移动时没有一点声音。务必留意四周，它可能正从背后跑来。
MISSING\n\nIf you see him please call:\n353-536-145-2-2\n\nHendry was wearing a blue t-shirt, blue jeans and black sneakers.\n\nHe was last seen playing with his fellow peers outside the Filitrios Toy Store near distinctly red bushes.=寻人启事\n\n如有线索，请致电：\n353-536-145-2-2\n\n亨德里失踪时穿着蓝色 T 恤、蓝色牛仔裤和黑色运动鞋。\n\n最后一次有人看见他，是在菲利特里奥斯玩具店外。他正和同伴们在一丛醒目的红色灌木旁玩耍。
Many years ago in a time long passed.\nA young man stood between the flowers in a ray of moonlight.\nObserving the stars, taking in the beauty that is the universe.\nHe did this every night. And every time it was breathtaking.\nBut on one fateful night it was different.\nHe saw a bright light in the sky.\nA comet?, A creature? no, something more.\nHe described it as a soul or a presence..\n And it spoke.\nThere between the flowers he listened to this voice from deep space.\nIt sounded powerful, but vague. A message he couldn't understand.\nYet he was inspired. He had to hear this again.\nHe had to tell everyone he knew.\nThis was something special.=很久很久以前，一个年轻人站在花丛间，月光落在他身上。他仰望群星，欣赏宇宙之美。每夜如此，每一次仍叫人屏息。\n可在命中注定的那一晚，一切都不同了。他看见天空中有一道亮光。一颗彗星？一个生灵？不，还不止于此。按他的说法，那像是灵魂，又像某种存在……而且，它开口了。\n他就站在花间，聆听来自深空的声音。那声音强大，却含糊，传递着他无法理解的消息。可他深受触动。他一定要再听一次，一定要告诉所有认识的人。\n那绝非寻常之物。
