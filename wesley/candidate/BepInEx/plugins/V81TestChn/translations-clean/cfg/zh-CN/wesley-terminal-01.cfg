It has been a strange past few days.\nOf course that is the usual around here but some things appear off.\nStranger than usual.\n\nWe noticed that the water filters have been burnt through.\nThere was a substantial buildup in acidir material in the pipelines.\nLuckilly no leakages but it is strange how none of us noticed the.. acidic taste in the water supply.\nWe have been drinking this for days.=过去这几天真是奇怪。\n当然，这里的情况通常都是这样，但有些事情看起来不太对劲。\n比平常更加奇怪。\n\n我们注意到水过滤器已经被烧穿了。\n管道中的酸性物质也大量积聚。\n幸运的是没有泄漏，但奇怪的是，我们都没有注意到供水中的酸味。\n我们已经喝了好几天这种水了。
It has not been a couple hours since I entered this abandoned mineshaft. And already something feels off. If not for the missing equipment in the supply area, it would be the distant rumbling giving me a sense of unease. Maybe I should just shrug it off and get what I came here for.\nA large deposit of various crystals is what attracted me to this place.\nI've been short on money and I'm slowly heading into debt. If I'm able to find what I'm looking for it could really help me out. I don't know how deep they are but I know for certain that they're there.\nThere's no mineshaft here for nothing.\nI'm heading in deeper.=自从我进入这个废弃的矿井以来，已经过去几个小时了。但总觉得有些不对劲。如果不是因为补给区里缺少装备，那遥远的轰鸣声也会让我感到不安。也许我应该忽略这些感觉，去做我来到这里的目的。\n各种晶体的大量堆积正是吸引我来到这个地方的原因。\n我的钱已经不多了，而且债务也在逐渐增加。如果我能找到我要的东西，那真的会对我有很大帮助。我不知道矿井有多深，但我确信那些东西就在那里。\n这里没有无缘无故存在的矿井。\n我将继续深入下去。
It strikes a fear in me, rooted deep within my ocean of thought. He kept asking about it and I don't even have the full answer. They have a way of operating that makes them invisible to not only the surface but even those who'd consider themselves high up the ladder. But I know they're here. They're everywhere. Stare long enough into the abyss, you start seeing things. Holes in reality. Fissures in logic. Yet you shake your head and pretend it was your eyes playing tricks on you. I see them. Companies appear more and more frequent like an infestation of roaches from influential businessmen to lower class entrepreneurs. All with history, documents, lives. Processed within our systems. It's usual. Standard practice. Nothing strange about it. But you look closer. You read their documents. Everything seems normal until.. you get a glimpse. A date mismatched. A name changed. Manlike mistakes, for sure. Look deeper, closer. Children without proof of birth. Deposits from companies that only registered days later. Trades between people who don't even know each other. Fissures. I've never observed them, my superiors have never seen them. Only stories.. irregularities. Seemingly random. But I think they are connected. They're here. And I believe they're scared. There is something here that scares them, threatens them. Makes them slip up. And if something is here that scares the corporate entity that’s able to twist our reality no matter where in our galaxy. You best know I sleep with one eye open.=深深植根于我思想深处的恐惧他不停地问 我甚至没有完整的答案他们有一种操作方式 使得它们不仅看不见表面 也看不到那些自认为高在梯子上的人但我知道他们来了到处都是潜伏到深渊里的时间足够长 你开始看到一些东西现实中的洞。逻辑上的迷信但你却摇头假装是眼睛在耍你我看到他们了公司似乎越来越频繁地出现,就像有影响力的商人的蟑螂对低级企业家的侵袭。所有的历史,文件,生命。在我们系统内部处理的平时都是这样标准做法。没有什么奇怪的。但你看近点你读过他们的文件一切看起来都正常 直到... 你一眼就能看见日期不匹配 。名字变了当然是像男人的错误仔细看 再近点没有出生证明的儿童。仅在几天后登记的公司存款。人之间的交易 谁甚至不知道对方。信条我从没看过,我的上司也没见过只有故事... 不合规定似乎随机的。但我认为它们有联系他们来了我相信他们很害怕这里有些东西吓唬他们 威胁他们让他们滑倒了如果有什么东西在这里 吓唬公司实体 它能够扭曲我们的现实 不管我们在银河系中在哪里你最清楚我睡着时只睁一只眼
It was a while ago when I first felt it. I felt it for a friends. But for the three years I was around. I was too scared to say something. And now we talk no longer.\nI often wonder what life would be had I been more courageous.\nBut now I have felt it once more.\nSomeone else. Another friend.\nBut it is different this time. While I send it from my side. I know I will never receive it.\nWhile to some it is a blessing. To me it is a curse. I feel the weight on my chest whenever I mention it.\nI feel like I am driving them away whenever I send it.\nI am lost.\nAnd I do not know the way.=那是很久以前的事了，当时我第一次感受到了那种感觉。那是一种对朋友的思念。但在那三年的时间里，我太害怕了，不敢说出口。现在，我们已经不再交谈了。\n我经常想，如果当时我更有勇气的话，生活会怎样呢？\n但现在，我又一次感受到了那种感觉。\n是另一个人，另一个朋友。\n但这次不同了。虽然我把它从自己的角度发送出去，但我知道我永远无法得到回应。\n对有些人来说，这是一种祝福，对我而言，却是一种诅咒。每当提到这件事时，我就会感到胸口的重量。\n每次发送出去时，我都感觉自己在把他们推开。\n我迷失了方向。\n我不知道该往哪里走。
It worked. My disguise was enough to make them believe I was with them. I have been assigned a room in the guard chambers.\nThis facility is much larger.\nThe clouds seem to end before the building does.\nThe conditions are not better either. I feel for the workers.\nIn some places it's warm enough to melt skin off muscle.\n\nNow I'm here I will need to get accustomed to the standard procedures. I will also need to study the building a bit more before I can start planning anything.\nNot to mention figure out where Jareck is among all of this.\nBut I will have my vengeance.\nOne way or another.=成功了。我的伪装足以让他们相信我和他们在一起。我被分配到了警卫室的一个房间。\n该设施规模要大得多。\n云层似乎在建筑物之前就消失了。\n这些条件也没有改善。我很同情那些工人。\n在有些地方,它很温暖 足以融化肌肉上的皮肤\n\n现在我需要适应这些标准流程。在开始规划任何事情之前，我还需要进一步了解这座建筑。\n不要提及如何在所有这些信息中找出Jareck的位置。\n我会实现我的复仇。\n无论如何。
It's all real! Every time!.\nThe city sinks but at midnight, the city returns.\nBut all who die stay dead.\n\nI am the only one left!\nThe hallway is flooding again.\n\nI might not make it this time.\nTime is repeating...=一切都是真实的！每次都是如此。\n城市沉没,但午夜时分,城市返回。\n但是所有死去的人 都会死\n\n我是唯一剩下的人！\n走廊又发生了积水现象。\n\n我可能无法这次成功。\n时间在不断循环……
It's been 3 weeks since I was sent to the quarry.\nMy life in Filtra was nice, peaceful. My job was simple but it payed well.\nNow I find myself in this shithole.. Doomed to work until my back snaps in two.\nDoomed to never see my wife and child ever again. I don't even know if they're alive.\nBut I know who took them. I know the name of the man who burst into our home and ripped our family apart.\nThe man who gave the order. The man who beat me into submission.\nThe invastion of Filitrios left a scar on my mind. That scar has a name.\nJareck Hill.\nI will come for you.=自从我被送到采石场以来，已经过去了3周了。\n在Filtra的生活很美好，很平静。我的工作很简单，但报酬不错。\n现在我却身处这个糟糕的地方……注定要工作到背疼断掉为止。\n注定再也见不到我的妻子和孩子了。我甚至不知道他们是否还活着。\n但我知道是谁带走了他们。我知道那个闯入我们家、摧毁我们家庭的男人的名字。\n那个下达命令的男人。那个把我打得屈服的男人。\nFilitrios的罪行在我的心中留下了伤痕。那个伤痕有个名字。\nJareck Hill。\n我会来找你的。
It's been a strange past few weeks, we've heard that luitenant commander Cunningham was send back to 61 after going mad. \nI have no idea what that's all about. \nBut they've started extracting this.. plant I think it was? \nAnyways. \nResearch has been going steady, these illuminating eyes don't seem to have a purpose.. \nwell.. \nnot a definitive one at least. \nEver since the Cunningham incident it appears to be more.. agressive almost. \nIt's certainly strange. \nI wonder if the- \n\n*Rumbling*\n\nWhat is happening? \nEverything is bright outside?? \n\n*More rumbling*\n\nWoah. \nWhat's happening.\n\n*Agressive rumbling*\n\nThere's a what coming at us?! \n\n*The sounds of a moon ripping itself apart.*\n\nWe have been hit. \nWorse. \nWe have been separated from Cosmocos. \nI..\nI need to go..=过去几周很奇怪,我们听说 指挥官坎宁安被送回 61 在发疯之后 \n我不知道这是怎么回事。 \n但他们已经开始提取这个... 我想是植物吗? \n不管怎样。 \n研究一直在稳步进行, 这些启发人心的眼睛似乎没有目的。 \n嗯.. . . \n至少不是一个确定性的。 \n自从坎宁安事件以来 似乎更... ... \n这当然很奇怪。 \n我想知道,如果 - \n\n*轰鸣声*\n\n发生什么事了? \n外面一切都亮吗? \n\n*更多的隆隆声*\n\n哇 \n发生什么事了?\n\n* 逐渐的隆隆声*\n\n有什么东西来对付我们吗? \n\n*月亮自我撕裂的声音*\n\n我们被击中了 \n更糟糕。 \n我们和宇宙号已经分开了 \nI.. . .\n我得走了..
It's been a while now since my arrival at this facility.\nI've been closely paying attention to the projects here.\nI was told that moon is THE home of the Lacerta-glomerorum.\nOr.. spore lizards in the common tongue.\nThis is where they are most frequently hunted.\nHowever, in the labs they seem to be working on cloning technology.\nThe cloning of creatures to be more specific.\nI feel it's right up my alley.\nProfessor Harrington, over and out.=自从我来到这个设施已经有一段时间了。\n我一直密切关注着这里的项目。\n有人告诉我，月亮是Lacerta-glomerorum的家园。\n或者用通俗的说法，就是孢子蜥蜴的栖息地。\n它们在这里被猎杀的频率最高。\n不过，在实验室里，他们似乎正在研究克隆技术。\n更具体地说，就是克隆生物。\n我觉得这正是我擅长的事情。\n哈林顿教授，再见。
It's been two weeks since my last letter.\nI am getting a little more homesick every day.\n\nI have noticed that a lot of newer employee get fired relatively quickly..\nMost of them don't even last a month!\n\nA co-worker of mine got fired as well.\nI haven't from him since :(\n\nWe also had to divert a rescue ship from Infernis to Gratar due to some accident there.\n\nBut I've got good news!\nThey agreed to let me go home at the end of this month!!!\n\nFrom: employee-254 To [home address]=已经两周没有收到你的来信了。\n每天我都会更加想念家。\n\n我注意到很多新员工被解雇的速度相当快……\n他们大多数甚至撑不过一个月！\n\n我的一个同事也被解雇了。\n自从那以后我就再也没有他的消息了 :(\n\n我们还不得不因为因弗尼斯发生的一些事故，将一艘救援船改道送往格拉塔尔。\n\n不过我有好消息！\n他们同意在这个月底让我回家了！！！\n\n发讯人:雇员-254 将 to [home address]
It's my fifth day of work.\n\nMy apartment is surprisingly comfortable.\nIt's a long walk to the 'space bus' as I've started to call it.\n\nThere are also these strange noises below the ice, my co-worker speculated that it's the ice shifting.\n\nI have asked if I could go home and see the kids at least once a week but they refused to let me go.\nProbably because I am still in my proving period...\n\nBut I'll keep trying!\nI can't wait to see you again!\n\nFrom: employee-254 To [home address]=这是我工作的第五天。\n\n我的公寓出乎意料地舒适。\n走到“太空巴士”那里需要走很长的路，我开始这么称呼它了。\n\n冰层下面还有这些奇怪的声音，我的同事推测是冰层在移动。\n\n我请求可以每周至少回家一次看望孩子们，但他们拒绝让我离开。\n可能是因为我仍处于证明期……\n\n但我会继续尝试！\n迫不及待想再次见到你！\n\n发讯人:雇员-254 将 to [home address]
It's my last day before I can visit you.\n\nMost of my co-workers got fired and it's getting a little quiet around here lately.\n\nAnd there is definitely something below the ice, you can hear the growling in the deeper parts of the building.\n\nBut whatever it is they seem to keep it under control, maybe they are feeding it somehow.\n\nAnyway, they will take me home at the end of the day.\nI can't wait to see you!\nI've missed you!\n\nFrom: employee-254 To [home address]=这是我在能够拜访你之前的最后一天。\n\n我的大多数同事都被解雇了，最近这里有点冷清。\n\n而且冰层下面肯定有什么东西，在建筑的深处能听到咆哮声。\n\n不过他们似乎控制得很好，也许他们以某种方式在喂养它。\n\n不管怎样，今天结束时他们会送我回家。\n我迫不及待想见到你！\n我真的很想念你！\n\n发讯人:雇员-254 将 to [home address]
It's my second day working at this vault.\n\nThe work is quite boring if I'm bring honest.\nBut we are allowed to take breaks regularly!!\n\nThe people seem super nice as well, they make me feel at home.\n\nI like it here.\n\nBut I do miss you and I hope to see you and the kids soon :)\n\nFrom: employee-254 To [home address]=这是我在这家金库工作的第二天。\n\n如果我是诚实的人，工作其实相当无聊。\n但是，我们被允许定期休息！！\n\n这里的人看起来也非常友善，让我有宾至如归的感觉。\n\n我喜欢这里。\n\n但我确实很想念你，希望很快能见到你和孩子们 :)\n\n发讯人:雇员-254 将 to [home address]
It’s been over one hundred and twenty days since my meeting on Polarus and the devastating Catalyst of this Grand War we now find ourselves in.\nAs we had foreseen, the military of Titan was not pleased with the initial attack and launched a counter attack within the same week.\nIt only escalated from there..\nHowever,\n\nI’m pleased to report that my family, my wife, and my children have all safely made it to Trite, as promised..\nI do hope the trip wasn’t as bad as mine have been.\nThey were moved in secrecy for their own protection. So unfortunately I am unable to contact them..\nAt least that’s what I was told when I tried my hardest to do so.\nMaybe it’s for the better.\n\nI have only a few more missions to complete before I can visit my family again.\nSpeaking of which,\n\nThe teams we send out to Cosmocos have vanished..\nAnd..\nSo has the entire moon.\nIt vanished from the radars entirely. Which seems impossible and yet is true.\n\nThis happened only days after they found something.. incredible that would’ve been the key to our victory.\nAll that returned was a confused and mad Commander Cunningham who supposedly tried to sabotage the operations. And a large amount of so-called “Cosmic Growth”.\nAnyways,\n\nI have been tasked to guide a group of scientists here with the creation of manipulative weapons using the aforementioned Cosmic Growth.\nThey’ll grow into the brain of whoever it will be applied to and we’ll supposedly have full control over them.\nThink of it as a mind controlling parasite.\nIt will hopefully aid us in this war.\nThen once that’s done I will vanish in the night for my next task.\n\nAgent G- Signing off.=自从我关于波拉鲁斯以及这场大战争中的毁灭性催化剂的会议以来，已经过去了一百二十多天。\n正如我们所预料的，泰坦的军队对最初的攻击并不满意，于是在同一周内发起了反击。\n事情从那时起就愈演愈烈了。\n不过，\n\n我很高兴地报告，我的家人、妻子和孩子们都如承诺的那样安全抵达了特赖特。\n我真心希望这次旅行没有像我这次那样糟糕。\n为了自身的安全，他们被秘密地转移了。因此，很遗憾，我无法与他们取得联系。\n至少，当我尽力这么做的时候，别人是这么告诉我的。\n也许这样更好。\n\n在我能够再次探望家人之前，我还有几项任务需要完成。\n顺便说一下，\n\n我们派往Cosmocos的团队已经消失了..\n还有...\n整个月亮都是如此。\n它完全从雷达上消失了。这似乎不可能，但实际上确实如此。\n\n这发生在他们发现某件事的几天后……那件事本可以成为我们胜利的关键，真是不可思议。\n最终得到的只是一个混乱且疯狂的指挥官坎宁安，据说他试图破坏行动。此外，还发现了大量的所谓“宇宙增长物”。\n无论如何，\n\n我被任务指派来指导一群科学家，共同利用上述的“宇宙生长”技术来制造操控性武器。\n它们将成为任何应用于它们的系统的核心，而我们似乎可以完全控制它们。\n将其视为一种能够控制思维的营养体。\n希望这能帮助我们在这场战争中取得胜利。\n完成这些后，我将在夜晚消失，去执行我的下一个任务。\n\n特工G - 签名。
JESTER\n\nSigurd's danger level: 90% Get out o fthere before it goes APE!! You cant hide from it, just evacuate. i think it goes back in its box if everyone stays outside long enough\n\nScientific name: INSANEUS THINGUS\nTHERE'S NO FREAKING SCIENTIFIC RECORD! good luck, you know as much as us. we just call it the jester=杰斯特\n\n西格德的危险等级：90% 在它爆炸之前赶紧离开！！你无法躲开它，只能撤离。我觉得只要大家都待在室外足够长的时间，它就会回到盒子里。\n\n科学名称：INSANEUS THINGUS\n根本就没有什么科学记录！祝你好运，你知道的和我们一样多。我们只是称它为“小丑”
