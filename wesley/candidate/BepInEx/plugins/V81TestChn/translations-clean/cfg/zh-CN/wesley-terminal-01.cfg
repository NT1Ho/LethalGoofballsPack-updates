My existence, my being, my mortality are comming thougts which cycle through my head more often than not.\nMy future, my past, my heart's desires. And the choices made which brought me here. Could I have done something different I wonder. Could I have been happy.\n\nI offered to have my heart cut out. In the ceremony of this rotation.\nI hope to be placed among the others. I hope to be happy. I hope to be unalone.\nI hope for my soul to be at peace within it. And may I be found.\nI ask, please, take care of me.=我的存在、我的生命、我的 mortality 这些想法时常在我脑海中浮现。\n我的未来、我的过去、我心中的愿望。以及那些让我来到这里的选择。我是否可以做些不同的事情呢？我是否能够幸福呢？\n\n我提议在轮回的仪式中切除我的心。\n我希望能与其他人同在。我希望能幸福。我希望能不再孤独。\n我希望我的灵魂能得到安宁。愿我能被找到。\n我请求，请照顾好我。
Not weeks ago we had a big breakthrough with one of my theories.\nNow yesterday our front door was broken though.\nAfter having celebrated our victory in the cloning of spore lizards we weren't expecting to see the military show up to investigate our lab.\nBut after learning about our success in the cloning department, we had a.. less than peaceful discussion as they had brought it to their higher ranks who now demand to use it to clone.. people.. for the war of course.\nThis leaves us with a choice, we either give them an unlimited army.. or we destroy all our progress.\n\nI have to take my leave.\nProfessor Harrington, over and out.=并非几周前，我们的理论取得了重大突破。\n然而昨天，我们的前门被打破了。\n在成功克隆孢子蜥蜴后，我们本以为不会遇到军队来调查我们的实验室。\n但得知我们在克隆方面的成功之后，我们不得不进行一场……并不平静的讨论。因为军方高层得知这一消息后，要求利用这项技术来克隆人类，当然是为了战争的需要。\n现在我们面临一个选择：要么给他们提供一支无限制数量的军队，要么毁掉我们所有的成果。\n\n我得离开这里了。\n哈林顿教授，再见。
