As per usual, I leave a note.\nI'm only getting closer to completing my task.\nThe cancer that grows within me makes me feel weaker by the day.\nBut I must continue.\nHe will heal me.\n\nI must say I enjoyed the peace that Dreck brought me.\nIt was cold yet empty. It felt like nothing was there to bother me.\nI felt alone but.. the good kind.\nI really.. needed that.\nThe war had quite a toll on me. Even if it's all I know.\nI mean. I was practically created by it.\nJust like many others.\n\n... I should get the fuel I came here for and proceed to Faith.=照例留张便条。离完成任务又近了一步。体内的肿瘤不断长大，我一天比一天虚弱。但我得继续。他会治好我。\n\n得说一句，我很喜欢德雷克的安静。这里又冷又空，仿佛没有什么会来打扰我。我是孤身一人，可……是那种自在的孤独。我真的……需要它。战争把我折磨得够呛，尽管我从来只知道战争。说起来，我几乎就是它造出来的。还有许多人也是。\n\n……我该拿上来这里要找的燃料，继续前往信仰星了。
Asteroid-13=小行星-13（Asteroid-13）
At the behest of Captain Donahue, I am to record my own personal experiences here on Cosmocos.\n\nI was first to stumble upon this strange extraterrestrial lifeform.\nIt seemed to be, upon first glance, perhaps a plant, or something akin to coral - something like Diploria.\nBut when I placed my hand upon it, even through my suit, I felt - I felt as if incredible knowledge was poured into me.\nKnowledge of things vastly unfamiliar and unbelievably alien to me - but also of things familiar, things around me that others had been educated on, but I’d never had the opportunity to learn.\nIt was incredible, exhilarating.\nUnlike anything I’ve ever experienced.\n\nBut the most exhilarating thing of all was this unusual connection I feel that I’ve fostered with this thing.\nThis being.\nIn a sense, it felt...like a person, is perhaps the best way to put it, in terms we are capable of understanding.\nLike Cosmocos isn’t just a moon.\nLike it’s...a huge, alien life-form, sitting here in space with its own incredible ecosystem.\n\nBizarre as it may be, I can say with confidence that I could feel what seemed to be a rush of emotions from Cosmocos itself.\nI still feel it now, in truth.\nWhich sounds like insanity, doesn’t it? But it was beautiful.\nLike a rush of warmth, kindness, generosity.\nI really feel like Cosmocos wants to teach us things.\nLike it wants to help us grow and nurture us.\n\nThe Captain has commanded that no one is to interact with this celestial brain aside from himself for our own safety.\nI do feel slightly disheartened by this, as I was hoping to commune with it again.\n\nI have so much more to say.\nIt’ll be difficult to record all of this knowledge I’ve been gifted with in a comprehensible format on these recorders, but I’ll do my best over the next few cycles.\n\nLieutenant Commander Cunningham, signing off.=奉唐纳休船长之命，我要记录自己在科斯莫科斯的亲身经历。\n\n我是第一个撞见那个奇异外星生命的人。乍一看，它似乎是株植物，又有点像珊瑚，像脑纹珊瑚。可我把手放上去时，隔着防护服我都能感觉到……仿佛无比丰沛的知识正涌入我的脑海。有的是我闻所未闻、陌生得难以置信的事；也有就在身边、别人学过而我却从没机会了解的东西。太不可思议了，让人兴奋不已。我从未有过这样的经历。\n\n但最令我激动的，是我觉得自己和这个东西，和这个生命，建立了一种奇特的联系。要用我们能理解的话来说，它……像一个人。科斯莫科斯似乎不只是一颗卫星，它像一个栖居在太空中的庞大外星生命，身上有着不可思议的生态系统。\n\n这听起来古怪，可我确信，自己感到了一阵情绪，从科斯莫科斯本身涌来。说真的，我现在还能感觉到。是不是像疯话？可那感觉多么美好。一阵暖意，满是善意和慷慨。我真的觉得科斯莫科斯想教我们一些东西，想呵护我们，帮助我们成长。\n\n船长已经下令，为了大家的安全，除他以外，谁都不能再和这个天体大脑接触。我很失落，本来还盼着再与它交流一次。\n\n我还有好多话想说。要用这些记录仪把获赠的知识记下来，还得让人能看懂，并不容易。不过接下来几个周期，我会尽力。\n\n坎宁安少校，通话完毕。
Atlantica=Atlantica（亚特兰蒂卡）
Autopsy=Autopsy（尸检报告）
BIOHXNV7 Experiment=BIOHXNV7 Experiment（BIO-HXNV7 实验）
Backwater Gunkfish\n\nSigurd's danger level: 0% but these little goopy goblins wont leave me ALONE\n\nScientific name: Infectum linteum\n\nThe Backwater Gunkfish is a type of Gunkfish of the family Mobulidae. Unlike the other types of Gunkfish, the Backwater Gunkfish spends most of its time on land. It can inhabit any damp, warm space where a water source is present. Its body is fat, flat, squishy and gelatinous, the width of a doormat. Its tail, slightly harder than the rest of its soft body, can range from 2-3 feet in length. When stressed, its tail is often curled up over its head to position for firing mucus or to shake and rattle as a deterrent.\n\nThe Backwater Gunkfish feeds off organic material on surfaces, and for this reason, it is found most often around polluted water, swamps, or dirty sewers. When frightened, the Gunkfish can use an opening in its tail to release a burst of a thick, green mucus mixed with saliva to defend itself; the Backwater Gunkfish keeps an especially large "reserve" for emergency situations and can squirt multiple times. When needed, it uses part of this extra reserve to excrete from its body, increasing its mobility on land.\n\nThe Backwater Gunkfish is harmless and is considered a natural cleaner of its preferred environments. Its mucus is a disinfectant; though it is not safe or healthy to consume, it is unlikely to cause major harm if it enters the body through the eyes or nose. Its smell is often described as a mix of vinegar and lard, and it is slightly warm when freshly excreted.\n\nThough not directly harmful, the Backwater Gunkfish is often considered a notorious pest to water treatment facilities and petroleum refineries. The gunkfish itself is evasive, capable of fitting itself into very small holes and pipes, and its mucus is arduous to remove once it has hardened, forming a substance comparable to ice. For all these reasons, the Backwater Gunkfish has lead to many accidents and should be taken seriously. Today, pest removal services are well-accustomed to safe Gunkfish removal and relocation operations, and there are many affordable options if you believe there is one in the area. The best way to prevent a Gunkfish infestation is to keep your environment clean and dry and to close off any access to standing water.=死水泥鱼\n\n西格德的危险等级：0%，可这群黏糊糊的小鬼就是不肯放过我！\n\n学名：Infectum linteum\n\n死水泥鱼属于蝠鲼科。与其他黏液鱼不同，它大部分时间生活在陆地上，任何温暖潮湿且有水源的地方都能栖身。身体肥厚扁平，柔软如胶，宽度相当于一张门垫。尾巴比躯体稍硬，长约 2–3 英尺。受惊时常把尾巴卷到头顶，准备喷射黏液，也会摇动尾巴发出响声以示威吓。\n\n它靠啃食物体表面的有机物为生，因此常见于污水、沼泽和肮脏的下水道。受到惊吓时，它会从尾部开口喷出混有唾液的浓稠绿色黏液来自卫。它为紧急情况储备的黏液格外多，可以连续喷射数次。必要时也会将部分黏液排到体表，帮助自己在陆上移动。\n\n这种鱼本身无害，还能清洁栖息地。它的黏液有消毒作用，虽不宜食用，但即便进入眼鼻，通常也不会造成严重伤害。刚排出的黏液略带温热，据说闻起来像醋混着猪油。\n\n尽管没有直接危害，它却是污水处理厂和炼油厂出了名的祸害。鱼身灵活，能钻进极小的孔洞和管道；黏液一旦硬化，便形成类似冰的物质，很难清除。这些特性已经酿成多起事故，不容轻视。如今，专业除害人员已能熟练地安全捕捉并转移黏液鱼。如果怀疑附近有鱼，可以找到不少收费实惠的服务。预防成灾的最好办法是保持环境清洁干燥，封住所有通往积水处的入口。
Bracken -- AKA flower man!\n\nit was flower man, you can't say othrwise! i wanted to find his body .You were the cowards\n\nScientific name: Rapax-folium\nThere is debate on the genus to which the Bracken belongs. It is a bipedal vertebrate with skin the color and texture of a red beat. The name was coined for what appear to be leaves protruding from its upper spine. The purpose of these is believed to be for intimidation, however not much is known about the specifics of bracken behaviour due to its illusiveness and low population.\n\nWe know a little from accounts by wildlife experts who have encountered it. is a lone hunter with high intelligence. Its behavior can seem aloof; it exhibits high aggression even when unprovoked, yet it quickly backs off when confronted. However, brackens are known to up their hostility when cornered or simply watched for a long time. For this reason it's recommended to keep an eye on it but not to stare it down. No specimens have been collected dead or alive. It's theorized that upon death their bodies undergo a rapid decomposition process which is unique from other large animals.=布拉肯（黑影），又叫花人！\n明明就是花人，别跟我犟！我本来想去找他的尸体。胆小鬼是你们！\n\n学名：Rapax-folium\n布拉肯究竟属于哪个属，尚有争议。它是双足脊椎动物，皮肤的颜色和质感酷似红甜菜。它的俗名来自上段脊柱伸出的叶片状结构，据推测有威吓作用。由于行踪隐秘、数量稀少，人们对其行为所知不多。\n从曾与之遭遇的野生动物专家口中，我们得知它智力很高，独自狩猎。它看似冷淡，即使不受挑衅也可能表现出强烈攻击性，但在正面遭遇时又会迅速退开。被逼入绝境或遭人长时间注视时，它的敌意会加重。因此，最好时刻留意它，却别和它一直对视。至今没有采集到活体或尸体标本。据推测，布拉肯死后会迅速分解，有别于其他大型动物。
Businesscard=Businesscard（名片）
CORPSE CRAWLER\n\nScientific name: Cerec-retoma\nThe Cerec-retoma is a device made up of a hollowed rotting corpse stuffed with machinery using parts of the nervous system as internal wiring to reduce the cost of creation. The body itself seems to serve no other purpose other than to keep the components together. Hence how it has earned the name “Corpse crawler”.\n\nIt walks around through the means of four hydraulic legs which use various liquids drained from the body among which are spinal fluid and blood rather than water. The extraction happens shortly after the insertion which as a side effect severs the spine and the head from the body in a very short, yet painful method.\n\nThe body is riddled with spikes protruding through the flesh and skin and can be used as a defensive method against anything that seeks to attack or destroy it.\n\nThese devices were likely designed and produced by the Trite Control Corporation as the first appearances were sighted on celestial bodies surrounding the fractured remains of the Triton Empire shortly after the creation of the corporation in 2249. There they acted as remotely controlled scouts being able to search and explore through the cameras hidden within the head of the device. The usage of a human body with their organs as components meant that these scouts are purposefully temporary. The rot of the corpse making it near impossible to understand what its original internals may have looked like before deactivation.\nLater models discovered around 2296 no longer possessed the ability of being remotely controlled but were instead fully autonomous.\n\nThe corpse crawler bears a striking resemblance to the Areck-hetoma, otherwise known as the Arachnohead which was likely an inspiration for the design.=爬行尸怪\n\n学名：Cerec-retoma\n这种装置由一具掏空的腐尸和塞入其中的机械组成。制造者为降低成本，利用部分神经系统充当内部线路。尸身本身似乎只起到固定零件的作用，“爬行尸怪”一名由此而来。\n\n它靠四条液压腿行走，驱动腿部的不是水，而是从身体抽取的血液、脑脊液等体液。机械装入不久便开始抽液；这一过程会使脊柱和头部与身体分离，短暂，却极为痛苦。\n\n尖刺遍布全身，穿透皮肉向外伸出，可用来抵挡试图攻击或摧毁它的东西。\n\n这些装置很可能由特赖特控制公司设计制造。公司于 2249 年成立，不久后，人们首次在环绕特里同帝国残部的天体上发现它们。当时它们充当遥控侦察兵，操作者通过藏在头内的摄像头进行搜索和勘察。用人体和器官做零件，意味着这种侦察兵从设计之初就不打算长期使用。尸体会腐烂，设备停用后几乎没人能还原内部原先的模样。\n约在 2296 年发现的后期型号已不再接受遥控，改为完全自主行动。\n\n爬行尸怪与蛛首怪（Areck-hetoma）极为相似，其设计很可能受过后者启发。
Captains Log. Log 3. Location, Acidir.\n\nI’ve hardly had a moment to record my findings.\nNavigating Etern was a nightmare with those bloody Nutcrackers roaming the desert.\nWe were down to a crew of 26 after that veritable screw-up - and I’m afraid things have only gotten worse since we arrived on Acidir.\nBut first - my findings on Etern.\n\nA silver lining - I recovered a log from the corpse of a scientist pertaining to Cosmocos’ location.\nIt seems that he created some sort of AI for the sole purpose of retrieving these coordinates.\nUnfortunately, the AI seems to malfunction while reciting them...\n\nCertainly, it’s some system error in the mad-man’s machine.\nMost definitely.\nBut...for some reason, it feels to me that Cosmocos...does not want to be found.\nAnd yet the more I recall, the more intense my desire becomes to try and locate it.\nTo see the way the walls of crystal shimmer in the light of those strange bulbs that hang from the trees...\n\nI know that my dreary mind couldn’t create things of such beauty of its own accord.\nI’m far too boring for that.\n\nNevertheless.\nI left a log with the rising map on Atlantica, and I’ve discovered that the 6th letter of the coordinates is a lowercase Z. Zee. Zed.\n\nWe’ll soon be leaving Acidir.\n5 went mad after coming into contact with the Crescent of Curses and decided to go for a swim with the local pond life.\n3 ran screaming into the woods, and it’s been hours since we saw them.\nThe ship will fly soon when the conditions become too dangerous.\nIf they’re not back before then…\n\nOur next destination is Polarus.\nThis was the closest moon to Cosmocos before it’s disappearance.\nWe’ll stop by Gratar in lieu of the ramblings in the scientists log.\n\nThis is Cunningham. Signing off.=船长日志 3。地点：阿西迪尔。\n\n我几乎抽不出时间记录调查结果。埃特恩的沙漠里到处游荡着那些该死的胡桃夹子，想找条路简直是噩梦。\n那次行动彻底搞砸了，船员只剩 26 人。到了阿西迪尔，情况恐怕更糟。不过先说说在埃特恩的发现。\n\n坏消息里总算有件好事：我从一位科学家的遗体上找到一份日志，里面提到了科斯莫科斯的位置。\n他似乎专门造了个 AI 来取得这组坐标。可惜那 AI 一念坐标就像出了故障……\n\n一定是那疯子的机器出了点系统错误。\n肯定是。\n可……不知为什么，我总觉得科斯莫科斯……不想让人找到。可我想起的事越多，就越渴望找到它。想再看一眼树间垂下的奇异灯泡，看水晶墙在那光里闪烁……\n\n我这颗乏味的脑袋，绝不可能凭空想出那么美的东西。我可没那本事。\n\n回到正题。\n我在亚特兰蒂卡升起的地图旁留了一份日志。我已经查明：坐标的第 6 个字母是小写 z。Zee。Zed。\n\n我们很快就要离开阿西迪尔。5 个人接触诅咒新月后发了疯，决定跳进池塘，和里面的生物一起游泳。还有 3 个人尖叫着冲进树林，已经几个小时没见到他们了。环境一旦危险到不能再待，飞船就会起飞。要是他们到那时还没回来……\n\n下一站是波拉鲁斯。科斯莫科斯消失前，它是离那里最近的卫星。考虑到那科学家在日志里的那番胡话，我们会在格拉塔尔停一下。\n\n我是坎宁安，通话完毕。
Captains Log. Log 4. Location, Polarus.\n\nFirst, my findings on Gratar.\nWe managed to trick that conniving AI into revealing the final letter to us.\nIt’s P.\nIt’s a capital P.\nIt’s smart - but we were smarter.\nThe ones of us that survived, anyway.\nI think it realised we were deceiving it and it decimated 10 of us.\nWe’re down to a pathetic team of 8, half of whom are too disturbed to carry on their duties as usual.\n\nOur ‘skeleton crew’ might be real skeletons, soon enough.\nBut I only need them to help pilot the ship for the last leg of our journey.\n\nBecause I’ve found it.\nI know where Cosmocos is.\n\n...I wonder if it felt the same loss that I felt...when I left?\nLike my heart was wrenched from my chest.\nTo get to know something...some- someone…so magnificent...to know that you leave them blighted...wounded and sick...\n\nI’ll be with you soon, old friend.\nI’ll heal you.\nI only need the opportunity.\nAnd then we’ll be one again.\n\nCunningham. Signing off.=船长日志 4。地点：波拉鲁斯。\n\n先说格拉塔尔的收获。我们设法骗过那个诡计多端的 AI，让它说出了最后一个字母。\n是 P。\n大写 P。\n它很聪明，可我们更胜一筹。至少活下来的这几个算是吧。\n我想它发现我们在骗它，一下子就杀了我们 10 个人。现在只剩可怜的 8 个，其中一半受惊太重，已经没法照常当值了。\n\n如今只有几副骨头撑着这条船，再过不久，没准真就剩骨头了。不过我只需要他们帮忙把最后这一程开完。\n\n因为我找到了。\n我知道科斯莫科斯在哪儿了。\n\n……我离开时，它是不是也和我一样，觉得失去了什么……\n像是心被硬生生从胸口扯了出去。能认识一个如此美好的东西……一位……一个如此美好的朋友，却明知自己留下的是一个遭到摧残、伤病交加的它……\n\n老朋友，我很快就来陪你。\n我会治好你。\n我只需要一个机会。\n到那时，我们就又能合为一体。\n\n坎宁安，通话完毕。
Captain’s Log. Log 2. Location, Atlantica.\n\nAfter visiting Etern, we diverted course to Atlantica due to reports of ‘unnatural occurrences’ having taken place here.\nAnd I’m glad we did - most excitingly, we have discovered a map of Cosmocos on this small island not far from the mainland.\nWe lost a crewmate trying to swim over and resorted to using jetpacks instead.\nAnd despite our loss...seeing some evidence of Cosmocos was exhilarating.\nIt solidifies in my mind that these weren’t just delusions of mine, it was real.\nI was there.\nI saw it.\nI’m familiar with this terrain.\nI may not be able to recall with perfect clarity, but it is knowledge I possess.\nOr...possessed.\n\nAlso of significant note - a body was discovered on Etern along with a log not dissimilar to mine.\nI believe we’ve obtained another piece of the puzzle, so to speak.\nI’ve etched it into the map.\nPlease excuse my haste, Atlantica is sinking and I must return to the ship.\n\nOur course is set for Acidir.\nWith one less crewmate, we should be vigilant.\n\nCunningham, signing off.=船长日志 2。地点：亚特兰蒂卡。\n\n离开埃特恩后，我们因这里有“反常现象”的报告改航亚特兰蒂卡。幸好来了：离大陆不远的一座小岛上，竟有一幅科斯莫科斯的地图。\n一位船员试图游过去时丧生，我们只得改用喷气背包。尽管失去了同伴……见到科斯莫科斯确实存在的证据，还是让我激动不已。\n我越发确信那不是我的臆想。它是真的。\n我去过那里。\n我亲眼见过。\n我熟悉那片地形。我的记忆也许不够清晰，但我是知道的。\n或者说……曾经知道。\n\n还有一件大事：在埃特恩发现了一具尸体，旁边有份和我的颇相似的日志。可以说，我们又拼上了一块拼图。我把它刻进了地图。\n恕我写得仓促，亚特兰蒂卡正在下沉，我必须赶回飞船。\n\n航向已设为阿西迪尔。我们少了一名船员，千万要保持警惕。\n\n坎宁安，通话完毕。
Captain’s log. Log 1. Location: Infernis.\n\nNo information on the whereabouts of Cosmocos after its unusual disappearance.\n32 of us on the ground and found nothing of note.\nWe will be leaving shortly due to dangerous conditions...as if no one could have seen that coming.\nStepping off the ship was like walking into an oven.\nI am still struggling to recall any of the knowledge I possessed on Cosmocos - but there is something still urging me to continue in my pursuits.\n\nNext point of interest is the so-called Death Labs on Etern.\nNot an exciting prospect for the team, but they will manage.\n\nAfter that...Acidir.\nTo investigate the fantastically named Crescent of Curses.\nHoping it leads us in the direction of it’s true origins.\n\nThis is Cunningham, signing off.=船长日志 1。地点：因弗尼斯。\n\n自从科斯莫科斯离奇消失，至今仍没有它的下落。我们 32 人下到地面，一无所获。\n环境太危险，很快就得走……说得好像谁都没料到一样。一出船舱就像走进烤炉。\n我仍想不起自己在科斯莫科斯时掌握的那些知识，可总有个念头催我继续追寻。\n\n下一个要查的地方是埃特恩上所谓的“死亡实验室”。这可不是什么能让队员们高兴的差事，不过他们应付得来。\n\n再之后……阿西迪尔。去调查那件名字起得煞有介事的“诅咒新月”。希望能借此查出它究竟来自哪里。\n\n我是坎宁安，通话完毕。
