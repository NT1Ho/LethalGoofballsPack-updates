ARACHNOHEAD\n\nSigurd's danger level: 35%\n\nScientific name: Areck-hetoma\nAreck-hetoma or the “Arachnohead” are vicious devices designed to ensnare their targets with the intent to kill. \nIt is theorised their original intended purpose was to act as a security device and scare off intruders when spotted. However it is certain their current purpose is to only act as a trap, an artefact of the war predating the quiet age.\n\nTheir appearance is that of a teddy bear with a head resembling that of a baby doll. The teddy bear exterior is only there to conceal the machinery of the Arachnohead itself in its dormant state. Upon activation it starts a search for any nearby entities internally listed as enemy targets. When a target is spotted it leaves its teddy enclosure and uses a set of four hydraulic legs to chase its target.\nThe internals of the head are often very haphazardly wired and it is not uncommon for the wrong wires to cross during an impact of blunt force causing a short circuit leading to a possibly explosive reaction. While it is a flaw in the original design, it was never resolved due to it being a very favourable feature when used in times of conflict.=ARACHNOHEAD\r\n\r\nSigurd的危险等级：35%\r\n\r\n科学名称：Areck-hetoma\r\nAreck-hetoma或“Arachnohead”是一种设计用来捕捉目标、意图致死的凶恶装置。 \r\n据推测，它们最初的用途是作为安全装置，在被发现时吓退入侵者。然而，可以确定的是，它们现在的用途仅仅是作为陷阱，这是战争时期遗留下来的产物。\r\n\r\n它们的外形像一只泰迪熊，头部则类似婴儿娃娃。泰迪熊的外表只是用来隐藏休眠状态下的Arachnohead内部机械装置。一旦激活，它会开始搜索任何被列为敌对目标的附近实体。当发现目标时，它会离开泰迪熊的壳，并使用四条液压腿来追捕目标。\r\nArachnohead的头部内部电路往往布局混乱，因此在受到钝力撞击时，错误的电线可能会交叉导致短路，从而引发爆炸反应。虽然这是原始设计中的一个缺陷，但由于在冲突时期这一特性非常实用，因此从未被修复。
