Crystaline cube\n\nThese cubic shaped anomalies are covelant crystals.\nPossibly made from a chemical reaction.\n\nSlightly luminescent.\n\nHighly volatile. Known to release rays of electricity and another unidentified material.\n\nNot many cleavage planes. Mainly in cubic formations.\nAppears to generate piezoelectricity even when slightly moved.\n\nInteresting patern.\n\nCrystalised Chisel\n\nThe item was left near a cube. After a few electric pulses from the cube it turned crystalline.\n\nDoes not appear to have the same properties as the cube.\nUseless.\n\n\nThese cubes could be used for highly efficient power sources if their volatile abilities are harnessed in a proper way.\n\nDo not get close or leave any items near them.\nEspecially while charged.=水晶立方体\n\n这些立方形异常物是共价晶体，可能由化学反应形成。\n\n略微发光。\n\n极不稳定。已知会放出电弧及另一种未识别的物质。\n\n解理面不多，多呈立方形。即使略微移动，也似乎会产生压电效应。\n\n花纹很有意思。\n\n结晶的凿子\n\n凿子被留在一个立方体旁。立方体发出几次电脉冲后，凿子就结晶了。\n\n似乎并不具备立方体的特性。\n没用。\n\n\n如果能妥善控制这些立方体不稳定的特性，它们就能成为效率极高的能源。\n\n不要靠近，也不要在附近留下任何物品。\n尤其是在它们带电的时候。
