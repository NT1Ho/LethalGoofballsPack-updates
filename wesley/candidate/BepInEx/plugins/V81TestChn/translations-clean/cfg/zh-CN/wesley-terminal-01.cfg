Last night..\nI heard the news..\nThe cities of Trite have been made one with the ground.\nThey bombed almost the entire moon!\nAnd now they are laying waste to whomever survived the attack.\n\nI send out many MANY messages to ask for my family.\nThe emperor has refused to answer. How weird I thought.\nBut ooooh those left on Trite sure answered!\n\nThey told me there were no reports of anyone arriving from Calist before or after the Catalyst.\n\nMy family.. my children.. my Maddy.\nThey never even left in the first place.\n\nNo effort was made to even try to get them out of there in time.\nAnd the emperor has been lying to me!\nHe has been lying to me since the very start of this hell!\nI thought he may have had it all planned out but this.. grand war.\nAll that I have done..\nI should never have trusted him.\n\nI am ceasing the operations here.\nAnd I will be moving into my final mission but I won’t be following his plans.\n\nAgent G- Signing off.=昨晚……\n我听到了消息……\nTrite 的城市已被夷为平地。\n他们轰炸了几乎整颗卫星！\n现在，连幸存者都不放过。\n\n我发了一条又一条消息，四处打听家人的下落。\n皇帝拒不回应。我还奇怪这是为什么。\n倒是那些留在 Trite 的人回话了！\n\n他们说，“催化事件”前后，都没有人从 Calist 抵达的记录。\n\n我的家人……我的孩子们……我的麦迪。\n原来他们根本没能离开。\n\n甚至没有人试着及时把他们救出来。\n皇帝一直在骗我！\n从这场噩梦开始，他就一直在骗我！\n我以为他早有安排，可这场……大战。\n我所做的一切……\n我早就不该相信他。\n\n我要停止这里的行动。\n接下来是我的最后一次任务，但我不会再照他的计划行事。\n\n特工 G，通话结束。
