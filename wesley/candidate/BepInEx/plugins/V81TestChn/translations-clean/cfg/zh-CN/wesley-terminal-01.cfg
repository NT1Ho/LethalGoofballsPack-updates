DROOP\n\nSigurd's danger level: uhhhh I dnot know but thsi sou nds horrifyign\n\nScientific name: Vorictus-detoma\n\nThe Vorictus-detoma, garnered the name “Droop” due to its drooping appearance. Its arms, legs and neck are exceptionally long, likely due to the body deformation which happens in the process of a Droop’s creation.\n\nThe Droop is not officially classified as a non-human creature, while it no longer possesses the humanity it once did, it technically is still human. Only with the effects of prolonged exposure to V-Radiation.\n\nV-Radiation is an incredibly rare phenomenon and has previously had very adverse and unexplainable effects on creatures and places, often leading to deformation and destruction. Sightings of V-Radiation were extremely rare up until the Grand war where it was occasionally used to cause mass destruction. However, even by supporters of the use of biological warfare, it was greatly frowned upon due to its cruel and otherworldly effects often rendering places uninhabitable.\n\nWhile there have not been many encounters, the majority of the Droop were likely everyday civilians affected during the war. \nDirect exposure to gamma or beta rays of V-Radiation vaporises the average unprotected human, leaving behind what can only be described as a shadow or a memory where they once were. It is not certain what exactly it is that they leave behind but it is thought to no longer be alive. However there have been rumors of these shadows stalking or moving in the dark.\nWhen exposed to alpha rays of V-Radiation you won’t immediately notice any harmful effects aside from a slight headache or brief dizziness. But from the moment of exposure you have been infected with a unique type of radiation sickness. While it doesn’t break your DNA, it does change it which only becomes noticeable after a few days. Skin might start feeling heavy and organs might move around during a very painful process. If the infected is still alive 13 days past the first exposure, changes start happening to the brain, often noting highly irregular brainwaves. From this point onwards it is only a husk of its former self. While it is on a technical level not death, this is what we consider the moment of death. The person is unrecoverable and the body is deformed to an unrecognisable level where the skin and muscles resemble a droopy obsidian. \n\nThere has not been any research from this point onwards.=DROOP\r\n\r\n西格德的危险等级：呃，我不知道，但这个生物非常可怕。\r\n\r\n科学名称：Vorictus-detoma\r\n\r\nVorictus-detoma因其下垂的外形而得名“Droop”。它的手臂、腿部和颈部异常长，这可能是由于在Droop形成过程中发生的身体变形所致。\r\n\r\nDroop并不被正式归类为非人类生物，虽然它已经不再具有曾经的人性，但从技术上讲它仍然是人类。只有在长时间暴露于V-辐射下时才会发生这种情况。\r\n\r\nV-辐射是一种极其罕见的现象，过去对生物和地点产生了非常恶劣且无法解释的影响，常常导致变形和破坏。直到大战争时期，V-辐射才偶尔被用来造成大规模破坏。然而，即使是生物战的支持者也对其残忍和超自然的影响感到厌恶，因为它常常使地方变得无法居住。\r\n\r\n虽然遭遇Droop的情况不多，但大多数Droop都是战争期间受到影响的普通平民。 \r\n直接暴露于V-辐射的伽马或贝塔射线会摧毁普通未受保护的人类，只留下一个影子或记忆，无法知道他们究竟变成了什么。不过，有传言称这些影子会在黑暗中徘徊或移动。\r\n当暴露于V-辐射的阿尔法射线时，除了轻微的头痛和短暂的头晕外，你不会立即察觉到任何有害影响。但从暴露的那一刻起，你就会感染一种独特的辐射病。虽然它不会破坏你的DNA，但它会改变DNA，这种影响在几天后才会显现出来。皮肤可能会变得沉重，器官也会在非常痛苦的过程中移动。如果感染者在初次暴露后的13天内仍然活着，大脑就会开始发生变化，通常会出现异常的大脑波。从这一点开始，它就只剩下了一具躯壳。虽然从技术上讲还没有死亡，但我们认为这就是死亡的时刻。这个人已经无法恢复，身体也变形到了无法辨认的程度，皮肤和肌肉看起来就像下垂的黑曜石一样。 \r\n\r\n从那时起，就没有任何关于Droop的研究了。
Day 289 - Golden Dagger - Origin: Junic\n\nExperiment-1: Possession\nThe subject was given the dagger and left alone in a room. The subject would not let go of the dagger.\nAfter 15.1 hours the subject started chanting strange words. The subject attempted to murder another employee, during with the subject was executed. The employee fell victim to crossfire.\n\nExperiment-2: Grouping\nThe subject was given the dagger and placed in a room with 3 more subjects. The other subjects attempted to carry the dagger but were unable to.\nAfter 27.4 hours the subject started to chant strange words again. The subject covered their face with their hand and decapitated another subject using the dagger before violently ripping out their organs and drawing a strange symbol on the floor. All surviving subjects except for the wielder were removed from the room. After 34.44 minutes of the subject searching for other subjects, the subject stabbed itself through the mouth upwards into the brain using the dagger.\n\nConclusion: Not Weaponisable=第289天 - 金匕首 - 起源：朱尼克（Junic）\n\n实验-1:拥有\n受试者被给予匕首，并被单独留在房间里。受试者无法放开匕首。\n15.1小时后，受试者开始念叨奇怪的词语。受试者试图杀害另一名员工，最终被处决。那名员工在交火中丧生。\n\n实验-2:分组\n受试者被给予匕首，并与其他3名受试者一起被安置在一个房间里。其他受试者试图携带匕首，但未能成功。\n27.4小时后，受试者再次开始念叨奇怪的词语。受试者用手遮住脸，用匕首砍下另一名受试者的头颅，随后暴力地割下其器官，并在地板上画出一个奇怪的符号。除持刀者外，所有幸存者都被带出房间。在34.44分钟内，受试者寻找其他受试者，最终用匕首刺穿自己的大脑。\n\n结论：不可武器化
Day 374 - Hyper Acid - Origin: Acidir\n\nExperiment-1: Touch\nThe subject's finger was unharmed.\n\nExperiment-2: Spray\nThe subject experienced discomfort but remained healthy.\n\nExperiment-3: Ingest\nThe subject felt slight burning of the throat but remained healthy.\n\nExperiment-4: Dousing\nThe subject lived for a total of 4.68 seconds after being fully drenched. The flesh was fully melted in 8.49 seconds once the subject was fully covered.\nOnly few bones remained.\n\nConclusion: Weaponisable=天天 374 - 超酸-来源:酸性\n\n实验-1：触摸\n受试者的手指没有受到伤害。\n\n实验-2：喷洒\n受试者感到不适，但身体状况良好。\n\n实验-3：摄入\n受试者感到喉咙有轻微的灼烧感，但身体状况良好。\n\n实验-4:使用\n该受试者在被完全浸湿后，总共存活了4.68秒。当受试者全身被水完全覆盖后，其肉体在8.49秒内完全融化。\n仅剩少量骨头。\n\n结论：可武器化
Day 387 - Comedy Mask - Origin: Etern\n\nExperiment-1: Presence\nThe subject was put in a room with a mask for 7.8 hours. The subject claimed to have heard laughs. No further effects noted.\n\nExperiment-2: Wearing\nThe subject entered a zombie like state within 28.78 seconds. The subject was executed.\n\nExperiment-3: Conversion\nTwo subjects were put in a room, one of which converted. The living subject was immedietely attacked and converted. Both were executed.\n\nNOTE\nA secret log was recovered from a body on Etern. It was put into storage area D.\n\nConclusion: Weaponisable=第387天 - 喜剧面具 - 来源：埃特恩（Etern）\n\n实验-1:存在\n实验对象被戴上面具，处于该状态共7.8小时。实验对象声称听到了笑声。无其他明显效果。\n\n实验-2:穿戴\n实验对象在28.78秒内进入僵尸状态。实验对象被处决。\n\n实验-3: 换算\n两名实验对象被放入一个房间，其中一名发生了转化。活着的实验对象立即遭到攻击并转化。两名实验对象均被处决。\n\n备注：\n从埃特恩的一具尸体上发现了一份秘密记录。该记录被存放在D存储区。\n\n结论：具有武器化潜力
Day 394 - Cursed Coin - Origin: Polarus\n\nExperiment-1: Proximity\nThe subject was given the coin. It took 6 hours for the subject to enter insanity. The subject claimed to see a ghostly figure.\nPossible schizophrenia.\n\nNOTE\nSeveral employees died with similar symtoms. Every employee who claimed to see a ghost has died.\n\nAny further experiments with this item are prohibited!\n\nConclusion: Not Weaponisable=第394天 - 被诅咒的硬币 - 来源：波拉鲁斯（Polarus）\n\n实验-1:相近\n实验对象被给予该硬币。实验对象需要6小时才会陷入疯狂状态。实验对象声称看到了一个幽灵般的身影。\n可能患有精神分裂症。\n\n注意：\n几名员工也出现了类似的症状而去世。所有声称看到幽灵的人都有死亡。\n\n禁止对该物品进行任何进一步实验！\n\n结论：无法作为武器使用
Day 402 - BIO HXNV7 - Origin: Cosmocos\n\nExperiment-1: Touch\nUpon touch the subject became very agressive and seemed to slightly deform. The subject was executed before further experiments could be done.\n\nExperiment-2: Isolation\nThe subject was infected with BIO HXNV7 and put into a room. It took 12.24 seconds for the subject to become agressive. It took 15.48 seconds for the subject to deform. The subject's flesh seemed to merge with the walls it touched. Turning into a concrete statue while completely consious. It took 4.23 minutes for the subject to lose thought. At 4.44 minutes the subject was a concrete statue.\n\nNOTE\nBIO HXNV7 OUTBREAK! SEVERAL INFECTED.\nSTARTING SECTOR WIDE DECONTAMINATION.\nDECONTAMINATION LEVEL 5: INCINERATION.\n\nSEVERAL STILL INFECTED, FEW FULLY TRANSFORMED.\nDON'T LOOK AWAY!\nFACILITY WIDE DECONTAMINATION IMMINENT.\nGOODBYE.\n\nConclusion: Highly Weaponisable=第402天 - BIO HXNV7 - 起源：科斯莫科斯（Cosmocos）\n\n实验-1：触摸\n触碰后，实验对象变得非常具有攻击性，并似乎发生了轻微的变形。在进一步实验之前，实验对象被处决了。\n\n实验-2:孤立\n实验对象感染了BIO HXNV7，并被安置在一个房间里。实验对象变得具有攻击性需要12.24秒，发生变形需要15.48秒。实验对象的肉体似乎与它所触碰的墙壁融合在一起，变成了一座混凝土雕像。实验对象失去意识需要4.23分钟。在4.44分钟时，实验对象已经变成了一座混凝土雕像。\n\n注意：\nBIO HXNV7疫情爆发！已有数名感染者。\n正在整个领域范围内进行净化处理。\n净化等级5：焚化处理。\n\n仍有几名感染者，但已完全变形的只有少数。\n切勿视而不见！\n设施范围内的净化处理即将开始。\n再见。\n\n结论：极具武器化潜力
Day 79\nOur team has gone mad. Ever since the flash, our technology seems to be malfunctioning.\nIt is unlikely that we’ll be able to leave anytime soon.\nDay 80\nA few on the team say they are experiencing disorientation and dizziness. Unsure as to why but it appears to be a common factor. I wonder if we’ve been hit with a large surge of radiation. We best figure out what’s wrong with the equipment so we can do a proper evaluation.\nDay 81\nThree of us stumbled into the forest, they said, “the forest is calling to us”. If it weren’t for the fact that we need all hands on deck I would let them get lost. I’ve sent two more of us out to go and look for them.\nDay 82\nNobody turned up, not the three who went missing nor the ones I sent out to find them. Fantastic. Now I am starting to sense it too. Slightly disoriented and there’s this strange feel to my skin.\nI’ve told the rest of the team to keep working on getting the equipment fixed up. I’m heading out to the third facility. It’s not too distant. About 12000 meters north-east from here.\nPerhaps they have answers there.\nDay 83\nMy skin feels strange. My back hurts. It feels like something’s crawling under my shoulderblades. The path seems different from what we mapped out. I dare say I am lost.\nRunning out of ink too.\nDay 84\nEverything hurts. My legs below my knees are shrinking. It’s getting hard to walk. My skin has turned purple and thick. There’s something sticking out my back. Something cursed me, something cursed all of us. I don’t believe I’ll be here for much longer. There’s something very wrong here.\nI think I’ll just sit by this tree. I’ll write more tomorrow.=第 79 天\n我们的人都疯了。那道闪光之后，设备也开始失灵了。\n恐怕短时间内走不了。\n第 80 天\n几名队员说他们头晕，分不清方向。原因不明，但症状很相似。我怀疑我们遭遇了强烈的辐射。得先找出设备的故障，才能好好检查一番。\n第 81 天\n有三个人踉踉跄跄走进树林，说“森林在召唤我们”。要不是急需人手，我真想任由他们迷路。我又派了两个人去找。\n第 82 天\n三名失踪者、两名搜寻者，一个都没回来。好极了。现在连我也感觉到了：有点晕，皮肤的感觉也很奇怪。\n我让剩下的队员继续修设备，自己动身去第三座设施。那里不算太远，就在东北方，大约 12000 米。\n也许那里能找到答案。\n第 83 天\n皮肤感觉不对劲，背也疼，像是有什么在肩胛骨底下爬。这条路和地图上不一样。我想，我迷路了。\n墨水也快用完了。\n第 84 天\n我浑身都疼。膝盖以下的腿正在萎缩，走路越来越难。皮肤变紫，也变厚了。背上有什么东西凸了出来。有什么诅咒了我，诅咒了我们所有人。我大概撑不了多久。这里一定出了大问题。\n我想就在这棵树旁坐一会儿。明天再写。
Destiny=Destiny（天命）
Diary entry 847.\n\nNothing quite remarkable today.\n\n10:30 I woke up and per usual I brushed my teeth, did my hair, changed my clothes and went out for breakfast with the family in the grand hall. Had a laugh with my dad and went back home.\n\n11:40 The cleaners knocked apparently, they should know to use the light by now. How many times would it take for them to remember I can’t hear the knocking.\n\n13:30 We are back out to get lunch. I’ve been practicing art in the meantime. My parents are keen on letting me know it’s a worthless skill to have. They are no fun.\n\n14:05 When we got home the neighbor passed by to update us on the state of the Emperor. He hasn’t been seen for weeks. Granted he’s not likely to leave his palace but he hasn’t been spotted in the windows either.\n\n16:40 I’ve stayed home. There is not much out there to do. My parents went with the neighbor.\n\n18:30 We had dinner in the grand hall. Apparently the Emperor’s absence is a common topic at the moment. I am starting to worry myself if I’m quite honest.\n\n22:10 Watched a scary show with my parents. It’s difficult to understand what’s happening at times but that doesn’t make it less scary. They seemed to enjoy it at least.\n\n\nDiary entry 848.\n\nStrange occurrence on an otherwise regular day.\n\n10:30 I woke up, brushed my teeth, did my hair and went with a slightly different style than usual, hoping someone would notice. I changed clothes and went out for breakfast with the family in the grand hall.\n\n11:30 Yesterday I missed them so today I left the door open so I can see the cleaners arrive when they come and I won’t have to rely on my very functional hearing.\n\n13:30 Lunch time, I’ve worked some more on my art while I waited for time to pass.\n\n15:20 My parents came home for a bit and allowed me to have some sweets. Surprisingly they actually stayed with me until dinner time.\n\n18:30 We went back to the grand hall for dinner. The emperor has not been seen yet. Maybe he’s resting. I’m sure it’s not easy to oversee an entire system.\n\n22:10 That same show as yesterday came on so we watched it together. However in the middle it was interrupted by an emergency broadcast. There wasn’t any imagery nor any subtitles so I’ve no idea what was said. Whatever it was, it seemed to upset my parents, they looked concerned yet.. Relieved. It’s hard to describe. They quickly send me to bed.\n\nI’m sure they’ll tell me what that was tomorrow.\n\n\nDiary entry 849.\nThis isn’t real. I am fairly certain this is a horrible nightmare.\nI will try to write what I saw. I’m fearful.\n\n10:30 I woke up to a cold breeze. I walked over to brush my teeth, make up my hair and change clothes. I found it strange that I couldn’t feel my parents walk around, for a moment I assumed they were off to a neighbor again. Until I stepped out of my room.\n\nThey were there, by the window, hanging from the ceiling. There was an empty noose next to them.\nI haven’t looked at them since.\n12:00 I’ve been sobbing and crying. It’s not just my parents. I haven’t found a single living person. I think it’s everyone.\nI’ve looked out the window in the hallway. And I see more people hanging in the distance.\nI don’t believe this is real.\n\n13:40 I went to an empty apartment on the top floor. I don’t have to see anyone here. I don’t want to see anyone else.\n\n14:44 I felt the emergency bells ringing, it was a deep rumble to my skin which I’ve only felt during tests, I stepped out on the balcony to see what was going on, hoping there would be an answer but there he was. The Emperor. And at least a hundred noblemen all slowly marching out the palace. I screamed hoping for something to happen. Nothing. They kept walking. Nobody even bat an eye. I thought the Emperor would save us. Just like he had done with so many before us. I screamed and begged.\nIt’s hard to write while I’m shaking.\nHe stopped moving in the middle of the plaza. I thought he finally heard my screams but he kneeled and looked up. His mouth moved but it was too far for me to read what he said before he burst into this red mass. I couldn’t move. My body forced me to watch as he erupted into a swarm of tendrils reaching for the ground while he grew into something horrific. The noblemen kept walking and collapsed into him, vanishing into the mass. Last thing I saw before could take control and run was the red mass growing and pulsating.\n\n16:12 I haven't quite calmed down but I’ve at least managed to calm my breathing. This doesn’t feel real. \nI don’t understand what is happening. Or if it even is. The Emperor would never let this happen. This would never happen.\nWe’ve always been happy. I feel dizzy. There is a hole in my mind I cannot fill. It doesn’t make sense. Was it yesterday’s broadcast? What was even said? I wish I could fucking hear.\nIt’s cold here.\nThis must be a nightmare. It’s the only thing that makes sense. I know what they’re like, they’re just like this. They can be the worst reality while feeling completely real. \nThis is the worst reality.\nMy parents would never leave me like this, I know they wouldn’t. And the Emperor, it cannot be real. That must be it. I need to wake up.\nI have to wake up. I have to see mom and dad.=日记条目847。\n\n今天没什么特别的事情发生。\n\n10:30 我醒来后，像往常一样刷牙、梳头发、换衣服，然后和家人一起去大厅吃早餐。和爸爸一起笑了一会儿，之后就回家了。\n\n11:40 清洁人员似乎来过，他们应该知道要使用灯光。他们要记住多少次才能忘记我听不见敲门声呢？\n\n13:30 我们又出去吃午饭了。与此同时，我一直在练习艺术。父母并不喜欢我从事这种毫无价值的技能，他们真让人头疼。\n\n14:05 回到家后，邻居过来告诉我们关于皇帝的情况。他已经好几个星期没被人看到了。虽然他不太可能离开他的宫殿，但也没有人在窗户那里看到他。\n\n16:40 我待在家里。外面没什么事情可做。父母和邻居一起去了。\n\n18:30 我们在大厅吃了晚饭。显然，皇帝的失踪是当前的热门话题。说实话，我开始担心起来。\n\n22:10 和父母一起看了一个恐怖的节目。有时候很难理解节目里发生了什么，但这并不妨碍它看起来很可怕。至少他们似乎很喜欢。\n\n\n日记条目848。\n\n平常的一天却发生了奇怪的事情。\n\n10:30 我醒来后，刷牙、梳头发，然后以一种与平时不同的方式出门，希望有人能注意到。我换好衣服，然后和家人一起去大厅吃早餐。\n\n11:30 昨天我错过了他们，所以今天我把门开着，这样清洁人员来的时候就能看到，而不需要依赖我的听力了。\n\n13:30 到了午餐时间，我在等待时间流逝的同时，继续练习艺术。\n\n15:20 父母回家了一会儿，允许我吃点甜食。令人惊讶的是，他们一直陪着我直到晚餐时间。\n\n18:30 我们回到大厅吃晚饭。皇帝仍然没有被人看到。也许他正在休息。我相信管理整个系统并不容易。\n\n22:10 和昨天一样，节目开始了，我们一起观看。然而在中间，节目被紧急广播中断了。没有画面也没有字幕，所以我不知道说了什么。不管是什么，似乎让父母很不安，他们看起来很担心，但……又松了一口气。很难描述。他们很快让我上床睡觉了。\n\n我相信明天他们会告诉我那是什么。\n\n\n日记条目849。\n这不是真的。我确信这是一场可怕的噩梦。\n我会试着写下我所看到的。我很害怕。\n\n10:30 我醒来时，一阵冷风拂过。我走到窗边刷牙、化妆、换衣服。奇怪的是，我感觉不到父母在房间里走动，有那么一瞬间，我以为他们又去邻居家了。直到我走出房间。\n\n他们就在那里，站在窗边，悬挂在天花板上。旁边有一个空着的绞索。\n从那以后，我就再也没有看过它们了。\n12:00 我一直在哭泣。不只是我的父母。我找不到一个活人。我想每个人都是这样。\n我透过走廊的窗户看外面，看到更远的地方还有更多的人被悬挂着。\n我不相信这是真的。\n\n13:40 我去了顶层的一个空公寓。这里不需要见任何人。我不想见到其他人。\n\n14:44 我感觉到紧急铃声在响，那是一种只有在我做测试时才会感受到的沉闷震动。我走到阳台上，想看看发生了什么，希望会有答案，但皇帝就在那里。至少有上百名贵族正慢慢地走出宫殿。我尖叫着，希望会发生什么。什么也没有。他们继续走着，甚至没有看我一眼。我以为皇帝会拯救我们。就像他以前拯救过许多人一样。我尖叫着，恳求着。\n在我颤抖的时候，很难写字。\n他在广场中央停了下来。我以为他终于听到了我的尖叫，但他跪下来抬头看着我。他的嘴巴动了，但距离太远，我无法读到他说了什么，然后他就变成了这个红色的东西。我无法动弹。我的身体迫使我看着他变成了一群向地面伸出的触手，然后他变成了一个可怕的东西。贵族们继续走着，然后消失在那个红色的东西中。最后我看到的是那个红色的东西正在生长并跳动。\n\n16:12 我还没有完全平静下来，但至少我能够控制自己的呼吸。这感觉不真实。 \n我不明白发生了什么。或者这是不是真的。皇帝永远不会让这种事情发生。这永远不会发生。\n我们一直都很幸福。我感到头晕。我的脑海里有一个无法填补的空洞。这毫无道理。是昨天的广播吗？到底说了什么？我希望我能听到。\n这里很冷。\n这一定是一场噩梦。这是唯一合理的解释。我知道他们是什么样的人，他们就是这样的。他们可以是最糟糕的现实，但感觉却完全真实。 \n这是最糟糕的现实。\n我的父母永远不会这样离开我，我知道他们不会。而皇帝，这不可能是真的。一定是这样。我必须醒来。\n我必须醒来。我必须见到爸爸妈妈。
Donnahue's note=Donnahue's note（多纳休的便条）
