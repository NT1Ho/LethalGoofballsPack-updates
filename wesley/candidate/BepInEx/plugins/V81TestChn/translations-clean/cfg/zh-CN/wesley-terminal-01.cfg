It’s been over one hundred and twenty days since my meeting on Polarus and the devastating Catalyst of this Grand War we now find ourselves in.\nAs we had foreseen, the military of Titan was not pleased with the initial attack and launched a counter attack within the same week.\nIt only escalated from there..\nHowever,\n\nI’m pleased to report that my family, my wife, and my children have all safely made it to Trite, as promised..\nI do hope the trip wasn’t as bad as mine have been.\nThey were moved in secrecy for their own protection. So unfortunately I am unable to contact them..\nAt least that’s what I was told when I tried my hardest to do so.\nMaybe it’s for the better.\n\nI have only a few more missions to complete before I can visit my family again.\nSpeaking of which,\n\nThe teams we send out to Cosmocos have vanished..\nAnd..\nSo has the entire moon.\nIt vanished from the radars entirely. Which seems impossible and yet is true.\n\nThis happened only days after they found something.. incredible that would’ve been the key to our victory.\nAll that returned was a confused and mad Commander Cunningham who supposedly tried to sabotage the operations. And a large amount of so-called “Cosmic Growth”.\nAnyways,\n\nI have been tasked to guide a group of scientists here with the creation of manipulative weapons using the aforementioned Cosmic Growth.\nThey’ll grow into the brain of whoever it will be applied to and we’ll supposedly have full control over them.\nThink of it as a mind controlling parasite.\nIt will hopefully aid us in this war.\nThen once that’s done I will vanish in the night for my next task.\n\nAgent G- Signing off.=从我在波拉鲁斯开会、那场灾难性的事件引爆这场大战算起，已经过了一百二十多天。如我们所料，Titan 军方对最初的袭击绝不肯善罢甘休，同一周内便发动了反击。此后事态只管升级……不过，\n\n我很高兴地报告，正如承诺的那样，我的妻子和孩子们都已平安抵达特赖特。希望他们一路上没有我这么遭罪。为了保护他们，转移是在秘密中进行的，所以我无法联系他们……至少，在我想尽办法联络时，他们是这么告诉我的。也许这样更好。\n\n再完成几项任务，我就能与家人见面。说到任务……\n\n派往科斯莫科斯的队伍失踪了……而且……整颗卫星也是。它从雷达上彻底消失。怎么想都不可能，偏偏是真的。就在几天前，他们刚发现了某种……非同寻常的东西，本可以成为我们取胜的关键。回来的只有神志混乱、据称企图破坏行动的坎宁安指挥官，以及大量所谓的“宇宙增生体”。\n\n现在，我的任务是指导这里的一组科学家，利用这种增生体制造操控他人的武器。它会长进施用对象的大脑，据说这样我们就能完全控制对方。把它想成一种操控心智的寄生物就好。希望它能助我们打赢这场仗。完成之后，我便会趁夜离开，执行下一项任务。\n\n特工 G，通话完毕。
JESTER\n\nSigurd's danger level: 90% Get out o fthere before it goes APE!! You cant hide from it, just evacuate. i think it goes back in its box if everyone stays outside long enough\n\nScientific name: INSANEUS THINGUS\nTHERE'S NO FREAKING SCIENTIFIC RECORD! good luck, you know as much as us. we just call it the jester=小丑盒\n\n西格德的危险等级：90%。趁它还没发疯，赶紧跑！躲是躲不掉的，只能撤出去。我觉得，只要大家都在外面待够久，它就会缩回盒子里。\n\n学名：INSANEUS THINGUS\n根本没有这玩意儿的科学记录！祝你好运，你知道的跟我们一样多。反正我们就叫它小丑盒。\n\n
