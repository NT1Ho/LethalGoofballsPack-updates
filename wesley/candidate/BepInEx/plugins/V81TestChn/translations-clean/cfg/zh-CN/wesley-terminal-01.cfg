Hello employee.\nYou may not know me but.. I know you.\nSince the death of your soulmate you have been taken by grief, you have felt like your existence is once again pointless.\nYou continuously put yourself in danger, inching closer and closer to the end each time.\nLets see if you have what it takes to survive, if you still appreciate the body that has been given to you.\nIn front of you there hangs a Decimator, an explosive device that will destroy everything in this room when the timer hits zero.\nThere also hangs another employee, you may know him as he has been in your crew for months, he will be the key to your freedom, All you need to do is remove the right wire with the knife you now posses.\nBut beware, if he dies by your hands, neither of you will make it out alive.\nLive or die, make your choice.=你好，员工。\n你可能不认识我，但我认识你。\n自从你的灵魂伴侣去世后，你就被悲伤所吞噬，感觉自己的存在再次变得毫无意义。\n你不断将自己置于危险之中，每一次都离死亡更近一步。\n让我们看看你是否还有生存下去的勇气，是否还能珍惜这个赐予你的身体。\n在你面前悬挂着一个毁灭者，这是一种爆炸装置，当计时器归零时，它会摧毁这个房间里的所有东西。\n还有另一个员工也悬挂在那里，你可能认识他，因为他已经在你的团队里待了几个月了。他将是你获得自由的关键。你只需要用你现在拥有的刀子切断正确的电线即可。\n但请小心，如果他被你杀死，你们俩都不会活着离开这里。\n生或死，做出你的选择。
