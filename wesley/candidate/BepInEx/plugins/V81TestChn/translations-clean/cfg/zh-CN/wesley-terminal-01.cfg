It has been a strange past few days.\nOf course that is the usual around here but some things appear off.\nStranger than usual.\n\nWe noticed that the water filters have been burnt through.\nThere was a substantial buildup in acidir material in the pipelines.\nLuckilly no leakages but it is strange how none of us noticed the.. acidic taste in the water supply.\nWe have been drinking this for days.=这几天真奇怪。\n当然，这地方本来就怪，可有些事情不对劲。\n比平时还怪。\n\n我们发现净水滤芯已经被蚀穿。\n管道里积了很多阿西迪尔物质。\n幸好还没泄漏，但怪的是，我们谁都没注意到……供水里有股酸味。\n我们已经喝了好几天了。
It has not been a couple hours since I entered this abandoned mineshaft. And already something feels off. If not for the missing equipment in the supply area, it would be the distant rumbling giving me a sense of unease. Maybe I should just shrug it off and get what I came here for.\nA large deposit of various crystals is what attracted me to this place.\nI've been short on money and I'm slowly heading into debt. If I'm able to find what I'm looking for it could really help me out. I don't know how deep they are but I know for certain that they're there.\nThere's no mineshaft here for nothing.\nI'm heading in deeper.=走进这座废矿井还不到几个小时，就已经觉得不对劲了。就算补给区没少那些设备，远处隐约的隆隆声也足以让人不安。也许我该少想些，拿了要找的东西就走。\n这里有一大片矿藏，各种晶体都有，我就是冲这个来的。手头拮据，眼看就要背上债了。要是能找到我想要的，真能帮我渡过难关。我不知道它们埋得多深，却知道一定在。\n没人会无缘无故挖这么一座矿井。\n我再往深处走。
It strikes a fear in me, rooted deep within my ocean of thought. He kept asking about it and I don't even have the full answer. They have a way of operating that makes them invisible to not only the surface but even those who'd consider themselves high up the ladder. But I know they're here. They're everywhere. Stare long enough into the abyss, you start seeing things. Holes in reality. Fissures in logic. Yet you shake your head and pretend it was your eyes playing tricks on you. I see them. Companies appear more and more frequent like an infestation of roaches from influential businessmen to lower class entrepreneurs. All with history, documents, lives. Processed within our systems. It's usual. Standard practice. Nothing strange about it. But you look closer. You read their documents. Everything seems normal until.. you get a glimpse. A date mismatched. A name changed. Manlike mistakes, for sure. Look deeper, closer. Children without proof of birth. Deposits from companies that only registered days later. Trades between people who don't even know each other. Fissures. I've never observed them, my superiors have never seen them. Only stories.. irregularities. Seemingly random. But I think they are connected. They're here. And I believe they're scared. There is something here that scares them, threatens them. Makes them slip up. And if something is here that scares the corporate entity that’s able to twist our reality no matter where in our galaxy. You best know I sleep with one eye open.=这件事让我害怕，那恐惧深深扎在我的思绪里。他一直追问，可连我也答不全。他们有一种行事方式，不光外面的人察觉不到，就连自以为身居高位的人也看不见。可我知道，他们就在这里。无处不在。\n朝深渊盯得够久，就会看出端倪。现实里的破洞，逻辑上的裂缝。你却摇摇头，骗自己说是看花了眼。我看见了。公司冒出来的次数越来越多，像闹了蟑螂灾。从有权势的商人到底层创业者，人人都有来历、档案、生活轨迹，全在我们的系统里过了手续。寻常得很。例行公事。有什么奇怪的？\n再靠近一点。读读那些文件。一切都正常，直到……你瞥见一处日期对不上，一个名字改过。人嘛，总会犯错。可再往深处看：有孩子却没有出生证明；有公司打来款项，却是几天之后才注册的；有两个人互不相识，却做过交易。裂缝。\n我从未直接见过他们，上司也没见过。只有传闻……和些看似毫不相干的异常。我却觉得它们彼此相连。他们就在这里，而且我相信他们在害怕。这里有什么东西让他们恐惧、觉得受到了威胁，逼得他们露出马脚。如果真有什么能吓到一个无论身处银河系何处都能扭曲现实的企业实体，那我告诉你，我连睡觉都要睁着一只眼。
It was a while ago when I first felt it. I felt it for a friends. But for the three years I was around. I was too scared to say something. And now we talk no longer.\nI often wonder what life would be had I been more courageous.\nBut now I have felt it once more.\nSomeone else. Another friend.\nBut it is different this time. While I send it from my side. I know I will never receive it.\nWhile to some it is a blessing. To me it is a curse. I feel the weight on my chest whenever I mention it.\nI feel like I am driving them away whenever I send it.\nI am lost.\nAnd I do not know the way.=第一次有这种感觉，是挺久以前了。对方是个朋友。我在那里的三年里，一直没勇气说出口。现在我们已经不再说话。\n我常想，当初若是胆大一点，现在会过着什么样的生活。\n如今那感觉又回来了。对另一个人，也是朋友。可这次不同。我把心意送出去，却知道永远不会有回应。在有些人眼里，这是恩赐。在我这里，却是诅咒。每次提起，胸口都沉甸甸的。每次表达心意，都像是在把对方推远。\n我迷了路。\n我不知道该往哪里走。
It worked. My disguise was enough to make them believe I was with them. I have been assigned a room in the guard chambers.\nThis facility is much larger.\nThe clouds seem to end before the building does.\nThe conditions are not better either. I feel for the workers.\nIn some places it's warm enough to melt skin off muscle.\n\nNow I'm here I will need to get accustomed to the standard procedures. I will also need to study the building a bit more before I can start planning anything.\nNot to mention figure out where Jareck is among all of this.\nBut I will have my vengeance.\nOne way or another.=成功了。这身伪装让他们以为我是自己人，已经给我在警卫宿舍分了房间。\n这处设施大多了。建筑高得仿佛连云层都先到了尽头。条件也没好到哪去，我真替工人难受。有些地方热得能把皮从肉上烤下来。\n\n既然进来了，我得熟悉他们平时怎么做事，再摸清楚建筑布局，才能开始谋划。更别说还得从这么大的地方找出贾雷克。\n可我一定会报仇。\n不管用什么办法。
It's all real! Every time!.\nThe city sinks but at midnight, the city returns.\nBut all who die stay dead.\n\nI am the only one left!\nThe hallway is flooding again.\n\nI might not make it this time.\nTime is repeating...=这都是真的！每一次都是真的！\n城市下沉，到了午夜，又会恢复原样。\n可死了的人不会回来。\n\n只剩我一个了！\n走廊又开始进水了。\n\n这一次我可能撑不过去。\n时间在重复……
It's been 3 weeks since I was sent to the quarry.\nMy life in Filtra was nice, peaceful. My job was simple but it payed well.\nNow I find myself in this shithole.. Doomed to work until my back snaps in two.\nDoomed to never see my wife and child ever again. I don't even know if they're alive.\nBut I know who took them. I know the name of the man who burst into our home and ripped our family apart.\nThe man who gave the order. The man who beat me into submission.\nThe invastion of Filitrios left a scar on my mind. That scar has a name.\nJareck Hill.\nI will come for you.=我被送到采石场已经 3 周了。在菲尔特拉的时候，我过得很好，很平静。活儿简单，收入也不错。\n现在却沦落到这个鬼地方……注定要干到脊梁断成两截，注定再也见不到妻儿。我甚至不知道他们是不是还活着。\n可我知道是谁带走了他们。我知道那个闯进我家、拆散我们一家的人叫什么。那个下令的人。那个把我打到再也无力反抗的人。\n菲利特里奥斯遭入侵，在我心里留下了一道疤。那道疤有个名字。\n贾雷克·希尔。\n我会去找你的。
It's been a strange past few weeks, we've heard that luitenant commander Cunningham was send back to 61 after going mad. \nI have no idea what that's all about. \nBut they've started extracting this.. plant I think it was? \nAnyways. \nResearch has been going steady, these illuminating eyes don't seem to have a purpose.. \nwell.. \nnot a definitive one at least. \nEver since the Cunningham incident it appears to be more.. agressive almost. \nIt's certainly strange. \nI wonder if the- \n\n*Rumbling*\n\nWhat is happening? \nEverything is bright outside?? \n\n*More rumbling*\n\nWoah. \nWhat's happening.\n\n*Agressive rumbling*\n\nThere's a what coming at us?! \n\n*The sounds of a moon ripping itself apart.*\n\nWe have been hit. \nWorse. \nWe have been separated from Cosmocos. \nI..\nI need to go..=过去这几周真怪。听说坎宁安少校疯了，被送回了 61。我完全不知道怎么回事。他们已经开始提取那种……植物？我想是植物。总之，研究一直在推进。那些发光的眼睛好像没什么用途……嗯，至少还没弄清楚。自从坎宁安出事之后，它似乎变得更……几乎可以说更有攻击性了。确实古怪。不知道那——\n\n*隆隆声*\n\n怎么了？外面怎么全亮了？？\n\n*隆隆声继续*\n\n哇。怎么回事？\n\n*巨响加剧*\n\n你说什么东西正朝我们撞过来？！\n\n*卫星撕裂自身的声音*\n\n我们被击中了。更糟的是，我们和科斯莫科斯分开了。\n我……我得走了……
It's been a while now since my arrival at this facility.\nI've been closely paying attention to the projects here.\nI was told that moon is THE home of the Lacerta-glomerorum.\nOr.. spore lizards in the common tongue.\nThis is where they are most frequently hunted.\nHowever, in the labs they seem to be working on cloning technology.\nThe cloning of creatures to be more specific.\nI feel it's right up my alley.\nProfessor Harrington, over and out.=到这座设施已经有些日子了。\n我一直在仔细观察这里的项目。\n听说这颗卫星才是 Lacerta-glomerorum 真正的故乡。\n哦……就是俗称的孢子蜥蜴。\n这里捕猎它们最为频繁。\n不过实验室里的人似乎在研究克隆技术。\n确切地说，是克隆生物。\n这可正对我的胃口。\n哈林顿教授，通话结束。
