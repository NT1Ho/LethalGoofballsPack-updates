During my time in this realm of mortality I have made friends of many. Though very few have stuck with me past my time of being around them.\nGrateful I am to those who remain. Those whom I can consider close.\nTrue friends.\nHowever I fear that the friends I have made in the past year become one with those who no longer seek contact with me. The thought haunts me daily. I fear that I might end up alone once more.\nI fear the void we call loneliness.\nOften I sit down, just me and my thoughts. No one to join my pondering. To fill up the void.=在我身处这个死亡领域的时间里，我结识了许多朋友。不过，在离开他们之后，只有极少数人一直陪伴着我。\n我感激那些仍然留在我身边的人。那些我能够视为亲密朋友的人。\n真正的朋友。\n然而，我担心过去一年里结交的朋友会渐渐与那些不再与我联系的人融为一体。这个念头每天都萦绕在我的心头。我害怕自己会再次陷入孤独。\n我害怕那种我们称之为孤独的空虚感。\n很多时候，我独自坐着，沉浸在自己的思绪中。没有人可以加入我的思考，填补那空虚的角落。
