I AM IN SHOCK!\nWhen Jack came in earlier he was completely covered in blood!\nHe has lost his mind!\nHe was holding the dagger in his right hand and the mask in his left held before his face.\nHe looked at me.\nChanting soem unrecognisable words before he walked away. Seemingly heading outside.\n\nI am not sure if he killed an animal or..\nI need to make sure Dave is ok.\nI don't want to be alone with Jack the lunatic.\nMaybe I should go look what's outside.\n\nI fear the worst.=我震惊了！\n当杰克早些时候进来时，他的全身都沾满了血迹！\n他已经失去理智了！\n他右手握着匕首，左手则戴着面具，遮住了他的脸。\n他看着我。\n他边念着那些难以辨认的词语，边离开。似乎是要走向外面。\n\n我不确定他是杀了一头动物，还是……\n我需要确保戴夫没事。\n我不想和那个疯子杰克单独在一起。\n也许我该去看看外面有什么\n\n我担心最坏的情况会发生。
I am Geoffrey Samuel Smith, Agent and high commander working directly for the Emperor.\nThis will be my final message.\n\nUntil recent I have believed that my actions since the Catalyst under command of the Emperor were for some greater good.\nI was led to believe that all the sacrifices made were with purpose.\nYet they were in vain.\nIt wasn’t until I had lost all that I had left in my world when I realized.\n\nI now find myself here to execute one final mission.\nOne of my own.\nOver the past few months we have been collecting the many experimental bioweapons that were created because of me.\nI made them believe we got them to study them further. Make them more dangerous.\nThat’s what the emperor would have wanted.\nBut I will no longer follow the wishes of that man.\nHe sits on his golden throne while everyone else suffers by his command.\nI should have done something when he told me to give the order.\nI should have executed him right then and there.\n\nBack in the labs I smashed the glass containers for BIO-HXNV7, the deadliest weapon we have.\nIt will hopefully kill or convert most of the people here.\nThese loyal rats who think they’re on the winning side.\nThere is no winning side.\nAnd I’ll make sure nobody will escape this place.\nNobody will use these atrocities to further this pointless hell!\n\nI called for a facility wide decontamination.\nAnd all of it will burn!=我是杰弗里·塞缪尔·史密斯，作为直接隶属于皇帝的特工和高级指挥官。\n这是我的最后一条消息。\n\n直到最近，我一直认为自己在皇帝指挥下的行为是为了某种更大的利益。\n我被告知，所有做出的牺牲都是出于目的。\n然而，这些努力都是徒劳的。\n直到我失去了世界上所有剩下的东西时，我才意识到这一点。\n\n我现在在这里执行最后一项任务。\n我自己的一个\n在过去的几个月里，我们收集了许多因我而制造的实验性生物武器。\n我让他们相信，我们会让他们继续研究这些数字标记，让它们变得更加危险。\n这就是皇帝所期望的。\n我会不再遵循那个人的意愿行事。\n他坐在他的金色宝座上，而其他人则在他的命令下受苦。\n当他让我下达命令时，我本应该采取一些行动的。\n我本应该在当时就处决他。\n\n在实验室里，我打碎了用于存放BIO-HXNV7的玻璃容器，这是我们最致命的武器。\n希望这能杀死或消灭这里的大多数人。\n这些忠心的老鼠认为自己是赢家。\n没有赢家。\n我会确保没有人能够逃离这个地方。\n没有人会利用这些暴行来推进这个毫无意义的地狱!\n\n我要求对整个设施进行去污染处理。\n全部烧掉!
I am nearing my day of birth yet again. It will be the twenty first.\nWhile to most it would seem a day of happiness.\nI look at it the opposite.\nThis year I have graduated for a course I was happy to start.\nBut time has shown that it might not be within my interest in this form.\nTherefor I feel a part of life was wasted. I have yet to understand what I truly want to do with the years that remain.\nI feel like a rock in a river. With life flowing around me. Unmoved. Waiting for change. Change that might never come if I stay this way.=我又即将迎来自己的出生日了。今天就是二十一号。\n对大多数人来说，这似乎是一个幸福的日子。\n但我却觉得恰恰相反。\n今年我完成了一门我原本很乐意学习的课程。\n但时间已经证明，以这种方式可能并不符合我的兴趣。\n因此，我觉得生命的一部分被浪费了。我仍然不明白自己真正想用剩下的岁月去做什么。\n我感觉自己就像河中的一块石头，生命在周围流淌，我却毫无反应，只是等待变化。如果继续这样下去，也许永远都不会有变化了。
I am trying to compose myself. I must stay strong in front of her. I must be there for her. They took Julie. Me and the others in the building ran for the metro while they broke through the barrier. We went building by building. She was right there with me. We kept running as the gunfire got closer. A bomb went off and the group split apart in a panic. Then when I looked behind me she was gone. She was right god damn there.\n\nIs this some sort of punishment? Is this because I left those poor people I was trying to help?\nAll I hear is screams and gunfire. This isn’t a battle, this is a massacre. People are being lined up and shot. Please god tell me Julie got away. Please.\nWe need her. I don’t want our daughter to grow up without a mother. I don’t want to lose you.\nPlease return to us. I know you’re out there.\nWe won’t be able to stay for long. If you’re not here soon we will have to leave.\nWe’re moving to the end of the metro, there should be a way to get off of Filitrios from there.\nI will leave this note here for you. Please come to us. I love you.=我正在努力保持冷静。我必须在她面前坚强。我必须陪伴在她身边。他们抓走了朱莉。我和大楼里的其他人一起跑向地铁，而他们则突破障碍。我们一栋栋地前进。她就在我身边。随着枪声越来越近，我们继续奔跑。一枚炸弹爆炸了，队伍在恐慌中分开了。然后当我回头看时，她已经不在了。她真的就在那里。\n\n这是某种惩罚吗？是因为我离开了那些我试图帮助的可怜人吗？\n我听到的只有尖叫声和枪声。这不是战斗，这是一场大屠杀。人们被排队并枪决。请上帝告诉我朱莉安全脱险了。求你了。\n我们需要她。我不想让我们的女儿在没有母亲的环境中长大。我不想失去你。\n请回到我们身边吧。我知道你还在外面。\n我们无法停留太久。如果你不能很快回来，我们就不得不离开。\n我们正在前往地铁的终点站，从那里应该可以找到离开的方法。\n我会在这里留下这张纸条给你。请回到我们身边吧。我爱你。
I am uncertain where to begin.\nWhat has occurred was beyond dreadful.\nI find myself lacking the vocabulary to describe it.\nIt has taken me a fair amount of time to even build the courage to leave my bed chamber.\nI am frightened. Deeply frightened. It was a mistake. They died because I ran. I watched him cry in fear as I fled like a coward.\nThese doors will protect me. Opening them would require a considerable source of power. Such sources are rare in today’s day and age. Yet still I fear. There is a sound. I was certain it was my imagination playing tricks on me. I no longer believe that.\nIt’s drawing nearer. Every day I become more certain of that.\nIt spoke. I wish it had not. It echoes through my mind. It leaves me without peace.\nIt’s drawing nearer.\nI should never have viewed that tape.\nI assure you what I am hearing is real.\nThat thing was real.\nI urge you to stay away. I beg of you.\nLet it remain undisturbed.=我不确定从哪里开始。\n所发生的事实在令人恐惧之外，更加可怕。\n我发现自己的词汇量不足以描述它。\n我花了相当长的时间才鼓起勇气离开我的床铺。\n我感到害怕。极度害怕。那是个错误。他们死了，因为我逃跑了。当我像懦夫一样逃跑时，我看着他因恐惧而哭泣。\n这些门会保护我。打开它们需要巨大的能量来源。在当今这个时代，这样的能量来源非常罕见。但我仍然感到恐惧。有声音在响。我确信那只是我的想象在欺骗我。但我不再相信这一点了。\n它正在接近。每一天，我都对这一点越来越确信。\n它说话了。真希望它没有这么做。它的声音在我脑海中回响。这让我无法平静。\n它越来越近了。\n我根本就不应该观看那个录像带。\n我向您保证，我所听到的是真实的情况。\n那个东西是真实的。\n我恳请您远离。我请求您不要这样做。\n保持原样，不要删除、添加或解释。
I cannot say I am much of a writer, I beg of you, don’t have grave expectations.\nAs for any story it would be good to know who’s behind the pencil. Or keyboard in this instance.\n\nTo introduce myself, my name is Zellenah. Born on Haltar under the family name Cross.\nFor those who are unaware, Haltar is likely one of the wealthiest moons still remaining in our region.\nFirst, an agreement. Then the golden flame. Foolish to have gotten involved.\nOur father couldn’t keep the political talk to himself so I’ve become rather educated on the conflict.\n\nI feel I am already losing the path. Where was I? Ah yes.\nFor the greater part of my life I have spent mindlessly staring at golden halls and sipping the most elegant vintages while relatives endlessly discuss their fortunes with a devotion I could not understand. We’ve always gone on the same trips and visited the same fountains. I couldn’t convey how often I’ve seen the gemstone waters.\nYou could say I’ve always had more of an explorative trait. The predictability of it all became rather stifling. The people are kind, but perhaps a touch soulless. All they conversed about was their wealth and what grandiose places they visited. I found it to be rather dull. Terribly underwhelming. I fear the normality of it all has greatly impacted my joy of what were seemingly magnificent things.\n\nI found myself unwilling to accept such predictability so I left for a few trips outside of our usual experiences.\nA majority of the places I went to were fresh, unique. Often whelming as I had witnessed the same before but on a grander scale.\n\nThen, during one of these visits there were these magnetized pebbles. Not too extraordinary I believe we have all seen magnets before. But these pebbles, when they touched they would brighten up. Not only brighten up, they would share a light that traveled between them. Now that was lovely. I had never seen that before. Truly magnificent. I still have them somewhere I am quite certain. Perhaps in one of my drawers with the crystals which pacifies insects with a soft drone, another magical find.\nEither way I put on a glove and took a hand full of them back to the manor.\nFrom then on all I ever wanted was to collect more of these interesting objects.\nIndeed I did. I went on many trips following this initial find.\nI had gathered plentiful mistiques. It had gotten to a point where they were turning my manors into a dreadful mess.\nThere was a terrible need for a place to put these things. And that’s when I came with the idea of the gallery. A gallery of uniquities.\nI wouldn’t want it to be back on Haltar, you could display something magnificent and they wouldn’t even lift their glasses.\n\nThis place looks delightful and happens to be right in the center of everything. Nearly too good to be true.\nSo I acquired this small moon and began planning out the gallery.\nA few months pass and now we are here.\n\nI appreciate your reading. I find it incredibly relaxing to write.\nPerhaps I might write some more in the future.=我不敢说自己是个出色的作家，请你们不要对我抱有过高的期望。\n关于任何故事，了解那些在键盘前敲下文字的人是很重要的。或者在这种情况下，是那些在电脑前操作的人。\n\n自我介绍：我的名字是Zellenah。我出生于Haltar，家族姓氏为Cross。\n对于那些不清楚的人来说，Haltar可能是我们地区现存最富有的卫星之一。\n首先，达成一项协议。然后是金色火焰。参与其中真是愚蠢。\n我们的父亲无法保持政治对话,\n\n我感觉到自己已经迷失了方向。我之前在哪里？啊，对了。\n在我生命的大部分时间里，我都在无意识地凝视着金色的殿堂，品尝着最上等的葡萄酒，而我的亲戚们则不停地讨论着他们的财富，那种热情让我难以理解。我们总是一起去同样的旅行，参观同样的喷泉。我无法形容自己见过多少次那些宝石般的水源。\n可以说，我一直都更喜欢探索性强的体验。一切的可预测性让我感到有些压抑。那些人虽然友善，但可能有点缺乏灵魂。他们谈论的只有自己的财富以及他们去过的那些宏伟地方。我觉得这相当乏味，实在令人失望。恐怕这种常规化的生活方式大大影响了我对那些看似壮丽事物的兴趣。\n\n我发现自己不愿意接受这种可预测性，因此我尝试了一些超出我们常规体验的旅行。\n我到过的多数地方都十分新鲜且独特。很多时候，这些地方让我感到震撼，因为我在之前已经见过类似的事物，只是规模更大而已。\n\n在其中的一次参观中，发现了这些被磁化的小石子。我觉得这并不特别，因为我们以前都见过磁铁。但这些小石子一旦接触，就会发出光芒。不仅如此，它们还会传递光线。这真是太美妙了。我以前从未见过这样的现象。真是令人惊叹。我肯定还在某个地方保存着它们，也许放在我的抽屉里，那里还有那些能驱赶昆虫的魔法水晶。又是一个神奇的发现。\n要么我戴上手套 把满满都是的手套拿回庄园\n从那时起，我所渴望的只是收集更多这些有趣的物品。\n确实如此。在最初发现这个之后，我进行了许多旅行。\n我收集了大量的迷情物。情况已经发展到这样的地步：它们把我的宅邸变成了一片混乱不堪的景象。\n当时，人们非常需要一个存放这些物品的地方。于是，我提出了建立画廊的想法。一个展示独特物品的画廊。\n我不想让这个东西又回到哈塔尔，你可以展示一些非常壮观的东西，但他们甚至都不会抬起他们的杯子。\n\n这个地方看起来非常迷人，而且正好位于一切的中心。简直好得令人难以置信。\n我获得了这颗小卫星，并开始规划画廊的设计。\n几个月过去了，现在我们在这里。\n\n感谢您的阅读。我觉得写作是一种非常放松的活动。\n或许我将来会写更多
I desire to write again following today's frightful ordeal.\nIt was in the early morning when the trouble began. I had woken up from an annoyingly repetitive beeping coming from my computer. And so I had a gaze at what happened to be a message. It was deeply unsettling.\nIt read as follows: \n“The celestial body designated [98 Galetry] falls under company territory and is marked for collection. Agree to our terms or leave immediately.”.\nOf course I took this sudden message very dear. It had appeared to be rather important though a bit distasteful. So as with any message of seemingly grave importance like this I had informed them, in terms perhaps less diplomatic than advisable, that I had no interest in their proposal.\n\nNot much time had passed and I heard this charming jingle of an elevator of sorts followed by an explosion. Immediately I put on my gloves and armed myself with an antique blade in hopes it would scare away whoever had impolitely seared my front yard. Or at the very least offer me the confidence to confront them.\n\nTo my surprise there was nobody there. Only the wind, a dull quietness and a pod with a big gap presumably from the explosion.\nThen to my surprise, a dreadful swarm of hornets attacked me. I ran away as fast as I could and locked myself in my bed chamber.\nThen I remembered those droning crystals. Unsure where I had left them I began searching. It had taken me a fair moment but in the end I discovered them to be in a small box in one of my closets. I took out a few and slowly opened the door. Nothing in the hallway. Quite curious. I slowly made my way along the gallery towards the entrance, not a hornet in sight. Then to my surprise there was a bulging man standing in the grass. He quietly gazed at me. To my knowledge I was alone, there hadn’t been any visitors in days. I yelled out to him. No response. Frightening. I took a step back. Then he seemed to search for something in his tailor coat. Before long he ran at me holding a shimmering knife. Having neither a plan or any courage in that moment I instinctively held out the small bag of crystals between us. To my surprise this bloated man seemed enamored by them. Staring soullessly into the bag. Only then it dawned on me, this was not an ordinary man at all, but a deteriorating arrangement of skin and cloth piloted by these hornets. The dreadful smell only confirmed that. Terrifying discovery yet I must admit in a way quite divine.\nI had led him to the back room as he followed the bag of crystals. As I had no proper placement for this ominous gentleman, I elected to leave him where he was. I don’t think he minds that much.\n\nFinally I return to my computer only to find it beeping once more. A new message.\n“You have received your first and only warning, The celestial body designated [98 Galetry] falls under company territory and is marked for collection. Agree to our terms or leave immediately.”\nI was left with a choice and perhaps in an act of fear I agreed.\n\nAs long as I help their workers ship the things they found to Gordion without interrupting their work, I should be left alone.\nI’m hopeful.=我渴望在经历了今天的可怕经历之后再次写作。\n麻烦是在清晨开始的。我被电脑发出的恼人重复哔哔声吵醒，然后看到了一条消息。这消息让我感到非常不安。\n消息内容如下： \n“被指定为[98 Galetry]的天体属于公司领地，需要被收集。请同意我们的条件，否则立即离开。”\n当然，我非常重视这条突如其来的消息。虽然它看起来很重要，但有些令人不悦。因此，就像对待任何如此重要的消息一样，我以不太得体的方式告诉他们，我对他们的提议并不感兴趣。\n\n没过多久，我听到一种类似电梯的嗡嗡声，接着是一声爆炸。我立刻戴上手套，拿起一把古董刀，希望这能吓跑那些不请自来的人，或者至少让我有勇气面对他们。\n\n令我惊讶的是，那里没有人。只有风声、一片沉寂，还有一个显然因爆炸而出现大裂缝的舱体。\n然后，令我更加惊讶的是，一群可怕的马蜂向我袭来。我拼命逃跑，把自己锁在卧室里。\n接着我想起了那些嗡嗡响的晶体。不确定把它们放在哪里，我开始寻找。过了一会儿，我发现它们在一个壁橱里的一个小盒子里。我拿出几颗晶体，慢慢打开门。走廊里什么也没有。真奇怪。我沿着走廊走向入口，但看不到一只马蜂。然后，令我惊讶的是，有一个肿胀的男人站在草地上。他静静地注视着我。据我所知，只有我一个人，已经好几天没有客人来了。我朝他喊了一声，但没有回应。真是可怕。我后退了一步。然后他似乎在他的西装外套里寻找着什么。不久后，他拿着一把闪闪发光的刀向我冲过来。当时我既没有计划，也没有勇气，于是本能地把那小袋晶体放在他们之间。令我惊讶的是，这个肿胀的男人似乎被它们迷住了，他空洞地盯着袋子。直到那时我才意识到，这并不是一个普通的人，而是一群马蜂操控着的腐烂的皮肤和布料。那可怕的气味进一步证实了这一点。虽然这个发现很可怕，但我不得不承认，在某种程度上，这似乎是一种神圣的事情。\n我把他带到后面的房间，让他跟着那小袋晶体。由于我没有合适的安置方式，我决定让他留在那里。我觉得他应该不会介意。\n\n最后，我回到电脑前，发现它又开始发出哔哔声。又一条消息。\n“你已经收到了第一次也是最后一次警告，被指定为[98 Galetry]的天体属于公司领地，需要被收集。请同意我们的条件，否则立即离开。”\n我面临着一个选择，也许出于恐惧，我同意了。\n\n只要我帮助他们把找到的东西运到Gordion，而不打扰他们的工作，我就应该被允许独自待着。\n我抱有希望。
I did not expect this meeting to go the way it did.\n\nWhile I tried to educate the Emperor on the matters back at the Grand Capitol. he seemed uninterested and looked at me with a rather lifeless expression.\nI explained how the Council of Rule is very adamant about not allowing any bioweapons to be used or studied..\nBut then he told me..\nHe wanted me to..\n\nThe Triton Military will decimate the Grand Capitol as well as the moon it sits on.\nThis will be.. soon, on the day of the final conference.\nJudgement day.\n\nAnd he wanted me to give the order.\n\nThis will be the catalyst of a region wide war.\nYet I did as he asked. I gave the order. In the name of the Emperor.\n\nThis means I will not be returning home and I was promised that my family will be moved to Trite to keep them safe from what’s about to come.\nI hope to see them soon.\n\nSoon I will be off to 61-March where I will prepare 3 groups of scientists to set course for the mysterious moon of 42-Cosmocos in hopes of finding something to aid us in the upcoming war against the dominions who will oppose the Triton Military and the Emperor.\n\nThis will not be pleasant. But I am ready.\n\nAgent G- Signing off.=我没想到这次会面会如此发展。\n\n尽管我试图向皇帝解释在大首都发生的事情，但他似乎并不感兴趣，用一种相当无生气的表情看着我。\n我解释了统治委员会坚决不允许使用或研究任何生物武器……\n但随后他告诉我……\n他希望我……\n\n特赖特军队将摧毁大首都以及它所在的月球。\n这将会在最终会议的那一天发生……\n审判日。\n\n他希望我下达命令。\n\n这将成为一场地区性战争的催化剂。\n但我还是按照他的要求做了。我以皇帝的名义下达了命令。\n\n这意味着我将无法回家，而且有人承诺会把我家人转移到特赖特，以确保他们免受即将到来的灾难。\n我希望能很快见到他们。\n\n很快我将前往 61-March，在那里我将组织 3组科学家，让他们前往神秘的 42-Cosmocos卫星，希望能找到一些东西来帮助我们应对即将到来的与那些反对特里顿军事力量和皇帝的势力之间的战争。\n\n这不会是一件愉快的事情。但我已经准备好了。\n\nG-特工 结束报告。
I followed him through the vast halls of this citadel, hoping to see if he revealed anything else.\nBut when I turned the corner, he had vanished into one of the storage rooms. Which is particularly strange I thought.\nAnd when I put my ear up against the door. I heard him talk again.\n\nHe sounded rather monotone. Having a discussion with himself.\nOr so I thought.\nIt wasn't until he said 'my overseer' when I realised he was talking to someone or.. something.\n\nI hid around the corner when he left the storage closet. And he quietly mumbled 'The seed must grow' as he left the hallway.\nI am uncertain what any of this means but I feel something larger is a play here.=我跟随他穿过了这座城堡的广阔大厅，希望他能透露出更多信息。\n当我转过拐角时，他已经消失在其中一个储藏室里。这特别奇怪，我心想。\n当我把耳朵贴在门上时，我又听到他在说话。\n\n他的声音相当单调，似乎在自言自语。\n或者我这么认为\n直到他说“我的监督者”时，我才意识到他是在和某个人或某物说话。\n\n当他离开储藏室时，我躲在角落里。他离开走廊时，轻声嘟囔着“种子必须生长”。\n我不确定这些术语到底意味着什么，但我觉得这里似乎在暗示着一些更为重要的东西。
I found some pen and paper stached below my cold, hard mattress.\nMeaning I can FINALLY write down some of my problems with this BROKEN justice system.\n\nFor one, I AM INNOCENT!\nI would never EVER do that to my wife and children.\nAnd the fact that they never even had a look at the evidence I provided.\nHORRID!\n\nIf I ever get the opportunity to het out of this hell hole..\nI will sue the everliving hell out of those people.\nJustice my ass.\n\nMeanwhile I'm sure that monster is still out there.\nAGHH\nWhat he did to my children, my Jane..\n\nIf I ever find him I'll be happy to watch him ROT behind these same bars that I find myself behind.\nHE belongs in a cell on Alcatras NOT ME!\n\nThough unfortunately they gave me life in prison.\nI don't think I'll ever be able to get true justice.=我在冰冷坚硬的床垫下面发现了一些笔和纸。\n这意味着我终于可以写下我对这个糟糕的司法系统的不满了。\n\n首先，我是无辜的！\n我绝对不会对我妻子和孩子做出那样的事情。\n而且他们甚至都没有查看我提供的证据。\n真是可怕！\n\n如果我有机会逃离这个地狱般的地方……\n我会起诉那些人，让他们付出惨痛的代价。\n正义什么的，根本不存在。\n\n与此同时，我确信那个怪物还在外面。\n啊啊啊\n他对我的孩子们做了什么，我的简……\n\n如果我找到他，我很乐意看到他像我一样被关在牢房里。\n他应该被关在阿尔卡特拉斯的牢房里，而不是我！\n\n不过不幸的是，他们给了我无期徒刑。\n我觉得我永远无法得到真正的正义。
I have made it to faith but my health has rapidly declined.\nI can barely walk.\n\nIt's there, I feel it sitting in my chest...\nGrowing...\nThis tumor.\nI escaped the war..     I SURVIVED\nAnd this is how the universe rewards me?\nLife is suffering.\nAlways has been, from the moment I was created.\nOne month after being born I was already on the battlefield. Posessing memories of someone I'm not.\nThey didn't even give me a name.\nI was a number. A duplicate of someone else.\n...\nMy body is crumbling, I should get going.\nAnd when I'm done.\nAll my problems will go away.\n\n\nMy salvation lies on Berunah.=我已经实现了信仰，但我的健康状况迅速恶化。\n我几乎无法行走。\n\n它就在那里，我感觉它存在于我的胸膛中……\n在生长……\n这个肿瘤。\n我逃过了战争……我活了下来。\n这就是宇宙对我的回报吗？\n生活充满了痛苦。\n一直如此，从我被创造出来的那一刻起。\n出生一个月后，我就已经身处战场。脑海中浮现着某个我不认识的人们的记忆。\n他们甚至没有给我一个名字。\n我只是个数字，是另一个人的复制品。\n……\n我的身体正在崩溃，我应该离开了。\n当这一切结束后，\n我所有的问题都将消失。\n\n\n我的救赎在于贝鲁纳（Berunah）。
I hear her in the dark\nThere’s a sadness in her voice\nSomething is wrong with her\n\nShe fears being seen\nShe’s scared\nSomething happened to her\n\nThere is a darkness in her eyes\nIt’s not her\nSomething is within\n\nWatch your back\nShe might ask for help\nBut it won’t let you=我在黑暗中听到她的声音\r\n她的声音里带着悲伤\r\n她有些不对劲\r\n\r\n她害怕被看到\r\n她很害怕\r\n她发生了什么事\r\n\r\n她的眼中充满了黑暗\r\n那不是她\r\n有什么东西在她的体内\r\n\r\n小心你的背后\r\n她可能会寻求帮助\r\n但不会让你得逞
I must write about this. I believe I have acquired all the information that remains.\nBack in my early days on Haltar, on the television this advertisement would play. It was an elegant place to visit with stunning environments, yet I’ve never quite discovered where this place is or even what it’s called. I only remember greenery with purplish waters and a soft pink sky. It was extraordinary. But it seems as if it never existed, though I am certain it did.\nThroughout my life I have attempted to inquire information of its whereabouts yet nobody seemed to know. I only had rumors to work off of. Some said it was made to disappear due to a chemical accident. Others said it was a hoax entirely, which seemed like a rather dull explanation.\n\nI simply cannot allow the matter to remain unsolved. It has most certainly been removed form every public source of information as nothing has turned up over the many years I have searched for this. But perhaps a physical copy remains in existence somewhere.\n\nI have reached what may generously be described as a plan, the idea fills me with discomfort, though I see no alternative but to attend to it personally. When Marcus returns I will fly out with him in search of what could be one of the only physical copies of this remarkable advertisement. I believe I know where such a copy may still exist.\nYou will see me return soon.=我必须写下这件事。我认为我已经获得了所有剩余的信息。\n在我初到Haltar的时候，电视上播放着这样的广告。那是一个值得一游的优雅之地，环境令人惊叹。不过，我一直不清楚这个地方的准确位置，甚至不知道它叫什么名字。我只记得有绿植、紫色的水域，以及淡粉色的天空。那真是非同寻常。但似乎那地方从未真正存在过，尽管我确信它确实存在过。\n在我的一生中，我一直试图打听它的下落，但似乎没有人知道。我只能依靠一些传闻来了解情况。有人说它因为化学事故而消失了。还有人说这完全是一场骗局，但这个解释似乎相当无趣。\n\n我绝对不能让这件事一直悬而未决。经过多年的搜索，我发现这个事情已经从所有公开的信息来源中消失了，没有任何线索。但也许 somewhere 还存在着一份实体副本。\n\n我大致制定出了一个计划，但这个想法让我感到不适，不过我别无选择，只能亲自去处理这件事。等马库斯回来后，我会和他一起出发，寻找这份非凡广告的实物副本。我相信我知道这样的副本可能还存在于何处。\n你会看到我很快回来的
I need to burn these notes later, can't risk anyone finding out about this.\nMy 'friend' Aaron has been a nuisance my entire life. \nHe stole my girlfriend, he stole my job! \nI can't keep acting friendly while he's around. \nI HATE HIM!=我以后必须销毁这些笔记，不能让任何人发现这件事。\n我的“朋友”亚伦一直是个麻烦人物。 \n他抢走了我的女朋友，还夺走了我的工作！ \n他在身边的时候，我实在无法保持友善的态度。 \n我恨他！
I really am cursed to live out my days recording with subpar recording devices.\n\nThis is professor Harrington and I have found myself to be on Utril.\nThe days may be darker than the nights yet it has a strange sense of beauty.\nIt is not a place I ever expected to visit.\nThe wildlife is unlike the usual, not very diverse.\nGenerally consistent of spore lizards and arachnids.\nIt was surprising to learn that it wasn't the spiders that were the aggressive ones here.\nThey were much more keen on posing for a picture.\nEither way,\nI'm needed back in the labs.\nProfessor Harrington, over and out.=我真的被诅咒了，必须用质量不佳的录音设备来记录我的岁月。\n\n这里是哈林顿教授，我发现自己在尤特里尔上。\n白天可能比夜晚更黑暗，但却有一种奇特的美丽感。\n这不是我原本期望去的地方。\n这里的野生动物与平常的完全不同，种类并不丰富。\n通常都是孢子蜥蜴和蛛形纲动物。\n令人惊讶的是，这里并非蜘蛛才是具有攻击性的生物。\n它们更喜欢摆出姿势拍照。\n无论如何，\n我需要回到实验室去。\n哈林顿教授，通话结束。
I remember that moment... clear as day.\nI was at work when I received a message from my wife Jane.'There's people in the house'.\nI told her to grab the gun from my desk and hide with the kids in the bedroom closet.\n'I am on my way' I said.\n\nWhile driving home I got a call from my nextdoor neighbor.\nShe said she heard screams and gunshots from our apartment.\nAnd that her husband called the police.\nI should have never gone home after I heard that...\n\nWhen I finally got home, I burst through the door and...\nI found her..\nOn the floor in the kitchen..\nShe had been shot multiple times and her body was partially flayed.\n\nAnd before I could even see what he did to my children, the cops ran in and I was arrested on the spot.\n\nBut as we drove away. I saw him I SAW HIM.\nHis crooked smile and those fiery eyes staring at me through the bushes, still covered in Jane's blood.\n\nI will never forget that face.=我记得那一刻...清晰如白昼。\n我在工作时收到了妻子简的消息。'家里有人'。\n我让她从我的桌子上拿起枪，和孩子们一起躲到卧室的衣柜里。\n'我马上就到'我说。\n\n在开车回家的路上，我接到了邻居的电话。\n她说她听到我们公寓里有尖叫声和枪声。\n而且她的丈夫已经报警了。\n听到这些后，我根本不应该回家...\n\n当我终于回到家时，我冲进门去...\n发现了她...\n她在厨房的地板上...\n她被多次枪击，身体部分被剥皮。\n\n在我还没来得及看到他对孩子们做了什么之前，警察就冲了进来，我当场被捕。\n\n但当我们开车离开时，我看到了他...我真的看到了他。\n他那扭曲的笑容和那双炽热的眼睛透过灌木丛盯着我，身上还沾着简的血。\n\n我永远忘不了那张脸。
I thought I would write about our findings.\nDuring the excavation we laid eyes upon an ancient golden mask.\nI bet this is worth millions considering where it came from!\n\nIt was perhaps used by the ancient people of this moon.\nNot quite sure what for however. I do feel it has a creepy look to it.\nMaybe my fellow archeologist Jack might have an idea.\nHere's a sketch:=我想我会写下我们的发现。\n在挖掘过程中，我们发现了面部的古代金面具。\n我相信，考虑到它的来源，这个东西的价值可能高达数百万！\n\n或许，这个星球上的古代居民曾经使用过这样的术语。\n但是,还不清楚为了什么。我确实觉得它看起来有点诡异\n也许我的考古学家杰克同学 可能有个主意\n这是一张草图:
I understand that I am writing on an official document but I have overheard something I feel like I shouldn't have. However it seems important enough to have it written down for later.\nWhile I walked through the halls near the office secions. I heard a faint discussion through one of the closed doors.\nIt was the Emperor talking to his closest agent.\n\nWhile I do not exactly recall what was said, I do remember them discussing the case as it stands. Their strategy is unusual.\nThe agent seemed sceptical while the Emperor remained adamant. Understandibly so.\n\nApparently their next argument will be that biological weapons might come in use if, say, a swarm of unidentified lifeforms from beyond the known regions invade that of ours.\nNot impossible but certainly not plausible.\n\nI am going to try figuring out more about the Emperor's plans.=我明白自己正在撰写一份正式文件，但我听到了一些我不应该听到的消息。不过，这些消息似乎非常重要，有必要记录下来以备将来参考。\n当我在办公室附近的走廊里走动时，我听到一扇关闭的门后传来微弱的谈话声。\n那是皇帝正在与他的亲信特工交谈。\n\n虽然我不太记得他们具体说了什么，但我记得他们讨论了当前的情况。他们的策略很不寻常。\n特工似乎持怀疑态度，而皇帝则坚持自己的观点。这是可以理解的。\n\n显然，他们的下一个争论点将是：如果来自已知区域之外的未知生命体入侵我们的领地，生物武器可能会被使用。\n这并非不可能，但肯定不太可能实现。\n\n我打算尝试了解更多关于皇帝的计划。
I wanted to give an update to my time here.\nThe cloning process is very complex but the technology is easy to produce.\nWhen they explained to me the current state of the project I was told that they had figured out how to grow a spore lizard from practically nothing to a fully functioning adult in the matter of days.\nHowever there was one fatal flaw.\nDue to GYN-H chemicals used in the process of speeding up the development of the creature, a unique form of cancer would grow in the brain which, after about a month would kill it.\nBut I think I came up with a solution, LYN-H is a very similar chemical to GYN-H, It's only down one component.\nI've theorised this could be the required change.\nProfessor Harrington, over and out.=我想向您汇报一下我在这里的情况。\n克隆过程非常复杂，但相关技术其实很容易实现。\n当他们向我解释项目的现状时，他们告诉我已经找到了一种方法，可以在短短几天内，从几乎没有任何东西开始，培育出一只功能完备的孢子蜥蜴。\n不过，存在一个致命的缺陷。\n因为在加速生物发育的过程中使用了GYN-H化学物质，会导致大脑中出现一种特殊的癌症，大约一个月后，这种癌症就会导致生物死亡。\n但我想我已经找到了解决方案。LYN-H是一种与GYN-H非常相似的化学物质，只是少了一个成分而已。\n我认为这就是我们需要进行的关键改变。\n哈林顿教授，以上便是我的汇报。
I was uneased before, now I'm scared.\nI have seen some of the equipment scattered around the caverns. Abandoned by whomwever used to work here. Possibly left in an emergency I thought. But then I started seeing bones and bodies.\nThere were empty birdcages sitting on the floor about an hour back. My theory is that there might be something toxic in the air. Possibly some sort of gas leak. Suffocating everyone who was down here at the time. It could be in the air still.\nEither way, I need to make it quick. The rumbling is getting closer. And I do not entertain what that could mean.=我之前就感到不安，现在更是害怕了。\n我在洞穴里看到一些设备散落一地。不知道是谁留下的，可能是曾经在这里工作的人遗弃的。或许是在紧急情况下留下的。但后来我发现还有骨头和尸体。\n大约一小时前，地板上还放着一些空鸟笼。我觉得空气中可能有某种有毒物质，可能是某种气体泄漏，导致当时在这里的人窒息。现在空气中可能还残留着这种物质。\n不管怎样，我得赶紧行动。那种轰鸣声越来越近了。我不清楚那意味着什么。
I woke up to screams of terror.\nThe city is sinking!\n\nAll is flooded we need to leave.\nOnly the bridge can save us!\n\n... The bridge is gone. No hope.\nI need to find a higher point.\nGoodbye=我醒来时听到恐怖的尖叫声。\n这座城市正在下沉！\n\n一切都被淹没，我们必须离开。\n只有桥梁能拯救我们！\n\n……桥梁已经消失了。没有希望了。\n我必须找到更高的地方。\n再见。
I woke up to screams of terror.\nThe city is sinking!\n\nAll is flooded we need to leave.\nWill the bridge be gone?\n\nIt's gone! I need to find a higher point.\nGoodbye=我醒来时听到恐怖的尖叫声。\n城市正在下沉！\n\n一切都被淹没，我们必须离开。\n那座桥会消失吗？\n\n它已经消失了！我需要找到一个更高的地方。\n再见
I woke up to screams of terror. But less than in my dreams.\nThe city is sinking! Again!\n\nSomething is wrong.. This is.. unnatrual.\nAll who died are gone this time.\nI saw a platform rise around 5pm.\nI need to find a higher point.\n That way I will survive.=我醒来时听到的是恐怖的尖叫声。但比梦境中的声音要小一些。\n这座城市正在下沉！又来了！\n\n有些事情不对劲……这太不自然了。\n这次死去的人都不见了。\n我在下午5点左右看到一个平台升起。\n我需要找到一个更高的地方。\n 那样我才能活下来。
I've been here for 4 weeks. I've learned much.\nI have gotten used to the procedures and the protocols of this place.\nDespite what it might seem from the perspective of the workers below.\nBeing a guard here is a differnt kind of imprisoning.\nInstead of constant physical labour you're put through committing actions that'll break a man.\nWhile I don't share the same chains as those below.\nI feel just as shackled.\n\nHowever, I know my way to the upper layers.\nI have seen him. He takes two smoke breaks by the left most fire exit at the bottom. Usually around 11am and 7pm.\nThe only place that's not monitored here is a small storage closet near the stairs atop the upper floor.\nIf I can sneak in there. With the right timing...\nI can give him what he deserves.=我已经在这里待了4周。我学到了很多东西。\n我已经习惯了这里的程序和规定。\n尽管从下面的工作人员的角度来看，这似乎很平常。\n但在这里当守卫是一种不同的监禁方式。\n不是持续的身体劳动，而是要执行一些会让人身心俱疲的动作。\n虽然我没有和下面的人一样被束缚着，\n但我感觉自己同样被束缚着。\n\n不过，我知道如何到达上层。\n我见过他。他会在最左边的消防出口处休息两次，通常是在上午11点到下午7点之间。\n唯一不受监控的地方是上层楼梯附近的一个小储藏室。\n如果我能趁对的时间偷偷进入那里……\n我就能给他应得的惩罚。
I've been here for six weeks now.\nThey told me there will be a retrial for my case!\nTHANK GOD!\nMaybe this time they will actually have a close look at all the evidence I've provided.\nThis also means I can FINALLY leave this place.\nEven if temporarily.\n\nWe're also slowly being moved to another prison I've heard.\nI really hope it's a little nicer because I am SICK of waking up to a swarm of rats running around our cells.\n\nThe activities here are horrible too.\nWe can't even work out since most of the equipment is either broken or extremely dirty.\n\nThey cleared out a couple cell blocks already.\nI think we might be next.\n\nThis does mean I'll have to leave my notes here.\nI don't think I can sneak those with me.\n\ni will find justice for you Jane.\nI loved you.=我已经在这里待了六周了。\n他们告诉我，我的案子将再次审理！\n感谢上帝！\n也许这次他们会认真审查我提供的所有证据。\n这也意味着我终于可以离开这个地方了。\n即使只是暂时离开。\n\n我还听说我们会被转移到另一座监狱里。\n我真心希望那里会好一些，因为我已经受够了每天醒来看到成群的老鼠在我们牢房里乱跑。\n\n这里的活动也很糟糕。\n我们甚至无法锻炼，因为大多数设备要么损坏，要么极其脏乱。\n\n他们已经清理了几个牢房区。\n我觉得我们可能会是下一个被清理的对象。\n\n这意味着我必须把我的笔记留在这里。\n我觉得自己无法偷偷把它们带走。\n\n我会为你讨回公道，简。\n我爱你。
I, Michael Dunton hereby resign from my position on the council.\n\nI feel there are things at play that are bigger than they seem.\nWhile I am certain that I would not be believed if I brought this up myself, I have left my notes and recordings in my office.\n\nI do not wish to be part of what's happening or what's to come.\nStrange things are going on in this council, and in this case.\n\nDuring the 4th and previous conference it seems to me that all sense of logistics are thrown out the window.\nI will take my leave on the day of the 5th and final conference.\n\nIt is best to carry my words with heavy thought.\n\n-Michael Dunton=我，迈克尔·邓顿，特此辞去我在委员会中的职务。\n\n我觉得有些事情的影响比表面看起来要严重得多。\n虽然我确信如果我自己提出这件事，是不会被相信的，但我已经把我的笔记和录音留在了我的办公室里。\n\n我不想成为正在发生的事情或即将发生的事情的一部分。\n在这个委员会中，正在发生一些奇怪的事情。\n\n期间 4在我看来,在前几次会议上,所有后勤意识都被抛出窗外。\n我将在第5次也是最后一次会议当天离开。\n\n最好是在深思熟虑之后才说出我的话。\n\n——迈克尔·邓顿
I.. I can't believe I actually did it. \nHis body flopped right onto the floor. \nI picked him up, now all covered in blood and I dumped him into one of those boxes.\nI wasn't quite sure what to do next so I closed it and pushed it into a giant pool of toxic waste.\nIn hindsight he might've still been alive.\nNot that it matters now..\nMy geiger counter reads dangerous levels now.\nI need to burn my stuff and leave before the radiation kills me..\nBye Bye Aaron.=I.. . .真不敢相信我居然这么做了 \n他的尸体被击倒在地上。 \n我把他抱了起来，现在他全身都是血，我把他扔进了那个箱子里。\n我不太确定接下来该做什么，于是就把它关上，然后扔进了一个巨大的有毒废物池里。\n回顾起来，他或许至今仍活着。\n现在不重要了...\n我的盖格计数器现在显示了危险水平。\n我需要烧掉我的东西，然后在辐射杀死我之前离开……\n再见,亚伦。
ICE LEVIATHAN\n\nSigurd's danger level: ??? idk I have n veer seen tehm\n\nScientific name: Iciteren-gigantis\n\nThe Ice leviathan, being part of the family Piscicolidae is, similarly to the Earth leviathan among the largest invertebrates in the Thistle Nebula. While there have been equally little recorded captures of this creature, there have been a lot of discoveries made since the expedition in the glacial caves of 94-Polarus, which they have made their home.\n\nWhile it is often assumed that these leviathans primarily hunt land-dwelling prey due to their occasional appearances above the earth. It is quite the opposite.\nTheir jaws do not have any teeth but instead have baleen which they use to filter out nutrients from vast frozen oceans.\nIt is only in desperate times when they resort to hunting for prey on land. However they might also appear when their breeding grounds are threatened. Be wary of sudden vibrations as you might not immediately realise you are walking above one.\n\nIce leviathans primarily burrow themselves within deep sheets of ice, carving out large sections creating these ginormous unnatural caverns as resting and breeding places in between feeding sessions. Using their extremely hard and thick skin to break through the ice. \nThey have to move often due to the nutrient supply not replenishing quick enough to sustain the leviathan.\nAn ice leviathan will only ever make one breeding cavern in their lifetime, it is often much larger than resting caverns and it is always the place they return to when mortally wounded, or when they are approaching the final months of their life. They will stay there until death occurs. It is not known why. The common theory is that Ice Leviathans share a sentimental value with the area where they birthed their young.=利比里亚\r\n\r\n西格德的危险等级：？？？我不知道，我从未见过他们。\r\n\r\n科学名称: Iciteren-gigantis\r\n\r\n冰生巨兽属于鱼虫科，与地球上的冰生巨兽一样，是蓟花星云中最大的无脊椎动物之一。虽然对这种生物的捕获记录同样很少，但自 94-波拉鲁斯冰川洞穴的探险以来，人们已经发现了许多这种生物。\r\n\r\n虽然人们常常认为,这些利维坦人主要猎取土地栖息的猎物,因为他们偶尔出现在地球之上。恰恰相反。\r\n它们的颌部没有牙齿，而是有鲸须，可以利用鲸须从广阔的冰封海洋中过滤出营养物质。\r\n只有在极端困难的情况下，它们才会转向在陆地上寻找猎物。不过，当它们的栖息地受到威胁时，它们也可能出现这种情况。要注意突然的震动，因为你可能不会立刻意识到自己正走在某个震动源之上。\r\n\r\n冰利维坦人主要埋在深厚的冰层中, 形成大量的裂缝, 形成这些巨大的非自然洞穴,用他们极其坚硬和厚厚的皮肤 打破冰层 \r\n由于营养供应无法迅速补充，以维持这种庞然大物的生存，它们不得不频繁移动。\r\n冰 Leviathan 一生只会建造一个繁殖洞穴，这个洞穴通常比休息洞穴要大得多。当它们受到致命伤害，或者接近生命的最后阶段时，总会回到这个地方。它们会一直待在那里直到死亡。目前尚不清楚原因。常见的理论认为，冰 Leviathan 与其孕育幼崽的地方有着情感上的联系。
If anyone has followed me from across the stars, I made it to my apartment, Julie is here with my daughter, they’re safe. The armies aren’t here yet but the city is preparing for an invasion. I just don’t think they’re ready.\nI mean I’ve read the reports. This city doesn’t have nearly enough to withstand whatever army they’ll throw at us.\nI’m fearful.\n\nBags are packed and we are about ready to leave. But if I’m speaking in honesty, it doesn’t quite sit right with me. I know I have done all that I could to warn people but I am not sure if it was right for me to just.. Leave like that. \nI’ve thought about going back but then I’d be leaving my family. There are countless people listening to my station and I hope they don’t feel abandoned. I know what that’s like unfortunately.\nIt’s rough. Like the lifeboat sailed away and now you’re drowning alone, unsure of how to survive. I’ve been there.\nTimes are worse now.=Julie和我女儿在一起, 他们很安全。军队尚未到来, 但城市正在准备入侵。我只是觉得他们还没准备好。\n我的意思是，我已经阅读了相关报告。这座城市根本没有足够的力量来抵抗他们可能派来的任何军队。\n我感到害怕。\n\n行李都收拾好了 我们准备出发了但如果我是诚实地说,我知道我已尽我所能警告人们,像这样离开。 \n我考虑过回去，但那样的话我就不得不离开我的家人。有无数的人在收听我的节目，我希望他们不会感到被抛弃。不幸的是，我明白那种感受。\n这很艰难。就像救生艇已经驶离，现在你独自溺水，不知道该如何生存。我也经历过这种感觉。\n现在的情况更糟了。
